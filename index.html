<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ski Week Stays</title>
<style>
/* Layout: overview = sticky bar + filter drawer + photo-carousel cards; detail = gallery mosaic, two columns (story left, slopes box right), map, footer for the organiser. Fully offline: system fonts, embedded images. */
:root{
  --bg:#ffffff; --soft:#f6f7f6; --card:#ffffff; --fg:#1c2320; --muted:#646f6a; --line:#e3e7e4; --accent:#1d6b57; --accent-soft:#e3f1ec;
  --green:#2e8b46; --blue:#2266c4; --red:#c8312b; --black:#1b1b1b; --gold:#d18f0f; --warn:#9a5b00; --warnbg:#fff1db;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111614; --soft:#171d1a; --card:#171d1a; --fg:#e8eeea; --muted:#9fada6; --line:#2b3531; --accent:#6cc7a8; --accent-soft:#1d2e28;
  --green:#4cc06a; --blue:#6aa5ff; --red:#ff6f66; --black:#e8eeea; --gold:#f2b84b; --warn:#f0b04a; --warnbg:#2c2414; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ski{width:15px;height:15px;flex:none;vertical-align:-2px}
.muted{color:var(--muted)} .small{font-size:.84rem}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1400px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{font-weight:700;font-size:1.2rem;display:flex;gap:8px;align-items:center;margin-right:auto}
.brand svg{width:26px;height:26px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--card);box-shadow:0 1px 3px rgb(0 0 0 / .06);max-width:520px}
.search input{border:0;outline:0;background:transparent;width:100%}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wins{max-width:1400px;margin:0 auto;padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap}
.intro{max-width:1400px;margin:0 auto;padding:18px 16px 0}
.intro p{margin:0;max-width:80ch}
.howto{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:10px;max-width:900px}
.howto b{color:var(--accent)}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
.drawer{display:none;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;background:var(--card);gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.drawer.open{display:grid}
.fg{display:grid;gap:8px;align-content:start}
.fg h4{margin:0;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:7px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:.92rem}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.head h2{margin:0;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px 22px}
.card{display:grid;gap:7px;min-width:0;cursor:pointer}
.card>*{min-width:0}
.car{position:relative;width:100%;max-width:100%;border-radius:14px;overflow:hidden;aspect-ratio:20/19;background:var(--soft)}
.track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;min-width:0;height:100%;object-fit:cover;scroll-snap-align:center;display:block}
.vid{position:absolute;top:10px;left:10px;background:var(--fg);color:var(--bg);font-weight:800;border-radius:8px;padding:3px 9px;font-size:.95rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:10px;right:10px;background:#fff;color:#1c2320;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:700;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgb(255 255 255 / .92);color:#1c2320;cursor:pointer;box-shadow:0 1px 4px rgb(0 0 0 / .3);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.nav.l{left:8px}.nav.r{right:8px}
.car:hover .nav,.nav:focus-visible{opacity:1}
@media (hover:none){.nav{opacity:.85;width:28px;height:28px}}
.dots{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgb(255 255 255 / .55)}
.dots i.on{background:#fff}
.row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ttl{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.stars{white-space:nowrap;font-size:.88rem;display:inline-flex;align-items:center;gap:2px}
.stars svg{width:13px;height:13px}
.sub{color:var(--muted);font-size:.9rem;margin-top:-5px}
.slopes{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.86rem}
.slope{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.slope b{font-weight:650}
.pst{width:8px;height:8px;display:inline-block;border-radius:50%;flex:none}
.pst.sq{border-radius:1px;transform:rotate(45deg) scale(.95)}
.facs{display:flex;flex-wrap:wrap;gap:5px}
.fac{font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.avs{display:flex;flex-wrap:wrap;gap:5px}
.av{font-size:.73rem;padding:2px 7px;border-radius:6px;border:1px solid var(--green);color:var(--green);font-weight:600}
.warn{font-size:.73rem;padding:2px 7px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-weight:600}
.empty{padding:40px 0;color:var(--muted)}
/* detail */
.dwrap{max-width:1180px;margin:0 auto;padding:16px 16px 70px}
.back{display:inline-flex;gap:6px;align-items:center;border:0;background:transparent;cursor:pointer;padding:6px 0;font-weight:600}
.dhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:6px 0 4px}
.dhead h1{margin:0;font-size:1.65rem;line-height:1.2;text-wrap:balance}
.bigid{font-size:1.65rem;font-weight:800;background:var(--fg);color:var(--bg);border-radius:10px;padding:0 10px;font-variant-numeric:tabular-nums}
.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:200px 200px;gap:8px;border-radius:16px;overflow:hidden;margin:16px 0 10px;position:relative}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.mosaic img:first-child{grid-row:1/3}
.allbtn{position:absolute;right:12px;bottom:12px;background:#fff;color:#1c2320;border:1px solid #1c2320;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.dcar{display:none}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;margin-top:20px;align-items:start}
.sec{border-top:1px solid var(--line);padding:22px 0}
.sec:first-child{border-top:0;padding-top:4px}
.sec h3{margin:0 0 12px;font-size:1.15rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:1rem}
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.am{display:flex;gap:10px;align-items:flex-start}
.am .ic{width:22px;text-align:center;flex:none}
.am.off{color:var(--muted);text-decoration:line-through}
.desc{white-space:pre-line;max-width:72ch}
.desc h4{margin:16px 0 4px;font-size:.95rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.box{position:sticky;top:76px;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 18px rgb(0 0 0 / .07);background:var(--card);display:grid;gap:12px}
.box h3{margin:0;font-size:1.05rem}
table.dt{width:100%;border-collapse:collapse;font-size:.9rem}
.dt td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.dt td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.note{font-size:.84rem;color:var(--muted)}
.pick{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:.92rem}
.pick b{font-size:1.15rem;color:var(--accent)}
.mapimg{width:100%;max-width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.ev{margin:8px 0 0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.organiser{border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:.88rem;display:grid;gap:6px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
/* lightbox */
.lb{position:fixed;inset:0;background:rgb(10 12 11 / .96);z-index:50;display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb.open{display:flex}
.lbbar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:12px 16px}
.lbbar button{background:transparent;border:1px solid rgb(255 255 255 / .4);color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer}
.lbt{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lbt::-webkit-scrollbar{display:none}
.lbt div{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;padding:0 12px}
.lbt img{max-width:100%;max-height:100%;object-fit:contain}
.lb .nav{opacity:1;width:44px;height:44px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);align-items:center}
.method{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font-size:.84rem;color:var(--muted);display:grid;gap:6px}
.method p{margin:0;max-width:100ch}
@media (max-width:900px){
  .cols{grid-template-columns:minmax(0,1fr);gap:0}
  .box{position:static}
  .mosaic{display:none}
  .dcar{display:block;margin:12px -16px 0;width:calc(100% + 32px);max-width:none;border-radius:0;aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>/* required styles */

	}
.leaflet-tile,

	-webkit-user-select: none;
	   -moz-user-select: none;

	}

}

	}
.lvml {

/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

	}
.leaflet-top {

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;

	}

	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);

	}

.leaflet-zoom-anim .leaflet-zoom-hide {

	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}

	}

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,

/* general toolbar styles */

.leaflet-bar {

	}

	}

	}

	}

.leaflet-control-zoom-out {

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}

.leaflet-control-layers {

	background: #fff;

	}

	height: 44px;

.leaflet-control-layers-expanded .leaflet-control-layers-list {

eur et d'extérieur pour petits et grands enfants (trampoline, playstation)\nGrand jardin, potager bio en saison, cueillette de petits fruits en saison.\n\nMagnificent 3-storey apartment built into the rural farmhouse. Our spacious house is made of bright wood, warm and welcoming, with a magnificent view of the Pre-Alps.. Close to major tourist centers, Gruyère, Montreux, Lausanne... Many opportunities for hiking in summer and 15 minutes from the ski resort of Moléson in winter. Our green and calm region will charm you.\nwe are close to beautiful lakes, 1 hour and a half from the highest peaks of the Alps, multiple possibilities for skiing, cycling, hiking and swimming.\n\nhigh-speed Internet, television channels in all languages.\n\nBicycles available for adults and children. \n\nIndoor and outdoor games for young and old (trampoline, playstation )\n\nLarge garden, organic vegetable garden in season, picking berries in season.","gp":"Notre maison est située à proximité de la ville de Gruyère (5 minutes en voiture), Montreux, Lausanne, Fribourg. Le Valais est à 1 heure de voiture. Les possibilités d'excursions et les lieux touristiques sont tous proches. La région vous séduira par ses produits du terroir, ses traditions et les nombreuses activités qu'elle propose. Dans la ville de Bulle en 2 minutes vous trouverez tout ce dont vous avez besoin, l'autoroute est accessible en 5 minutes.\n\n\n\nOur house is situated close to Gruyère, Montreux, Lausanne, Fribourg. The Valais is 1 hour away by car. The possibilities of excursions and the tourist places are all close. The region will seduce you with its local products, its traditions and the many activities it offers. In the city of Bulle in 2 minutes you will find all that you need, the highway is accessible in 5 minutes.","ot":"Typique et rénovée, bien situé pour rayonner en Suisse (ski, randonnée, culture)\nVue imprenable sur les montagnes \nDe plein pied avec accès au jardin privatif"},{"loc":"fr","title":"La maison de Céline et Yvan","gf":"Magnifique appartement de 3 étages à plein pied dans une ancienne ferme rénovée. Situé au coeur de la Gruyères, à 3 minutes en voiture de la ville de Gruyère et de son chateau que l'on peut voir depuis la maison, à 30 minutes de Montreux et du Lavaux et à 40 minutes de Berne. La vue sur les Préalpes depuis le jardin est grandiose.\nLa station de ski la plus proche, Moléson est à 8 min en voiture. Notre situation géographique est idéale pour sillonner la Suisse. Ski, randonnée, patrimoine ou visite culturelle, tout est là pour profiter pleinement des beautés de la Suisse.\nAu rez de chaussé, notre maison est composée d'une grande cuisine ainsi que d'une entrée à plein pied donnant sur deux grandes terrasses, la piscine et le jardin. La grande baie vitrée permet une vue magnifique sur les Préalpes à toutes saisons. Le local technique avec congélateur et machine à laver/sécher ainsi qu'un WC/douche se trouve également au rez.\n\nAu premier étage, 1 chambre parentale avec un lit King size, 1 chambre avec lit double (160 x 200), 1 chambre avec lit (140 x 200), 1 chambre enfant lit (90x 200), 1 canapé convertible (160x200), 1 local de musique avec entrée indépendante (piano, batterie...) utilisable pour des musiciens confirmés. Egalement un très grand salon et une étagère de jeux et de livres. Pour les petits nous avons à disposition une couchette.\nAu deuxième étage, une mezzanine ouverte sur l'espace salon du premier avec une grande Smart TV, un canapé convertible avec matelas confort, un lit d'appoint. La maison est équipée de moustiquaire. \n\n\nMagnificent 3-storey ground-floor apartment in a renovated former farmhouse. Located in the heart of the Gruyère region, 3 minutes by car from the town of Gruyère and its castle, which can be seen from the house, 30 minutes from Montreux and the Lavaux, and 40 minutes from Bern. The view of the Pre-Alps from the garden is breathtaking.\nThe nearest ski resort, Moléson, is an 8-minute drive away. Our location is ideal for exploring Switzerland. Skiing, hiking, heritage or cultural visits, everything is here to make the most of Switzerland's beauty.\n\nOn the ground floor, our house comprises a large kitchen and a ground-level entrance opening onto two large terraces, the pool and the garden. The large bay window affords magnificent views of the Pre-Alps in all seasons. The utility room with freezer, washer/dryer and WC/shower is also on the ground floor.\nOn the second floor, 1 master bedroom with king-size bed, 1 bedroom with double bed (160 x 200), 1 bedroom with bed (140 x 200), 1 children's bedroom with bed (90x200), 1 sofa bed (160x200), 1 music room with separate entrance (piano, drums...) suitable for experienced musicians. There's also a very large living room and a games and bookshelf. For the little ones, we have a bunk available.\nOn the second floor, a mezzanine opens onto the second floor lounge area, with a large Smart TV, a convertible sofa with comfort mattress, and an extra bed. The house is equipped with mosquito netting.","gp":"Notre quartier est calme tout en étant très proche de la ville de Bulle ou du château de Gruyère (3 minutes en voiture). Il n'y a pas de maison pour obstruer la vue depuis le jardin et très peu de circulation. Place de parc à disposition.\n\nOur district is quiet but very close to the city of Bulle or the castle of Gruyère (3 minutes by car). There is no house to obstruct the view from the garden and very little traffic.","ot":"Que vous veniez en été pour profiter des nombreuses randonnées, du lac ou de la piscine (3x6 mètres) ou en hiver pour profiter de la neige et du ski et des soirées autour du poêle, notre maison est à toutes saisons un havre de paix spacieux et accueillant.\n\nWhether you come in summer to enjoy the many hikes, the lake or the swimming pool (3x6 meters), or in winter to enjoy the snow and skiing and evenings around the stove, our house is a spacious, welcoming haven of peace in every season."}],"ph":[ location on a 2 hectare property","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"Ideal for summer and winter (Wildkogel Arena area); no slope distance stated","notes":"19th-c. hut sleeps 15 in 5 bedrooms near Wildkogel, 2 ha slope for sledging; basic curtain showers; €30pp extra fees, 85 exchanges.","score":79,"stars":4.0,"gp":300,"rr":100,"gr":4.9,"ex":85,"owner":"IngridFabianNathalie","recip":false,"desc":[{"loc":"de","title":"Almhütte Katharina - rural Cottage in the mountains ⛰️","gf":"t in the winter season we do only rent the house \n\nUnsere urige Almhütte Katharina ist eine rustikale und romantische Hütte aus dem 19ten Jahrhundert die ihren Charme der letzten Jahrhunderte bewahrt.\nJedoch wurde die Hütte natürlich angepasst und modernisiert, um den Komfortstandards von heute gerecht zu werden. Somit gibt es in jedem Zimmer eine Infrarotheizung und Warmwasser gibt es über einen Strom-Boiler. In der Hütte gibt es zwei Duschen hinter einem Vorhang im Flur und auch zwei separate WCs ( eines im EG und eines im OG 9 \n befinden sich im Haus. \nUm die Hütte wollig warm zu bekommen, gibt es 3 große Holzöfen und reichlich Holz ist auch vorhanden.\nAufteilung der Ferienunterkunft im Pinzgau:\nDas Haus ist aufgeteilt in zwei Etagen: 5 Schlafräume, ( Durchgangszimmer ) 2 Duschen und 2 separate WCs. \nWenn Sie auf der Suche nach einem Ferienhaus für Gruppen im Pinzgau sind, sind Sie hier genau richtig.\nIm 180 qm großem Erdgeschoss befindet sich der Eingang über eine kleine Terrasse mit Sitzecke. Die Küche mit großer Sitzecke befindet sich auch im Erdgeschoss und verfügt über einen TV, Wi-Fi Internet, Omas alten Holzofen, ein Elektroherd mit vier Platten, ein Geschirrspüler, zwei Kühlschränke mit Eisfach, eine Kaffeemaschine sowie alle notwendigen Küchenutensilien. Im Eg gibt es einen Skiabstellplatz im Holzschuppen. Waschmaschine und Trockner stehen auch zur Verfügung. Im Erdgeschoss gibt es außerdem, ein Vierbettzimmer mit vier Einzelbetten und ein Doppelschlafzimmer. (Durchgangszimmer )\nIm ersten Stock befinden sich insgesamt drei Schlafzimmer: ( Durchgangszimmer ) drei Dreibettzimmer, eins davon mit Waschbecken im Zimmer. Es gibt hinter einem Vorhang im Flur, zwei Duschen und ein Waschbecken. Zusätzlich, gibt es hier ein separates WC. Rauchen ist im Haus nicht gestattet , aber es gibt Terrasse -Garten danke\n\nWir bitten um die Kosten der Endreinigung INKL DER NK UND WÄSCHe etc.  30 euro pro Person oder minimum 150 euro","gp":"Die Almhütte Katharina in Mühlbach im Pinzgau befindet sich in Alleinlage auf einem 2 Hektar großen Grundstück, auf einem Hang gelegen, umgeben von Obstbäumen und einem einzigartigen Blick auf das Tal und das Dorf Mühlbach.\r\n\r\nIdeal für Sommer und Winter\r\nSowohl im Winter als auch im Sommer können Sie das Grundstück und den Garten optimal für eine Vielzahl an Aktivitäten nutzen. Im Winter können Sie einfach den Hang hinunter Rodeln. Hierfür stehen Ihnen genügend Rodel kostenlos zur Verfügung. Im Sommer können Sie den herrlichen Ausblick genießen und in der warmen Sonne entspannen oder einen Grill Abend an der Feuerstelle organisieren. Genügend Gartenmöbel sind vorhanden und unterhalb des Grundstücks befindet sich der Fluss Salzbach, entlang diesem führt Sie ein schöner kilometerlanger Fahrradweg auf Entdeckungstour.\r\n\r\nDie Anfahrt mit dem Pkw ist im Sommer bis zum Haus problemlos möglich, im Winter wird der Weg bis zum Haus auch geräumt, dennoch benötigen Sie Schneeketten und Allrad um bis zum Haus zu fahren. Ansonsten gibt es Parkmöglichkeiten bis ca. 250 Meter vor dem Haus.\r\n\r\nDas Ferienhaus ist perfekt für größere Gruppen geeignet, die gerne im Salzburger Land Urlaub machen. Obwohl bis zu 15 Personen Platz finden, eignet sich die Almhütte Katharina auch perfekt als Ferienhaus für 6 Personen oder als Unterkunft für 8 Personen oder 12 Personen. Die Almhütte ist auch sehr beliebt als Ferienunterkunft für Skivereine, Sportvereine und Schulklassen.","ot":"WICHTIG - bitte beachten Sie dass wir Nebenkosten  verrechnen für Holz, Endreinigung, Bettbezüge, Hand- und Duschtücher, Strom,Internet ,Müll   \nWir bitten um die Kosten der Endreinigung 30 euro pro Person oder minimum 150 euro plus die \nNächtigungsabgabe in Bramberg\n€ 2,50 pro Person und Nacht (ab 15 Jahre).\nMobilitätsabgabe - Guest Mobility Ticket - Abgabe an das Land Salzburg\n € 0,55 pro Person und Nacht (ab 15 Jahre)."},{"loc":"en","title":"Almhütte Katharina -  Cottage in the mountains-ideal for families","gf":"Our rustic Almhütte Katharina is a rustic and romantic hut from the 19th century that retains its charm from the last centuries. In the may and June we can offer you free dates from Monday to thirtday !\nHowever, the hut has of course been adapted and modernized to meet today's comfort standards. So there is infrared heating in every room and hot water is available from an electricity boiler. In the hut there are two showers behind a curtain in the hallway and there are also two separate toilets in the house. To keep the hut warm and cozy, there are two large wood stoves and there is plenty of wood.\n\nThere is a bus station in about 2 km , and also a railway station next to the hotel Kirchner . For children there are a lot of activities around , for the lake in about  2,5, km https://www.hollersbach.at/Unser_Hollersbach/Freizeit/Badesee and also a lot of adventures . see more her https://www.wildkogel-arena.at/en/summer/summer-holidays/","gp":"The Almhütte Katharina in Mühlbach im Pinzgau is in a secluded location on a 2 hectare property, on a slope, surrounded by fruit trees and a unique view of the valley and the village of Mühlbach.\n\nIdeal for summer and winter\n\nBoth in winter and in summer, you can optimally use the property and the garden for a variety of activities. In winter, you can simply toboggan down the slope. There are enough toboggans available for you free of charge. In summer, you can enjoy the wonderful view and relax in the warm sun or organize a barbecue evening by the fireplace. Sufficient garden furniture is available and the Salzbach river is located below the property, along which a beautiful kilometer-long bike path leads you on a discovery tour.","ot":"IMPORTANT - please note that we charge a one-off additional costs 30 euro per person or minimum 150 euro ,. for wood, final cleaning, bed linen, hand and bath towels, electricity, internet, garbage\n\nOvernight tax in Bramberg\n€2.50 per person per night (from age 15).\nMobility tax - Guest Mobility Ticket - levy payable to the State of Salzburg\n€0.50 per person per night (from age 15)."}],"ph":["2597098_0","2597098_1","2597098_2","2597098_3","2597098_4","2597098_5","2597098_6","2597098_7","2597098_8","2597098_9","2597098_10","2597098_11","2597098_12","2597098_13","2597098_14","2597098_15","2597098_16","2597098_17","2597098_18","2597098_19","2597098_20","2597098_21","2597098_22","2597098_23","2597098_24","2597098_25","2597098_26","2597098_27","2597098_28","2597098_29","2597098_30","2597098_31","2597098_32","2597098_33","2597098_34","2597098_35","2597098_36","2597098_37","2597098_38","2597098_39","2597098_40","2597098_41","2597098_42"]},{"v":"V5","n":5,"id":596424,"t":"Open for Travel/Exchange ideas for Easter and Summer 27","town":"Unterer Wienerweg","cc":"Austria","region":"Pyhrn-Priel","lat":47.86669709630139,"lon":14.164054725222547,"bd":5,"ba":2,"cap":12,"m2":180,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":8,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Wurzeralm","m":45,"b":50,"km":42,"via":"A9","q":""},{"n":"Hinterstoder","m":55,"b":55,"km":35,"via":"Pyhrnpass Str./B138","q":""},{"n":"Riesneralm","m":75,"b":80,"km":78,"via":"A9","q":""},{"n":"Schladming","m":85,"b":100,"km":102,"via":"A9 and B320","q":""},{"n":"Ramsau","m":100,"b":120,"km":108,"via":"A9 and B320","q":""},{"n":"Postalm","m":120,"b":140,"km":100,"via":"B145","q":""},{"n":"Dachstein West","m":130,"b":150,"km":120,"via":"B145 and B166","q":""},{"n":"Filzmoos","m":140,"b":160,"km":131,"via":"A9 and B320","q":""}],"near":45,"n30":0,"n60":2,"fac":{"fireplace":true,"sauna":true,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":"Fasssauna/outdoorwellnessbereich","toys_inside":"Spielsachen, Fahrzeuge, Fahrräder genügend vorhanden","toys_outside":"Lagerfeuer, Riesentrampolin, Seilbahn, Baumhaus","large_garden":"2500qm Garten am Waldrand","winter_restriction":null,"access_issue":null},"av":["x27"],"q":[],"ski":"Nächstes Skigebiet (20min mit dem Auto)","notes":"Family house in Alpine foothills, 5 bed/2 bath + cabin, sleeps 12; kids paradise (trampoline, treehouse); ski 20 min drive; €120 cleaning.","score":79,"stars":4.0,"gp":293,"rr":93,"gr":4.98,"ex":25,"owner":"Markus und Bettina","recip":false,"desc":[{"loc":"tr","title":"Open for Travel/Exchange ideas for Easter and Summer 27","gf":"Feel free to contact us :-)\n\n\nNewly renovated detached house (2017) in the Alpine foothills. We (a family with 3 kids) live on 160 m² with a 2,500 m² garden. Very quiet location. You can't hear any road. Still, superb motorway connection (5 km). Nearest supermarket (5 km). Ski areas in the near vicinity. Hiking trails straight from home. Lots of children's things and attractions in the garden (campfire, giant trampoline, zip line, treehouse...), lots of bikes.\n\nNew since 2023: a converted cabin as a retreat for adults or also for a second family to sleep in (happy to give more details on request), usable as a meditation room, reading spot, gym, cinema, barrel sauna/outdoor wellness area …\n\nCleaning (towels/bed linen etc.) before and after the exchange involves quite a lot of work for us – so we ask for a cleaning contribution of €120 for a stay of about one week.. Thank you very much for your understanding. At the same time, a request: if anything is not clean enough - please be sure to tell us honestly straight away!","gp":"Hiking trails right outside the front door / Nearest ski area (20 min by car), formerly run as a \"Sacherl\" (self-catering house)! A paradise for children with a 2,500 m² garden at the edge of the forest.\nHiking, via ferratas, mountaineering, kayaking, canyoning, swimming lake, outdoor pool, paragliding, ski touring, skiing, mountain biking, pump track, camping, mini golf, downhill, summer toboggan run... all in the near vicinity!!!\nOur own hens lay our breakfast eggs every day!\n\nMore info:\nhttps://www.360alpenland.com/","ot":"Hens, vegetable garden/polytunnel (with automatic watering), fruit trees, berries, all in the garden. Plenty of toys, ride-on vehicles and bikes available!!! Wallbox. E-moped. Trampoline. Football goal"},{"loc":"de","title":"Open for Travel/Exchange ideas for Easter and Summer 27","gf":"Feel free to contact us :-)\n\n\nNeu renoviertes Einfamilienhaus (2017) im Alpenvorland. Wir ( Familie mit 3 Kids) leben auf 160qm und 2500qm Garten. Sehr Ruhig gelegen. Man hört keine Straße. Trotzdem super Autobahnanbindung (5km). Nächster Supermarkt (5km). Skigebiete in näherer Umgebung. Wanderwege direkt von Zuhause. Sehr viele Kindersachen und Attraktionen im Garten. (Lagerfeuer, Riesentrampolin, Seilbahn, Baumhaus...), Viele Fahrräder.\n\nNeu seit 2023: ausgebaute Hütte als Rückzugsort für Erwachsene oder auch zum Übernachten für eine zweite Familie (gebe dazu gerne nähere Infos auf Anfrage) nutzbar als Meditationsraum, Leseplatz, Fitnessstudio, Kino, Fasssauna/outdoorwellnessbereich …\n\nFür die Reinigung (Handtücher/Bettwäsche etc.) vor und nach dem Tausch fällt bei uns jeweils einiges an Arbeit an – deshalb bitten wir um einen Beitrag zur Reinigung von 120 € bei etwa einer woche Aufenthalt.. Vielen Dank für dein Verständnis. Gleichzeitig auch die Bitte: falls etwas nicht sauber genug ist - unbedingt sofort ehrlich zu sagen!","gp":"Wanderwege direkt vor der Haustür/ Nächstes Skigebiet (20min mit dem Auto) früher als „Sacherl“ (Selbstversorger Haus) geführt! Ein Paradies für Kinder bei 2500qm Garten am Waldrand. \nWandern, Klettersteige, Bergsteigen, Kajak, Canyoning, Badesee, Freibad, Paragleiten, Skitouren, Skifahren, Mountainbiken, Pump Track, Camping, Minigolf, Downhill, Sommerrodelbahn... alles in näherer Umgebung!!!\nEigene Hühner legen täglich unsere Frühstückseier!\n\nNähere Infos:\nhttps://www.360alpenland.com/","ot":"Hühner, Gemüsegarten/Folientunnel ( mit automatischer Bewässerung) , Obstbäume, Beeren alles im Garten. Spielsachen, Fahrzeuge, Fahrräder genügend vorhanden!!! Wallbox. E-Moped. Trampolin. Fußballtor"}],"ph":["596424_0","596424_1","596424_2","596424_3","596424_4","596424_5","596424_6","596424_7","596424_8","596424_9","596424_10","596424_11","596424_12","596424_13","596424_14","596424_15","596424_16","596424_17","596424_18","596424_19","596424_20","596424_21","596424_22","596424_23","596424_24","596424_25","596424_26","596424_27","596424_28","596424_29","596424_30","596424_31","596424_32","596424_33","596424_34","596424_35","596424_36","596424_37","596424_38","596424_39","596424_40","596424_41","596424_42","596424_43","596424_44","596424_45","596424_46","596424_47","596424_48","596424_49","596424_50","596424_51","596424_52","596424_53","596424_54","596424_55","596424_56","596424_57","596424_58","596424_59","596424_60"]},{"v":"V6","n":6,"id":1601732,"t":"Emilie, Hugues, Adèle, Anna et Capucine's house","town":"Barby","cc":"France","region":"Bauges","lat":45.57700477320899,"lon":5.9783599422467475,"bd":4,"ba":2,"cap":12,"m2":175,"typ":"House","mn":0,"beds":{"big_double_bed":2,"double_bed":0,"single_bed":2,"children_bed":1,"baby_bed":0,"double_bed_up":2,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"La Feclaz (Grand Revard)","m":28,"b":35,"km":17,"via":"D912 and D206A","q":""},{"n":"Aillons-Margeriaz","m":30,"b":35,"km":21,"via":"D11 and D206","q":""},{"n":"Les 7 Laux","m":50,"b":60,"km":50,"via":"A41","q":""},{"n":"Le Collet d'Allevard","m":55,"b":60,"km":52,"via":"A41","q":""},{"n":"Le Sappey","m":60,"b":70,"km":65,"via":"A41","q":""},{"n":"Crest-Voland","m":65,"b":80,"km":77,"via":"A43","q":"Maurienne A43"},{"n":"St-Pierre-de-Chartreuse","m":65,"b":75,"km":44,"via":"D1006","q":"Maurienne"},{"n":"Saint-Francois-Longchamp","m":75,"b":90,"km":83,"via":"A43","q":"Maurienne A43"}],"near":28,"n30":2,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"une immense salle de jeux qui fait la joie des plus jeunes","toys_outside":"portique (balançoire, toboggan et balançoire bébé)","large_garden":"Le terrain mesure environ 600 m²","winter_restriction":null,"access_issue":null},"av":["f27"],"q":[],"ski":"la première station de ski est à moins de 30 minutes en voiture","notes":"Stone farmhouse at Chambéry edge, 4 bed/2 bath sleeps 12, huge playroom, swings/slide, 600 m2 garden; nearest ski <30 min; very experienced owner.","score":76,"stars":4.0,"gp":200,"rr":100,"gr":4.97,"ex":48,"owner":"Emilie, Hugues, Adèle, Anna et Capucine","recip":true,"desc":[{"loc":"tr","title":"Emilie and Hugues's house","gf":"Our house is a former wine-growing farm building dating from we don't know exactly when… other than that it was a time when houses were built of stone and wood with local materials!\nWe particularly love the dressed stone, the exposed roof timbers, and the four-sided roof with fish-scale tiles.\n\nThe building was meticulously restored by the previous owners with an uncommon attention to detail and finish. It perhaps lacks a little modernity, but we should sort that out in the coming years.\n\nOn the first level, at garden level, the storage spaces and the workshop.\nOn the first level, a living room, a fitted kitchen, two bedrooms, a bathroom and a WC.\nOn the second level, 2 small children's bedrooms, a bathroom and a huge playroom that delights the youngest.\nEach level measures about 90 m².\n\nThe plot is about 600 m², with a cherry tree, an apple tree, a fig tree and 2 lime trees that shade the dining areas.\nThere is also a barbecue and a play frame (swing, slide and baby swing).","gp":"Why do we love this place and why did we settle here?\n\nBecause Savoie is a really pleasant place to live. Being close to Switzerland and Italy allows for little trips that feel like a change of scene while staying \"local\", for a weekend or just a day.\n\nSavoie also lets you choose between the cultural and urban activities offered by Lyon, Grenoble, Geneva and Chambéry, and outdoor activities made possible by the many lakes, rivers and mountains that are everywhere.\nFrom \"serious\" high-mountain climbing on iconic peaks, family hikes in the alpine pastures, mountain biking, the beach, canoeing, skiing, canyoning, paragliding, diving, kitesurfing, fishing etc., you never get bored around here and there's something for every taste.\nAnd when it comes to local produce, we can't complain either, between the cheeses, wine, beer and all the local products. And when it's all bought directly from the producer after a visit to the farm, even better!\n\nThere, have we sold you on Savoie? But why choose Chambéry?? Well, for the same reasons; Chambéry is a small town on a human scale, with lots of cultural activities, surrounded by mountains on one side and a gigantic lake on the other.\nThe views are lovely on every street corner, and absolute calm is just a few steps away.\n\nAnd why 188 chemin de Casselagnat in Barby? Because the forest starts right at the end of the street, Chambéry town centre is 20 minutes away by bike on a protected cycle path, there are 3 swimming spots less than 10 min away by bike, the nearest ski resort is less than 30 minutes away by car, and 15 km separate us from the largest natural lake in France and its water sports. All amenities are also nearby, and a few nightspots (bars, brewery and concert hall) can be reached by bike.\nThe house is in a quiet spot, with a stunning view of the Bauges and Belledonne mountain ranges.","ot":"Welcome to our home!"},{"loc":"fr","title":"La maison d' Emilie et Hugues","gf":"Notre maison est un ancien bâtiment d’exploitation viticole qui date d’on ne sait pas exactement combien de temps…si ce n’est qu’il s’agissait d’une époque pendant laquelle on faisait les maisons en pierre et en bois avec les matériaux du coin !\nOn apprécie particulièrement les pierres de tailles, la charpente apparente, et le toit 4 pans en tuiles écailles.\n\nLe bâtiment a été restauré méticuleusement par les anciens propriétaires avec un souci  peu commun du détail et de la finition. Ça manque peut-être un peu de modernité, mais on devrait résoudre cela dans les années à venir. \n\nAu premier niveau, en rez de jardin, les espaces de stockage et l’atelier.\nAu premier niveau, un salon, une cuisine aménagée ainsi que deux chambres, une salle de bain et un WC\nAu second niveau, 2 petites chambres d’enfants, une salle de bain et une immense salle de jeux qui fait la joie des plus jeunes. \nChaque niveau mesure environ 90 m²\n\nLe terrain mesure environ 600 m ² sur lequel se trouvent un cerisier, un pommier, un figuier et 2 tilleuls qui ombragent les espaces de repas.\nBarbecue et portique (balançoire, toboggan et balançoire bébé) y sont également présents.","gp":"Pourquoi est-ce qu’on aime cet endroit et pourquoi nous nous y sommes installés ? \n\nParce que la Savoie est un endroit plutôt très agréable à vivre. La proximité avec la Suisse et l’Italie permet de petites excursions dépaysantes tout en restant « local », le temps d’un week-end, ou simplement à la journée. \n\nLa Savoie permet aussi de choisir entre des activités culturelles et urbaines qu’offrent Lyon, Grenoble, Genève, Chambéry et des activités d’extérieures possibles grâce aux nombreux lacs, rivières et montagnes qui sont omniprésents. \nDe la haute montagne « engagée » sur des sommets emblématiques, des randos familiales dans les alpages, du VTT, de la plage, du canoé, du ski, du canyoning, du parapente, de la plongée, du kitesurf, de la pêche etc, on ne s’ennuie pas par ici et il y en a pour tous les goûts.\nEt puis côté terroir, on n’est pas non plus à plaindre entre les fromages, le vin, la bière et tous les produits du coin. Et quand le tout est acheté directement au producteur après une visite de l’exploitation, c’est encore mieux !\n\nÇa y est, on vous a bien vendu la Savoie ? Mais pourquoi avoir choisi Chambéry ?? Et bien pour les mêmes raisons ; Chambéry, c’est une petite ville à taille humaine, avec pleins d'activités culturelles, qui est entourée de montagnes d’un côté, et d’un gigantesque lac de l’autre.\nLes panoramas y sont appréciables à tous les coins de rue, et le calme absolu est accessible à quelques enjambés.\n\nEt pourquoi le 188 chemin de Casselagnat à Barby ? Parce que la foret commence juste au bout de la rue, que le centre-ville de Chambéry est accessible à vélo en 20 minutes par piste cyclable protégée, qu’il y a 3 points de baignade à moins de 10 min à vélo, que la première station de ski est à moins de 30 minutes en voiture, et que 15 km nous séparent du plus grand lac naturel de France et de ses activités nautiques. Toutes les commodités sont également à proximité, et quelques lieux nocturnes (bars, brasserie et salle de concert) sont accessibles à vélo. \nLa maison est au calme, avec une vue imprenable sur le massif des Bauges et de Belledonnes.","ot":"Soyez les bienvenus chez nous !"}],"ph":["1601732_0","1601732_1","1601732_2","1601732_3","1601732_4","1601732_5","1601732_6","1601732_7","1601732_8","1601732_9","1601732_10","1601732_11","1601732_12","1601732_13","1601732_14","1601732_15","1601732_16"]},{"v":"V7","n":7,"id":1435325,"t":"Maison avec vue splendide sur les montagnes!","town":"Lumbin","cc":"France","region":"Belledonne","lat":45.30574032257513,"lon":5.904789441567781,"bd":6,"ba":2,"cap":14,"m2":170,"typ":"House","mn":4,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":3,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Les 7 Laux","m":30,"b":35,"km":22,"via":"D30","q":""},{"n":"Le Collet d'Allevard","m":40,"b":45,"km":29,"via":"D1090 and D525","q":""},{"n":"Le Sappey","m":45,"b":50,"km":24,"via":"D1090 and D512","q":""},{"n":"Aillons-Margeriaz","m":60,"b":65,"km":53,"via":"A41","q":""},{"n":"St-Pierre-de-Chartreuse","m":60,"b":65,"km":32,"via":"D30","q":""},{"n":"Chamrousse","m":65,"b":75,"km":46,"via":"D111","q":""},{"n":"La Feclaz (Grand Revard)","m":65,"b":75,"km":57,"via":"A41","q":""},{"n":"Le Corbier/Toussuire","m":80,"b":100,"km":99,"via":"A43","q":"Maurienne A43"}],"near":30,"n30":1,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":"une salle à manger avec cheminée","sauna":null,"toys_inside":"une salle de jeux (ou 6ème chambre)","toys_outside":"a pleasant garden with barbecue and games for children","large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"les septs laux se trouve à 30 min; only 20 min of the first ski station","notes":"Lumbin house (Grésivaudan), 5 bed + playroom/2 baths, fireplace, kids' games, pets on site; Les 7 Laux 30 min; 57 exchanges.","score":75,"stars":4.0,"gp":270,"rr":90,"gr":5.0,"ex":57,"owner":"Caroline","recip":true,"desc":[{"loc":"en","title":"Maison avec vue splendide sur les montagnes!","gf":"Pour les vacances de Pâques, nous vous faisons une petite fleur,la maison sera à 180 GP la nuit pour un séjour d'une semaine !\nNous sommes une famille avec 3 enfants , maintenant adultes et qui ne vivent plus chez nous. Notre maison, située au pied du massif de la Chartreuse, entre Grenoble et Chambéry, à 45 min d'Annecy, comporte 5 chambres,une salle de jeux (ou 6ème chambre) une salle à manger avec cheminée, 2 salles de bains, une piscine, un jardin agréable avec barbecue .\n Nous avons un magnifique panorama sur le massif de Belledonne, la station de ski familiale \"les septs laux\" se trouve à 30 min : à vous les belles descentes enneigées!\nL'été, vous pourrez profiter de nos montagnes pour faire de magnifiques randonnées , sorties de VTT, canyoning... Si vous aimez les sensations fortes vous pourrez même faire un saut en parapente et atterrir juste en face de la maison! \nAmoureux de la nature, notre maison est un lieu idéal pour les vacances en toutes saisons!\nLes enfants sont les bienvenus, outre la piscine et  la salle de jeux, ils pourront aussi profiter de nos adorables animaux: un chien qui vit à l'extérieur et qui est très affectueux, une petite chèvre qui vit avec le chien et qui réclame des calins,  quelques poules qui vous pondront quelques oeufs moyennant un peu d'eau et de nourriture et une magnifique chatte \"Frisbee\", seul animal à avoir le droit de vivre à l'intérieur avec nous mais qui souvent reste dehors lors des échanges!\n Nous avons fait plusieurs échanges  que ce soit en France ou à l'étranger, tous réussis et nous laissant de très bons souvenirs! ... Nous avons également prêté notre maison à plusieurs reprises. Nous sommes ouverts à toutes propositions.\n\n\nWe are a family with 3 children who are adults now. Our house, situated at the foot of the massif of the Chartreuse, between Grenoble and Chambéry, in 45 min of Annecy, contains 5 bedrooms, a play room (or a bedroom more) a dining room with fireplace, 2 bathrooms, a swimming pool, a pleasant garden with barbecue and games for children.\nWe have a magnificent panorama on the massif of Belledonne, the family ski station \" septs laux \" is in 30 min: to you the beautiful snowy descents!\nThe summer, you can take advantage of our mountains to make magnificent rides, MOUNTAIN BIKE, canyoning... If you like the strong sensations you can even pop over in paragliding and land just in front of the house! \nNature lover, our house is an ideal place for the holidays each season!\nThe children are welcome, besides the swimming pool, the games(sets) in the garden and the playroom, they can also take advantage of our fine animals: one dog  who always lives outside and who are very affectionate, one dwarf goat, 6 hens that will lay eggs for you and a magnificent cat \"Frisbee\", only animal to have the right to live inside with us but wlo often lives outside during exchanges homes!\nWe made several exchanges with the Bretagne, the south of France, the castles of the Loire, the Canary Islands, Normandy, Alsace, South Africa, croatia...all made a success and leaving us of very good memories!... We also lent our house repeatedly. We are opened to any proposals .","gp":"Nos invités vont adorer notre superbe  vue sur les montagnes de Chartreuse et Belledonne, pouvoir se relaxer dans notre belle piscine après une journée de randonnée, l'espace intérieur, la salle de jeux pour les enfants...\nOur guests will love our superb view of the Chartreuse and Belledonne mountains, being able to relax in our beautiful swimming pool after a day of hiking, the interior space, the playroom for children ...","ot":"La maison a une belle piscine idéale pour se relaxer après de belles randonnées. The house has a beautiful ideal swimming pool to relax after beautiful rides.\nLa maison est à seulement 20 min de la première station de ski.\nThe house is only 20 min of the first ski station.\nla maison est spacieuse et peut accueillir une grande famille ou plusieurs couples d'amis! \nThe house is spacious and can welcome a big family or several couples of friends!"},{"loc":"fr","title":"","gf":"Nous sommes une famille avec 3 enfants , maintenant adultes et qui ne vivent plus chez nous. Notre maison, située au pied du massif de la Chartreuse, entre Grenoble et Chambéry, à 45 min d'Annecy, comporte 5 chambres,une salle de jeux (ou 6ème chambre) une salle à manger avec cheminée, 2 salles de bains, une piscine, un jardin agréable avec barbecue .\n Nous avons un magnifique panorama sur le massif de Belledonne, la station de ski familiale \"les septs laux\" se trouve à 30 min : à vous les belles descentes enneigées!\nL'été, vous pourrez profiter de nos montagnes pour faire de magnifiques randonnées , sorties de VTT, canyoning... Si vous aimez les sensations fortes vous pourrez même faire un saut en parapente et atterrir juste en face de la maison! \nAmoureux de la nature, notre maison est un lieu idéal pour les vacances en toutes saisons!\nLes enfants sont les bienvenus, outre la piscine et  la salle de jeux, ils pourront aussi profiter de nos adorables animaux: un chien qui vit à l'extérieur et qui est très affectueux, une petite chèvre qui vit avec le chien et qui réclame des calins,  quelques poules qui vous pondront quelques oeufs moyennant un peu d'eau et de nourriture et une magnifique chatte \"Frisbee\", seul animal à avoir le droit de vivre à l'intérieur avec nous mais qui souvent reste dehors lors des échanges!\n Nous avons fait plusieurs échanges  que ce soit en France ou à l'étranger, tous réussis et nous laissant de très bons souvenirs! ... Nous avons également prêté notre maison à plusieurs reprises. Nous sommes ouverts à toutes propositions.\n\n\nWe are a family with 3 children who are adults now. Our house, situated at the foot of the massif of the Chartreuse, between Grenoble and Chambéry, in 45 min of Annecy, contains 5 bedrooms, a play room (or a bedroom more) a dining room with fireplace, 2 bathrooms, a swimming pool, a pleasant garden with barbecue and games for children.\nWe have a magnificent panorama on the massif of Belledonne, the family ski station \" septs laux \" is in 30 min: to you the beautiful snowy descents!\nThe summer, you can take advantage of our mountains to make magnificent rides, MOUNTAIN BIKE, canyoning... If you like the strong sensations you can even pop over in paragliding and land just in front of the house! \nNature lover, our house is an ideal place for the holidays each season!\nThe children are welcome, besides the swimming pool, the games(sets) in the garden and the playroom, they can also take advantage of our fine animals: one dog  who always lives outside and who are very affectionate, one dwarf goat, 6 hens that will lay eggs for you and a magnificent cat \"Frisbee\", only animal to have the right to live inside with us but wlo often lives outside during exchanges homes!\nWe made several exchanges with the Bretagne, the south of France, the castles of the Loire, the Canary Islands, Normandy, Alsace, South Africa, croatia...all made a success and leaving us of very good memories!... We also lent our house repeatedly. We are opened to any proposals .","gp":"","ot":""}],"ph":["1435325_0","1435325_1","1435325_2","1435325_3","1435325_4","1435325_5","1435325_6","1435325_7"]},{"v":"V8","n":8,"id":2166369,"t":"La maison de Delphine et Nicolas","town":"Saint-Martin-D'uriage","cc":"France","region":"Belledonne","lat":45.17493618492976,"lon":5.8484006952192065,"bd":5,"ba":2,"cap":11,"m2":185,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":0,"children_bed":3,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":1,"baby_bed_up":1},"res":[{"n":"Chamrousse","m":26,"b":26,"km":19,"via":"D111","q":""},{"n":"Le Sappey","m":40,"b":45,"km":23,"via":"D512","q":""},{"n":"Les 7 Laux","m":50,"b":55,"km":43,"via":"A41","q":""},{"n":"St-Pierre-de-Chartreuse","m":55,"b":60,"km":36,"via":"D512","q":""},{"n":"Le Collet d'Allevard","m":60,"b":65,"km":54,"via":"A41","q":""},{"n":"Villard-de-Lans","m":70,"b":80,"km":58,"via":"D531","q":""},{"n":"Aillons-Margeriaz","m":75,"b":85,"km":77,"via":"A41","q":""},{"n":"La Feclaz (Grand Revard)","m":80,"b":90,"km":81,"via":"A41","q":""}],"near":26,"n30":1,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"Deux chambres enfants avec bureaux et jeux (légo, playmobil); salle de billard","toys_outside":"grand jardin avec balançoire et toboggan","large_garden":"un grand jardin","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"à 20 min de la station de ski de Chamrousse; 7 Laux ou stations de l'Oisans (45 min à 1h)","notes":"Renovated barn near Uriage, 20-25 min to Chamrousse; great for kids (swings, slide, Lego, billiards) but 5 bed with 3 child beds, sleeps ~11.","score":74,"stars":3.5,"gp":199,"rr":100,"gr":5.0,"ex":27,"owner":"Delphine et Nicolas","recip":true,"desc":[{"loc":"tr","title":"Delphine and Nicolas's house","gf":"A recently renovated former barn with a stunning view of the mountains, our house invites relaxation and family time together.\nWith a large garden with a swing and slide and a swimming pool, it is 20 min from the Chamrousse ski resort (downhill and cross-country skiing), 25 min from swimmable lakes (Laffrey) and 25 min from Grenoble city centre. It therefore offers rest and calm while giving easy access to all the activities in the area.\nExposed beams, stone floors downstairs and parquet upstairs, a convivial kitchen with made-to-measure wooden units: it combines character and charm.\n\nOn the ground floor, you'll find:\n- a large living room surrounded by picture windows\n- a large kitchen with a 5-burner gas range cooker and two ovens, where you can whip up tasty dishes.\n- a bathroom with walk-in shower and WC.\n\nUpstairs:\n- Two bedrooms with quality queen-size beds.\n- Two children's bedrooms with desks and toys (Lego, Playmobil).\n\nIn the basement:\n- billiards room\n- 5th bedroom with a standard double bed\n\nMaki, our cat, will stay outside and in the basement (her domain) throughout your stay if you wish. You'll just need to give her water and kibble. If you're happy for her to come up to the ground floor, she'll appreciate a few strokes. She doesn't usually go upstairs and spends every night downstairs.","gp":"A cul-de-sac with very little traffic (only 4 other houses). The village of Saint Martin d'Uriage and the spa town of Uriage are 5 min away by car and offer all amenities (bakeries, delicatessens, restaurants). In summer, in the village of Saint Martin d'Uriage you'll also find a heated outdoor pool that is both fun and lets swimmers let off steam.\nThe forest is a few steps away and there are several walks with splendid views (over the mountains or Grenoble) starting from the house.\nFor hikers, the three massifs (Chartreuse, Vercors and above all Belledonne) welcome you with open arms.\nFor cyclists, the Balcons de Belledonne road is 1 km away.\nFor skiers, Chamrousse (25 min) but also Les 7 Laux or the Oisans resorts (45 min to 1h) await you. At Chamrousse you'll also find an outdoor ice rink (in winter), snowshoe walks... . In summer you can go downhill biking, do a treetop adventure course, or simply ride the cable car up to \"la Croix\" for a walk or a restaurant. Very pleasant swimmable lakes are about half an hour away by car.","ot":"We wish you a very good stay in our home and we will be happy to give you advice on walks or activities not to be missed near our lovely house.\n\nWe hope you will enjoy our house and we will be very happy to advise you and give you some tips of activities not far away."},{"loc":"fr","title":"La maison de Delphine et Nicolas","gf":"Ancienne grange récemment rénovée avec vue imprenable sur les montagnes, notre maison invite à la détente et au partage en famille. \nDotée d'un grand jardin avec balançoire et toboggan ainsi que d'une piscine, elle est située à 20 min de la station de ski de Chamrousse (ski de piste et ski de fond), 25 min de lacs baignables (Laffrey) et 25 min du centre-ville de Grenoble. Elle offre donc repos et calme tout en permettant d'accéder facilement à toutes les activités environnantes.\nPoutres apparentes, sol en pierre en bas et parquet à l'étage, cuisine conviviale dotée de meubles en bois sur mesure, elle allie caractère et charme.\n\nAu rez-de-chaussée, vous trouverez :\n- un grand salon entouré de baies vitrées\n- une grande cuisine avec un piano 5 feux gaz et deux fours vous permettra de concocter des petits plats.\n- une salle de bain avec douche à l'italienne et WC.\n\nA l'étage :\n- Deux chambres avec lits queen size de qualité.\n- Deux chambres enfants avec bureaux et jeux (légo, playmobil).\n\nAu sous-sol :\n- salle de billard\n- 5ème chambre avec lit double standard\n\nMaki, notre chat, restera dehors et au sous-sol (son domaine) tout votre séjour si vous le désirez. Il suffira de lui mettre eau et croquettes. Si vous acceptez qu'elle monte au RdC, elle appréciera quelques caresses. Elle ne monte habituellement pas à l'étage et passe toutes les nuits en bas.","gp":"Impasse avec très peu de passage (4 autres habitations seulement). Le village de Saint Martin d'Uriage et la cité thermale d'Uriage sont à 5 min en voiture et offrent toutes les commodités (boulangeries, épiceries fines, restaurants). Dans le village de Saint Martin d'Uriage vous trouverez également l'été, une piscine extérieure chauffée à la fois ludique et permettant aux nageurs de se défouler.\nLa forêt est à quelques pas et il y a plusieurs ballades avec des panoramas splendides (sur les montagnes ou Grenoble) au départ de la maison.\nPour les randonneurs, les trois massifs (Chartreuse, Vercors et surtout Belledonne) vous ouvrent les bras.\nPour les cyclistes, la route des bacons de Belledonne est à 1 km.\nPour les skieurs, Chamrousse (25 min) mais aussi les 7 Laux ou les stations de l'Oisans (45 min à 1h) vous attendent. A Chamrousse vous trouverez également un patinoire extérieure (l'hiver), des ballades en raquettes... . L'été vous pouvez faire du vélo de descente, de l'accrobranche, ou tout simplement monter à \"la croix\" avec le téléphérique pour une ballade ou un restaurant. Des lacs baignables très agréables sont à environ un demi-heure en voiture.","ot":"Nous vous souhaitons un très bon séjour chez nous et nous serons heureux de vous donner des conseils de balades ou d'activités à ne pas manquer proches de notre belle maison.\n\nWe hope you will enjoy our house and we will be very happy to advise you and give you some tips of activities not far away."}],"ph":["2166369_0","2166369_1","2166369_2","2166369_3","2166369_4","2166369_5","2166369_6","2166369_7","2166369_8","2166369_9","2166369_10","2166369_11","2166369_12","2166369_13"]},{"v":"V9","n":9,"id":2653432,"t":"Nadia's house","town":"Collombey","cc":"Switzerland","region":"Vaud Alps","lat":46.2749653621904,"lon":6.950217513893966,"bd":5,"ba":3,"cap":15,"m2":1000,"typ":"House","mn":10,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":1,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":3,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Champery","m":22,"b":24,"km":14,"via":"Rte de Champéry","q":""},{"n":"Villars","m":24,"b":28,"km":15,"via":"Rte de Villars","q":""},{"n":"Leysin","m":35,"b":45,"km":25,"via":"Route 11","q":""},{"n":"Les Diablerets","m":40,"b":50,"km":30,"via":"Route 11","q":""},{"n":"La Tzoumaz","m":50,"b":55,"km":52,"via":"A9","q":""},{"n":"Charmey","m":55,"b":70,"km":69,"via":"A9 and A12","q":""},{"n":"Chateau-d'Oex","m":55,"b":65,"km":43,"via":"Route 11","q":""},{"n":"Verbier","m":55,"b":60,"km":53,"via":"A9","q":""}],"near":22,"n30":2,"n60":9,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":["x26"],"q":[],"ski":null,"notes":"No description at all; 5 bedrooms/3 baths sleeps 15 in Rhône valley (Collombey), size 1000 m2 likely plot; min 10 nights; ask host.","score":74,"stars":3.5,"gp":334,"rr":89,"gr":5.0,"ex":29,"owner":"Nadia","recip":false,"desc":[{"loc":"tr","title":"The house in Collombey","gf":"My house is a lovely family house, recently renovated. It is built on a 1000 m2 plot of land.\nIt is 20 minutes from the ski slopes/mountain hik .5,"gp":251,"rr":100,"gr":4.99,"ex":27,"owner":"Raphaële","recip":true,"desc":[{"loc":"en","title":"Nice house in the Alps / Stunning view / AVAILABLE 2d fortnight july 2022","gf":"French Alps - Nice new-house in a typical mountain village \nStunning view on the valley and mountains\n\nSituated at an altitude of 950 meters (col des Ayes – Les Adrets – 38190 Isère), our house is recent (built in 2012), bright and sunny. It has a stunning view on mountains (Chartreuse, Vercors and Belledonne) and valley. \nWith a living area of 130 square meters the house is composed of : \n•\tA living room with kitchen (50 sq. m)\n•\t4 bedrooms (including one of 25 sq. m)\n•\tAn open office area \n•\t1 bathroom\n•\t2 toilets \n•\tGarage + cellar\n\nIn a garden of more than 1 000 sq. m fitted with : \n•\tA wooden cabin for kids\n•\tA swing\n•\tA hammock\n•\tTransats \n•\tTable tennis\n•\tTrampoline","gp":"What to do around home ? \nA stone’s throw from our house : \n•\tHiking and walking (marked paths)\n•\tBiking (mountain biking on the marked paths and cycling on the amazing roads of “balcons de Belledonne”)\n•\tTrail\n\n7 Laux resort (10 minutes) \n•\tAlpine skiing (45 slopes), skating, snow shoes, \n•\tClimbing wall  (for learning)\n•\tSwimming pool \n•\tArchery \n•\tMountain biking  (chairlift open in summer) \n\nA bit further (30 minutes)\n•\tClimbing \n•\tVia ferrata\n•\tParagliding\n•\tTreetop adventure course\n•\tSwmming in the lakes \n•\tKarting\n•\tGolf","ot":"La vue sur les massifs depuis notre terrasse et notre canapé / The view on the mountains from our terrace and sofa\nLa lumière et l’ensoleillement à toute heure de la journée / The light and sunshine all day long \nL’environnement immédiat, à la fois campagnard et montagnard / Immediate surroundings, between mountain and country, forests and grasslands"},{"loc":"fr","title":"Alpes / massif Belledonne / belle vue /station ski 7 Laux 10 min / 8-10 personnes","gf":"Maison 8-10 personnes située à 10 min de la station des 7 Laux (Prapoutel - Pipay)\n\nSituée à 950 mètres d’altitude (col des Ayes – Les Adrets), notre maison est récente, lumineuse et bénéficie d’une magnifique vue sur la vallée du Grésivaudan et les massifs de Belledonne, de la Chartreuse et du Vercors.\n\nD’une surface de 130m2 elle est composée : \n•\tD’une pièce de vie de 50m2 (cuisine – salle à manger – salon)\n•\tDe 4 chambres (dont une de 25m2) \n•\tD’un coin bureau\n•\tD’une salle de bains (baignoire + douche)\n•\tDe 2 WC\n•\tD’un garage et d’un cellier \n\nSur un terrain de plus de 1 000 m2 bénéficiant : \n•\tD’une belle terrasse et d'un grand jardin\n•\tD’une petite cabane en bois pour les enfants \n•\tD’une balançoire\n•\tD’un trampoline \n•\tDe cages de foot \n•\tD’un toboggan\n•\tD’un bac à sable\n \nNous y installons l’été les transats, le hamac, la table de ping-pong, nous sortons les boules de pétanque, une petite cage de foot…  Et l’hiver un grand champ de luge se trouve à 200 mètres de chez nous.","gp":"La superbe vue, la terrasse ensoleillée, les massifs qui nous entourent, le coucher de soleil sur les montagnes, les chemins de rando et de VTT, la station des 7 Laux animée hiver comme été...\n\nBref, la vie à la montagne, pour petits et grands !!!","ot":""}],"ph":["1457995_0","1457995_1","1457995_2","1457995_3","1457995_4","1457995_5","1457995_6","1457995_7","1457995_8","1457995_9","1457995_10","1457995_11","1457995_12","1457995_13","1457995_14","1457995_15","1457995_16","1457995_17","1457995_18","1457995_19","1457995_20","1457995_21","1457995_22","1457995_23","1457995_24","1457995_25","1457995_26","1457995_27","1457995_28","1457995_29","1457995_30","1457995_31","1457995_32","1457995_33","1457995_34","1457995_35","1457995_36","1457995_37","1457995_38","1457995_39","1457995_40","1457995_41"]},{"v":"V12","n":12,"id":3327275,"t":"Duplex for 14 people ideally located in Saint Gervais les Bains, Cures, Mont Blanc, mounta","town":"Saint-Gervais-les-Bains","cc":"France","region":"Mont Blanc","lat":45.89316194 oys_inside":"des jeux de société, un home cinéma avec un bon choix de dvd","toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":["Morzine D902"],"ski":"Les Carroz: commerces et télécabine accessibles à pieds (Grand Massif, Samoëns, Flaine)","notes":"Les Carroz log chalet, 5 bed/4 bath, sleeps 15; walk to gondola (Grand Massif); fireplace, home cinema; very small kitchen.","score":71,"stars":3.5,"gp":235,"rr":80,"gr":5.0,"ex":3,"owner":"Cecile","recip":true,"desc":[{"loc":"tr","title":"Chalet le Balcon","gf":"The chalet, built entirely of logs with red shutters, dates from the 1960s. Partly renovated since 2009, it is very warm and cosy, despite a small kitchen that has kept its original state.\n\nThe chalet is spread over three levels. You enter on the upper level, where there is a double bedroom, a bathroom, a WC and two mezzanines.\n\nA staircase leads down to the middle floor, to the main room with the lounge area and its fireplace and the dining area. The kitchen is very small but very practical. On this floor is the main bedroom with a large double bed and its bathroom, plus a WC. This floor opens onto a very large terrace looking out on the view. The terrace has a very large wooden table, a coffee table, two stools and deckchairs that can be brought out to enjoy the sun.\n\nGoing down another floor you reach the lower level, with 2 small bedrooms with 2 beds and a large room that serves both as a dormitory (3 beds) and a home cinema. On this floor are 1 WC, 1 shower room and 1 bathroom, as well as the laundry room with a washing machine and the boiler. This floor also has a lovely large south-facing terrace facing the view.","gp":"Very well located, above the village; the shops can be reached on foot, as can the gondola for skiing and the hiking trails. The village is very family-friendly with all the necessary facilities. Les Carroz is a renowned ski resort linked to Samoëns and Flaine, offering many activities in summer and winter. The surroundings are quiet and the view is magnificent.","ot":"This chalet is a second home regularly used by our family and friends. You will find a bookcase full of comics, board games, a home cinema with a good choice of DVDs, a child's chair, wifi…\n2 parking spaces are right in front of the entrance, which makes access very convenient.\nOnce the cars are parked, you can do everything on foot."},{"loc":"fr","title":"Chalet le balcon","gf":"Le chalet tout en rondins de bois et volets rouges date des années 1960. Rénové en partie depuis 2009, il est très chaleureux et cosy malgré une petite cuisine restée « dans son jus ».\n\nLe chalet se développe sur trois niveaux. On rentre par le niveau supérieur où se trouve une chambre double, une salle de bains, un wc et deux mezzanines.\n\nUn escalier descend à l’étage central, dans la pièce principale où se trouve le coin salon et sa cheminée et le coin salle à manger. La cuisine est toute petite mais très pratique. À cet étage se trouve la chambre parentale avec un grand lit double et sa salle de bains plus un wc. Cet étage donne sur une très grande terrasse ouverte sur la vue. La terrasse est équipée d’une très grande table en bois, une table basse, deux tabourets et des transats que l’on peut sortir pour profiter du soleil.\n\nEn descendant encore d’un étage vous arrivez au niveau inférieur où se trouvent 2 petites chambres avec 2 lits et une grande pièce qui sert à la fois de dortoir (3 lits) et de home cinéma. À cet étage se trouvent 1 wc, 1 salle de douche et 1 salle de bains, ainsi que la buanderie équipée d’un lave linge et de la chaudière. Cet étage est aussi agrémenté d’une belle et grande terrasse, plein sud, face a la vue.","gp":"Très bien placé, au dessus du village, les commerces sont accessibles à pieds, ainsi que la télécabine pour aller skier et les sentiers pour randonner. Le village est très familial avec tous les équipements nécessaires. Les Carroz est une station de ski renommée reliée à Samoëns et Flaine, qui propose de nombreuses activités en été comme en hiver. L’environnement est calme et la vue magnifique.","ot":"Ce chalet est une résidence secondaire habitée régulièrement par notre famille et nos amis. Vous y trouverez une bibliothèque remplie de bandes dessinées, des jeux de société, un home cinéma avec un bon choix de dvd, une chaise pour enfants, la wifi…\n2 places de parking se trouvent juste devant l’entrée ce qui rend l’accès très pratique. \nUne fois les voitures posées, vous pouvez tout faire à pied."}],"ph":["2981153_0","2981153_1","2981153_2","2981153_3","2981153_4","2981153_5","2981153_6","2981153_7","2981153_8","2981153_9","2981153_10","2981153_11","2981153_12","2981153_13","2981153_14","2981153_15","2981153_16","2981153_17","2981153_18","2981153_19","2981153_20","2981153_21","2981153_22","2981153_23","2981153_24","2981153_25","2981153_26","2981153_27","2981153_28","2981153_29","2981153_30","2981153_31"]},{"v":"V14","n":14,"id":1319595,"t":"Chalet en Haute Savoie, France","town":"Saint-Jean-De-Sixt","cc":"France","region":"Mont Blanc","lat":45.92533971705879,"lon":6.42124521608568,"bd":4,"ba":2,"cap":14,"m2":230,"typ":"House","mn":7,"beds":{"big_double_bed":1,"double_bed":2,"single_bed":5,"children_bed":1,"baby_bed":1,"double_bed_up":0,"single_bed_up":0,"children_bed_up":1,"baby_bed_up":0},"res":[{"n":"La Clusaz","m":12,"b":12,"km":5,"via":"Rte de Corengy and D909","q":"Aravis D909"},{"n":"Le Grand-Bornand","m":12,"b":12,"km":5,"via":"Rte de Corengy and D4","q":""},{"n":"Crest-Voland","m":55,"b":55,"km":33,"via":"Rte du Col des Aravis","q":""},{"n":"Megeve","m":60,"b":65,"km":35,"via":"Rte du Col des Aravis and D1212","q":"Val d'Arly D1212"},{"n":"Combloux","m":65,"b":70,"km":39,"via":"Rte du Col des Aravis and D1212","q":"Val d'Arly D1212"},{"n":"Les Carroz","m":65,"b":70,"km":54,"via":"Tour du Bargy/D12 and A40","q":""},{"n":"Les Saisies","m":65,"b":70,"km":40,"via":"Rte du Col des Aravis and D218B","q":""},{"n":"Les Houches","m":70,"b":85,"km":73,"via":"A40","q":""}],"near":12,"n30":2,"n60":4,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":"sejour avec cheminée","sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":"terrain 1000m2","winter_restriction":null,"access_issue":null},"av":[],"q":["Aravis D909"],"ski":"Stations de ski à partir de 3 km (la Clusaz, le Grand Bornand); La Clusaz à 5 km","notes":"230 m2 Aravis chalet, sleeps 14, fireplace, 1000 m2 plot, 5 km to La Clusaz/Grand-Bornand; min 7 nights, €100 cleaning on GP - strong fit.","score":70,"stars":3.5,"gp":280,"rr":93,"gr":4.97,"ex":161,"owner":"May","recip":true,"desc":[{"loc":"en","title":"Chalet en Haute Savoie, France","gf":"SVP pas d’échange de moins de 7 nuits !\nChalet en moyenne montagne, idéal pour des vacances en toutes saisons et pour des échanges non simultanés . \r\nStations de ski à partir de 3 km (la Clusaz, le Grand Bornand).\r\nAnnecy est à 30 km, Genève à 50 km( l'aéroport international à 60 km ). Chamonix et le Mont Blanc à 70 km.\r\n230 m2, 4 chambres, 3 lits doubles, 2 x 2 lits superposés, 2 salles de bain, salle à manger, sejour avec cheminée, cuisine équipée, terrasse, terrain 1000m2, belle vue sur la vallée de Thônes et les Pres-Alpes. Wifi et TV","gp":"Quartier de chalets calme, village à 2 km, La Clusaz à 5 km, le Grand Bornand à 5 km, Annecy à 30 km, Genève à 50 km, Chamonix à 70 km. Grandes promenades depuis le chalet. Belles randonnées dans les Pres-Alpes. Baignades au lac d'Annecy. Via ferrata, escalade, canyoning, golf, parapente. Région gastronomique. Vastes domaines de sports d'hiver. Climat agréable en toutes saisons.","ot":"La maison, agréable, est hors des sentiers battus\nLa région alterne fêtes traditionnelles,événements\nInternationaux, sportifs, culturels. \nNous demandons 100€ de frais de ménage en cas d’échange contre Guestpoints"}],"ph":["1319595_0","1319595_1","1319595_2","1319595_3","1 sommes un couple d'architecte, et nous avons conçu notre maison.\r\nNous y avons mis tous notre coeur et notre ...patience et le résultat nous procure chaque jour, joie et bonheur. \r\n\r\nElle fait environ 160m² est composée d'un niveau supérieur donnant sur un jardin plein sud composé des espaces de vies : Salon, salle à manger, cuisine et coin bureau.  \r\n\r\nUne grande terrasse \"patio\" sépare le salon de la salle à manger et prolonge en même temps cet espace.  C'est un lieu de partage et de lien avec le jardin.\r\n\r\nAu \"rez-de-chaussée bas\" on trouve 5 chambres, 2 salles de bains, un WC indépendant et une salle de jeux. \r\n\r\nLà aussi la distribution est aussi atypique.  En effet, afin de privilégier les relations et les liens entre nos enfants, nous avons conçu une grande salle de jeux sur laquelle donne de petites chambres qui servent uniquement pour la nuit ou les devoirs. Les échanges, les jeux, se déroulent dans la salle commune.\r\n\r\nVoilà notre \"maison du bonheur\" comme nous nous plaisons à l'appeler, en espérant qu'elle vous procure autant de joie que nous lors de vos vacances.","gp":"Nous vivons dans une petite ville touristique.  Nous sommes à 12' à pied du centre ville. Suffisamment à l'écart pour profiter du calme et de la vue exeptionnelle.\r\nL'hiver, 2 stations de ski sont à 20 minutes de voiture avec en plus des navettes bus à 0,5€ (le Collet d'Allevard et les 7 laux). \r\nL'été Allevard est une station thermale où il est agréable de faire des cures ou des soins.\r\nNous bénéficions d'un cinéma, de nombreux commerces, mais aussi d'une piscine municipale agréable (à 500m) et d'un CASINO !!\r\nIci on ne s'ennuie jamais, on fait des ballades en montagnes mais on peut également profiter des magnifiques villes qui nous entourent, comme Annecy, Romans, Chambéry, Pont en Royans ...\r\nOn est également sur un spot mondial de parapente (saint hilaire du Touvet et la fameuse coupe Icare), on fait de l'escalade, des baignades dans des lacs d'eau transparente ...\r\nUne région magnifique et surprenante ...","ot":"Notre maison est spacieuse, lumineuse et colorée\nau coeur des montagnes, de circuits de randonnées\nà 1/2h de Grenoble ou de Chambéry, proche d'Annecy"},{"loc":"fr","title":"La maison lumineuse avec piscine","gf":"Maison très lumineuse, spacieuse, pratique et agréable. \nL'espace de vie est ouvert sur la nature, le paysage et les magnifiques montagne.\nNous avons \nMagnifique piscine de 8,5m x 3m\nClimatisation l'été et poêle à bois l'hiver et 1 sauna\n1 chambre avec lit de 180, \n2 chambres avec lit de 140, \n2 chambre avec lit de 160 \n2 belles salles de bain et une belle cuisine équipée.","gp":"Notre quartier est calme et tranquille \nNous habitons à 15' à pied du centre d'Allevard. \nAvec tous les avantages d'une petite ville touristique et thermale : petits commerces locaux, marchés, festivités diverses, cinéma, piscine, thalasso ...\nEn hiver : nous sommes à 20' en voiture du Collet d'Allevard et des Sept Laux !! ski, luge, neige !!","ot":"Nous appelons notre chez nous \"la maison du Bonheur\" et ce n'est pas pour rien\nNous baignons dans la nature, au milieu des arbres et des montagnes tout en étant proche de magnifiques villes comme Chambéry, Pont en Royans, Turin, Lyon !!\nA bientôt"}],"ph":["1408615_0","1408615_1","1408615_2","1408615_3","1408615_4","1408615_5","1408615_6","1408615_7","1408615_8","1408615_9","1408615_10","1408615_11","1408615_12","1408615_13","1408615_14","1408615_15","1408615_16","1408615_17","1408615_18","1408615_19","1408615_20","1408615_21","1408615_22","1408615_23","1408615_24","1408615_25","1408615_26","1408615_27","1408615_28","1408615_29","1408615_30","1408615_31","1408615_32","1408615_33","1408615_34","1408615_35","1408615_36","1408615_37","1408615_38","1408615_39","1408615_40"]},{"v":"V16","n":16,"id":2871523,"t":"La maison d'Alice et Marco au calme avec vue Lac","town":"Sévrier","cc":"France","region":"Aravis","lat":45.852866524259476,"lon":6.138583489736008,  trees. Shops and a bus stop are within walking distance (bakery and greengrocer 600m away); the lake and the cycle path are less than 5 minutes away by bike. Annecy town centre is 5km away, reachable by bike via the cycle path, by car or by bus.","ot":""},{"loc":"fr","title":"La maison d'Alice et Marco au calme avec vue Lac","gf":"Bienvenue dans notre maison, idéale pour profiter d'Annecy et de son lac. Elle se situe à 5 km du centre ville d'Annecy et à 1 km du lac, au pied du massif des Bauges vous pourrez également profiter de la montagne! \nLa maison dispose de 4 chambres et d'un bureau, salon-salle à manger avec poêle à bois et vue lac. Vous pourrez également bénéficier du jardin et d'une terrasse de 40m2.","gp":"La maison se situe dans une impasse, dans un quartier résidentiel très calme et convivial. L'environnement est très arboré. Les commerces et arrêt de bus sont accessibles à pied (boulangerie et primeur à 600m), le lac et la piste cyclable sont à moins de 5 minutes à vélo. Le centre ville d'Annecy se situe à 5km, accessible en vélo par la piste, en voiture ou en bus.","ot":""}],"ph":["2871523_0","2871523_1","2871523_2","2871523_3","2871523_4","2871523_5","2871523_6","2871523_7","2871523_8","2871523_9","2871523_10","2871523_11","2871523_12","2871523_13","2871523_14","2871523_15","2871523_16","2871523_17","2871523_18","2871523_19","2871523_20","2871523_21","2871523_22","2871523_23","2871523_24","2871523_25"]},{"v":"V17","n":17,"id":2016060,"t":"Grande maison familiale entre de magnifiques lacs et montagnes","town":"Chambéry","cc":"France","region":"Bauges","lat":45.575445894323124,"lon":5.892198668539825,"bd":5,"ba":2,"cap":12,"m2":178,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":4,"children_bed":0,"baby_bed":1,"double_bed_up":0,"single_bed_up":3,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"La Feclaz (Grand Revard)","m":40,"b":45,"km":24,"via":"D912","q":""},{"n":"Aillons-Margeriaz","m":45,"b":50,"km":28,"via":"D206","q  de l'Epine.\nWe are at the foot of the Chartreuse and the Bauges (hiking 30 min away by car)\nFinally, the lake at Aix les Bains is 20 min away by car (40 min by bike on the cycle path), a very nice area for swimming and water sports. The beautiful town of Annecy is 50 min away.","ot":"Welcome to our warm home!"},{"loc":"fr","title":"Grande maison familiale entre de magnifiques lacs et montagnes","gf":"Belle maison spacieuse, restaurée dans un ancien corps de ferme au cœur du quartier de Bissy.\nNotre maison chaleureuse vous accueille avec joie, équipée pour une famille nombreuse !\nJeux de société, livres et BD et jeux d'enfants pour tous les âges.\nCoin lecture, coin vidéo et des espaces pour chacun.\nJardin de 400m2, habillé d'arbres fruitiers et de verdure, espace repas extérieur très agréable et un vrai trampoline. Piscine hors sol de 4.6 de diamètre sur 1m20, très spacieuse pour jouer ou se rafraichir.\nSoirée colorée d'un poêle à bois l'hiver.","gp":"Quartier calme et peu d'exposition au voisinage, qui sont cependant fort agréables. \nLe centre historique de Chambéry se trouve à 8 min en voiture (ou 15 min en vélo!)\nVous pourrez partir à pied de chez nous en direction de la montagne de l'Epine.\nNous sommes au pied de la Chartreuse, et des Bauges (randonnée à  30 min de voiture)\nEnfin le lac d'Aix les Bains se trouve à 20 min de voiture (40 min de vélo en piste cyclable) espace de baignade et de loisir aquatique très sympathique. La belle ville d'Annecy est à 50min.","ot":"Bienvenue dans notre maison chaleureuse!"}],"ph":["2016060_0","2016060_1","2016060_2","2016060_3","2016060_4","2016060_5","2016060_6","2016060_7","2016060_8","2016060_9","2016060_10","2016060_11","2016060_12","2016060_13","2016060_14","2016060_15","2016060_16","2016060_17","2016060_18","2016060_19","2016060_20","2016060_21","2016060_22","2016060_23","2016060_24","2016060_25","2016060_26","2016060_27","2016060_28","2016060_29","2016060_30","2016060_31","2016060_32","2016060_33","2016060_3
