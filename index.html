cious and bright on the ground floor with its large picture windows, but also cosy upstairs under the sloping roof. The 2000 m² wooded garden offers a great play area as well as a few vegetables in summer! The terrace facing the view offers a very pleasant place for relaxation and tranquillity. We have only one neighbour, and are not overlooked.\nIn winter, the stove wraps you in a warm atmosphere to the sound of the crackling fire, and if snow comes along the atmosphere is magical.\nOur house is a place of simplicity and authenticity where life is good!\n\nGROUND FLOOR\n- A large equipped kitchen (bean-to-cup coffee machine) with a view of the mountains\n- A large living room with dining table, sofa, TV, wood stove, large picture windows\n- An office (fibre internet for remote working)\n- A bedroom with a 140 double bed\n- A bathroom with a large shower\n- WC\n- A secure garage\n\nUPSTAIRS\n- A bedroom with a 180 double bed\n- A bedroom with a 140 double bed, a child's bed and a sofa\n- A bathroom with bathtub and WC\n\nOUTSIDE\n- A gravel courtyard for parking cars (up to 5)\n- A shaded area under the oak tree with a picnic table\n- A sunny terrace with outdoor table and parasol\n- A shaded corner under the plum tree with garden furniture\n- A removable double hammock\n- A wood-fired barbecue\n- A vegetable garden","gp":"Our house is in Revel, a small mountain village in the Belledonne range, less than 30 min from Grenoble and the Chamrousse ski resort, and 10 min from hiking trailheads.\nIt's a place made for lovers of nature and mountains!\n\nIn Revel:\n- café/restaurant \"Luma\" in the village centre, local cooking with a vegetarian option\n- Freydières natural area, with a small pond, walking trails, and the cultural bar-café-restaurant \"La Gélinotte\", mountain-hut-style local cooking with a vegetarian option.\n- \"Caresse et Câline\" farm: artisan ice cream, with open days on Saturdays\n- hiking trailhead for Lac du Crozet and the Refuge de la Pra or the summit of the Grand Colon\n- small market on the town hall square on Saturday mornings\n\nNearby:\n- Bois Français leisure park (20 min)\n- outdoor swimming pool in summer at St Martin d'Uriage (15 min)\n- thermal baths, Michelin-starred restaurants, casino... in Uriage-les-Bains (20 min)\n- Chamrousse ski resort and hiking trailheads (25 min)","ot":"We are very respectful of the homes we stay in and considerate towards hosts, and we hope for the same consideration from our guests ;) Welcome to our home!"},{"loc":"fr","title":"Maison de montagne avec vue de Lucie et Tibô","gf":"Notre maison de type chalet de montagne se niche dans un écrin de verdure et de nature, avec une superbe vue sur les montagnes autour de Grenoble.\nElle a de multiple facettes : spacieuse et lumineuse au rez-de-chaussée avec ses grandes baies vitrées mais aussi cosy à l'étage sous les pentes de toit. Le jardin arboré de 2000 m² offre un beau terrain de jeu ainsi que quelques légumes l'été ! La terrasse en face de la vue offre un lieu de détente et tranquillité très appréciable. Nous n'avons qu'un seul voisin sans vis-à-vis.\nL'hiver, le poêle vous plonge dans une atmosphère chaleureuse au son du crépitement du feu, et si la neige s'invite l'ambiance est magique.\nNotre maison est un lieu tout en simplicité et authenticité où il fait bon vivre !\n\nREZ DE CHAUSSÉE\n- Une grande cuisine équipée (machine à café à grain) avec vue sur les montagnes\n- Un grand séjour avec table à manger, canapé, TV, poêle à bois, grandes baies vitrées\n- Un bureau (fibre internet pour télétravailler)\n- Une chambre avec lit double 140\n- Une salle de bain avec grande douche \n- Des WC\n- Un garage sécurisé\n\nÉTAGE \n- Une chambre avec un lit double 180\n- Une chambre avec un lit double 140, un lit enfant et un canapé\n- Une salle de bain avec baignoire et WC\n\nEXTÉRIEUR\n- Une cours gravillonnée pour garer les voitures (jusqu'à 5)\n- Un espace ombragé sous le chêne avec table de pique nique\n- Une terrasse ensoleillée avec table d'extérieur et parasol\n- Un coin ombragé sous le prunier avec salon de jardin \n- Un hamac double amovible\n- Un barbecue à bois\n- Un potager","gp":"Notre maison se situe à Revel, petit village de montagne dans la chaîne de Belledonne, à moins de 30 min de Grenoble et de la station de ski de Chamrousse, et à 10 min des départs de randonnées.  \nC'est un lieu fait pour les amoureux de la nature et des montagnes !\n\nA Revel : \n- café/restaurant \"Luma\" au centre du village, cuisine locale avec option végétarienne\n- espace naturel de Freydières, avec petit étang, sentiers de balade, bar café restaurant culturel \"La Gélinotte\" cuisine style refuge, locale avec option végétarienne.\n- ferme \"Caresse et Câline\" : glaces artisanales avec portes ouvertes le samedi\n- départ de randonnée pour le lac du Crozet et le refuge de la Pra ou le sommet du Grand Colon\n- petit marché sur la place de la mairie le samedi matin\n\nAux alentours : \n- base de loisir du Bois Français (20 min)\n- piscine extérieure l'été à St Martin d'Uriage (15 min)\n- termes, restaurants étoilés, casino... à Uriage les bains (20 min)\n- station de ski et départs de randonnée de Chamrousse (25 min)","ot":"Nous sommes très respectueux des logements dans lesquels nous séjournons et bienveillants à l'égard des hôtes, et espérons la même considération de nos guests ;) Bienvenue chez nous !"}],"ph":["1921980_0","1921980_1","1921980_2","1921980_3","1921980_4","1921980_5","1921980_6","1921980_7","1921980_8","1921980_9","1921980_10","1921980_11","1921980_12","1921980_13","1921980_14","1921980_15","1921980_16","1921980_17","1921980_18","1921980_19","1921980_20","1921980_21","1921980_22","1921980_23","1921980_24","1921980_25","1921980_26","1921980_27","1921980_28","1921980_29","1921980_30","1921980_31","1921980_32","1921980_33","1921980_34","1921980_35","1921980_36","1921980_37","1921980_38"]},{"v":"V89","n":89,"id":3289733,"t":"Villa Côte des Vignes - Annecy à 15', Genève à 30'","town":"Charvonnex","cc":"France","region":"Aravis","lat":45.9848621111213,"lon":6.15435387179068,"bd":4,"ba":2,"cap":11,"m2":120,"typ":"House","mn":4,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":4,"children_bed":1,"baby_bed":1,"double_bed_up":0,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"La Clusaz","m":50,"b":60,"km":37,"via":"D909","q":"Aravis D909"},{"n":"Le Grand-Bornand","m":50,"b":60,"km":37,"via":"D909","q":"Aravis D909"},{"n":"Les Carroz","m":55,"b":65,"km":66,"via":"A410 and A40","q":""},{"n":"Aillons-Margeriaz","m":60,"b":70,"km":55,"via":"A41","q":""},{"n":"Combloux","m":60,"b":75,"km":75,"via":"A410 and A40","q":""},{"n":"La Feclaz (Grand Revard)","m":65,"b":75,"km":66,"via":"A41 and D913","q":""},{"n":"Samoens","m":65,"b":80,"km":72,"via":"A410 and A40","q":""},{"n":"Les Gets","m":70,"b":85,"km":74,"via":"A410 and A40","q":""}],"near":50,"n30":0,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":"beaux volumes, hauts plafonds, parquet, cheminée en marbre","sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":"grand jardin arboré d'environ 1 000 m²","winter_restriction":null,"access_issue":null},"av":[],"q":["Aravis D909"],"ski":"En hiver, La Clusaz, Le Grand-Bornand, le plateau des Glières et le Semnoz (day trips, no times)","notes":"1900 villa near Annecy, 4 bed/2 bath, owner says up to 9; marble fireplace, 1,000 m2 garden; day-trip skiing; new owner, 0 exchanges.","score":51,"stars":2.5,"gp":220,"rr":100,"gr":0.0,"ex":0,"owner":"Dhalia","recip":true,"desc":[{"loc":"tr","title":"Villa Côte des Vignes - Annecy 15', Geneva 30'","gf":"Villa Côte des Vignes is first and foremost our family home: a house full of character built around 1900, set on the heights of Charvonnex, in the Grand Annecy countryside.\nWe fell in love with this house because it looks like no other in the surrounding landscape. In the middle of a setting that is still rural, among gardens, fields and mountains, its bourgeois-house silhouette, its façade details and its proportions give it a very special presence.\nThe house is now listed in Charvonnex's built heritage register, as is the large old farmhouse right next to it.\nInside, it has kept the charm of old houses: generous volumes, high ceilings, parquet floors, a marble fireplace, mouldings and exposed beams under the roof. The renovations carried out over the years have brought in more light and opened it up widely onto the garden and the mountains, while preserving its character.\nThe house offers about 120 m² of living space over three levels, with four bedrooms and two bathrooms. It can sleep up to 9 people and is particularly well suited to stays with family or friends.\nThe living area is organised around a large, convivial kitchen open onto the dining room and living room. From the house as well as from the garden, the view stretches far out over the mountains: the Parmelan, the Tournette and the surrounding peaks are truly part of life here.\nOutside, the house is surrounded by a large, fully private garden of about 1,000 m² with trees. We eat lunch outdoors, the children play in the garden, we settle under the walnut tree and enjoy that feeling of space and calm that so won us over when we discovered the house.\n\nA little history…\nWe still know little about the house's early years — and its history remains partly to be discovered.\nBuilt around 1900, it was historically linked to the large old farmhouse at the end of the cul-de-sac. According to the information passed on to us, a woman from the family of that farm had this house built, and its bourgeois architecture is quite unusual in its rural Savoyard setting.\nThe house and the neighbouring farm are both now listed for their heritage interest and still bear witness to the history of this little corner of Charvonnex.\nIts address is Côte des Vignes. We are still trying to trace its exact origin and history, but when we were looking for a name for our house, it seemed obvious to borrow the name of the place: Villa Côte des Vignes.\nOver time, the house has evolved. In particular, new openings were created towards the garden and the mountains, bringing the landscape into the living spaces. We love this meeting between its old architecture and a much more contemporary way of living in it.\nMore than a century after it was built, it remains above all what it seems always to have been: a house made to be lived in, shared and filled with life.","gp":"Villa Côte des Vignes is in Charvonnex, in Grand Annecy, in a residential and still very rural setting, among fields, forests and mountains.\nThe house sits slightly up the hillside, at the end of a small cul-de-sac. This position gives it a lovely open view of the surrounding mountains, notably the Parmelan and the Tournette, while giving the feeling of being in the countryside.\nThat is exactly what we love here: being able to enjoy the calm, the garden and the mountains while staying very close to Annecy.\nAnnecy and the lakeshore are about 15–20 minutes away by car. In the other direction, Geneva can be reached in around thirty minutes. The house is therefore ideally located on the Annecy–Geneva axis, in the north of Grand Annecy.\nFor everyday needs, a bakery, local produce, restaurants and shops are a few minutes away by car. The surroundings also offer many opportunities for walks, hikes and outdoor activities.\nIn the warmer months, Lake Annecy, its beaches and the villages along its shores are very close. In winter, La Clusaz, Le Grand-Bornand, the Plateau des Glières and the Semnoz make it easy to head off for a day in the mountains.\nWe find it a particularly pleasant location for discovering the region: Annecy and the lake whenever you feel like it, the mountains all around, Geneva nearby — and then the calm of the countryside when you come home.","ot":"We are a couple in our forties, parents of a little girl. I am an interior designer. We are passionate about architecture, decoration and human relationships. We love discovering the world. Don't hesitate to contact us!"},{"loc":"fr","title":"Villa Côte des Vignes - Annecy à 15', Genève à 30'","gf":"La Villa Côte des Vignes est avant tout notre maison de famille : une demeure de caractère construite autour de 1900, posée sur les hauteurs de Charvonnex, dans la campagne du Grand Annecy.\nNous sommes tombés sous le charme de cette maison parce qu’elle ne ressemble à aucune autre dans le paysage qui l’entoure. Au milieu d’un environnement encore rural, entre jardins, champs et montagnes, sa silhouette de maison bourgeoise, ses détails de façade et ses proportions lui donnent une présence très particulière.\nLa maison est aujourd’hui repérée au patrimoine bâti de Charvonnex, tout comme la grande ferme ancienne située à proximité immédiate.\nÀ l’intérieur, elle a conservé le charme des maisons anciennes : beaux volumes, hauts plafonds, parquet, cheminée en marbre, moulures et charpente apparente sous les toits. Les rénovations réalisées au fil des années lui ont apporté davantage de lumière et l’ont largement ouverte sur le jardin et les montagnes, tout en préservant son caractère.\nLa maison offre environ 120 m² habitables, répartis sur trois niveaux, avec quatre chambres et deux salles de bain. Elle peut accueillir jusqu’à 9 personnes et se prête particulièrement bien aux séjours en famille ou entre amis.\nLa pièce de vie s’organise autour d’une grande cuisine conviviale ouverte sur la salle à manger et le salon. Depuis la maison comme depuis le jardin, le regard porte au loin sur les montagnes : le Parmelan, la Tournette et les sommets environnants accompagnent véritablement la vie ici.\nÀ l’extérieur, la maison est entourée d’un grand jardin arboré d’environ 1 000 m², entièrement privé. On y déjeune dehors, les enfants jouent dans le jardin, on s’installe sous le noyer et on profite de cette sensation d’espace et de calme qui nous avait tant séduits lorsque nous avons découvert la maison.\n\nUn peu d’histoire…\nNous connaissons encore peu de choses sur les premières années de la maison — et son histoire reste en partie à découvrir.\nConstruite autour de 1900, elle était historiquement liée à la grande ferme ancienne située au bout de l’impasse. D’après les informations qui nous ont été transmises, une femme de la famille de cette ferme aurait fait construire cette demeure, dont l’architecture bourgeoise est assez singulière dans son environnement rural savoyard.\nLa maison et la ferme voisine sont aujourd’hui toutes deux repérées pour leur intérêt patrimonial et témoignent encore de l’histoire de ce petit morceau de Charvonnex.\nSon adresse est Côte des Vignes. Nous cherchons encore à en retracer précisément l’origine et l’histoire, mais lorsque nous avons cherché un nom pour notre maison, il nous a semblé évident de lui emprunter celui du lieu : Villa Côte des Vignes.\nAu fil du temps, la maison a évolué. De nouvelles ouvertures ont notamment été créées vers le jardin et les montagnes, faisant entrer le paysage dans les pièces de vie. Nous aimons cette rencontre entre son architecture ancienne et une manière beaucoup plus contemporaine de l’habiter.\nPlus d’un siècle après sa construction, elle reste surtout ce qu’elle semble avoir toujours été : une maison faite pour être habitée, partagée et remplie de vie.","gp":"Villa Côte des Vignes se trouve à Charvonnex, dans le Grand Annecy, dans un environnement résidentiel et encore très rural, entre champs, forêts et montagnes.\nLa maison est située légèrement en hauteur, au bout d’une petite impasse. Cette position lui offre une belle vue dégagée sur les montagnes environnantes, notamment le Parmelan et la Tournette, tout en donnant la sensation d’être à la campagne.\nC’est justement ce que nous aimons ici : pouvoir profiter du calme, du jardin et de la montagne tout en restant très proches d’Annecy.\nAnnecy et les rives du lac sont à environ 15–20 minutes en voiture. Dans l’autre direction, Genève est accessible en une trentaine de minutes. La maison est donc idéalement située sur l’axe Annecy–Genève, au nord du Grand Annecy.\nPour le quotidien, boulangerie, produits locaux, restaurants et commerces se trouvent à quelques minutes en voiture. Les environs offrent également de nombreuses possibilités de promenades, randonnées et activités en pleine nature.\nAux beaux jours, le lac d’Annecy, ses plages et les villages qui bordent ses rives sont tout proches. En hiver, La Clusaz, Le Grand-Bornand, le plateau des Glières et le Semnoz permettent facilement de partir passer une journée à la montagne.\nC’est un emplacement que nous trouvons particulièrement agréable pour découvrir la région : Annecy et le lac lorsque l’on en a envie, les montagnes tout autour, Genève à proximité — puis le calme de la campagne lorsque l’on rentre à la maison.","ot":"Nous sommes un couple dans la quarantaine, parents d'une petite fille. Je suis architecte d'intérieur. Nous sommes passionnés par l'Architecture, la décoration, et les relations humaines. Nous aimons découvrir le monde. N'hésitez pas à nous contacter !"}],"ph":["3289733_0","3289733_1","3289733_2","3289733_3","3289733_4","3289733_5","3289733_6","3289733_7","3289733_8","3289733_9","3289733_10","3289733_11","3289733_12","3289733_13","3289733_14","3289733_15","3289733_16","3289733_17","3289733_18","3289733_19","3289733_20","3289733_21","3289733_22","3289733_23","3289733_24","3289733_25","3289733_26","3289733_27","3289733_28","3289733_29","3289733_30","3289733_31","3289733_32","3289733_33","3289733_34","3289733_35","3289733_36","3289733_37","3289733_38","3289733_39","3289733_40"]},{"v":"V90","n":90,"id":2067023,"t":"La maison de Robert","town":"Passy","cc":"France","region":"Mont Blanc","lat":45.939685170362615,"lon":6.710658937102841,"bd":3,"ba":2,"cap":11,"m2":110,"typ":"Apartment","mn":5,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":0,"children_bed":0,"baby_ er...","gp":"The Plateau d'Assy was the largest concentration of sanatoriums for tuberculosis patients until the 1970s, with more than 2,000 beds. Today it is a very lively and very young village-like district of the town of Passy. Besides the church, there is a medical centre with two doctors, two dentists, two nurses, two physiotherapists... There is also a bakery, a grocery, two hairdressers, a cinema... The nearest supermarket is only ten minutes away.","ot":"Everyone who has stayed at my place has left delighted."},{"loc":"fr","title":"La maison de Robert","gf":"Mon appartement est situé plein Sud à 1000 mètres d'altitude face au Massif du Mont-Blanc. La vue sur le massif est exceptionnelle.  Il est entièrement refait à neuf. Il dispose d'un balcon de 14 mètres carrés plein Sud avec une vue magnifique face aux montagnes.\nIl est situé à moins de 30 minutes des stations de ski de Chamonix, de Saint-Gervais, de Megève  et à moins de 15 minutes de la station de ski de Plaine Joux idéale pour les débutants.\nIl est à 5 minutes de l'église du plateau d'Assy qui est remplie de chefs d'oeuvre du XXème siècle : Matisse, Braque, Chagall, Lurçat, Rouault, Léger...","gp":"Le plateau d'Assy était la plus importante concentration de sanatoriums pour l'accueil des malades de la tuberculose jusqu'aux années 1970 avec plus de 2000 lits. C'est aujourd'hui un quartier village très dynamique et très jeune de la ville de Passy. Outre l'église, il y a un centre médical avec deux médecins, deux dentistes, deux infirmières, deux kinésithérapeutes... Il y a aussi une boulangerie, une épicerie, deux coiffeuses, un cinéma... Le premier supermarché est à dix minutes seulement.","ot":"Toutes les personnes qui sont venues chez moi sont reparties ravies."}],"ph":["2067023_0","2067023_1","2067023_2","2067023_3","2067023_4","2067023_5","2067023_6","2067023_7","2067023_8","2067023_9","2067023_10","2067023_11","2067023_12"]},{"v":"V91","n":91,"id":2697793,"t":"Le Pradi","town":"St.-Georges-des- wnstairs, a large open room, with a second (flushing) toilet and a closed bedroom.\nA 30 m2 east/south-facing terrace.\nA large basement for bikes, bike trailers and other things.\nAll on a 6,000 m2 plot with a small pond, a vegetable garden, an orchard, huts and a small stream.","gp":"An isolated house above a small mountain village, not overlooked at all and offering a magnificent view of the Lauzière massif.\n45 min from the St François Longchamps ski resort, and an hour from many other resorts.\n10 min from Lac des Hurtières for summer swimming.\nLots of beautiful hikes nearby.\nIron museum 5 min away by car.","ot":"The place is called Le Pradi. It lives up to its name: it's our Paradise!"},{"loc":"fr","title":"Le Pradi","gf":"A l'entrée de la vallée de la Maurienne, sur le plateau des Hurtières,maison écologique entièrement rénovée en 2021. \nLa maison est composée comme suit:\nEn haut, une entrée spacieuse. \nUne grande et lumineuse pièce de vie avec cuisine ouverte, de 60m2. Des grandes baies vitrées donnent sur le massif de la Lauzière. \nCoin nuit séparé avec 3 chambres, 1 salle de bain et un cabinet de toilette sèche. \nEn bas, une grande pièce ouverte, avec un deuxième toilette (humide) et une chambre fermée.\nUne terrasse de 30m2 exposée Est/Sud\nUn grand sous-sol pour les vélos, carrioles et autres\nLe tout sur un terrain de 6000m2 avec une petite mare, un potager, un verger, des cabanes et un petit ruisseau.","gp":"Maison isolée au dessus d'un petit village de montagne, sans aucun vis à vis et offrant une magnifique vue sur le massif de la Lauzière.\nA 45 min de la station de ski de St François Longchamps, et une heure de nombreuses autres stations. \nA 10 min du lac des Hurtières pour les baignades estivales. \nBeaucoup de belles randonnées à proximité. \nMusée du fer à 5 min en voiture.","ot":"Le lieu s'appelle le Le Pradi. il porte bien son nom, c'est notre Paradis!"}],"ph":["2697793_0","2697793_1","2697793_2","2697793_3","2697793_4","2697793_5","2697793_6","2697793_7","2697793_8","2697793_9","2697793_10","2697793_11","2697793_12","2697793_13","2697793_14","2697793_15","2697793_16","2697793_17","2697793_18","2697793_19","2697793_20","2697793_21"]},{"v":"V92","n":92,"id":2777168,"t":"House between Salzburg, Mountains & Lakes","town":"Thalgau","cc":"Austria","region":"Salzkammergut","lat":47.843139256982,"lon":13.259771325971492,"bd":4,"ba":2,"cap":10,"m2":138,"typ":"House","mn":6,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":3,"children_bed":3,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Jenner","m":55,"b":65,"km":55,"via":"Westautobahn","q":""},{"n":"Ruhpolding","m":55,"b":65,"km":67,"via":"Westautobahn and A8","q":""},{"n":"Werfenweng","m":65,"b":75,"km":77,"via":"Westautobahn and A10","q":""},{"n":"Postalm","m":70,"b":70,"km":47,"via":"Österreichische Romantikstraße/B158 and Weißenbach","q":""},{"n":"Dachstein West","m":70,"b":80,"km":84,"via":"Westautobahn and A10","q":""},{"n":"Winklmoosalm","m":85,"b":100,"km":93,"via":"Westautobahn and A8","q":""}],"near":55,"n30":0,"n60":2,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":"The living room has a wood stove (stove)","sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"Mountains (Schober, Drachenwand, Schafberg) 5-10 min by car; no ski area claim","notes":"138 m2 house in Thalgau near Salzburg, sleeps 10 (3 child beds); lakes not ski area; quiet hours and alcohol-free household rules.","score":49,"stars":2.5,"gp":250,"rr":100,"gr":4.92,"ex":11,"owner":"Perry & Theresa","recip":true,"desc":[{"loc":"de","title":"Haus zw. Salzburg, Bergen & Seen","gf":"Das Wohnzimmer hat einen Holzofen und einen großen Fernseher.\nMan kann direkt raus auf die Terrasse - wo wir bei Sonnenschein immer Essen. Auch mit Markiese.\nAlle Böden sind neu und aus echtem Eichenholz - wir lieben es barfuß zu gehen.\nDie Küche ist neu und hat alles was man braucht.\nIn Jeder Etage gibt es Sanitäreinheiten.\n3 bewohnbare Geschosse - also ist es auch im heißen Sommer angenehm im Untergeschoss zu schlafen.\nUnser Haus hat 2 Parkplätze.","gp":"Unser Haus ist 5min zu Fuß von der Ortsmitte (Restaurant Calouba, Traffik, Post, Kirche, Schule, Bibliothek, Freibad, Spielplätze, Sport-,Minigolf-, Tennisplätze), direkt am Sportplatz und 15-20min vom Bahnhof und Flughafen Salzburg mit dem Auto. Glasklare Seen (Fuschlsee, Mondsee, Wolfgangsee, ... und Berge - Schober, Drachenwand, Schafberg, Nockstein, ...) sind in 5-10min mit dem Auto erreichbar. Auch der Fahrrad Naturhighway von Salzburg ins Salzkammergut führt direkt bei uns vorbei.","ot":"Ruhezeiten Nachbarschaft:\nMo-Sa: 12-13h & 20-7h\nSonn-&Feiertage: ganztags\n(kein besonders lauten Geräusche wie Rasenmähen, Handwerken, ...)\n\nWir sind Nichtraucher und Alkoholfrei.\nRauchen ist im Haus & am Grundstück nicht erlaubt.\n\nEs gibt einen Meerschweinchenstall (die sind nur draußen - kann man gerne Füttern, oder wir geben sie zu Nachbarn Bescheid - 1x am Tag)\n\nReinigung - wie vorgefunden sauber (Bäder, WC's, Küche & Böden) & Besenrein oder 50€ Reinigungsentschädigung."},{"loc":"en","title":"House between Salzburg, Mountains & Lakes","gf":"The living room has a wood stove and a large TV.\nYou can go directly out to the terrace – where we always eat when the sun is shining. It also has an awning.\nAll floors are new and made of real oak wood – we love walking barefoot.\nThe kitchen is new and has everything you need.\nThere are sanitary units on each floor.\n3 livable floors – so it is also comfortable to sleep in the basement during hot summer days.\nOur house has 2 parking spaces.","gp":"Our house is a 5-minute walk from the town center (with Restaurant Calouba, a tobacconist, post office, church, school, library, outdoor pool, playgrounds, and sports, mini golf, and tennis courts). It is located right next to the sports field and is 15-20 minutes by car from the Salzburg train station and airport. Crystal-clear lakes (Fuschlsee, Mondsee, Wolfgangsee, etc.) and mountains (Schober, Drachenwand, Schafberg, Nockstein, etc.) can be reached in 5-10 minutes by car. The natural bike highway from Salzburg to the Salzkammergut passes directly by our house.","ot":"Quiet Hours in the Neighborhood:\nMon-Sat: 12-1 PM & 8 PM-7 AM\nSundays & Public Holidays: All day\n(No particularly loud noises such as lawn mowing, DIY work, etc.)\n\nWe are a non-smoking and alcohol-free household.\nSmoking is not allowed inside the house or on the property.\n\nThere is a guinea pig hutch (they stay outside only – you are welcome to feed them, or we can inform the neighbors to take care of them – once a day).\n\nCleaning: Leave the house clean and swept, as you found it."},{"loc":"fr","title":"Maison entre Salzbourg, montagnes et lacs","gf":"","gp":"","ot":""},{"loc":"es","title":"Casa entre Salzburgo, montañas y lagos","gf":"","gp":"Nuestra casa está a 5 minutos a pie del centro del pueblo (donde se encuentran el restaurante Calouba, una tabacaría, la oficina de correos, una iglesia, una escuela, una biblioteca, una piscina al aire libre, parques infantiles y campos de deportes, minigolf y tenis). Está situada justo al lado del campo de deportes y a 15-20 minutos en coche de la estación de tren y el aeropuerto de Salzburgo. Los lagos de aguas cristalinas (Fuschlsee, Mondsee, Wolfgangsee, etc.) y las montañas (Schober, Drachenwand, Schafberg, Nockstein, etc.) se pueden alcanzar en 5-10 minutos en coche. La ruta ciclista natural que conecta Salzburgo con el Salzkammergut pasa justo por nuestra casa.","ot":""},{"loc":"it","title":"Casa tra Salisburgo, montagne e laghi","gf":"","gp":"La nostra casa si trova a 5 minuti a piedi dal centro del paese (dove si trovano il ristorante Calouba, una tabaccheria, l’ufficio postale, una chiesa, una scuola, una biblioteca, una piscina all’aperto, parchi giochi e campi da sport, minigolf e tennis). È situata proprio accanto al campo sportivo e a 15-20 minuti in auto dalla stazione ferroviaria e dall’aeroporto di Salisburgo. Laghi cristallini (Fuschlsee, Mondsee, Wolfgangsee, ecc.) e montagne (Schober, Drachenwand, Schafberg, Nockstein, ecc.) sono raggiungibili in 5-10 minuti in auto. La pista ciclabile naturale che collega Salisburgo al Salzkammergut passa proprio davanti a casa nostra.","ot":""},{"loc":"pt","title":"Casa entre Salzburgo, montanhas e lagos","gf":"","gp":"Nossa casa fica a 5 minutos a pé do centro da vila (onde há o restaurante Calouba, uma tabacaria, o correio, uma igreja, uma escola, uma biblioteca, uma piscina ao ar livre, parques infantis e campos de esportes, minigolfe e tênis). Está localizada ao lado do campo de esportes e a 15-20 minutos de carro da estação de trem e do aeroporto de Salzburgo. Lagos cristalinos (Fuschlsee, Mondsee, Wolfgangsee, etc.) e montanhas (Schober, Drachenwand, Schafberg, Nockstein, etc.) podem ser alcançados em 5-10 minutos de carro. A rota natural para ciclismo que liga Salzburgo ao Salzkammergut passa bem em frente à nossa casa.","ot":""},{"loc":"nl","title":"Huis tussen Salzburg, bergen en meren","gf":"","gp":"Ons huis ligt op 5 minuten lopen van het dorpscentrum (waar het restaurant Calouba, een tabakswinkel, het postkantoor, een kerk, een school, een bibliotheek, een buitenzwembad, speeltuinen en sport-, minigolf- en tennisbanen te vinden zijn). Het bevindt zich direct naast het sportveld en op 15-20 minuten rijden van het treinstation en de luchthaven van Salzburg. Kristalheldere meren (Fuschlsee, Mondsee, Wolfgangsee, enz.) en bergen (Schober, Drachenwand, Schafberg, Nockstein, enz.) zijn in 5-10 minuten met de auto bereikbaar. De natuurlijke fietsroute van Salzburg naar het Salzkammergut gaat direct langs ons huis.","ot":""},{"loc":"da","title":"Hus mellem Salzburg, bjerge og søer","gf":"","gp":"Vores hus ligger 5 minutters gang fra byens centrum (hvor der er Restaurant Calouba, en tobaksbutik, posthus, kirke, skole, bibliotek, udendørs svømmebassin, legepladser samt sports-, minigolf- og tennisbaner). Det ligger lige ved siden af sportspladsen og 15-20 minutters kørsel fra togstationen og lufthavnen i Salzburg. Krystalklare søer (Fuschlsee, Mondsee, Wolfgangsee, osv.) og bjerge (Schober, Drachenwand, Schafberg, Nockstein, osv.) kan nås på 5-10 minutter med bil. Den naturskønne cykelrute fra Salzburg til Salzkammergut går lige forbi vores hus.","ot":""},{"loc":"sv","title":"Hus mellan Salzburg, berg och sjöar","gf":"","gp":"Vårt hus ligger 5 minuters promenad från byns centrum (där det finns restaurang Calouba, en tobaksaffär, postkontor, kyrka, skola, bibliotek, utomhuspool, lekplatser samt sport-, minigolf- och tennisbanor). Det ligger precis vid sportfältet och 15-20 minuter med bil från tågstationen och flygplatsen i Salzburg. Kristallklara sjöar (Fuschlsee, Mondsee, Wolfgangsee, osv.) och berg (Schober, Drachenwand, Schafberg, Nockstein, osv.) kan nås på 5-10 minuter med bil. Den natursköna cykelleden från Salzburg till Salzkammergut går direkt förbi vårt hus.","ot":""},{"loc":"nb","title":"Hus mellom Salzburg, fjell og innsjøer","gf":"Stuen har en vedovn og en stor TV.\nMan kan gå direkte ut på terrassen, hvor vi alltid spiser når solen skinner. Det er også en markise.\nAlle gulv er nye og laget av ekte eik – vi elsker å gå barbent.\nKjøkkenet er nytt og har alt du trenger.\nDet er sanitærenheter på hver etasje.\n3 beboelige etasjer – så det er også behagelig å sove i kjelleren på varme sommerdager.\nHuset vårt har 2 parkeringsplasser.","gp":"Huset vårt ligger 5 minutters gange fra sentrum av landsbyen (hvor du finner Restaurant Calouba, en tobakkbutikk, postkontor, kirke, skole, bibliotek, utendørs svømmebasseng, lekeplasser samt sports-, minigolf- og tennisbaner). Det ligger rett ved siden av idrettsplassen og 15-20 minutters kjøretur fra togstasjonen og flyplassen i Salzburg. Krystallklare innsjøer (Fuschlsee, Mondsee, Wolfgangsee, osv.) og fjell (Schober, Drachenwand, Schafberg, Nockstein, osv.) kan nås på 5-10 minutter med bil. Den naturskjønne sykkelruten fra Salzburg til Salzkammergut går rett forbi huset vårt.","ot":""},{"loc":"hr","title":"Kuća između Salzburga, planina i jezera","gf":"","gp":"Naša kuća je udaljena 5 minuta pješice od centra mjesta (gdje se nalaze restoran Calouba, trafika, pošta, crkva, škola, knjižnica, vanjski bazen, igrališta te sportski, minigolf i teniski tereni). Smještena je odmah uz sportski teren i 15-20 minuta vožnje od željezničke stanice i zračne luke u Salzburgu. Kristalno čista jezera (Fuschlsee, Mondsee, Wolfgangsee, itd.) i planine (Schober, Drachenwand, Schafberg, Nockstein, itd.) mogu se doseći za 5-10 minuta vožnje automobilom. Prirodna biciklistička ruta od Salzburga do Salzkammerguta prolazi točno pored naše kuće.","ot":""}],"ph":["2777168_0","2777168_1","2777168_2","2777168_3","2777168_4","2777168_5","2777168_6","2777168_7","2777168_8","2777168_9","2777168_10","2777168_11","2777168_12","2777168_13","2777168_14","2777168_15","2777168_16","2777168_17","2777168_18","2777168_19","2777168_20","2777168_21","2777168_22","2777168_23","2777168_24","2777168_25","2777168_26","2777168_27","2777168_28"]},{"v":"V93","n":93,"id":434793,"t":"Albane et julien's house","town":"Maxilly-Sur-Léman","cc":"France","region":"Portes du Soleil","lat":46.39553830140689,"lon":6.628734965174724,"bd":4,"ba":2,"cap":11,"m2":170,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":2,"baby_bed_up":1},"res":[{"n":"Morzine","m":55,"b":65,"km":43,"via":"D902","q":"Morzine D902"},{"n":"Les Gets","m":60,"b":70,"km":47,"via":"D902","q":"Morzine D902"},{"n":"Leysin","m":65,"b":80,"km":50,"via":"Route 11","q":""},{"n":"Villars","m":65,"b":70,"km":47,"via":"D1005","q":""},{"n":"Champery","m":70,"b":75,"km":56,"via":"D1005","q":""},{"n":"Avoriaz","m":75,"b":85,"km":55,"via":"D902","q":"Morzine D902"},{"n":"Les Diablerets","m":75,"b":85,"km":55,"via":"Route 11","q":""},{"n":"Charmey","m":80,"b":100,"km":83,"via":"A12","q":""}],"near":55,"n30":0,"n60":2,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":"salon ... avec cheminée, vue lac","sauna":null,"toys_inside":"un second à l'étage avec pleins de jeux pour les enfants et PlayStation","toys_outside":"jeux pour enfants, hamac, trampoline, table de ping pong, cabane","large_garden":"grand espace jardin de 1200 m2 avec jeux pour enfants","winter_restriction":null,"access_issue":null},"av":[],"q":["Morzine D902"],"ski":"pistes de ski à 10 mn de voiture ou navette (Bernex, Thollon); Portes du Soleil 35 mn","notes":"Evian lake-view family villa, 4 bed/2 bath, fireplace, kids' playroom, 1200 m2 garden with trampoline/treehouse; Thollon/Bernex 10 min.","score":49,"stars":2.5,"gp":280,"rr":57,"gr":5.0,"ex":23,"owner":"Albane et julien","recip":true,"desc":[{"loc":"tr","title":"Evian, beautiful villa with a view of Lake Geneva","gf":"On the shores of Lake Geneva, in an unspoilt natural setting, a 170 m2 family house, not overlooked, comfortable and bright, with a view of the lake, the mountains and neighbouring Switzerland. A very comfortable, quiet living room for the parents with fireplace, lake view and access outside, and a second one upstairs with lots of games for the children and a PlayStation for the older ones.\n\n4 bedrooms with excellent beds:\nFloor 1: 1 large bedroom with a 160/200 bed, renovated in 2024, 1 bedroom with a 180/200 bed.\nFloor 2: 1 bedroom with a 140/200 bed and a 2nd bedroom with a 160/200 bed. Floor entirely renovated in 2020.\nAll 4 bedrooms have a lake view. We are on the heights of Évian, in a quiet spot, less than 5 min from a pretty beach in a natural setting full of trees and flowers.\nYou can even admire the lake view while taking your shower!\n\nIn summer the lake is at 23 degrees – pure bliss!\n\nOn the south side: a large 1200 m2 garden area with children's play equipment, relaxation area, dining area, hammock, trampoline, ping pong table, hut, bikes, scooters; and on the north side you will enjoy the sunset over the lake from the house.\nA treehouse built high up in a tree will delight your children :-) and you can enjoy the vegetables from our little vegetable garden.\n\nLovely view of the lake, the countryside and the surrounding mountains. The mountains are very close, 10 minutes away, and you can go on unforgettable hikes. Right from the house you can already set off on lovely walks in the middle of nature. Switzerland is just opposite, a few oar strokes away... ;-) ski slopes in winter and downhill mountain biking 10 min away by car or by shuttle. (Bernex, Thollon).\nOlympic Museum in Lausanne: 1/2 hour\nNatural History Museum in Geneva (free): 40 min","gp":"The residential neighbourhood is a stone's throw from the lake, on the quiet countryside side, and the few neighbours are charming. A pretty beach for swimming less than 5 min from the house, and the first hikes start from the house.\nEvian thermal baths (SPA, gym) and Evian Resort Golf Club and Academy 5 min from the house.\n1/2 hour from the house: Geneva and its free natural history museum, Lausanne, Montreux, Aquapark.ch at Le Bouveret: great for family fun! (see photo)\n1 hour from the house: Chamonix, Annecy\n10 minutes by car: typical mid-mountain villages with family ski resorts / bike park: Thollon les Memises and Bernex.\n\n40 min: hot thermal spring at Lavey les Bains in Switzerland (a must ;-)\nBains-lavey.ch\n\nMorzine-Avoriaz-Les Gets: the Portes du Soleil ski resorts and bike park: 35 min\nMontreux Christmas market: 25 min\nFree vintage funicular to get to Evian town centre.","ot":"We are in our forties and have been doing home exchanges for 14 years; we are friendly, respectful and accommodating.\n\nLet yourself be won over by this presentation of our surroundings!\nhttps://youtu.be/6_2ZLEt3UMA?t=36"},{"loc":"fr","title":"Evian,  belle villa avec vue sur le lac Leman","gf":"Au bord du lac Leman, dans un écrin de nature préservé, maison familiale de 170 m2 sans vis à vis, confortable et lumineuse avec vue sur le lac, les montagnes et la Suisse voisine. Un salon au calme très confortable pour les parents avec cheminée, vue lac et accès extérieur, un second à l'étage avec pleins de jeux pour les enfants  et PlayStation les plus grands.\n\n4 chambres avec excellente literie:\nÉtage 1: 1 grande chambre avec lit 160/200 rénovée en 2024, 1 chambre avec lit de 180/200.\nÉtage 2: 1 chambre avec lit 140/200 et une 2eme chambre avec lit de 160/200. Étage entièrement rénové en 2020.\nLes 4 chambres disposent d'une vue lac. Nous sommes sur les hauteurs d'Évian, au calme, à moins de 5 min d'une jolie plage dans un cadre nature, arboré et fleuri.\nVous pourrez également admirer la vue lac en prenant votre douche!\n\nL'été, le lac est à 23 degré, un vrai bonheur!\n\nCôté sud: grand espace jardin de 1200 m2 avec jeux  pour enfants, espace détente, repas, hamac, trampoline, table de ping pong, cabane, vélos, trottinettes et  coté nord, vous apprécierez le coucher de soleil sur le lac depuis la maison.\nUne cabane construite en haut d'un arbre ravira vos enfants :-) et vous pourrez profiter des légumes de notre petit potager.\n\nBelle vue lac, sur la nature et sur les montagnes environnantes. La montagne est toute proche, à 10 minutes, vous pourrez faire des randonnées inoubliables. Au départ de la maison, vous pouvez déjà accéder à de belles ballades en pleine nature. La suisse est en face, à quelques coups de rames... ;-) pistes de ski en hiver et vélo de descente de montagne à 10 mn de voiture ou avec la navette. (Bernex, Thollon).\nMusée olympique de Lausanne: 1/2h\nMusée d'histoire naturelle de Genève (gratuit) : 40mn","gp":"Le quartier résidentiel à 2 pas du lac coté campagne au calme et les quelques voisins sont charmants. Une jolie plage pour se baigner à moins de 5 mn de la maison et les premières randonnées au départ de la maison.\nEspaces des thermes d'Evian (SPA, salle de sport) et Evian Resort Golf club et Academy à 5mn de la maison.\nA 1/2 h de la maison : Genève et son musée d'histoire naturelle gratuit, Lausanne, Montreux, Aquapark.ch au Bouveret : génial pour s'amuser en famille! (voir photo)\nA 1h de la maison: Chamonix, Annecy \nA 10 minutes en voiture villages typique de moyenne montagne avec stations de ski familiale/ bike park: Thollon les memises et Bernex.\n\nA 40 mn: source thermale d'eau chaude à Lavey les bains en Suisse (incontournable  ;-)\nBains-lavey.ch\n\nMorzine-Avoriaz-les Gets: les stations de ski et bike Park des portes du soleil: 35mn\nMarché de Noël de Montreux: 25mn\nFuniculaire d'époque gratuit pour rejoindre le centre ville d'Evian.","ot":"Quarantenaires habitués aux échanges de maison depuis 14 ans, nous sommes sympas, respectueux et arrangeants.\n\nLaissez vous séduire par cette présentation de notre environnement !\nhttps://youtu.be/6_2ZLEt3UMA?t=36"}],"ph":["434793_0","434793_1","434793_2","434793_3","434793_4","434793_5","434793_6","434793_7","434793_8","434793_9","434793_10","434793_11","434793_12","434793_13","434793_14","434793_15","434793_16","434793_17","434793_18","434793_19","434793_20","434793_21","434793_22","434793_23","434793_24","434793_25","434793_26","434793_27","434793_28"]},{"v":"V94","n":94,"id":3066719,"t":"A l'air de Storck","town":"Storckensohn","cc":"France","region":"Vosges","lat":47.87898588466616,"lon":6.959385422611145,"bd":3,"ba":2,"cap":10,"m2":110,"typ":"House","mn":5,"beds":{"big_double_bed":0,"double_bed":1,"single_bed":6,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":2},"res":[{"n":"Ballon d'Alsace","m":35,"b":40,"km":24,"via":"N66 and D465","q":""},{"n":"La Bresse","m":40,"b":40,"km":29,"via":"D13B","q":""},{"n":"Le Markstein","m":40,"b":40,"km":29,"via":"D13B and D27","q":""},{"n":"Gerardmer","m":55,"b":55,"km":43,"via":"D13B","q":""}],"near":35,"n30":0,"n60":4,"fac":{"fireplace":true,"sauna":true,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":"un grand espace vert engazonné et clôturé","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"activités de plein air en toute saison (randonnée, vélo, raquettes, ski selon période)","notes":"Vosges village house, 3 bed/2 bath, owner says up to 8; skiing only 'depending on period' - too small and not an Alpine ski base.","score":49,"stars":2.5,"gp":243,"rr":80,"gr":5.0,"ex":3,"owner":"alexandre","recip":true,"desc":[{"loc":"tr","title":"A l'air de Storck","gf":"Family house with fenced garden and large terrace – Hautes Vosges d’Alsace\n\n110 m² house in a mid-mountain village, quiet, not overlooked at all, in the heart of the Hautes Vosges d’Alsace.\n\nThe house has 3 bedrooms and can sleep up to 8 people, making it ideal for families.\nYou will enjoy a large fenced lawn, as well as a 55 m² terrace, perfect for meals and relaxing outdoors.\n\nWith hiking trails starting right from the door, in unspoilt nature, the house offers easy access to many lakes and outdoor activities, in summer as in winter.\n\nFacilities:\nWi-Fi, dishwasher, washing machine, carport for the car.","gp":"The home is in a small, picturesque mid-mountain village in the Hautes Vosges d’Alsace, quiet, in an unspoilt natural setting.\n\nThe neighbourhood offers a peaceful setting, not overlooked, with direct access to hiking trails from the house.\n\nNature lovers will appreciate the proximity of several lakes, forests and mountain landscapes, ideal for outdoor activities in every season (hiking, cycling, snowshoeing, skiing depending on the time of year).\n\nThe village keeps a friendly, authentic atmosphere and intact heritage while remaining a reasonable distance from the shops and services in the surrounding area.\n\nIt is an ideal place to recharge, enjoy the peace and quiet and discover the natural side of the Hautes Vosges.","ot":""},{"loc":"fr","title":"A l'air de Storck","gf":"Maison familiale avec jardin clôturé et grande terrasse – Haute Vosges d’Alsace\n\nMaison de 110 m² située dans un village de moyenne montagne, au calme, sans aucun vis-à-vis, au cœur des Hautes Vosges d’Alsace.\n\nLa maison dispose de 3 chambres et peut accueillir jusqu’à 8 personnes, ce qui la rend idéale pour les familles.\nVous profiterez d’un grand espace vert engazonné et clôturé, ainsi que d’une terrasse de 55 m², parfaite pour les repas et les moments de détente en extérieur.\n\nSituée au départ direct de sentiers de randonnée, dans une nature préservée, la maison offre un accès facile à de nombreux lacs et activités de pleine nature, été comme hiver.\n\nÉquipements :\nWi-Fi, lave-vaisselle, machine à laver, carport pour la voiture.","gp":"Le logement est situé dans un petit village pittoresque de moyenne montagne des Hautes Vosges d’Alsace, au calme, dans un environnement naturel préservé.\n\nLe quartier offre un cadre paisible, sans vis-à-vis, avec un accès direct aux sentiers de randonnée depuis la maison.\n\nLes amoureux de nature apprécieront la proximité de plusieurs lacs, forêts et paysages de montagne, idéals pour les activités de plein air en toute saison (randonnée, vélo, raquettes, ski selon période).\n\nLe village conserve une ambiance conviviale, authentique et un patrimoine intacte tout en restant à distance raisonnable des commerces et services des environs.\n\nC’est un lieu idéal pour se ressourcer, profiter du calme et découvrir les Hautes Vosges côté nature.","ot":""}],"ph":["3066719_0","3066719_1","3066719_2","3066719_3","3066719_4","3066719_5","3066719_6","3066719_7","3066719_8","3066719_9","3066719_10","3066719_11","3066719_12","3066719_13"]},{"v":"V95","n":95,"id":1510058,"t":"caroline's house","town":"Saint-Jorioz","cc":"France","region":"Aravis","lat":45.83444828666931,"lon":6.166239269799591,"bd":4,"ba":2,"cap":11,"m2":180,"typ":"House","mn":0,"beds":{"big_double_bed":2,"double_bed":0,"single_bed":4,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Aillons-Margeriaz","m":45,"b":50,"km":31,"via":"D912 and D59","q":""},{"n":"Crest-Voland","m":50,"b":60,"km":41,"via":"D1508","q":""},{"n":"La Feclaz (Grand Revard)","m":55,"b":55,"km":36,"via":"D912","q":""},{"n":"La Clusaz","m":65,"b":75,"km":46,"via":"D1508 and D12","q":""},{"n":"Le Grand-Bornand","m":65,"b":75,"km":46,"via":"D1508 and D12","q":""},{"n":"Les Saisies","m":70,"b":80,"km":51,"via":"D1508 and D71A","q":""},{"n":"Megeve","m":70,"b":80,"km":51,"via":"D1508 and D1212","q":"Val d'Arly D1212"},{"n":"Combloux","m":75,"b":90,"km":56,"via":"D1508 and D1212","q":"Val d'Arly D1212"}],"near":45,"n30":0,"n60":3,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"mezzanine dédiée aux loisirs (jeux enfants); nombreux jeux de société","toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":["f27"],"q":[],"ski":"au croisement des massifs (Bauges, Aravis...); no specific ski distance; Annecy <10 km","notes":"Large family house in Saint-Jorioz on Lake Annecy, 4 bed/2 bath, kids' games mezzanine, fenced garden; lake base, ski not quantified; 56 exchanges.","score":48,"stars":2.5,"gp":280,"rr":99,"gr":4.98,"ex":56,"owner":"caroline","recip":true,"desc":[{"loc":"tr","title":"At Louis and Caroline's","gf":"We live in a large family house, bright, very functional and suited to large families. It has 4 bedrooms with plenty of flexible sleeping arrangements. The kitchen is large, equipped and open-plan. The living room is double: a cathedral-ceiling part and a large mezzanine dedicated to leisure (children's games, TV, Netflix, Wi-Fi ...). We have lots of board games suited to the ages of our children (17, 14 and 9). There are 3 WCs and 2 shower rooms. There is also a laundry room, a music room and a large garage (bikes, rollerblades, scooters, paddleboards available...). The garden has trees and a terrace, and is fenced with an automatic gate. Room to park several cars. The neighbourhood is quiet and friendly.","gp":"Our house is in the centre of the village of Saint Jorioz. All amenities are directly accessible on foot: shops (restaurants, bakery, market, supermarket,...), services (tourist office, post office, doctor, pharmacy, banks), playgrounds.\nThe house is on the west shore of Lake Annecy.\nWe are 1.5 km from a large beach with lots of activities (diving boards, playground, beach volleyball, restaurant/snack bar...).\nYou can get around the lake on a cycle path less than 300 m from the house (2 adult bikes and 3 children's bikes are available, plus adult and children's rollerblades).\nYou can also hire licence-free boats, pedalos and paddleboards to explore the lake and its scenery.\nWe are also less than 10 km from the town of Annecy. It is a magnificent and very lively town.\nWe are at the crossroads of the Alpine massifs (Bauges, Aravis, Beaufortain...), an exceptional place with a great many activities in winter and summer (paragliding, hiking, mountain biking).\n\nWe are also 1 hour from the city of Geneva (international airport) and Lake Geneva, and a 1-hour drive from Chamonix, Mont Blanc.","ot":"You are welcome in our home to explore our magnificent region, full of sports, water and mountain activities. And, last but not least, to feast on our many regional specialities!"},{"loc":"fr","title":"chez louis et caroline","gf":"Nous habitons une grande maison familiale, lumineuse, très fonctionnelle et adaptée aux familles nombreuses. Elle dispose de 4 chambres avec de nombreux couchages modulables. La cuisine est grande, équipée et ouverte. Le salon est double. Une partie cathédrale et une grande mezzanine dédiée aux loisirs (jeux enfants, tv, netflix, wifi ...). Nous avons de nombreux jeux de société correspondants aux âges de nos enfants (17, 14 et 9 ans). Il y a 3 WC et 2 salles d'eau. Il y a également une buanderie, une salle de musique et un grand garage (vélos, rollers, trottinettes, paddles à disposition...). Le jardin est arboré avec une terrasse, clôt avec un portail automatique. Possibilité de garer plusieurs voitures. Le voisinage est calme et sympathique.","gp":"Notre maison est située au centre du village de Saint Jorioz. Toutes les commodités sont directement accessibles à pied : commerces (restaurants, boulangerie, marché, supermarché,...), services (office du tourisme, poste, médecin, pharmacie, banques), jardins d'enfants. \nLa maison est sur la rive ouest du lac d'Annecy.\nNous sommes situés à 1.5 km d'une grande plage avec de nombreuses activités (plongeoirs, jardin d'enfants, beach volley, restaurant/snack...).  \nVous avez accès au pourtour du lac par une piste cyclable située à moins de 300 m de la maison (2 vélos adultes et 3 vélos enfants sont à disposition, rollers adultes et enfants). \nVous aurez aussi la possibilité de louer des bateaux sans permis, pédalos, paddle pour explorer le lac et son panorama.\nNous sommes également à moins de 10 km de la ville d'Annecy. C'est une ville magnifique et très dynamique. \n Nous sommes au croisement des massifs alpins (Bauges, Aravis, Beaufortain...), un endroit  exceptionnel avec de très nombreuses activités en hiver comme en été (parapente, randonnée, VTT). \n\nNous sommes également situé à 1 heure de la ville de Genève (aéroport international) et du lac Léman, 1h de route de chamonix, mont blanc.","ot":"Vous êtes les bienvenus chez nous pour explorer notre magnifique région pleine de loisirs sportifs, aquatiques, montagnards. Et enfin pour vous régaler de nos nombreuses spécialités régionales !"}],"ph":["1510058_0","1510058_1","1510058_2","1510058_3","1510058_4","1510058_5","1510058_6","1510058_7","1510058_8","1510058_9","1510058_10","1510058_11","1510058_12","1510058_13","1510058_14","1510058_15","1510058_16","1510058_17","1510058_18","1510058_19","1510058_20","1510058_21","1510058_22"]},{"v":"V96","n":96,"id":1713323,"t":"Alexanders and Anas House","town":"Salzburg","cc":"Austria","region":"Berchtesgaden","lat":47.80843511007632,"lon":13.001108370886397,"bd":4,"ba":2,"cap":10,"m2":140,"typ":"House","mn":0,"beds":{"big_double_bed":1,"double_bed":3,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Jenner","m":40,"b":45,"km":32,"via":"B305","q":""},{"n":"Ruhpolding","m":40,"b":45,"km":44,"via":"A8","q":""},{"n":"Werfenweng","m":45,"b":55,"km":53,"via":"A10","q":""},{"n":"Dachstein West","m":55,"b":60,"km":61,"via":"A10 and Lammertal Str./B162","q":""},{"n":"Postalm","m":65,"b":70,"km":63,"via":"A10","q":""},{"n":"Winklmoosalm","m":70,"b":80,"km":70,"via":"A8","q":""}],"near":40,"n30":0,"n60":4,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"some games and toys (mainly Lego, Kapla and many craft materials)","toys_outside":"several playgrounds are within walking distance (public)","large_garden":"small garden","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"In winter, many different ski areas can be reached within 45 minutes.","notes":"Salzburg city terraced house, toys/Lego, but ski areas 45 min away and sleeps 10 - weak fit for a ski week.","score":48,"stars":2.5,"gp":240,"rr":100,"gr":5.0,"ex":56,"owner":"Alexander","recip":true,"desc":[{"loc":"de","title":"Alexanders und Anas Haus","gf":"Wir wohnen in einem renovierten Reihenhaus in grüner Randlage von Salzburg und doch nicht weit vom Zentrum entfernt.\nDas Haus bietet einen gemütlichen Wohn- und Essbereich und eine gut ausgestattete Küche (Backofen, Induktionskochfeld, Geschirrspüler, Kitchen Aid, Kaffeemaschine) im Erdgeschoss, das Elternschlafzimmer, ein Kinderzimmer und ein Badezimmer mit Regendusche im 1 Stock. In der 2. Etage befinden sich zwei weitere Schlafzimmer, von denen eines über 2 Etagen mittels einer Wendeltreppe in den ausgebauten Dachboden führt. Hier können Sie einen schönen Blick auf die Salzburger Berge genießen und es sich auf einer Couch bequem machen. Außerdem gibt es ein kleines Badezimmer mit Badewanne.\n\nAuf der großzügigen und sonnigen Terrasse können Sie gemütliche Abende verbringen und das Grün des kleinen Gartens genießen.\n\nIm Keller befindet sich ein Technikraum mit Waschmaschine und Trockner (Markengeräte), die Schmutzwäsche kann über einen Wäscheschacht direkt aus den Bädern in den Keller transportiert werden.\n\nEs sind 5 Fahrräder vorhanden (2 für Erwachsene und 3 für Jugendliche). Außerdem gibt es einige Spiele und Spielsachen (hauptsächlich Lego, Kapla und viele Bastelmaterialien) und viele Bücher (in deutscher Sprache).","gp":"In der unmittelbaren Nachbarschaft wohnen viele Familien mit Kindern, mehrere Spielplätze sind fußläufig zu erreichen.\nIm Umkreis von 1 km gibt es zahlreiche Einkaufsmöglichkeiten (Supermärkte, Bäckereien). Das größte Einkaufszentrum Salzburgs ist ca. 1,5 km entfernt.\nEine Bushaltestelle mit Anbindung an das Stadtzentrum (Fahrzeit ca. 15 Minuten) ist fußläufig (3 Minuten) erreichbar. Eine S-Bahn-Station befindet sich ebenfalls im Ortsteil.\nUnser Haus ist ein guter Ausgangspunkt für Radtouren, die Radwege entlang der Saalach und Salzach sind in ca. 15 Minuten, das Stadtzentrum in ca. 20 Minuten zu erreichen.\nAußerdem befindet sich in der Nähe eine Autobahnanschlussstelle, die eine schnelle Verbindung zu vielen Ausflugszielen ermöglicht.\n\nFahrtzeiten zu anderen Städten und Ausflugszielen (mit dem Auto)\n\nLinz ca. 1 1/2 Stunden\nMünchen ca. 1 1/2 Stunden\nInnsbruck ca. 2 Stunden\nWien ca. 3 Stunden\n\nHallstatt ca. 1 1/2 Stunden\nEisriesenwelt Werfen ca. 40 Minuten\nGroßglockner Hochalpenstraße ca. 1 1/2 Stunden\nSalzwelten Hallein ca. 20 Minuten\nBerchtesgaden/Königsseegebiet ca. 30 Minuten\nChiemsee ca. 45 Minuten\nIm Winter sind viele verschiedene Skigebiete innerhalb von 45 Minuten zu erreichen.\nIm Sommer sind zahlreiche Wandergebiete, Seen und Ausflugsziele (z.B. Schafbergbahn, Untersbergbahn, Liechtensteinklamm, etc.) ebenfalls innerhalb einer halben bis einer Stunde zu erreichen.\n\nEs gibt aber auch sehr gute und häufige Zugverbindungen.","ot":""},{"loc":"en","title":"Alexanders and Anas House","gf":"We live in a renovated terraced house in a green peripheral location in Salzburg, yet not far from the centre.\nThe house offers a cosy living and dining area and a well-equipped kitchen (oven, induction hob, dishwasher, Kitchen Aid, coffee machine) on the ground floor, the master bedroom, a children's bedroom and a bathroom with rain shower on the 1st floor. On the 2nd floor there are two further bedrooms, one of which extends over 2 floors by means of a spiral staircase up to the converted attic. Here you can enjoy a beautiful view of the Salzburg mountains and make yourself comfortable on a couch. There is also a small bathroom with a bathtub.\n\nOn the spacious and sunny terrace you can spend cosy evenings and enjoy the green of the small garden.\n\nIn the basement there is a technical room with washing machine and dryer (branded appliances), the dirty laundry can be transported directly from the bathrooms to the basement via a laundry chute.\n\nThere are 5 bicycles available (2 for adults and 3 for youths). There are also some games and toys (mainly Lego, Kapla and many craft materials) and many books (in German).","gp":"Many families with children live in the immediate neighbourhood, and several playgrounds are within walking distance. \nThere are numerous shopping facilities (supermarkets, bakeries) within a radius of 1 km. The largest shopping centre in Salzburg is about 1.5 km away. \nA bus stop with connection to the city centre (travel time approx. 15 minutes) is within walking distance (3 minutes). An S-Bahn station is also located in the district.\nOur house is a good starting point for bicycle tours, the cycle paths along the Saalach and Salzach rivers can be reached in about 15 minutes, the city centre in about 20 minutes.\nIn addition, there is a motorway junction nearby that provides a quick connection to many excursion destinations. \n\nTravel times to other towns and excursion destinations (by car)\n\nLinz approx. 1 1/2 hour\nMunich approx. 1 1/2 hours\nInnsbruck approx. 2 hours\nVienna approx. 3 hours\n\nHallstatt approx. 1 1/2 hours\nEisriesenwelt Werfen approx. 40 minutes\nGrossglockner High Alpine Road approx. 1 1/2 hours\nSalzwelten Hallein approx. 20 minutes\nBerchtesgaden/Königssee region approx. 30 minutes\nLake Chiemsee approx. 45 minutes\nIn winter, many different ski areas can be reached within 45 minutes.\nIn summer, numerous hiking areas, lakes and tourist destinations (e.g. Schafbergbahn, Untersbergbahn, Liechtensteinklamm, etc.) can also be reached within half an hour to an hour.\n\nHowever, there are also very good and frequent train connections.","ot":""}],"ph":["1713323_0","1713323_1","1713323_2","1713323_3","1713323_4","1713323_5","1713323_6","1713323_7","1713323_8","1713323_9","1713323_10","1713323_11","1713323_12","1713323_13","1713323_14","1713323_15","1713323_16","1713323_17","1713323_18","1713323_19","1713323_20","1713323_21","1713323_22","1713323_23","1713323_24","1713323_25","1713323_26","1713323_27","1713323_28","1713323_29","1713323_30","1713323_31","1713323_32","1713323_33","1713323_34","1713323_35","1713323_36","1713323_37"]},{"v":"V97","n":97,"id":2677420,"t":"La maison de Baija","town":"Le Châtelard","cc":"France","region":"Bauges","lat":45.68370245959678,"lon":6.1381131148522785,"bd":3,"ba":2,"cap":10,"m2":160,"typ":"House","mn":0,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":1,"children_bed":1,"baby_bed":1,"double_bed_u table for 10. Outside, there is a small green garden on the mountainside along the house, and 200m away you will find our syntropic vegetable garden and our forest garden.","gp":"We live right in the heart of the Bauges, in a village house, which means we can do our shopping on foot or set off for walks in the mountains, since a long-distance hiking trail (GR) passes at the foot of the house. It's ideal for doing the tour of the massif. 10 min away you will find a leisure park and the Chéran lakes, offering a wide range of summer activities for the whole family. In winter you are 25 min from the Aillon-Margériaz downhill ski resort and 20 min from St François de Sales, with access to the largest cross-country ski area in Europe, the Revard plateau.\nOur house can be reached from\n- Geneva 1h\n- Annecy 35 min\n- Chambéry 45 min\nBuses allow day trips to Annecy, Aix-les-Bains and Chambéry, so you can discover Lake Annecy and Lac du Bourget.","ot":""},{"loc":"fr","title":"La maison de Baija","gf":"Notre maison c'est notre coup de cœur : vieille bâtisse typique de notre région nous l'avons rénovée pièce par pièce pour lui amener modernité et fonctionnalité. C'est une maison familial, un petit cocon pour profiter des montagnes environnantes aussi bien l'été que l'hiver. Vous y trouverez une suite parentale avec un lit queen size (160x200), une douche XXL, côté enfant 1 chambre avec un lit cabane et son tiroir pour inviter amis et famille, 1 salle de jeux qui peut servir de chambre d'amis, tout comme un bureau séparé qui abrite lui aussi un futon (120x200) et 1 lit simple pour y loger les amis de passage. La cuisine refaite à neuf dispose d'une table pour 8 personnes et le salon/salle à manger d'une table pour 10. Côté extérieur un petit jardin de verdure à flan de montagne bord de la maison, et à 200m vous trouverez notre potager syntropique et notre jardin forêt.","gp":"Nous habitons en plein cœur des Bauges, une maison de village ce qui nous permet de faire des courses à pied ou de partir nous balader dans la montagne puisque un chemin de grande randonné passe au pied de la maison. C'est l'idéal pour faire le tour du massif. A 10 min vous trouverez une base de loisirs et les lacs du chéran, qui offre un large panel d'activités d'été à faire en famille. L'hiver vous êtes à 25min de la station de ski de piste d'Aillon margeriaz et à 20min de St François de Sales, avec l'acces au plus grand domaine de ski de fond d'Europe le plateau du revard. \r\nNotre maison est accessible depuis \r\n- Geneve 1h\r\n- Annecy 35 min\r\n- Chambéry 45 min\r\nDes bus permettent de faire des virées à la journée à Annecy, Aix les bains et Chambéry et ainsi de découvrir le lac d'Annecy et celui du Bourget.","ot":""}],"ph":["2677420_0","2677420_1","2677420_2","2677420_3","2677420_4","2677420_5","2677420_6","2677420_7","2677420_8","2677420_9","2677420_10","2677420_11","2677420_12","2677420_13","2677420_14","2677420_15"]},{"v":"V98","n":98,"id":2694998,"t":"La maison de Cyrielle et Loïc","town":"Saint-Hilaire","cc":"France","region":"Chartreuse","lat":45.30245154130153,"lon":5.871079549167973,"bd":4,"ba":2,"cap":10,"m2":110,"typ":"House","mn":3,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":2,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"St-Pierre-de-Chartreuse","m":40,"b":40,"km":22,"via":"D30E","q":""},{"n":"Le Sappey","m":45,"b":50,"km":27,"via":"D30 and D512","q":""},{"n":"Les 7 Laux","m":45,"b":45,"km":30,"via":"D30","q":""},{"n":"Le Collet d'Allevard","m":50,"b":55,"km":35,"via":"D525","q":""},{"n":"Chamrousse","m":65,"b":70,"km":48,"via":"D30 and D111","q":""},{"n":"Aillons-Margeriaz","m":70,"b":75,"km":59,"via":"A41","q":""},{"n":"La Feclaz (Grand Revard)","m":75,"b":80,"km":63,"via":"A41","q":""},{"n":"Villard-de-Lans","m":80,"b":100,"km":67,"via":"D531","q":""}],"near":40,"n30":0,"n60":4,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"Les enfants trouveront leur bonheur dans les jouets disponibles","toys_outside":"aire de jeux à 200m de la maison (public)","large_garden":null,"winter_restriction":null,"access_issue":"Le garage permet de stocker vélos, skis"},"av":[],"q":[],"ski":"deux petites stations sur le Plateau (Col de Marcieu, St Hilaire); 7 Laux/Chamrousse by car","notes":"New wooden house on Plateau des Petites Roches, 4 small bedrooms, toys, tiny local ski stations nearby - too small for 12.","score":48,"stars":2.5,"gp":180,"rr":90,"gr":5.0,"ex":11,"owner":"Cyrielle","recip":false,"desc":[{"loc":"tr","title":"Cyrielle and Loïc's house","gf":"New wooden house (2022) with every comfort, very bright, with a superb view of the Belledonne massif and the Dent de Crolles.\nLarge wooden terrace for enjoying a coffee with a view!\nThe ground floor is a large open space (kitchen - dining room - living room) with a bedroom/office (1 sofa bed 160x200 - possible extra single mattress) and a bathroom - WC.\nUpstairs there are 3 bedrooms (1 master and 2 children's), 1 bathroom-WC and an open area ideal for children's play and/or reading.\nThe garage can store bikes, skis,...\nA house built with our own little hands: simple and functional!\nThere are still a few finishing touches to do, nothing that gets in the way of daily life. When it comes to building work, is a house ever really finished?!?","gp":"House located on the Plateau des Petites Roches in the village of Saint Hilaire du Touvet (30 minutes from Grenoble - 40 minutes from Chambéry).\nSeveral playgrounds nearby, including one 200m from the house.\n\nSPRING/SUMMER version: Hiking - Cycling - Free flight\n- Hiking: Enjoy nearby hikes in the Chartreuse (possible to set off from the house).\nSeveral mountain massifs are quickly accessible (Belledonne, Bauges,...) for other equally prestigious hikes.\n- Cycling: Calling all lovers of elevation gain. Beautiful passes and circuits await you!\n- Free flight: Also discover this unusual activity, which invites you to experience flight (paragliding/hang-gliding) at the magnificent Saint Hilaire site (a mecca of the Coupe Icare, the biggest free-flight festival)\n\nWINTER version: Skiing - Sledging\nYou can vary depending on the weather and the day's snow conditions. A car will be a plus.\n- Alpine skiing: you can enjoy the two small ski resorts on the Plateau (Col de Marcieu and Saint Hilaire) just as well as the big resorts of the Belledonne massif (7 Laux, Chamrousse, Collet d'Allevard)\n- Ski touring: starting near the house and in the massifs opposite!\n- Cross-country skiing: The resorts further away will welcome you: Chamrousse (45 min), La Feclaz (1 hour's drive), Col de Porte\n- Sledging: Spot in the field opposite the house, 5-10 minutes' walk\n\nRestaurants and small shops nearby. Several children's playgrounds on the Plateau.\nSupermarket 20 minutes away by car.\nLittle extras:\n- the bakery a few steps away without taking the car!-\n- a children's playground a few more steps away but still without the car\n- The tobacconist-newsagent opposite the playground, so still without the car","ot":"Welcome to our home!\nWe will do our best to make your stay in our nest as pleasant as possible.\nEnjoy the Chartreuse and surroundings!\nChildren will find plenty to make them happy among the toys available."},{"loc":"fr","title":"La maison de Cyrielle et Loïc","gf":"Maison en bois neuve (2022) tout confort, très lumineuse avec une superbe vue sur le massif de Belledonne et la Dent de Crolles.\r\nGrande terrasse en bois pour profiter d'un café avec vue! \r\nLe rez de chaussée est un grand espace ouvert (cuisine - salle à manger - salon) avec une chambre/bureau (1 canapé-lit 160x200 - possibilité couchage matelas 1 place) et une salle de bains - WC.\r\nL'étage se compose de 3 chambres (1 parentale et 2 enfants), 1 salle de bains-WC et un espace ouvert propice aux jeux d'enfants et/ou lecture.\r\nLe garage permet de stocker vélos, skis,...\r\nUne maison construite par nos petites mains : simple et fonctionnelle !\r\nIl reste quelques finitions à faire, rien de gênant à la vie quotidienne. Une maison ça se finit jamais en vrai question travaux!?!","gp":"Maison située sur le Plateau des Petites Roches dans le village de Saint Hilaire du Touvet (30 minutes de Grenoble - 40 minutes de Chambéry).\r\nPlusieurs aires de jeux à proximité dont une à 200m de la maison. \r\n\r\nVersion PRINTEMPS/ÉTÉ : Rando - Vélo - Vol libre\n- Randonnée: Profitez des randonnées en Chartreuse à proximité (départ de la maison possible). \r\nPlusieurs massifs de montagne sont rapidement accessibles (Belledonne, Bauges,...) pour d'autres randonnées toutes aussi prestigieuses.\n- Vélo : Avis aux amateurs de dénivelé. De beaux cols et circuits vous attendent!\n- Vol libre: Découvrez également cette activité insolite qui vous invite à découvrir le vol (parapente/deltaplane) sur le magnifique site de Saint Hilaire (Haut lieu de la Coupe Icare, le plus grand festival du Vol libre)\r\n\r\nVersion HIVER: Ski - Luge\nVous pourrez varier selon la météo et l'enneigement du jour. La voiture sera alors un plus.\n- Ski alpin: vous pourrez tout aussi bien profiter des deux petites stations de ski sur le Plateau (Col de Marcieu et Saint Hilaire) que des grandes stations du massif Belledonne (7 Laux, Chamrousse, Collet d'Allevard)\n-Ski de rando: départ à proximité de la maison et dans les massifs en face!\n- Ski de fond: Les stations à distance sauront vous accueillir: Chamrousse (45 min), La Feclaz (1h de route), Col de Porte\n- Luge: Spot dans le champ en face de la maison 5-10 minutes de marche\r\n\r\nRestaurants et Petits commerces à proximité. Plusieurs aires d ejeux pour enfants sur le Plateau.\nSupermarché à 20 minutes en voiture.\r\nPetits trucs en plus: \n- la Boulangerie à quelques pas sans prendre la voiture!-\n- une aire de jeux pour enfants à un peu plus de pas mais toujours sans voiture\n- Le tabac-presse en face de l'aire de jeux donc toujours sans voiture","ot":"Bienvenue chez nous!\nNous ferons au mieux pour rendre votre séjour dans notre nid des plus agréables.\nProfitez bien de la Chartreuse et alentours!\nLes enfants trouveront leur bonheur dans les jouets disponibles."}],"ph":["2694998_0","2694998_1","2694998_2","2694998_3","2694998_4","2694998_5","2694998_6","2694998_7","2694998_8","2694998_9","2694998_10","2694998_11","2694998_12","2694998_13","2694998_14","2694998_15","2694998_16","2694998_17"]},{"v":"V99","n":99,"id":2600231,"t":"Maison avec jardin en Savoie","town":"Chambéry","cc":"France","region":"Bauges","lat":45.58239811113684,"lon":5.890419076585174,"bd":4,"ba":2,"cap":10,"m2":200,"typ":"House","mn":7,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":2,"children_bed":0,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"La Feclaz (Grand Revard)","m":40,"b":45,"km":23,"via":"D912","q":""},{"n":"Aillons-Margeriaz","m":45,"b":50,"km":27,"via":"D206","q":""},{"n":"Le Collet d'Allevard","m":50,"b":60,"km":54,"via":"A41","q":""},{"n":"Les 7 Laux","m":50,"b":55,"km":51,"via":"A41","q":""},{"n":"St-Pierre-de-Chartreuse","m":50,"b":55,"km":39,"via":"D1006 and D520B","q":"Maurienne"},{"n":"Le Sappey","m":60,"b":70,"km":66,"via":"A41","q":""},{"n":"Crest-Voland","m":65,"b":75,"km":78,"via":"A43","q":"Maurienne A43"},{"n":"Saint-Francois-Longchamp","m":70,"b":85,"km":84,"via":"A43","q":"Maurienne A43"}],"near":40,"n30":0,"n60":6,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":"balançoire, trampoline et piscine hors sol","large_garden":null,"winter_restriction":null,"access_issue":null},"av":["f27"],"q":[],"ski":null,"notes":"Chambéry city house with swing/trampoline garden, sleeps 10, no ski access claimed - summer-oriented, poor ski fit.","score":48,"st gaelle","recip":false,"desc":[{"loc":"tr","title":"Gaelle's house","gf":"House in the heart of a hamlet, with a 50 m2 garden and terrace.\nground floor with living room (with table football) and equipped kitchen,\nupstairs with 3 bedrooms, a bathroom.\nview of the mountains,","gp":"in the heart of a hamlet, a 3-minute walk from the municipal swimming pool, heated to 28 degrees (open in summer only)\na 5-minute walk from the village centre.\nMany hiking trailheads.\nA few minutes away, walks along a river.\nVisit to the Chartreuse monastery less than 5 minutes away by car.\nlocated 30 minutes from Grenoble, 40 minutes from Chambéry and 1h15 from Lyon.","ot":"the house is quiet and restful"},{"loc":"fr","title":"La maison de Gaelle","gf":"Maison au coeur d'un hameau, avec jardin 50 m2 et terrasse. \nrdc avec salon  (avec baby foot) et cuisine équipée, \nétage avec 3 chambres, une salle de bain.\nvue sur les montagnes,","gp":"au coeur d'un hameau, à 3 minutes à pied de la piscine municipale qui est chauffée à 28 degrés (ouverte en été uniquement)\nà 5 minutes à pied du centre du village.\nDe nombreux départs de randonnée.\nA quelques minutes, ballades près d'une rivière.\nVisite du monastère de chartreuse à moins de 5 minutes en voiture.\nse situe à 30 minutes de grenoble, 40 minutes de chambéry et 1h15 de lyon.","ot":"la maison est au calme et reposante"}],"ph":["573521_0","573521_1","573521_2"]},{"v":"V102","n":102,"id":2436393,"t":"Home between city center and forest","town":"Pontarlier","cc":"France","region":"Jura","lat":46.91465530140689,"lon":6.355675013067991,"bd":3,"ba":1,"cap":10,"m2":120,"typ":"House","mn":2,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":1,"children_bed":0,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":2,"baby_bed_up":0},"res":[{"n":"Metabief","m":26,"b":30,"km":20,"via":"N57","q":""}],"near":26,"n30":1,"n60":1,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"The house is equipped for baby (changing table, high chair, games for children, etc.)","toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"cross-country La Malmaison 5 min, Le Larmont 15 min; family alpine resort Métabief (20 minutes)","notes":"Attached townhouse in Pontarlier, 3 bed/1 bath, sleeps ~10 tightly; Métabief alpine 20 min - too small for 12 adults.","score":47,"stars":2.5,"gp":190,"rr":100,"gr":4.98,"ex":40,"owner":"Mathilde","recip":true,"desc":[{"loc":"fr","title":"Maison proche centre-ville et forêt","gf":"Nous habitons une maison mitoyenne avec une terrasse et un jardin, proche du centre-ville.\nNous avons deux chambres avec des lits doubles et une chambre d'enfant avec un lit simple et un lit pour bébé. Si vous êtes plus nombreux, nous avons également un lit d'appoint pour deux personnes dans une chambre séparée et deux couchages d'appoint pour enfants. \nLa maison est équipée pour un bébé (table à langer, chaise haute, jeux pour enfants,...). Une des deux chambres est équipée avec un bureau et du wifi si vous souhaitez faire du télétravail.\nLorsque nous sommes à la maison, nous aimons passer du temps dans notre jardin aux beaux jours, bricoler (atelier, buanderie, garage au sous-sol) ou tout simplement regarder un film au salon grâce au vidéoprojecteur.\nMais nous passons aussi beaucoup de temps dehors à profiter de notre belle région !\nNous avons renové notre maison avec passion, nous souhaitons que nos invités soient respectueux de notre cocon. \nNous quittons nos chaussures en rentrant dans la maison et nous vous demanderons de ne pas monter à l'étage en chaussures. Prévoyez des chaussons en hiver.\n\n(Attention notre maison n'est pas adaptée aux personnes à mobilité réduite, 2 étages)","gp":"Si vous aimez être proche du centre-ville mais aussi à proximité de la forêt et de la montagne, vous allez adorer notre quartier ! \nA moins de 15 minutes à pied, vous trouverez à Pontarlier tous les commerces nécessaires (boulangerie, fromagerie, pharmacie, petit supermarché, restaurants,...) mais aussi des parcs pour les enfants et la piscine municipale (couverte). L'idéal si vous voulez éviter de prendre la voiture et vous déplacez à pied ou à vélo !\nA 30 minutes à pied, vous aurez accès à des sentiers de randonnées en forêt et plusieurs parcours VTT.\nEn s'éloignant un peu plus et en prenant la voiture, vous pourrez vous rendre au lac St Point (15 minutes), idéal pour la baignade et les activités nautiques (paddle, canoé, voile) en été et pour de jolies balades toutes l'année.\nVous venez chez nous en hiver ? Vous pourrez profiter de nombreuses pistes de ski de fond à proximité (La Malmaison à 5 min en voiture, Le Larmont à 15 min) et d'une station de ski alpin familiale à Métabief (20 min).\nLes Montagnes du Jura sont toutes proches, vous trouverez plusieurs sommets à moins d'une heure de chez nous vous offrant une vue magnifique sur les Alpes (le Suchet, le Chasseron, le Mont Tendre, etc.).\nA 1h de route enfin, vous pourrez vous rendre dans la ville de Besançon et sa citadelle Vauban ou encore à Lausanne (Suisse) au bord du lac Léman.\nVous avez de quoi profiter en toutes saisons !\nVous serez également à moins de 2h de route de l'aéroport international de Genève et de grandes stations de ski alpin des Alpes (Châtel).","ot":""},{"loc":"en","title":"Home between city center and forest","gf":"We live in an attached house with a terrace and a garden, close to the city center.\n\n We have two bedrooms with double beds and a children's bedroom with a baby bed.  If there are more of you, we also have an extra bed for two people in a separate bedroom.  The house is equipped for baby (changing table, high chair, games for children, etc.).  \nOne of the two bedrooms is equipped with a desk and wifi if you wish to telework.\n\n When we are at home, we like to spend time in our garden on sunny days, tinkering (workshop, laundry room, basement garage) or simply watching a film in the living room using the video projector.\n\n But we also spend a lot of time outside enjoying our beautiful region!\n\n (Please note our house is not suitable for people with reduced mobility, 2 floors)","gp":"If you like being close to the city center but also close to the forest and the mountains, you will love our neighborhood!\n\n Less than 15 minutes on foot, you will find in Pontarlier all the necessary shops (bakery, pharmacy, small supermarket, restaurant, etc.) but also parks for children and the municipal swimming pool (indoor).  Ideal if you want to avoid taking the car and travel on foot or by bike!\n\n A 30-minute walk away, you will have access to hiking trails in the forest and several mountain bike trails.\n\n By going a little further away and taking the car, you can go to Lake St Point (15 minutes), ideal for swimming and water activities (paddle, canoeing, sailing) in summer and for lovely walks.\n\n Are you coming to us in winter?  You can enjoy numerous cross-country ski trails nearby (La Malmaison 5 minutes by car, Le Larmont 15 minutes) and a family alpine ski resort in Métabief (20 minutes).\n\n The Jura Mountains are very close, you will find several peaks less than an hour from u\nour place offering you a magnificent view of the Alps (Suchet, Chasseron, Mont Tendre, etc.).\n\n Finally, a 1-hour drive away, you can go to the town of Besançon and its Vauban citadel or to Lausanne (Switzerland) on the shores of Lake Geneva.\n\n You have something to enjoy in all seasons!\n\n You will also be less than 2 hours drive from Geneva international airport and major alpine ski resorts in the Alps (Châtel).","ot":"We would like to do a long-term reciprocal exchange (between 2 and 5 months) in fall 2024."}],"ph":["2436393_0","2436393_1","2436393_2","2436393_3","2436393_4","2436393_5","2436393_6","2436393_7","2436393_8","2436393_9","2436393_10","2436393_11","2436393_12","24363
