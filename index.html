 CHALET. Savoie LA PLAGNE/LES ARCS, views, silence, skiing, nature, alpine pastures, lakes, wildlife, cool air","gf":"In the heart of the Alps, Tarentaise Valley, a breath of fresh air and absolute calm. Large Savoyard chalet from 1883, fully renovated. 5 bedrooms, large living room, bar, 2 bathrooms + a shower, 3 WCs, fully equipped kitchen, dining room with fireplace, study, music room with piano and drum kit, 2 cellars, 1 utility room, fibre internet and WIFI, 3 terraces facing different directions so you can follow the sun all day, gas barbecue/plancha, 2 sets of garden furniture, vegetable garden, lawn, mazot (small traditional chalet hut) for children's games,... Mountain-bike rides, walks, snowshoeing and ski touring straight from the house into the alpine pastures; the lakes, the streams. Varied wildlife: birds of prey, deer, chamois, ibex, marmots, stoats, etc...","gp":"La Grande Bergerie is a very quiet hamlet of 30 inhabitants with friendly, considerate neighbours. At 1,200 metres altitude, facing due south on the Versant du Soleil (sunny slope) with exceptional sunshine.\nExceptional view of the whole Paradiski area (La Plagne, Les Arcs), Mont Pourri, the Bellecote Glacier all the way to the Col de la Madeleine.\nIn summer: mountain biking and cycling (Tour de France passes), hiking in the Beaufortain (GR5), Mont Rosset, the Pierra Menta and the Vanoise Park, mountain lakes, the cycle path, the Versants d'Aime leisure centre, swimming pools, rafting on the ISERE river, paragliding, via ferrata, climbing, golf, horse riding, mountain huts, ...\nIn winter: 25 minutes from the resort of LA PLAGNE or the LES ARCS funicular, 1 hour from Val d'Isère, Tignes or Courchevel. From the house: sledging, snowshoe walks (snowshoes provided), cross-country skiing and ski touring.\nCulture: the historic centre of AIME (Basilica), the Baroque trail, music, theatre and film festivals.\nAll shops 7 km away (Aime), farmers' market in summer at La Cote d'Aime\nVisit: www.la-plagne.com/      www.aime-savoie.com/  versantsdaime.fr/\n\n- Buzzy restaurants: Very many\n- Cool bars: Very many\n- Cozy cafés: Very many\n- Retail therapy: Many\n- Bit of culture: All\n- Walks in the park: Endless\n- Spot of exercise: Endless\n- Day tripping: Endless","ot":"Having been home exchangers for many years, we are very respectful of property and the environment.\nWe will be available to help prepare your stay in our beautiful Tarentaise mountains as well as possible."},{"loc":"fr","title":"GRAND CHALET. Savoie LA PLAGNE/LES ARCS, vue, silence, ski, nature, alpages, lacs, faune, fraicheur","gf":"Au cœur des Alpes, Vallée de Tarentaise, bol d'air et calme absolu. Grand chalet savoyard de 1883, entièrement rénové. 5 chambres, grand salon , bar , 2 salles de bain + une douche, 3wc, cuisine toute équipée, salle à manger avec cheminée, bureau, salle de musique avec piano et batterie, 2 caves, 1 buanderie, Fibre Internet et WIFI, 3 terrasses aux orientations différentes pour pouvoir suivre le soleil toute la journée, barbecue plancha au gaz, 2 salons de jardin, potager, pelouse, mazot pour jeux d'enfants,... Départs depuis la maison pour ballades en VTT et à pieds, en raquettes, en ski de rando dans les Alpages; les lacs, les ruisseaux. Faune multiple : rapaces, cerfs, chamois, bouquetins, marmottes, hermine, etc...","gp":"La Grande Bergerie est un hameau de 30 habitants très calme au voisinage sympathique et prévenant. A 1200 mètres d'altitude exposé plein sud sur le Versant du Soleil avec un ensoleillement exceptionnel. \nVue exceptionnelle sur tout le massif du Paradiski (La Plagne, les Arcs), le Mont Pourri, le Glacier de Bellecote  jusqu'au col de la Madeleine. \nEn été: VTT et cyclisme (Cols du Tour de France),  randonnées pédestres dans le Beaufortain (GR5), le Mont Rosset, la Pierra Menta et le Parc de la Vanoise, les lacs de montagne, la piste cyclable, la Base de loisirs des Versants d'Aime,  piscines, rafting sur la rivière l'ISERE, parapente, via ferrata, escalades, golf, équitation, refuges de montagne, ...\nEn hiver: à 25 minutes de la station de la PLAGNE ou du funiculaire des ARCS, à 1H00 de Val d'Isère, Tignes ou Courchevel. Depuis la maison; luge, ballades en raquettes (fournies), ski de fond et ski de randonnée.\nCulture; centre historique d'AIME (Basilique), chemin du Baroque, festivals de musique, de théâtre et cinéma. \nTous commerces à 7 km (Aime), marché paysan l'été à la Cote d'Aime\nVisitez : www.la-plagne.com/      www.aime-savoie.com/  versantsdaime.fr/\n\n- Buzzy restaurants: Très nombreux\n- Cool bars: Très nombreux\n- Cozy cafés: Très nombreux\n- Retail therapy: Nombreux\n- Bit of culture: Tous\n- Walks in the park: Infinies\n- Spot of exercise: Infini\n- Day tripping: Infinies","ot":"Habitués des échanges de maisons depuis de nombreuses années, nous sommes très respectueux des biens et de l'environnement. \nNous serons être disponibles afin de préparer au mieux votre séjour dans notre belle montagne de Tarentaise."}],"ph":["2389670_0","2389670_1","2389670_2","2389670_3","2389670_4","2389670_5","2389670_6","2389670_7","2389670_8","2389670_9","2389670_10","2389670_11","2389670_12","2389670_13","2389670_14","2389670_15","2389670_16","2389670_17","2389670_18","2389670_19","2389670_20","2389670_21","2389670_22","2389670_23","2389670_24","2389670_25","2389670_26","2389670_27","2389670_28","2389670_29","2389670_30","2389670_31","2389670_32","2389670_33","2389670_34","2389670_35","2389670_36"]},{"v":"V19","n":19,"id":1801376,"t":"Charming Home at the Gateway to the Alps: Garden, Pool & Mountains (Grenoble)","town":"Saint-Ismier","cc":"France","region":"Belledonne","lat":45.2528082222314,"lon":5.822047239696708,"bd":5,"ba":2,"cap":11,"m2":220,"typ":"House","mn":0,"beds":{"big_double_bed":1,"double_bed":2,"single_bed":1,"children_bed":1,"baby_bed":0,"double_bed_up":0,"single_bed_up":1,"children_bed_up":1,"baby_bed_up":1},"res":[{"n":"Le Sappey","m":28,"b":30,"km":15,"via":"D512","q":""},{"n":"Les 7 Laux","m":40,"b":45,"km":29,"via":"D250","q":""},{"n":"St-Pierre-de-Chartreuse","m":45,"b":50,"km":27,"via":"D512","q":""},{"n":"Chamrousse","m":50,"b":55,"km":36,"via":"D111","q":""},{"n":"Le Collet d'Allevard","m":50,"b":55,"km":40,"via":"A41 and D525","q":""},{"n":"Aillons-Margeriaz","m":65,"b":75,"km":62,"via":"A41","q":""},{"n":"La Feclaz (Grand Revard)","m":70,"b":80,"km":66,"via":"A41","q":""},{"n":"Villard-de-Lans","m":70,"b":80,"km":55,"via":"D531","q":""}],"near":28,"n30":1,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":"nestled in a large garden","winter_restriction":null,"access_issue":null},"av":["f27"],"q":[],"ski":"close to family Chartreuse resorts (sledding, cross-country); less than an hour from Alpe d'Huez, Les 2 Alpes","notes":"Dauphinoise 5-bed/2-bath family house near Grenoble with large garden; small Chartreuse resorts nearby, big resorts <1 h - commute base.","score":68,"stars":3.5,"gp":255,"rr":100,"gr":5.0,"ex":9,"owner":"Julien","recip":false,"desc":[{"loc":"fr","title":"Maison de Charme aux Portes des Alpes: Jardin, Piscine & Montagnes (Grenoble)","gf":"Découvrez notre charmante maison dauphinoise, nichée dans un vaste jardin au pied du massif de la Chartreuse. La maison dispose de deux salles de bains, d'un grand séjour spacieux, et de cinq chambres, pouvant accueillir confortablement jusqu'à dix personnes.\n\nC'est le camp de base idéal pour explorer la région, quelle que soit la saison :\n☀️ En Été : La maison offre une petite piscine avec terrasse, parfaite pour se rafraîchir. Détendez-vous au bord de l'eau et profitez des longues soirées sur la terrasse ensoleillée.\n⛰️ Au Printemps & Automne : Vous bénéficierez d'un accès direct aux sentiers de randonnée en Chartreuse et dans la forêt toute proche. Notre emplacement est idéal pour visiter Annecy (1h), Lyon (1h15) ou explorer les massifs environnants (Vercors, Belledonne, Royans et Trièves).\n❄️ En Hiver : Profitez des joies de la montagne ! Nous sommes situés à proximité des stations familiales de Chartreuse pour la luge et le ski de fond, et à moins d'une heure des grandes stations internationales de l'Oisans (Alpe d'Huez, Les 2 Alpes) pour le grand ski.\n\nLe centre du village est accessible à pied, et une grande surface se trouve à seulement trois minutes en voiture pour vos courses quotidiennes. Venez découvrir le charme de notre maison et les beautés naturelles de la région !","gp":"Vous adorerez notre quartier pour son charme et son environnement naturel exceptionnel. C'est un quartier calme, qui dispose d'une place de parking et offre une vue magnifique sur le massif de Belledonne, garantissant tranquillité et dépaysement dès votre arrivée.\n\nLe village, accessible à pied, offre toutes les commodités nécessaires : tabac/presse, primeurs, boulangerie, boucherie et pizzeria. L'atout majeur reste la proximité immédiate de la nature : la forêt et les premiers sentiers de randonnée du massif de la Chartreuse sont au bout de la rue, tout en restant à 15 minutes du centre-ville de Grenoble.","ot":"Nous sommes impatients de vous accueillir et de partager la beauté de notre région. Nous vivons ici toute l'année avec nos trois enfants, c'est une maison pleine de vie.\n\nProfitez de notre maison dauphinoise, du calme du jardin et de la vue imprenable sur les sommets. Nous espérons que vous apprécierez l'échange de votre maison avec la nôtre et que vous vous sentirez ici comme chez vous. N'hésitez pas à nous poser des questions sur les activités (ski, rando, visites). À bientôt dans notre petit coin de paradis !"},{"loc":"en","title":"Charming Home at the Gateway to the Alps: Garden, Pool & Mountains (Grenoble)","gf":"Discover our charming traditional \"Dauphinoise\" house, nestled in a large garden at the foot of the Chartreuse mountains. The house features two bathrooms, a large and spacious living room, and five bedrooms, comfortably accommodating up to ten people.\n\nIt is the ideal base camp to explore the region, whatever the season:\n☀️ In Summer: The house offers a small pool with a terrace, perfect for cooling off. Relax by the water and enjoy long evenings on the sunny terrace. \n⛰️ In Spring & Autumn: You will enjoy direct access to hiking trails in the Chartreuse and the nearby forest. Our location is ideal for visiting Annecy (1h), Lyon (1h15), or exploring the surrounding mountain ranges (Vercors, Belledonne, Royans, and Trièves). \n❄️ In Winter: Enjoy the joys of the mountains! We are located close to family-friendly Chartreuse resorts for sledding and cross-country skiing, and less than an hour from major international resorts in Oisans (Alpe d'Huez, Les 2 Alpes) for world-class skiing.\n\nThe village center is within walking distance, and a large supermarket is just a three-minute drive away for your daily groceries. Come and discover the charm of our home and the natural beauty of the region!","gp":"You will love our neighborhood for its charm and exceptional natural environment. It is a quiet area, which includes a parking space and offers a magnificent view of the Belledonne massif, guaranteeing peace and a change of scenery from the moment you arrive.\n\nThe village, accessible on foot, offers all necessary amenities: newsagent, greengrocer, bakery, butcher, and pizzeria. The major asset remains the immediate proximity to nature: the forest and the first hiking trails of the Chartreuse massif are at the end of the street, while still being just 15 minutes from Grenoble city center.","ot":"We look forward to welcoming you and sharing the beauty of our region. We live here all year round with our three children; it is a house full of life.\n\nEnjoy our Dauphinoise home, the quiet garden, and the breathtaking view of the peaks. We hope you will enjoy exchanging your home with ours and that you will feel right at home here. Don't hesitate to ask us questions about activities (skiing, hiking, sightseeing). See you soon in our little corner of paradise!"},{"loc":"it","title":"Casa di Charme alle Porte delle Alpi: Giardino, Piscina & Montagne (Grenoble)","gf":"Scoprite la nostra affascinante casa tradizionale (\"Maison Dauphinoise\"), immersa in un vasto giardino ai piedi del massiccio della Chartreuse. La casa dispone di due bagni, un ampio e spazioso soggiorno e cinque camere da letto, potendo accogliere comodamente fino a dieci persone.\n\nÈ il campo base ideale per esplorare la regione, in qualsiasi stagione:\n☀️ In Estate: La casa offre una piccola piscina con terrazza, perfetta per rinfrescarsi. Rilassatevi a bordo piscina e godetevi le lunghe serate sulla terrazza soleggiata. \n⛰️ In Primavera & Autunno: Godrete di un accesso diretto ai sentieri escursionistici della Chartreuse e nella foresta vicina. La nostra posizione è ideale per visitare Annecy (1h), Lione (1h15) o esplorare i massicci circostanti (Vercors, Belledonne, Royans e Trièves). \n❄️ In Inverno: Godetevi le gioie della montagna! Siamo situati vicino alle stazioni familiari della Chartreuse per lo slittino e lo sci di fondo, e a meno di un'ora dalle grandi stazioni internazionali dell'Oisans (Alpe d'Huez, Les 2 Alpes) per il grande sci.\n\nIl centro del paese è accessibile a piedi, e un grande supermercato si trova a soli tre minuti in auto per la spesa quotidiana. Venite a scoprire il fascino della nostra casa e le bellezze naturali della regione!","gp":"Amerete il nostro quartiere per il suo fascino e il suo ambiente naturale eccezionale. È un quartiere tranquillo, che dispone di un posto auto e offre una vista magnifica sul massiccio di Belledonne, garantendo tranquillità e relax fin dal vostro arrivo.\n\nIl paese, accessibile a piedi, offre tutti i servizi necessari: tabacchi/edicola, fruttivendolo, panetteria, macelleria e pizzeria. La risorsa principale rimane l'immediata vicinanza alla natura: la foresta e i primi sentieri escursionistici del massiccio della Chartreuse sono in fondo alla strada, pur restando a soli 15 minuti dal centro di Grenoble.","ot":"Non vediamo l'ora di accogliervi e condividere la bellezza della nostra regione. Viviamo qui tutto l'anno con i nostri tre figli; è una casa piena di vita.\n\nGodetevi la nostra casa Dauphinoise, la calma del giardino e la vista mozzafiato sulle vette. Speriamo che apprezzerete lo scambio della vostra casa con la nostra e che vi sentirete qui come a casa vostra. Non esitate a farci domande sulle attività (sci, escursioni, visite). A presto nel nostro piccolo angolo di paradiso!"},{"loc":"de","title":"Charmantes Haus am Tor zu den Alpen: Garten, Pool & Berge (Grenoble)","gf":"Entdecken Sie unser charmantes, traditionelles Haus (\"Maison Dauphinoise\"), eingebettet in einen großen Garten am Fuße des Chartreuse-Massivs. Das Haus verfügt über zwei Badezimmer, ein großes, geräumiges Wohnzimmer und fünf Schlafzimmer, die bequem Platz für bis zu zehn Personen bieten.\n\nEs ist der ideale Ausgangspunkt, um die Region zu erkunden, egal zu welcher Jahreszeit:\n☀️ Im Sommer: Das Haus bietet einen kleinen Pool mit Terrasse, perfekt für eine Abkühlung. Entspannen Sie sich am Wasser und genießen Sie lange Abende auf der sonnigen Terrasse. \n⛰️ Im Frühling & Herbst: Sie profitieren von einem direkten Zugang zu den Wanderwegen der Chartreuse und dem nahegelegenen Wald. Unsere Lage ist ideal für Ausflüge nach Annecy (1h), Lyon (1h15) oder zur Erkundung der umliegenden Gebirgsmassive (Vercors, Belledonne, Royans und Trièves). \n❄️ Im Winter: Genießen Sie die Freuden der Berge! Wir befinden uns in der Nähe der familiären Skigebiete der Chartreuse (Rodeln und Langlauf) und weniger als eine Stunde von den großen internationalen Skistationen des Oisans (Alpe d'Huez, Les 2 Alpes) entfernt.\n\nDer Dorfkern ist zu Fuß erreichbar und ein großer Supermarkt für Ihre täglichen Einkäufe befindet sich nur drei Autominuten entfernt. Kommen Sie und entdecken Sie den Charme unseres Hauses und die Naturschönheiten der Region!","gp":"Sie werden unser Viertel wegen seines Charmes und der außergewöhnlichen natürlichen Umgebung lieben. Es ist ein ruhiges Viertel mit eigenem Parkplatz und einem herrlichen Blick auf das Belledonne-Massiv, was Ruhe und Tapetenwechsel ab Ihrer Ankunft garantiert.\n\nDas Dorf ist zu Fuß erreichbar und bietet alle notwendigen Annehmlichkeiten: Kiosk/Zeitschriftenladen, Gemüsehändler, Bäckerei, Metzgerei und Pizzeria. Der größte Pluspunkt bleibt die unmittelbare Nähe zur Natur: Der Wald und die ersten Wanderwege des Chartreuse-Massivs liegen am Ende der Straße, während das Stadtzentrum von Grenoble nur 15 Minuten entfernt ist.","ot":"Wir freuen uns darauf, Sie willkommen zu heißen und die Schönheit unserer Region mit Ihnen zu teilen. Wir leben hier das ganze Jahr über mit unseren drei Kindern; es ist ein Haus voller Leben.\n\nGenießen Sie unser traditionelles Haus, die Ruhe des Gartens und den atemberaubenden Blick auf die Gipfel. Wir hoffen, dass Ihnen der Tausch mit unserem Haus gefällt und Sie sich hier wie zu Hause fühlen. Zögern Sie nicht, uns Fragen zu Aktivitäten (Skifahren, Wandern, Besichtigungen) zu stellen. Bis bald in unserem kleinen Paradies!"}],"ph":["1801376_0","1801376_1","1801376_2","1801376_3","1801376_4","1801376_5","1801376_6","1801376_7","1801376_8","1801376_9","1801376_10","1801376_11","1801376_12","1801376_13","1801376_14","1801376_15","1801376_16","1801376_17","1801376_18","1801376_19","1801376_20"]},{"v":"V20","n":20,"id":3296509,"t":"Maison de campagne familiale","town":"Chauffayer","cc":"France","region":"Champsaur","lat":44.74401561963149,"lon":6.009610096943162,"bd":4,"ba":2,"cap":13,"m2":170,"typ":"House","mn":5,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":2,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Chaillol","m":26,"b":26,"km":19,"via":"Rte de Grenoble/N85","q":""},{"n":"Ancelle","m":28,"b":30,"km":25,"via":"Rte de Grenoble/N85","q":""},{"n":"Superdevoluy","m":45,"b":45,"km":26,"via":"D17T","q":""},{"n":"Orcieres","m":55,"b":60,"km":40,"via":"Rte de Grenoble/N85 and D944","q":""},{"n":"Alpe d'Huez","m":110,"b":130,"km":86,"via":"D526","q":""},{"n":"Les 2 Alpes","m":110,"b":120,"km":89,"via":"D526","q":""},{"n":"Risoul","m":110,"b":120,"km":88,"via":"N94","q":"Durance N94"}],"near":26,"n30":2,"n60":4,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":"grande salle à manger & salon avec cheminée","sauna":null,"toys_inside":"quelques jeux. Pour les tout-petits, des livres, jeux; some board games","toys_outside":null,"large_garden":"un grand jardin avec fruitiers","winter_restriction":null,"access_issue":"grand jardin ... sert également de parking"},"av":[],"q":[],"ski":"stations de ski entre 20-50min (Saint-Michel-de-Chaillol, Ancelle / Orcières-Merlette)","notes":"1823 Champsaur farmhouse with fireplace and toddler kit, 4 bedrooms (6 doubles/sofa beds), no WiFi, slopes 20-50 min drive; new owner.","score":68,"stars":3.5,"gp":219,"rr":100,"gr":0.0,"ex":0,"owner":"Julie","recip":true,"desc":[{"loc":"tr","title":"Family country house","gf":"Here is our family home, which dates from 1823. An old farm where my grandparents were the farmers, and my father renovated it entirely and tastefully!\nLocated in the beautiful Champsaur and Valgaudemar region, you will find all the comfort of the countryside here, in summer as in winter.\nIt has 4 bedrooms with 6 double beds/click-clack sofa beds, 2 shower rooms, WC, laundry room, an equipped kitchen, a large dining room & living room with fireplace. No internet; we have a TV with an HDMI cable, and DVDs for young and old, and some games. For toddlers: books, games, potties, 1 travel cot, a small baby bath, a bed rail, a stair gate.\nA small garden at the foot of the house and a large garden with fruit trees just opposite, which also serves as parking.\nThere are no pets, except sometimes the cows that occupy the field behind.\nDive into the neighbouring forests, visit the local craftspeople and producers, scramble around our mountains, glide down the snowy slopes of the surrounding resorts or simply cool off at the various swimming spots. The region has developed well and there is plenty to please young and old.\n------\nHere is our family home from 1823. My grand-parents were farmers and my father renovated this farmhouse tastefully !\nLocated in a beautiful region of Champsaur & Valgaudemar in Ecrins Park, you will find all the land comfort all along the seasons.\nCompound of 4 bedrooms with 6 double bed&sofa beds, 2 water rooms, toilets, wash-machine, equipped kitchen, big living room.\nNo Internet, no WIFI. 1 TV with HDMI cable and some DVDs for children (Disney in English too) and adults (in French only). Some board games. For little children, we have some books, games, potties, 1 folding crib, a little bathroom, child safety gate (bed and stairs).\nA little garden in front of the house and a big one with some fruit’s trees.\nNo animal inside the house, only some cows in the rear field.\nEnjoying inside the forests and across the rivers, visiting the handmade creators and local producers, hiking our mountains, sliding down the snow-covered slopes. This region has developed well and there is plenty of needs to satisfy young and old people.","gp":"Nature a few steps from the house for picking mushrooms and blackberries. Then by car: swimming pools (outdoor and indoor) 10 min away, a lake 20 min away, white-water sports, ski resorts 20-50 min away (small: Saint-Michel-De-Chaillol, Ancelle, Saint-Léger-Les-Mélèzes / Large: Orcière-Merlette), and lots of hikes in winter and summer, treetop adventure courses, and events in the neighbouring villages.\n\nShops less than 10 min away by car: bakery, supermarkets, petrol station, DIY store, pharmacies, restaurants, butcher, cheese shop. Gap is 30 min away, Grenoble 1h15.\n---\nIn few steps from my house and you will be in the forest ready to pick some mushrooms and berries. By car, there are some swimming pools (inside&outside) in 10min, artificial lake at 20min, water sports, winter sports stations between 20-50min (littles : Saint-Michel-De-Chaillol, Ancelle, Saint-Léger-Les-Mélèzes / Big: Orcière-Merlette), lot of hikings, treetop adventure courses, and some village events.\n\nSome shops at 10min away from the house : backery, supermarkets, oil stations, DYI store, pharmacy, restaurants, etc. \n\n30min from Gap and 1h15 from Grenoble.","ot":"Here, my home is your home. Enjoy!\n---\nHere is my home, your home. Enjoy it !"},{"loc":"fr","title":"Maison de campagne familiale","gf":"Voici notre maison de famille qui date de 1823. Une ancienne ferme dont mes grands-parents étaient les paysans et mon père l’a entièrement rénovée avec goût ! \nSituée dans la belle région du Champsaur et du Valgaudemar, vous y trouverez tout le confort de la campagne en été comme en hiver.\nComposée de 4 chambres avec 6 lits/clic-clacs doubles, 2 salles d’eau, wc, buanderie, une cuisine équipée, une grande salle à manger & salon avec cheminée. Pas d’internet, nous avons une télé avec un câble HDMI, et des DVD pour petits et grands, quelques jeux. Pour les tout-petits, des livres, jeux, pots, 1 lit parapluie, une petite baignoire, une barrière pour lit, une barrière pour l’escalier.\nUn petit jardin au pied de la maison et un grand jardin avec fruitiers juste en face, qui sert également de parking.\nIl n’y a pas d’animal de compagnie, si ce n’est parfois des vaches qui occupent le champ de derrière.\nPlonger dans les forêts adjacentes, visiter les artisans et producteurs du coin, crapahuter dans nos montagnes, glisser sur les pentes enneigées des stations environnantes ou simplement se rafraichir dans les différents points d’eaux. La région s’est bien développée et il y a de quoi se satisfaire pour petits et grands.\n------\nHere is our family home from 1823. My grand-parents were farmers and my father renovated this farmhouse tastefully !\nLocated in a beautiful region of Champsaur & Valgaudemar in Ecrins Park, you will find all the land comfort all along the seasons.\nCompound of 4 bedrooms with 6 double bed&sofa beds, 2 water rooms, toilets, wash-machine, equipped kitchen, big living room.\nNo Internet, no WIFI. 1 TV with HDMI cable and some DVDs for children (Disney in English too) and adults (in French only). Some board games. For little children, we have some books, games, potties, 1 folding crib, a little bathroom, child safety gate (bed and stairs).\nA little garden in front of the house and a big one with some fruit’s trees.\nNo animal inside the house, only some cows in the rear field.\nEnjoying inside the forests and across the rivers, visiting the handmade creators and local producers, hiking our mountains, sliding down the snow-covered slopes. This region has developed well and there is plenty of needs to satisfy young and old people.","gp":"La nature à quelques pas de la maison pour cueillir des champignons et des mûres. Puis en voiture : des piscines (extérieures et intérieure) à 10min, un plan d'eau à 20min, les sports d’eaux vives, des stations de ski entre 20-50min (petites : Saint-Michel-De-Chaillol, Ancelle, Saint-Léger-Les-Mélèzes / Grande: Orcière-Merlette), et pleins de randonnées hiver comme été, accrobranches, évènements dans les villages voisins.\n\nDes commerces à moins de 10min en voiture : boulangerie, supermarchés, station essence, bricolage, pharmacies, restaurants, boucherie, fromagerie. Gap à 30min, Grenoble à 1h15.\n---\nIn few steps from my house and you will be in the forest ready to pick some mushrooms and berries. By car, there are some swimming pools (inside&outside) in 10min, artificial lake at 20min, water sports, winter sports stations between 20-50min (littles : Saint-Michel-De-Chaillol, Ancelle, Saint-Léger-Les-Mélèzes / Big: Orcière-Merlette), lot of hikings, treetop adventure courses, and some village events.\n\nSome shops at 10min away from the house : backery, supermarkets, oil stations, DYI store, pharmacy, restaurants, etc. \n\n30min from Gap and 1h15 from Grenoble.","ot":"Ici chez moi, c'est chez vous. Profitez bien !\n---\nHere is my home, your home. Enjoy it !"}],"ph":["3296509_0","3296509_1","3296509_2","3296509_3","3296509_4","3296509_5","3296509_6","3296509_7","3296509_8","3296509_9","3296509_10","3296509_11","3296509_12"]},{"v":"V21","n":21,"id":2591672,"t":"Beautiful bright family house in a quiet area in Savoie 10 minutes from Chambéry","town":"Vimines","cc":"France","region":"Bauges","lat":45.55157570023916,"lon":5.869294245200768,"bd":5,"ba":2,"cap":10,"m2":180,"typ":"House","mn":6,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":3,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":2,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"St-Pierre-de-Chartreuse","m":45,"b":50,"km":36,"via":"D1006 and D520B","q":"Maurienne"},{"n":"La Feclaz (Grand Revard)","m":50,"b":60,"km":26,"via":"D912","q":""},{"n":"Aillons-Margeriaz","m":55,"b":65,"km":30,"via":"D206","q":""},{"n":"Le Sappey","m":60,"b":65,"km":49,"via":"Rte du Col de Pte./D512","q":""},{"n":"Les 7 Laux","m":60,"b":70,"km":57,"via":"A41","q":""},{"n":"Le Collet d'Allevard","m":65,"b":75,"km":59,"via":"A41","q":""},{"n":"Crest-Voland","m":75,"b":90,"km":84,"via":"A43","q":"Maurienne A43"},{"n":"La Clusaz","m":85,"b":110,"km":87,"via":"A41","q":""}],"near":45,"n30":0,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"board games for all ages, Lego, Duplo, Kapla, Playmobil ... games room","toys_outside":"Safe play area for children: large secure trampoline, large swing.","large_garden":"Pleasant outdoor areas: 1,500 square meter garden","winter_restriction":null,"access_issue":null},"av":[],"q":["Maurienne"],"ski":null,"notes":"Kid-heaven family house near Chambéry (500m alt), 5 bed sleeps 10; no ski claim - resorts are a drive away; too small for 12.","score":68,"stars":3.5,"gp":240,"rr":90,"gr":4.98,"ex":24,"owner":"Claire","recip":false,"desc":[{"loc":"fr","title":"Belle Maison lumineuse familiale au calme en Savoie","gf":"Maison disponible pour 6 nuits minimum car cela nous demande une organisation pour tout mettre en ordre afin de vous accueillir.  \n\nNous mettons à votre disposition notre maison spacieuse fonctionnelle lumineuse agréable et calme dans laquelle nous vivons toute l'année.\ntrès belle pièce de vie salon cuisine en plafond cathédrale avec une mezzanine donnant dans le salon permettant aux enfants de jouer avec les tres nombreux jeux à disposition (jeux de société de tous âges, lego, dupplo, kapla, playmobils, petites voitures, nombreux livres pour enfants ainsi que bandes dessinées.). \nCuisine bien équipée avec îlot central et plaques induction \nAppareil à raclette, fondue , crêpière, robot pâtissier à disposition pour les gourmets ! \nau Rez de Chaussée : 1 chambre avec un lit double + salle de bains + WC séparés \nÀ l’étage : 4 chambres + salle de jeux + Douche + WC séparés \nEspaces extérieurs agréables : jardin de 1500 mètres carrés, verger, potager, fleurs, framboises fraises cerises à ramasser selon la saison. \nBarbecue extérieur. \nEspace pour jouer en toute securité pour les enfants : grand trampoline sécurisé, grande balançoire.\nMagnifique terrasse de 70 mètres carrés bien exposée (Est soleil le matin et ombragée l’après midi sous un grand Bouleau pour l’été) avec vue exceptionnelle à 180° sur le lac du Bourget, les montagnes du parc naturel des Bauges et qq sommets de la chaine des Belledonnes. \n places de parking devant la maison.","gp":"Environnement: maison à 500m d'altitude dans un village tres calme entre campagne et montagne. Vous pourrez vous promener entre rivières, forêt et montagne directement à pied en partant de la maison. Vous pourrez rendre visite aux ânes, chevaux, vaches, moutons, poules dans les petites fermes autour de la maison.\n\nActivités possibles : \n\nL’HIVER : \nPlusieurs Stations de ski familiales (la Feclaz, Mageriaz, et le désert d’entremont)  à 45 min de voiture de la maison (pour du ski de fond ou ski de piste). \n\nle plus grand lac naturel de France (lac du bourget) est accessible en 20 min de voiture ou en velo avec activités nautiques (plages pour se baigner, balades en bateau organisées ou locations de kayak, paddle, bateau, planche a voile, catamaran,..). \nÉgalement à 20 min aussi le très joli Lac D’aiguebelette. \nIl existe plusieurs via ferrata, escalade, randonnées, VTT tres proches. \nNous avons de nombreuses cartes et guides pour toutes les activités en nature de la région.\n\nLa ville de Chambery est accessible à 10 min de voiture avec ses restaurants, musées et concerts gratuits durant l'été. Vous pourrez vous procurer des fruits et légumes frais et savoureux ainsi que des produits régionaux en allant sur le marché à Chambery. La visite de la ville et de son château émerveilleront petits et grands à pied ou en petit train touristique.\n\nLe très pittoresque et touristique centre historique d'Annecy et son lac sont accessibles à seulement 40min de voiture.","ot":"Nous sommes une famille avec 3 enfants de 5ans, 10ans et 13ans et nous souhaitons faire profiter d'autres familles de notre agréable maison. Nous sommes ravis de faire découvrir notre magnifique région et saurons vous conseiller pour toutes vos sorties en plein air en montagne ou aux lacs.\n\nPetites informations supplémentaires : \n- nous n’acceptons pas les animaux de compagnie dans la maison (mais dehors oui) \n- nous accueillons des familles pour du tourisme, mais nous n’acceptons pas les « fiesta »\n- nous louons une petite voiture 5 places si nécessaire pour dépanner via le site Getaround pour une question d’assurance\n- nous ne buvons pas de café mais bcp de thé à la maison : nous avons tout de même une cafetière à piston classique qui fonctionne avec du café moulu. Et une cafetière italienne. \n- nous n’avons pas de télévision mais possibilité de regarder des films en écran géant avec vidéo projecteur dans le salon , avec une sélection de nombreux films et dessins animés que nous avons acheté sur Apple TV , mis à disposition. Possibilité de louer des films également. \n- nous avons la fibre avec wifi qui fonctionne bien."},{"loc":"en","title":"Beautiful bright family house in a quiet area in Savoie 10 minutes from Chambéry","gf":"House available for a minimum of 6 nights, as we need time to get everything ready to welcome you.  \n\nWe offer you our spacious, functional, bright, pleasant, and quiet home, where we live year-round.\nBeautiful living room/kitchen with cathedral ceilings and a mezzanine overlooking the living room, where children can play with the many games available (board games for all ages, Lego, Duplo, Kapla, Playmobil, toy cars, numerous children's books, and comic books). \nWell-equipped kitchen with central island and induction hobs \nRaclette machine, fondue set, crepe maker, and pastry mixer available for foodies! \nOn the ground floor: 1 bedroom with a double bed + bathroom + separate toilet \nUpstairs: 4 bedrooms + games room + shower + separate toilet \nPleasant outdoor areas: 1,500 square meter garden, orchard, vegetable garden, flowers, raspberries, strawberries, and cherries to pick depending on the season. \nOutdoor barbecue. \nSafe play area for children: large secure trampoline, large swing.\nMagnificent 70 square meter terrace with good exposure (sunny in the morning and shaded in the afternoon under a large birch tree in summer) with an exceptional 180° view of Lake Bourget, the mountains of the Bauges Natural Park, and some peaks of the Belledonnes range. \n Parking spaces in front of the house.","gp":"Environment: house nestled at 500m altitude in a very quiet village between countryside and mountains. You can walk between rivers, forest and mountains directly on foot from the house. You can visit the donkeys, horses, cows, sheep, chickens on the small farms around the house.\nPossible activities: the largest natural lake in France (Lac du Bourget) is accessible in 20 minutes by car or by bike with water activities (beaches for swimming, organized boat trips or rentals of kayak, paddle, boat, windsurfing , catamaran, etc.). There are several via ferrata, climbing, hiking, mountain biking very close by. We have numerous maps and guides for all nature activities in the region.\nThe town of Chambery is a 10-minute drive away with its restaurants, museums and free concerts during the summer. You can buy fresh and tasty fruits and vegetables as well as regional products by going to the market in Chambery. \nA visit to the city and its castle will amaze young and old on foot or by little tourist train.\nThe very picturesque and touristy historic center of Annecy and its lake are only 40 minutes away by car.","ot":"We are a family with 3 children of 3 years old, 8 years old and 11 years old who want other families to enjoy our pleasant home. We are delighted to make you discover our beautiful region and will advise you for all your outdoor outings in the mountains or to the lakes.\n\nSmall additional information:\n\n- we do not accept pets in the house (but outside yes)\n\n- we welcome families for tourism, but we do not accept \"Parties\" between friends\n\n- We rent a small 5-seater car if necessary for emergency repairs via the Getaround website for insurance purposes.\n\n- we don't drink coffee but a lot of tea at home: we still have a classic piston coffee maker that works with ground coffee. And an Italian coffee maker.\n\n- we do not have a television but the possibility to watch movies on a giant screen with overhead projector in the living room, with a selection of many movies and cartoons that we bought on Apple TV, made available. Possibility to rent movies as well.\n\n- we have the fiber with wifi that works well."}],"ph":["2591672_0","2591672_1","2591672_2","2591672_3","2591672_4","2591672_5","2591672_6","2591672_7","2591672_8","2591672_9","2591672_10","2591672_11","2591672_12","2591672_13","2591672_14","2591672_15","2591672_16","2591672_17","2591672_18","2591672_19","2591672_20","2591672_21","2591672_22","2591672_23","2591672_24","2591672_25","2591672_26","2591672_27","2591672_28","2591672_29","2591672_30","2591672_31","2591672_32","2591672_33","2591672_34","2591672_35","2591672_36"]},{"v":"V22","n":22,"id":2982928,"t":"Maison cosy à Annecy","town":"Cran-Gevrier","cc":"France","region":"Aravis","lat":45.91075192848663,"lon":6.113995056286501,"bd":5,"ba":3,"cap":13,"m2":175,"typ":"House","mn":4,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":0,"children_bed":1,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Le Grand-Bornand","m":45,"b":55,"km":32,"via":"D16 and D909","q":"Aravis D909"},{"n":"Aillons-Margeriaz","m":50,"b":55,"km":41,"via":"D5 and D59","q":""},{"n":"La Clusaz","m":50,"b":55,"km":32,"via":"D16 and D909","q":"Aravis D909"},{"n":"La Feclaz (Grand Revard)","m":55,"b":60,"km":52,"via":"A41 and D913","q":""},{"n":"Les Carroz","m":60,"b":70,"km":77,"via":"A410 and A40","q":""},{"n":"Combloux","m":65,"b":80,"km":86,"via":"A410 and A40","q":""},{"n":"Samoens","m":70,"b":85,"km":82,"via":"A410","q":""},{"n":"Crest-Voland","m":75,"b":90,"km":53,"via":"D1508","q":""}],"near":45,"n30":0,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":["Aravis D909"],"ski":null,"notes":"Large Annecy family house, 5 bed/3 bath sleeps 13, 5 min to lake; no ski info - ~40+ min drive to resorts.","score":67,"stars":3.5,"gp":300,"rr":80,"gr":4.96,"ex":25,"owner":"Thida","recip":true,"desc":[{"loc":"tr","title":"Cosy house in Annecy","gf":"✨ About the house\nWelcome to our large family house, a stone's throw from the lake and the centre of Annecy!\nSpacious, modern and fully equipped, it is ideal for holidays with family or friends.\n","gp":"We have just moved from our apartment in the centre to a large house, located on the border between Annecy and Cran-Gevrier. The location is ideal: only 5 minutes by bike or car from the station and the lake, while still being quiet. You will enjoy a perfect setting, both close to the town and at the foot of the mountains, for discovering Annecy, nicknamed the \"Venice of the Alps\".","ot":""},{"loc":"fr","title":"Maison cosy à Annecy","gf":"✨ Présentation de la maison\nBienvenue dans notre grande maison familiale, située à deux pas du lac et du centre d’Annecy !\nSpacieuse, moderne et parfaitement équipée, elle est idéale pour des vacances en famille ou entre amis.\n","gp":"Nous venons de quitter notre appartement du centre pour une grande maison, située à la limite d’Annecy et de Cran-Gevrier. L’emplacement est idéal : à seulement 5 minutes en vélo ou en voiture de la gare et du lac, tout en restant au calme. Vous profiterez d’un cadre parfait, à la fois proche de la ville et au pied des montagnes, pour découvrir Annecy, surnommée la “Venise des Alpes”.","ot":null}],"ph":["2982928_0","2982928_1","2982928_2","2982928_3","2982928_4","2982928_5","2982928_6","2982928_7","2982928_8","2982928_9","2982928_10","2982928_11","2982928_12","2982928_13","2982928_14","2982928_15"]},{"v":"V23","n":23,"id":3304382,"t":"A Cosy Alpine Retreat Between Tyrol and Bavaria","town":"Jungholz","cc":"Austria","region":"Allgaeu","lat":47.57734618342596,"lon":10.444292517413988,"bd":6,"ba":2,"cap":13,"m2":245,"typ":"House","mn":4,"beds":{"big_double_bed":6,"double_bed":0,"single_bed":0,"children_bed":0,"baby_bed":1,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Jungholz","m":4,"b":4,"km":1,"via":"Jungholz","q":""},{"n":"Nesselwang","m":16,"b":18,"km":15,"via":"B310","q":""},{"n":"Tannheim","m":30,"b":35,"km":26,"via":"B310 and Tannheimer Str./B199","q":""},{"n":"Pfronten Breitenberg","m":35,"b":35,"km":25,"via":"B310","q":""},{"n":"Oberstdorf","m":50,"b":55,"km":40,"via":"B19","q":""},{"n":"Ehrwald","m":65,"b":75,"km":71,"via":"A7 and B179/E532","q":""},{"n":"Warth-Schroecken","m":100,"b":100,"km":87,"via":"B198","q":""},{"n":"Damuels","m":120,"b":130,"km":97,"via":"B200","q":""}],"near":4,"n30":3,"n60":5,"fac":{"fireplace":false,"sauna":false,"toysIn":false,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"In winter, perfectly groomed ski slopes, cross-country ski tracks (Jungholz, Tannheim Valley/Allgäu)","notes":"New 245 m2 wooden lodge in Jungholz, 6 bedrooms (6 king beds) + cot, sleeps 13 - good fit for 12 but owner has 0 exchanges and only 2 baths.","score":67,"stars":3.5,"gp":299,"rr":100,"gr":0.0,"ex":0,"owner":"Markus","recip":true,"desc":[{"loc":"de","title":"Gemütliches Wohlfühl-Chalet zwischen Tirol und Bayern","gf":"Wir haben die Ärmel hochgekrempelt und die Zeit genutzt, um den Platz für unsere Gäste zu erweitern:\nDas neue Holzhaus bietet Raum für aktive Wanderer, Radfahrer oder auch Wintersportler, die in der Familie oder Gruppe gemeinsam unter einem Dach zusammenfinden möchten. Zudem eignet sich das Haus perfekt für Familientreffen jeglicher Art. \nOb Jubiläum, runder Geburtstag oder einfach nur ein gemütliches Beisammensein kann hier im modernen Hüttenflair gefeiert werden.","gp":"Rund um das charmante Bergdorf Jungholz öffnet sich eine vielseitige Alpenregion, die Naturfreunde, Familien und Aktivurlauber gleichermaßen begeistert. Zwischen dem Tannheimer Tal und dem Allgäu liegen unzählige Wege, Gipfel und Ausflugsziele, die jeden Aufenthalt besonders machen.\n\nOb Wandern, Mountainbiken, Rennradfahren, Klettern, Skifahren, Schneeschuhwandern oder gemütliche Spaziergänge – die umliegenden Berge bieten ideale Bedingungen für Outdoor-Abenteuer in jeder Jahreszeit. Im Sommer locken klare Bergseen, abwechslungsreiche Höhenwege und familienfreundliche Erlebnisrouten. Im Winter warten bestens präparierte Pisten, Langlaufloipen und verschneite Winterwanderwege.\n\nAuch kulturell hat die Region viel zu bieten: Die weltberühmten Schlösser Neuschwanstein und Linderhof liegen ebenso in Reichweite wie die historischen Städte Füssen, Reutte und Kempten. Wer es gemütlicher mag, findet traditionelle Almen, regionale Küche und authentische Tiroler Gastfreundschaft.\n\nFür Familien gibt es zahlreiche Highlights – vom Hochseilgarten über Naturerlebnispfade bis hin zum Indoor-Spielplatz in Wertach, der an Regentagen für strahlende Kinderaugen sorgt.\n\nDie Umgebung von Jungholz verbindet alpine Ruhe mit einer Fülle an Aktivitäten – ein idealer Ausgangspunkt für alle, die Natur, Bewegung und echte Erholung suchen.","ot":"Wir kümmern uns gerne darum, dass alles sauber und gemütlich für Sie vorbereitet ist. Daher berechnen wir für die Endreinigung einmalig 95 € pro Aufenthalt. Bettwäsche stellen wir für 6 € pro Person zur Verfügung."},{"loc":"en","title":"A Cosy Alpine Retreat Between Tyrol and Bavaria","gf":"We rolled up our sleeves and made good use of the time to expand our accommodation for guests:\n\nOur new wooden lodge offers the perfect retreat for active hikers, cyclists, and winter sports enthusiasts who want to enjoy quality time together under one roof with family or friends. The house is also ideally suited for family gatherings and celebrations of all kinds.\n\nWhether it is an anniversary, a milestone birthday, or simply a cosy get-together, the lodge provides the perfect setting to celebrate in a modern alpine atmosphere. Combining contemporary comfort with the charm of a mountain cabin, it creates a welcoming space for unforgettable moments and shared experiences.","gp":"Surrounded by the charming mountain village of Jungholz, a diverse Alpine region unfolds, delighting nature lovers, families, and outdoor enthusiasts alike. Nestled between the Tannheim Valley and the Allgäu, the area offers countless hiking trails, mountain peaks, and excursion destinations that make every stay truly memorable.\n\nWhether you enjoy hiking, mountain biking, road cycling, climbing, skiing, snowshoeing, or simply taking leisurely walks, the surrounding mountains provide ideal conditions for outdoor adventures throughout the year. In summer, crystal-clear mountain lakes, scenic high-altitude trails, and family-friendly adventure routes invite visitors to explore the region. In winter, perfectly groomed ski slopes, cross-country ski tracks, and snow-covered winter hiking paths await.\n\nThe region also has plenty to offer culturally. World-famous attractions such as Neuschwanstein Castle and Linderhof Palace are within easy reach, as are the historic towns of Füssen, Reutte, and Kempten. Those seeking a more relaxed experience will find traditional alpine huts, regional cuisine, and authentic Tyrolean hospitality.\n\nFamilies can look forward to numerous highlights, from high-rope courses and nature discovery trails to the indoor playground in Wertach, which guarantees happy children even on rainy days.\n\nThe surroundings of Jungholz combine the tranquility of the Alps with a wide range of activities, making it an ideal base for anyone looking to enjoy nature, outdoor recreation, and genuine relaxation.","ot":""},{"loc":"fr","title":"Chalet alpin chaleureux entre le Tyrol et la Bavière","gf":"Nous avons retroussé nos manches et profité de ce temps pour agrandir notre espace d’accueil :\n\nNotre nouvelle maison en bois offre un hébergement idéal aux randonneurs, cyclistes et amateurs de sports d’hiver qui souhaitent se retrouver en famille ou entre amis sous un même toit. Elle se prête également parfaitement aux réunions de famille et aux célébrations de toutes sortes.\n\nQu’il s’agisse d’un anniversaire, d’un jubilé ou simplement d’un moment convivial entre proches, notre chalet au style alpin moderne constitue le cadre idéal. Il allie le charme authentique de la montagne au confort contemporain et crée une atmosphère chaleureuse propice aux moments inoubliables et aux souvenirs partagés.","gp":"Autour du charmant village de montagne de Jungholz s’étend une région alpine variée qui séduit aussi bien les amoureux de la nature que les familles et les amateurs d’activités de plein air. Située entre la vallée de Tannheim et l’Allgäu, cette destination offre d’innombrables sentiers, sommets et sites d’excursion qui rendent chaque séjour inoubliable.\n\nQue vous soyez adepte de randonnée, de VTT, de cyclisme sur route, d’escalade, de ski, de raquettes ou simplement de promenades tranquilles, les montagnes environnantes offrent des conditions idéales pour des aventures en plein air tout au long de l’année. En été, des lacs de montagne aux eaux cristallines, des itinéraires panoramiques d’altitude et des parcours découverte adaptés aux familles invitent à l’exploration. En hiver, vous profiterez de pistes parfaitement entretenues, de pistes de ski de fond et de sentiers de randonnée hivernale dans un décor enneigé.\n\nLa région possède également un riche patrimoine culturel. Les célèbres châteaux de Neuschwanstein et de Linderhof sont facilement accessibles, tout comme les villes historiques de Füssen, Reutte et Kempten. Ceux qui recherchent davantage de détente apprécieront les alpages traditionnels, la cuisine régionale et l’authentique hospitalité tyrolienne.\n\nLes familles trouveront également de nombreuses attractions, allant des parcours d’accrobranche et sentiers de découverte de la nature à l’aire de jeux couverte de Wertach, idéale pour divertir les enfants lors des journées pluvieuses.\n\nLes environs de Jungholz associent la sérénité des Alpes à une grande diversité d’activités, faisant de cette destination un point de départ idéal pour tous ceux qui souhaitent profiter de la nature, de l’activité physique et d’une véritable détente.","ot":""},{"loc":"it","title":"Chalet alpino accogliente tra il Tirolo e la Baviera","gf":"Ci siamo rimboccati le maniche e abbiamo sfruttato questo periodo per ampliare la nostra offerta di ospitalità:\n\nLa nostra nuova casa in legno offre la sistemazione ideale per escursionisti, ciclisti e appassionati di sport invernali che desiderano trascorrere del tempo insieme sotto lo stesso tetto, in famiglia o con gli amici. È inoltre perfetta per riunioni di famiglia e festeggiamenti di ogni genere.\n\nChe si tratti di un compleanno, di un anniversario o semplicemente di un piacevole incontro tra persone care, il nostro chalet in moderno stile alpino rappresenta la cornice ideale. Unisce il fascino autentico della montagna ai comfort contemporanei, creando un’atmosfera calda e accogliente per momenti indimenticabili e ricordi condivisi.","gp":"Attorno all’incantevole villaggio montano di Jungholz si estende una regione alpina variegata che affascina gli amanti della natura, le famiglie e gli appassionati di attività all’aria aperta. Tra la valle di Tannheim e l’Allgäu, innumerevoli sentieri, vette e mete escursionistiche rendono ogni soggiorno un’esperienza speciale.\n\nChe si tratti di escursionismo, mountain bike, ciclismo su strada, arrampicata, sci, ciaspolate o semplici passeggiate rilassanti, le montagne circostanti offrono condizioni ideali per vivere avventure all’aria aperta in ogni stagione.\n\nIn estate vi attendono laghi alpini dalle acque cristalline, panoramici sentieri in quota e percorsi avventura adatti a tutta la famiglia. In inverno, invece, potrete godere di piste perfettamente preparate, tracciati per lo sci di fondo e splendidi sentieri innevati per passeggiate nella natura.\n\nLa regione offre molto anche dal punto di vista culturale: i famosi castelli di Neuschwanstein e Linderhof sono facilmente raggiungibili, così come le storiche città di Füssen, Reutte e Kempten. Chi desidera un’atmosfera più tranquilla apprezzerà gli alpeggi tradizionali, la cucina tipica regionale e l’autentica ospitalità tirolese.\n\nAnche le famiglie troveranno numerose attrazioni: parchi avventura tra gli alberi, sentieri tematici dedicati alla natura e un parco giochi al coperto a Wertach, ideale per regalare divertimento ai più piccoli nelle giornate di pioggia.\n\nI dintorni di Jungholz uniscono la serenità delle Alpi a una vasta gamma di attività per il tempo libero. Un punto di partenza perfetto per chi desidera vivere appieno la natura, il movimento e un autentico momento di relax.","ot":""},{"loc":"es","title":"Encantador chalet alpino para sentirse como en casa entre el Tirol y Baviera","gf":"Nos hemos arremangado y aprovechado el tiempo para ampliar el espacio destinado a nuestros huéspedes.\n\nLa nueva casa de madera ofrece espacio para excursionistas, ciclistas y aficionados a los deportes de invierno que deseen reunirse en familia o con amigos bajo un mismo techo. Además, la casa es perfecta para celebrar reuniones familiares de todo tipo.\n\nYa sea un aniversario, un cumpleaños especial o simplemente un acogedor encuentro entre familiares y amigos, aquí podrá disfrutar de una celebración en un moderno ambiente alpino con el encanto de una cabaña de montaña.","gp":"Alrededor del encantador pueblo de montaña de Jungholz se despliega una variada región alpina que entusiasma por igual a los amantes de la naturaleza, las familias y los aficionados al turismo activo. Entre el Valle de Tannheim y la región de Allgäu se encuentran innumerables senderos, cumbres y destinos de excursión que convierten cada estancia en una experiencia especial.\n\nYa sea senderismo, ciclismo de montaña, ciclismo de carretera, escalada, esquí, rutas con raquetas de nieve o tranquilos paseos, las montañas de los alrededores ofrecen condiciones ideales para disfrutar de actividades al aire libre durante todo el año. En verano, los cristalinos lagos de montaña, las variadas rutas panorámicas y los recorridos de aventura para familias invitan a descubrir la región. En invierno, le esperan pistas perfectamente preparadas, circuitos de esquí de fondo y senderos invernales cubiertos de nieve.\n\nLa región también tiene mucho que ofrecer desde el punto de vista cultural: los mundialmente famosos castillos de Neuschwanstein y Linderhof se encuentran a poca distancia, al igual que las históricas ciudades de Füssen, Reutte y Kempten. Quienes prefieran un ritmo más tranquilo podrán disfrutar de tradicionales refugios de montaña, la gastronomía regional y la auténtica hospitalidad tirolesa.\n\nLas familias encontrarán además numerosas atracciones, desde parques de aventura en los árboles y senderos temáticos en la naturaleza hasta el parque infantil cubierto de Wertach, que garantiza la diversión de los más pequeños incluso en los días lluviosos.\n\nLos alrededores de Jungholz combinan la tranquilidad alpina con una amplia oferta de actividades, convirtiéndose en el punto de partida ideal para quienes buscan naturaleza, actividad física y auténtico descanso","ot":"Nos encargamos de que todo esté limpio, acogedor y perfectamente preparado para su llegada. Por ello, aplicamos una tarifa única de 95 € por estancia para la limpieza final. La ropa de cama se proporciona a todos los huéspedes y tiene un coste de 6 € por persona."}],"ph":["3304382_0","3304382_1","3304382_2","3304382_3","3304382_4","3304382_5","3304382_6","3304382_7","3304382_8","3304382_9","3304382_10","3304382_11","3304382_12","3304382_13","3304382_14","3304382_15","3304382_16","3304382_17"]},{"v":"V24","n":24,"id":2670583,"t":"Family house in the mountains","town":"Selva di Val Gardena","cc":"Italy","region":"Dolomites","lat":46.56374433855078,"lon":11.73629412724029,"bd":4,"ba":4,"cap":12,"m2":140,"typ":"House","mn":7,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":1,"children_bed": ,"av":[],"q":[],"ski":"station de ski alpin et nordique à 15/20 minutes en voiture (Le Revard); navette","notes":"Aix-les-Bains town house, 6 bedrooms/sleeps 12, stove, swing+sandpit, Revard slopes 15-20 min drive; new owner, 0 exchanges.","score":67,"stars":3.5,"gp":257,"rr":100,"gr":0.0,"ex":0,"owner":"Claire","recip":true,"desc":[{"loc":"tr","title":"Family house very close to the thermal baths of Aix-les-Bains, with a beautiful panoramic view.","gf":"Enjoy a quiet stay in Aix-les-Bains in a practical, bright and spacious house.\n4 WCs, 2 shower rooms and 1 bathroom. 6 bedrooms, 1 office, 1 living/dining room and 1 kitchen. The entrance with a cloakroom and the utility room mean you won't clutter the living spaces.\nThe water is softened, which avoids dry-skin problems for sensitive people.\nYou can enjoy the sunny garden, several terraces and tables for meals (in the sun, under the parasol or under the trees), a swing and a sandpit.\n\nFrom the house you can join the Revard hikes (La Voie de la Crémaillère) or walk 10 to 15 minutes into the town centre for a coffee or some shopping. The N3 bus stop is 5 minutes away.\nThe Chevalley thermal baths are easily reached on foot.\nThe parish is warm and prayerful.\n\nYou can use our bikes to get to the lake (6 bikes of different sizes for children, 5 adult bikes and 1 electric bike with a Thule trailer for 2 children (well used but works fine!)\n\nIn winter our stove creates a cosy atmosphere.\n\nAccess:\nFrom the railway station, you can reach the house by bus or on foot (about a 20-minute walk).\nIf you come by car, our private cul-de-sac makes parking easy (2 spaces)","gp":"Quiet, very green neighbourhood, within easy reach of the town centre.\nThermal baths, lake, forest, mountains, town, station, shopping, alpine and Nordic ski resorts 15/20 minutes away by car in winter depending on the site. There is also a shuttle bus.","ot":"Simple, clean house."},{"loc":"fr","title":"Maison familiale toute proche des thermes d Aix les Bains, avec une très belle vue panoramique.","gf":"Passez un séjour au calme à Aix les Bains dans une maison pratique, lumineuse et spacieuse. \n4 WC et 2 sdd et 1 sdb. 6 chambres, 1 bureau 1 salon salle à manger et 1 cuisine. L entrée avec garde robe et la buanderie vous permettra de ne pas encombrer les espaces de vie. \nL eau est adoucie ce qui écarte les problèmes de peau sèche chez les personnes fragiles. \nVous pourrez profiter du jardin ensoleillé, de plusieurs terrasses et tables pour les repas ( soleil, sous le parasol ou sous les arbres), d une balançoire et d un bac à sable. \n\nA patir de la maison vous pouvez rejoindre les randonnées du Revard ( La voie de la Cremaillère) ou aller vers le centre ville en marchant 10 a 15 minutes pour prendre 1 café ou faire des courses. L arrêt du bus N3 est à 5 minutes. \nLes thermes Chevalley sont facilement accessibles à pieds.\nLa paroisse est chaleureuse et priante.\n\nVous pouvez utiliser nos vélos pour vous rendre lac. ( 6 vélos de différentes tailles enfants, 5 vélos adultes et 1 vélo électrique avec charette Thule pour 2 enfants ( a vécu mais fonctionne bien!)\n\nEn hiver notre poêle donne une ambiance chaleureuse.\n\nAccès: \nDe la gare ferroviaire, vous pouvez rejoindre la maison en bus ou à pieds ( une 20aine de minutes de marche).\nSi vous venez en voiture notre impasse privée vous permettra de vous garer facilement ( 2 places)","gp":"Quartier calme, très vert et accessible du centre ville. \nThermes, lac, forêt, montagne,  ville, gare, shopping,  station de ski alpin et nordique à 15/ 20 minutes selon les sites en hiver en voiture. Il existe aussi une navette.","ot":"Maison simple et propre."}],"ph":["3334206_0","3334206_1","3334206_2","3334206_3","3334206_4","3334206_5","3334206_6","3334206_7","3334206_8"]},{"v":"V26","n":26,"id":1904733,"t":"La maison de Fanny à Annecy","town":"Annecy","cc":"France","region":"Aravis","lat":45.882587863292905,"lon":6.089443944585204,"bd":5,"ba":2,"cap":12,"m2":200,"typ":"House","mn":0,"beds":{"big_double_bed":1,"double_bed":3,"single_bed":3,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Aillons-Margeriaz","m":45,"b":50,"km":36,"via":"D5 and D59","q":""},{"n":"La Feclaz (Grand Revard)","m":50,"b":55,"km":37,"via":"D5 and D62","q":""},{"n":"La Clusaz","m":55,"b":70,"km":41,"via":"D909","q":"Aravis D909"},{"n":"Le Grand-Bornand","m":55,"b":65,"km":41,"via":"D909","q":"Aravis D909"},{"n":"Les Carroz","m":65,"b":75,"km":78,"via":"A410 and A40","q":""},{"n":"Combloux","m":70,"b":85,"km":87,"via":"A410 and A40","q":""},{"n":"Le Collet d'Allevard","m":75,"b":90,"km":95,"via":"A41","q":""},{"n":"Les 7 Laux","m":75,"b":85,"km":93,"via":"A41","q":""}],"near":45,"n30":0,"n60":4,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"De nombreux jeux sont à dispositions pour les enfants de tout âge.","toys_outside":"Un trampoline, une table de ping-pong, un petit toboggan, des jeux d'extérieurs","large_garden":"terrain de 900m²","winter_restriction":null,"access_issue":null},"av":[],"q":["Aravis D909"],"ski":"Les stations de ski du Semnoz sont à 20 minutes en voiture; Aravis à 30 min","notes":"200 m2 Annecy family house, 5 bed/2 bath (owner says 8-9 people), great kids' kit; Semnoz 20 min, Aravis 30 min.","score":67,"stars":3.5,"gp":273,"rr":100,"gr":5.0,"ex":4,"owner":"Fanny","recip":false,"desc":[{"loc":"tr","title":"Fanny's house in Annecy","gf":"Our house, 10 minutes by car from Annecy town centre, is ideally located for visiting the region:\n- Annecy and its lake,\n- the Semnoz and its heights for hiking on foot or mountain biking (a shuttle bus takes you and your bike up to the summit)\n- the Bauges massif,\n- the Aravis massif (Grand Bornand, La Clusaz) 30 min away\n- the Mont Blanc massif (Chamonix) 1h10 by road\n- motorway access\nand if you decide to visit another lake, Lac du Bourget is 30 min away","gp":"A few kilometres from Lake Annecy (4 km) and the historic centre, we invite you to spend wonderful moments in one of the most beautiful regions of France in our family home.\nThe house was built in the 2000s and renovated in 2020; you'll enjoy nearly 200 m² with large living spaces.\nWith its 5 bedrooms, it can sleep 8 to 9 people depending on how guests configure it.\nThe house is on a 900 m² plot with a superb terrace in the shade of a century-old oak grove, and has a recent, fully automated swimming pool so you only have to enjoy wonderful sunbathing, with built-in roller shutters and a 1-metre shallow ledge for little ones to bathe.\nThe uncovered pool is winterised from November until April.\n\nLocated in a cul-de-sac, the surroundings are quiet and green.\nThe house is laid out as follows:\nOn the ground floor, a large kitchen opens onto a large 50 m² living room, plus a master bedroom with its own bathroom.\nA utility room is equipped with a washing machine and tumble dryer, as well as raclette, fondue and crêpe-party machines, etc…\n\nUpstairs, 4 (large) bedrooms and a shower room.\n\nBedroom 1 - sleeps 2 (1 single bed OR a 160 cm bed),\nBedroom 2 - sleeps 1 (1 bed of 120 cm),\nBedroom 3 - sleeps 2 (1 bed of 140 cm)\nBedroom 4 - sleeps 2 (1 single bed OR a 160 cm bed) with a desk.\nPlenty of games are available for children of all ages.\n\nA trampoline, a ping-pong table, a small slide and outdoor games will provide pleasant moments for everyone.\n\nChildcare equipment is also available on request.\n\nThe region is rich in exceptional sites:\n\nOf course Annecy, its lake, its old town and its castle, and the extraordinary setting of a \"town in the mountains\".\nThe Semnoz ski areas are 20 minutes away by car. Ideal for learning downhill or cross-country skiing.\nLet's not forget the mountains of the Aravis or Bauges massifs right nearby for superb skiing outings, and of course Chamonix or Switzerland less than an hour away.\n\nWhether you love downhill skiing, cross-country skiing, ski touring, cycling, trail running, climbing, golf or fine food, you'll have a superb time in this little corner of paradise.\n\nAvailable for rental in February, April and July/August 2024.\n\nCleaning at the end of the stay is extra, and a pool technician is available for the duration of your stay.","ot":""},{"loc":"fr","title":"La maison de Fanny à Annecy","gf":"Notre maison, située à 10 minutes en voiture au centre ville d'annecy est idéalement située pour visiter la région:\n- annecy et son lac, \n- le semnoz et ses hauteurs pour randonner à pied, en VTT (navette de bus qui vous monte au sommet ainsi que votre vélo)\n- le massif des bauges,\n- le massif des aravis (grand bornand, la clusaz) à 30 min\n- le massif du mont blanc (Chamonix) à 1h10 de route\n- acces autoroute\net si vous décidez de visiter un autre lac, le lac du bourget se situe à 30 min","gp":"A quelques kilomètres du lac d’Annecy (4 km) et du centre historique, nous vous proposons de passer de merveilleux moments dans une des plus belles régions de France dans notre maison de famille.\nMaison construite dans les années 2000 et rénovée en 2020, vous pourrez profiter d’une surface de près de 200m² avec de grands espaces de vie.\nAvec ses 5 chambres, elle permettra de loger 8 à 9 personnes selon les configurations des locataires.\nLa maison se situe sur un terrain de 900m² accueillant une superbe terrasse à l’ombre d’une chênaie centenaire et dispose d’une piscine récente entièrement automatisée pour ne profiter que des merveilleux bains de soleil avec volets roulants intégrés et une plage de 1 Mètre pour baigner les tout-petits.\nLa piscine non couverte est hivernée à partir du mois de novembre jusqu’au mois d’avril.\n\nSituée dans une impasse, l’environnement est calme et verdoyant.\nLa maison est disposée de la manière suivante :\nAu rez-de-chaussée, une grande cuisine donne sur un grand salon de 50m² ainsi qu’une chambre parentale avec sa salle de bains.\nUne buanderie est équipée de lave linge, sèche linge, mais aussi appareil à raclette, fondue, crêpes party etc…\n\nA l’étage, 4 (grandes) chambres à disposition et une salle de douche.\n\nChambre 1 - 2 couchages (1 lit simple OU un lit en 160cm),\nChambre 2 - 1 couchage (1 lit en 120 cm),\nChambre 3 - 2 couchages (1 lit en 140 cm)\nChambre 4 - 2 couchages (1 lit simple OU un lit en 160cm) avec un bureau.\nDe nombreux jeux sont à dispositions pour les enfants de tout âge.\n\nUn trampoline, une table de ping-pong, un petit toboggan, des jeux d’extérieurs vous permettront de passer d’agréables moments pour tous.\n\nDu matériel de puériculture est également disponible sur demande.\n\nLa région est riche de sites exceptionnels :\n\nBien sûr Annecy, son lac, sa vieille ville et son château et l’environnement extraordinaire d’une \"ville à la montagne\".\nLes stations de ski du Semnoz sont à 20 minutes en voiture. L’idéal pour s’initier au ski de piste ou ski de fond.\nN’oublions pas les montagnes du Massif des Aravis ou des Bauges à proximité immédiate pour de superbes sorties de ski et bien sûr Chamonix ou la Suisse à moins d’une heure.\n\nAdeptes de ski de piste, ski de fond, ski de rando, vélo, trail, escalade, golf ou fins gastronomes, vous passerez de superbes moments dans ce petit coin de paradis.\n\nLocation en février, en avril et juillet/ Août 2024.\n\nMénage en sus fin de séjour et technicien piscine à disposition pendant la durée de votre séjour.","ot":""}],"ph":["1904733_0","1904733_1","1904733_2","1904733_3","1904733_4","1904733_5","1904733_6","1904733_7","1904733_8","1904733_9","1904733_10","1904733_11","1904733_12","1904733_13","1904733_14","1904733_15","1904733_16","1904733_17","1904733_18","1904733_19","1904733_20","1904733_21"]},{"v":"V27","n":27,"id":2967900,"t":"Maison insolite ronde \"DomeEspace\" en bois dans le parc national des Ecrins.","town":"Chauffayer","cc":"France","region":"Champsaur","lat":44.7442108
