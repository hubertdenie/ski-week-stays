 harp, keyboard), a play area for children and 2 more bedrooms.\nA large trampoline will let the children let off steam. A rustic wooden bench lets you enjoy the aerial ballet of the paragliders and a breathtaking view of the Bauges massif.","gp":"We are 10 minutes (by car) from the beach and bay of Talloires.\nWe are 500 m from the La Forclaz paragliding take-off (the No. 1 spot in Europe).\nIf you would like to discover how it feels to be a bird and see the landscape from the sky, you can book a tandem first flight with one of the paragliding companies right nearby.\n\nIn summer, shuttles will take you from the house to the lake and Annecy.\n4 restaurants, including one with two Michelin stars, are less than 500 m from the house.\nWe live opposite a farm/restaurant that produces reblochon. The cowbells sometimes ring!\n\nHikes start from the house (Pointe de la Rochette, La Tournette (360° view at the summit), ...).\nThe 3 free beaches of Talloires will welcome you for enchanting swims. Paddleboard and kayak hire on Talloires beach. You can also cycle around Lake Annecy (cycle path all the way round the lake).\n\nMany tourist sites are nearby: the town of Annecy, nicknamed \"the Venice of the Alps\", the Château de Menthon Saint Bernard, the Seythenex cave and waterfalls, the Angon waterfall, the Roc de Chère and Bout du Lac nature reserves ...\nWe are 1 hour from Geneva (airport) and 2 hours from Lyon.","ot":"Whether you are into lazing around, shopping or hiking (or even paragliding), our house is made for you!\nCome and discover all the riches of Lake Annecy and its mountains."},{"loc":"fr","title":"Entre lac et montagne : La maison de Virginie","gf":"Notre maison est située au col de la Forclaz, au cœur des montagnes des Aravis, surplombant le lac d'Annecy.\nC'est une maison spacieuse et lumineuse avec un grand rez de chaussée donnant sur la terrasse et un grand jardin arboré (1 500 m2). \nUne très belle pièce de vie, avec grande table conviviale et un coin salon (jeux de société, livres, BD), offre une vue panoramique sur les montagnes. La cuisine ouverte sur le séjour est très fonctionnelle. La salle de bain avec douche et baignoire se trouve aussi au rez de chaussée ainsi que 2 chambres.\nA l'étage, vous pourrez profiter d'une salle de musique (guitare, harpe, clavier), d'un coin jeux pour les enfants et de 2 autres chambres.\nUn grand trampoline permettra aux enfants de se défouler. Un banc rustique en bois vous fera profiter du ballet aérien des parapentistes et d'une vue imprenable sur le massif des Bauges.","gp":"Nous sommes situé à 10 minutes (en voiture) de la plage et de la baie de Talloires. \nNous sommes à 500 m du décollage de parapente de La Forclaz (1er spot d'Europe).\nSi vous souhaitez découvrir les sensations des oiseaux et le paysage vu du ciel, vous pourrez réserver un baptême dans une des compagnies de parapente à proximité immédiate.\n\nEn été, des navettes vous permettront de rejoindre le lac et Annecy depuis la maison.\n4 restaurants, dont un double étoilé Michelin, se trouvent à moins de 500 m de la maison.\nNous habitons en face d'une ferme/restaurant productrice de reblochon. Les cloches des vaches tintent parfois !\n\nDépart de randonnées depuis la maison (Pointe de la Rochette, la Tournette (vue à 360° au sommet), ...).\nLes 3 plages gratuites de Talloires vous accueilleront pour des baignades enchantées. Location de paddle et kayak sur la plage de Talloires. Vous pourrez aussi faire le tour du lac d'Annecy à vélo (piste cyclable tout autour du lac).\n\nDe nombreux sites touristiques se trouvent à proximité : la ville d'Annecy surnommée \"la Venise des Alpes\", le château de Menthon Saint Bernard, la grotte et les cascades de Seythenex, la cascade d'Angon, réserves naturelles du Roc de Chère et du Bout du Lac ...\nNous sommes à 1 heure de Genève (aéroport) et à 2 heures de Lyon.","ot":"Que vous soyez adepte du farniente, du shopping ou de la randonnée (ou même du parapente), notre maison est faite pour vous ! \nVenez découvrir toutes les richesses du lac d'Annecy et de ses montagnes."}],"ph":["2318794_0","2318794_1","2318794_2","2318794_3","2318794_4","2318794_5","2318794_6","2318794_7","2318794_8","2318794_9","2318794_10","2318794_11","2318794_12","2318794_13","2318794_14","2318794_15","2318794_16","2318794_17"]},{"v":"V60","n":60,"id":3070126,"t":"La maison de Sandrine et Jean-Stéphane au cœur de la montagne","town":"Saint-Martin-D'uriage","cc":"France","region":"Oisans","lat":45.15558031771016,"lon":5.840898985692511,"bd":4,"ba":2,"cap":10,"m2":150,"typ":"House","mn":3,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Chamrousse","m":20,"b":20,"km":16,"via":"D111","q":""},{"n":"Le Sappey","m":40,"b":45,"km":23,"via":"D512","q":""},{"n":"Les 7 Laux","m":50,"b":55,"km":42,"via":"A41","q":""},{"n":"St-Pierre-de-Chartreuse","m":55,"b":60,"km":36,"via":"D512","q":""},{"n":"Le Collet d'Allevard","m":60,"b":65,"km":53,"via":"A41","q":""},{"n":"Oz-Vaujany","m":70,"b":80,"km":53,"via":"D1091","q":"Oisans D1091"},{"n":"Villard-de-Lans","m":70,"b":80,"km":57,"via":"D531","q":""},{"n":"Aillons-Margeriaz","m":75,"b":85,"km":76,"via":"A41","q":""}],"near":20,"n30":1,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":false,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":"Un trampoline est à disposition des enfants.","large_garden":"un jardin de 1500 m² fleuri","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"à seulement 20 minutes de Grenoble ... et de la station de ski de Chamrousse","notes":"Uriage house at 600 m, 4 double bedrooms/2 baths (+ spare mattresses), 1,500 m2 garden, trampoline; Chamrousse 20 min; resident cat.","score":58,"stars":3.0,"gp":200,"rr":100,"gr":5.0,"ex":9,"owner":"SANDRINE","recip":true,"desc":[{"loc":"tr","title":"Sandrine and Jean-Stéphane's house in the heart of the mountains","gf":"Our large house is at 600 m altitude in the heart of the Belledonne massif in the Alps. We have a 1,500 m² flower garden leading onto a large terrace equipped with a summer kitchen and a pergola, with a magnificent view of the Chartreuse and Vercors massifs. A trampoline is available for children. It's an ideal spot for lovers (like us) of nature, sport and the mountains.\n\nHere are the details of the rooms and beds:\nOn the ground floor: 1 huge, very bright dining room/kitchen opening onto the terrace + WC\nUpstairs: 1 master suite with dressing room and bathroom and 3 bedrooms (with double beds) + bathroom + WC\nFor extra beds, we can lend you spare mattresses.\nWe have a cat, Pika, who is quite independent but very friendly!","gp":"The house is both 200 m from the heart of the village, where you'll find a bakery, café, small supermarket, greengrocer, and a market on Wednesday and Sunday mornings (and Monday morning in Uriage), an outdoor pool from June to the end of August, tennis courts, and with direct access to the many hiking trails by which you can go up on foot or by bike into the Seiglières forest or to Chamrousse.\nThe Uriage park, emblematic of the region with its thermal baths, is 3 minutes away by car and 20 minutes on foot. From the park, you can admire the Château d'Uriage, a former 11th-century fortress extensively remodelled in the 16th and 19th centuries.\n\nYou'll be only 20 minutes from Grenoble, with its cultural vibrancy, and from the Chamrousse ski resort. Finally, the Château de Vizille and its park, a landmark of French history, are 15 minutes away.\n1 hour's drive away: the cities of Lyon, Chambéry and Annecy make great day trips.\n3 hours by train from Grenoble: Paris","ot":""},{"loc":"fr","title":"La maison de Sandrine et Jean-Stéphane au cœur de la montagne","gf":"Notre grande maison se trouve à 600 m d'altitude au cœur du massif de Belledonne dans les Alpes. Nous avons un jardin de 1500 m² fleuri donnant sur une grande terrasse équipée d'une  cuisine d'été et d'une pergola avec une vue magnifique sur le massif de la Chartreuse et du Vercors. Un trampoline est à disposition des enfants. C'est un coin idéal pour les amoureux (comme nous) de la nature, du sport et des montagnes. \n\nVoici le détail des pièces et des couchages : \nAu rez-de-chaussée : 1 vaste salle à manger/cuisine très lumineuse donnant sur la terrasse + WC\nA l'étage : 1 suite parentale avec dressing et salle de bain et 3 chambres (avec des lits doubles)  + Salle de Bain + WC\nPour les couchages supplémentaires, nous pouvons vous prêter des matelas d’appoint.\nNous avons une chatte Pika assez indépendante, mais très sympa!","gp":"La maison est à la fois à 200 m du cœur du village où vous trouverez boulangerie, café, petit supermarché, primeur, et marché les mercredi et dimanche matins (et le lundi matin à Uriage), piscine découverte de juin à fin août, terrains de tennis, et en accès direct aux multiples sentiers de randonnée par lesquels vous pouvez monter à pied ou en vélo dans la forêt des Seiglières ou à Chamrousse.\nLe parc d'Uriage emblématique de la région avec ses thermes est à 3 minutes en voiture, et 20 minutes à pieds. Depuis le parc, vous pourrez admirer le château d'Uriage, ancien château fort du XIᵉ siècle profondément remanié aux XVIᵉ et XIXᵉ siècles.\n\nVous serez à seulement 20 minutes de Grenoble, avec son dynamisme culturel, et de la station de ski de Chamrousse. Enfin, le château de Vizille et son parc, haut lieu de l’histoire française, se trouvent à 15 minutes. \nA 1h de route : les villes de Lyon, de Chambéry et d'Annecy sont de belles sorties à la journée.\nA 3h de train depuis Grenoble : Paris","ot":""}],"ph":["3070126_0","3070126_1","3070126_2","3070126_3","3070126_4","3070126_5","3070126_6","3070126_7","3070126_8","3070126_9","3070126_10","3070126_11","3070126_12","3070126_13","3070126_14","3070126_15","3070126_16","3070126_17","3070  We have a garden and a large terrace where you can eat outdoors.\nThe whole house is air-conditioned.\nWe have a vegetable garden, so you can enjoy fresh vegetables!","gp":"La Chapelle Blanche is a charming village overlooking the Grésivaudan valley. The ski slopes at Allevard are less than 30 minutes away. Fort Barraux is 15 minutes away. The towns of Chambéry, Albertville and Grenoble are 30, 35 and 45 minutes away. In the town of La Rochette (7 minutes) you will find shops and restaurants, as well as a playground with water jets, a fishing pond and a public swimming pool. The town of Pontcharra (10 minutes) also has all the shops, a public swimming pool open all year round, a lake and a cinema.\nYou are less than 30 minutes from the site of the famous Coupe Icare (Lumbin - St Hilaire du Touvet).\nMany hikes are possible in the nearby massifs. We are also an hour's drive from Lake Annecy and half an hour from Lac du Bourget.","ot":"We are quite flexible! If you want to come to our home outside the school holidays, that's perfectly possible — just ask us, don't hesitate!"},{"loc":"fr","title":"Heated swimming pool, mountain view and ski resorts nearby","gf":"Notre maison avec la piscine chauffée et la vue panoramique sur le massif de la Chartreuse consiste du vaste salon-cuisine et de 5 pièces à l'étage (3 chambres et 2 bureaux). Nous avons un jardin et une grande terrasse où on peut manger en plein air.\nLa maison est intégralement climatisée.\nNous avons un potager, ce qui permet de profiter de légumes frais !","gp":"La Chapelle Blanche c'est un charmant village surplombant la vallée de Grésivaudan. Les pistes de ski à Allevard sont à moins de 30 minutes. Le fort Barraux est à 15 minutes. Les villes de Chambèry, d'Albertville et de Grenoble sont à 30, 35 et 45 minutes. Dans la ville de La Rochette (7 minutes) vous trouverez les commerces et les restaurants, ainsi qu'un terrain de jeu avec des jets d'eau, un étang de pèche et une piscine publique. Dans la ville de Pontcharra (10 minutes) il y a toutes les commerces également, une piscine publique ouverte toute l'année, un plan d'eau et un cinéma.\nVous êtes à moins de 30 minutes du site de fameuse Coupe Icare (Lumbin - St Hilaire du Touvet).\nDes nombreuses randonnées sont possibles dans les massifs à proximité. Nous sommes aussi à une heure de route du lac d'Annecy et à une demi-heure du lac du Bourget.","ot":"Nous sommes assez flexibles ! Si vous voulez venir chez nous en dehors de vacances scolaires, c’est tout à fait possible, demandez-nous, n’hésitez pas !"}],"ph":["2180691_0","2180691_1","2180691_2","2180691_3","2180691_4","2180691_5","2180691_6","2180691_7","2180691_8","2180691_9","2180691_10","2180691_11","2180691_12","2180691_13","2180691_14","2180691_15"]},{"v":"V62","n":62,"id":2266733,"t":"La maison de Doro et Alex au pied e Chamrousse","town":"Vaulnaveys-Le-Haut","cc":"France","region":"Belledonne","lat":45.12073598238951,"lon":5.829418930681433,"bd":4,"ba":2,"cap":10,"m2":150,"typ":"House","mn":7,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":0,"children_bed":3,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Chamrousse","m":26,"b":26,"km":18,"via":"D111","q":""},{"n":"Le Sappey","m":40,"b":45,"km":25,"via":"D524 and D512","q":""},{"n":"Les 7 Laux","m":50,"b":60,"km":44,"via":"A41","q":""},{"n":"Le Collet d'Allevard","m":60,"b":70,"km":55,"via":"A41","q":""},{"n":"St-Pierre-de-Chartreuse","m":60,"b":65,"km":38,"via":"D512","q":""},{"n":"Les 2 Alpes","m":70,"b":85,"km":62,"via":"D1091","q":"Oisans D1091"},{"n":"Oz-Vaujany","m":70,"b":75,"km":51,"via":"D1091","q":"Oisans D1091"},{"n":"Villard-de-Lans","m":70,"b":90,"km":53,"via":"D531","q":""}],"near":26,"n30":1,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":"Salon avec poelle à bois et pompe à chaleur (stove)","sauna":null,"toys_inside":"chaises hautes, jeux, livres enfant","toys_outside":null,"large_garden":"1000 m2 verdure clôturé","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"Sur la route de Chamrousse, la station de ski la plus proche de Grenoble","notes":"Renovated family house below Chamrousse, wood stove, 1000 m2 fenced garden, kid gear; sleeps 10, drive to slopes; contact_allowed 0.","score":58,"stars":3.0,"gp":239,"rr":100,"gr":4.99,"ex":29,"owner":"Dorothee","recip":false,"desc":[{"loc":"tr","title":"Doro and Alex's house at the foot of Chamrousse","gf":"Our house is at the foot of the Belledonne massif, at the gateway to the Champsaur, the Oisans and the Écrins.\nSet in green surroundings, it has a lovely view of the Vercors massif.\nRecently restored, it is comfortable, with its own electricity generation (solar panels) and a charging point for electric vehicles.\n\nOn the ground floor:\n- Living room with wood stove and heat pump, dining room, recent and well-equipped kitchen, open onto the terrace,\n- A back kitchen,\n- A laundry room,\n- WC,\n- A TV room/guest room (extra bed) and a bathroom (shower) and WC,\n\nOn the 1st floor:\n- a double bedroom with walk-in wardrobe and balcony,\n- a triple bedroom (140 bed and 90 bunk bed), access to the balcony\n- a bedroom with a 140 alcove bed,\n- bathroom (bath) and WC.\n\nOutside:\n- Private gravel parking for 4 cars with accessible electric charging point (Green up)\n- Terrace with large parasol and outdoor table\n- 1000 m2 of fenced green space\n- Henhouse\n\nThe house is bright, recently renovated, in a well-stocked garden with a henhouse.\nIn winter the stove wraps you in a warm atmosphere to the sound of the crackling fire.\nIt is suitable for families with children (changing table, high chairs, games, children's books, the whole garden fenced).\nWe can lend a cot and a pushchair.","gp":"A village of Belledonne, Vaulnaveys is one of the gateways to the massif, offering many hikes.\nOn the road to Chamrousse, the closest ski resort to Grenoble, both winter and summer activities are on offer (alpine skiing, cross-country skiing on the Arselle plateau, high-altitude walk to the Croix de Chamrousse with the Chamrousse cable car open in summer, Himalayan footbridge, giant zip line...). Paragliding flights are also possible.\nSmaller routes are also accessible for families (Lac de Luitel with boardwalk, walk to the Chartreuse de Prémol, Lac de Laffrey with swimming possible...)\nRefuge de la Pra, many high-altitude lakes, Croix de Belledonne. Close to Uriage, a spa town (5 min) with golf, thermal baths and restaurants including a Michelin-starred one, and the big lakes Aix les Bains, Annecy (1 hour). Grenoble (20 min).","ot":"We are very respectful of the homes we stay in and considerate towards our hosts, and we hope for the same consideration from our guests ;) Welcome to our home!"},{"loc":"fr","title":"La maison de Doro et Alex au pied e Chamrousse","gf":"Notre maison est située au pied du massif de Belledonne, aux portes du Champsaur, de l'Oisans et des Écrins.\nSituée dans un cadre verdoyant, elle propose une jolie vue sur le massif du Vercors. \nRestaurée récemment, elle est confortable avec une autoconsommation électrique (panneaux solaires) et une borne de recharge pour véhicules électriques.\n \nAu rez-de-chaussée : \n- Salon avec poelle à bois et pompe à chaleur, salle à manger cuisine récente et bien équipée, ouverte sur la terrasse, \n- Une arrière cuisine, \n- Une buanderie, \n- Des WC,\n- Une chambre TV/chambre d'ami (lit appoint) et une salle de bain (douche) et WC,\n\nAu 1er étage :\n- une chambre double avec dressing et balcon, \n- une chambre triple (lit 140 et lit 90 superposé), accès au balcon\n- une chambre lit alcove de 140, \n- SDB (bain) et WC. \n\nExtérieurs :\n- Parking sur gravillon privatif pour 4 voitures avec borne électrique accessible (Green up) \n- Terrasse avec grand parasol et table extérieure\n- 1000 m2 verdure clôturé\n- Poulailler \n\nLa maison est lumineuse, rénovée récemment, dans un jardin bien garni avec un poulailler. \nL'hiver, le poêle vous plonge dans une atmosphère chaleureuse au son du crépitement du feu. \nElle est adaptée aux familles avec enfants (table à langer, chaises hautes, jeux, livres enfant, clôturée de lensemble du jardin). \nPossibilité de prêter un lit cage et une poussette.","gp":"Village de Belledonne, Vaulnaveys est une des portes du massif, permettant de pratiquer de nombreuses randonnées.\nSur la route de Chamrousse, la station de ski la plus proche de Grenoble, des activités d'hiver comme d'été sont proposées (ski alpin, ski de fond au plateau de L'Arselle, balade en altitude à la croix de Chamrousse avec téléphérique chamrousse ouvert en été , passerelle himalayenne, tyrolienne géante..). Des vols en parapente sont également possible. \nDe plus petits parcours sont également accessible pour les familles (lac de Luitel avec caillebotis, balade de la Chartreuse de Premol,lac de Lafrey avec possibilité de baignade..) \nRefuge de la Pra, nombreux lacs d'altitude, croix de Belledonne. Proche d'Uriage, station thermale (5mn) golf, thermes et restaurants dont un étoilé et des grands lacs Aix les bains Annecy (1h). Grenoble (20mn).","ot":"Nous sommes très respectueux des logements dans lesquels nous séjournons et bienveillants à l'égard des hôtes, et espérons la même considération de nos guests ;) Bienvenue chez nous !"}],"ph":["2266733_0","2266733_1","2266733_2","2266733_3","2266733_4","2266733_5","2266733_6","2266733_7","2266733_8","2266733_9","2266733_10","2266733_11","2266733_12"]},{"v":"V63","n":63,"id":3000996,"t":"Maison de Céline & Terry - entre lac et montagnes","town":"Seynod","cc":"France","region":"Aravis","lat":45.88648259511342,"lon":6.1039249067935435,"bd":5,"ba":3,"cap":11,"m2":130,"typ":"House","mn":5,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":0,"children_bed":1,"baby_bed":1,"double_bed_up":2,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Aillons-Margeriaz",  en voiture","notes":"Straw-earth 5-bed/2-bath house by Lake Annecy, sleeps 10; nearest ski 45 min - lake base, not ski base.","score":56,"stars":3.0,"gp":216,"rr":100,"gr":5.0,"ex":32,"owner":"Laurence et Guy","recip":false,"desc":[{"loc":"tr","title":"Laurence and Guy's house","gf":"It is a large, bright house on 2 levels, with a vast terrace and a large lawn all around. We built it ourselves; the walls are made of a mixture of earth and straw, which makes it particularly healthy and pleasant to live in. It is simply but comfortably equipped and welcoming for its guests.\nOur house is a non-smoking house. As it is very large, we do not accept stays of fewer than 4 nights.","gp":"This house is in a small village very close to Lake Annecy. The lake is a fifteen-minute walk away. Walks in nature and in the mountains are possible from the house. The nearest ski resort (Val d'Arly) is 45 minutes away by car.\nThe cycle path that goes all the way round the lake, and lets you get to Annecy or as far as Albertville, is barely 5 min from the house.","ot":"The surroundings are magnificent and there is something for every taste: footpaths from the house, hiking or mountain-biking trails in the mountains in summer, swimming in the lake from its many beaches, skiing in winter at the renowned or family resorts of the Alps, or sightseeing: nearby Annecy, Aix-les-Bains, Chambéry."},{"loc":"fr","title":"La maison de Laurence et Guy","gf":"C'est une grande maison lumineuse sur 2 niveaux, avec une vaste terrasse et un grand terrain en pelouse autour. Nous l'avons nous-mêmes construite, les murs sont constitués d'un mélange de terre et de paille qui la rendent particulièrement saine et agréable à vivre. Elle est simplement mais confortablement équipée, accueillante pour ses hôtes.\nNotre maison est une maison non-fumeurs. Comme elle est d'une grande superficie, nous n'acceptons pas de séjour de moins de 4 nuits.","gp":"Cette maison est située dans un petit village tout proche du lac ne ouverte) donnant sur la terrasse. \nSalle de bains, WC\nA l'étage: \n3 chambres doubles (1 lit 160, 2 lits 140)\n1 chambre/ bureau avec canapé BZ convertible 140 + 2 lits d'appoint 1 place\nSalle de bains, WC\nAu sous sol aménagé : \nChambre double (1 lit 160) donnant sur 2e terrasse","gp":"Quartier calme. \nProximité du golf et de l'hippodrome (10/15min à pieds)\nProximité supermarché et commerces (5min en voiture)\nCentre ville accessible en bus depuis la maison (10 min)","ot":"Nous avons 2 chattes avec lesquelles il faudra cohabiter. Elles sont autonomes pour entrer/sortir de la maison et pour manger (distributeur de croquettes). Il faudra juste veiller à ce qu'elles aient des croquettes et de l'eau. \n\nPrécisions pour l'été : \nNotre maison est disponible 3 semaines entre fin juillet et mi août. \nNous recherchons un échange, réciproque ou non, pour 1 à 2 semaines,  au bord de l'océan, pour faire du surf et pour 8 personnes (4 adultes + 4 ados). \nN'hésitez pas à nous envoyer un message si vous êtes intéressés!"}],"ph":["2577640_0","2577640_1","2577640_2","2577640_3","2577640_4","2577640_5","2577640_6","2577640_7","2577640_8","2577640_9"]},{"v":"V68","n":68,"id":3126323,"t":"La maison de Clément et Coralie","town":"Saint-Michel-De-Chaillol","cc":"France","region":"Champsaur","lat":44.68414511009063,"lon":6.16726449077073,"bd":4,"ba":2,"cap":11,"m2":160,"typ":"House","mn":4,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Chaillol","m":6,"b":6,"km":2,"via":"Rte de Chaillol/D143","q":""},{"n":"Ancelle","m":22,"b":22,"km":16,"via":"D43 and Rte de Lachaup","q":""},{"n":"Orcieres","m":45,"b":45,"km":26,"via":"D944","q":""},{"n":"Superdevoluy","m":60,"b":60,"km":37,"via":"D17T","q":""},{"n":"Risoul","m":100,"b":110,"km":83,"via":"N94","q":"Durance N94"},{"n":"Les 2 Alpes","m":130,"b":150,"km":110,"via":"D526","q":""},{"n":"Alpe d'Huez","m":140,"b":150,"km":106,"via":"D526","q":""}],"near":6,"n30":2,"n60":4,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":false,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"livres et jeux de société, un bureau et un baby-foot bonzini","toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"à proximité des sentiers de randonnée l'été ainsi que du ski l'hiver (1450 m)","notes":"New 2024 house at 1450 m near Chaillol small ski area, comfortable for 8; linen not provided, EUR 150 cleaning; contact_allowed 0.","score":56,"stars":3.0,"gp":209,"rr":88,"gr":5.0,"ex":10,"owner":"Coralie","recip":true,"desc":[{"loc":"tr","title":"Clément and Coralie's house","gf":"Welcome to our house! We are leaving with our 2 children to explore the world for a year, and we hope you will enjoy our large, bright house and the surroundings we live in. We are in Saint Michel de Chaillol at an altitude of 1450 m, close to hiking trails in summer and skiing in winter.\nYou will find the equipment, storage and spaces to be very comfortable for up to 8 people.\nThe house was built in 2024 and has a floor area of 160 m2. Extremely bright, it has a panoramic view of the surrounding mountains. Its main asset is the size of its living areas: the living room, dining room and kitchen are fully open-plan, making a 55 m2 space.\nYou will have a bedroom with a 160 bed and its own adjoining shower room, and upstairs: a bedroom with a 140 bed, a bedroom with a sofa bed and a 160 bed on a mezzanine, an attic bedroom with a 160 bed and TV; this last bedroom has no window directly to the outside but it has an interior glass partition looking onto the mezzanine. Shower room upstairs.\n20 m2 mezzanine upstairs where you will find a relaxation area, shelves with books and board games, a desk and a Bonzini table football, all with an open view over the valley.\nFrom the dining room, a large sliding glass door gives access to a 30 m2 terrace with tables and chairs, garden lounge furniture, parasol and barbecue.\nOn the ground floor of the house is the Spa du Vieux Chaillol, a private wellness area (massages, facials...) which is completely separate from the main living quarters. You get 10% off all spa services.\nHousehold linen is not provided. Duvets and pillows are available. A travel cot for a baby is also available.\nAn end-of-stay cleaning package by an outside company is available at a cost of €150, to be booked when making the reservation.","gp":"Small, very quiet village close to the Écrins park. Skiing possible nearby in winter.","ot":""},{"loc":"fr","title":"La maison de Clément et Coralie","gf":"Bienvenue dans notre maison! Nous partons avec nos 2 enfants explorer le monde pendant une année, nous espérons que vous apprécierez notre grande maison lumineuse ainsi que le cadre de vie que nous avons. Nous sommes situés à Saint Michel de Chaillol à 1450m d 'altitude, à proximité des sentiers de randonnée l'été ainsi que du ski l'hiver,\nVous trouverez donc les équipements, rangements et espaces qui vous permettrons d être très confortable jusqu a 8 personnes. \nLa maison a été construite en 2024, elle est d une superficie de 160m2. Extrêmement lumineuse, vous avez une vue panoramique sur les montagnes environnantes. Son atout majeur est la taille de ses pièces de vie, le salon, salle à manger et cuisine sont entièrement ouvert pour un espace de 55m2. \nVous disposerez d une chambre avec lit 160 avec sa salle de douche atenante et à l étage : une chambre avec lit 140, une chambre avec clic clac et un lit 160 en mezzanine, une chambre mansardée avec lit 160 et TV, cette dernière chambre n a pas de fenêtre directe sur l extérieure mais elle dispose d une verriere donnant sur la mezzanine. Salle de douche à l étage,\nMezzanine de 20m2 à l étage où vous trouverez un espace détente, etagere avec livres et jeux de société,un bureau et un baby-foot bonzini, le tout avec une vue dégagée sur la vallée.\nDepuis la salle à manger vous avez accès via une grande baie vitrée à une terrasse de 30m2 avec tables et chaises, salon de jardin, parasol et barbecue.\nAu rez-de-chaussée de la maison, vous avez le spa du Vieux Chaillol, espace bien être privatif, massages, soins visage... qui est complètement indépendant de l habitation principale. Vous bénéficiez de 10% sur toutes les prestations du spa.\nLe linge de maison n est pas fournis. vous disposez de couettes et oreillers. Un lit parapluie pour bébé est également à disposition.\nPossibilité de forfait ménage fin de séjour par une entreprise extérieure au tarif de 150€. à réserver à la reservation.","gp":"Petit village très calme à proximité du parc des écrins. Possibilité de ski l'hiver à proximité","ot":""}],"ph":["3126323_0","3126323_1","3126323_2","3126323_3","3126323_4","3126323_5","3126323_6","3126323_7","3126323_8","3126323_9","3126323_10","3126323_11","3126323_12","3126323_13","3126323_14","3126323_15","3126323_16","3126323_17","3126323_18","3126323_19","3126323_20","3126323_21","3126323_22","3126323_23","3126323_24","3126323_25","3126323_26","3126323_27","3126323_28","3126323_29","3126323_30","3126323_31","3126323_32","3126323_33","3126323_34","3126323_35","3126323_36","3126323_37","3126323_38","3126323_39","3126323_40"]},{"v":"V69","n":69,"id":3322934,"t":"Le Chalet proche des pistes de Hug & Mag","town":"Villarembert","cc":"France","region":"Maurienne","lat":45.239292978065606,"lon":6.2753996400369365,"bd":6,"ba":4,"cap":15,"m2":160,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":4,"children_bed":2,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Le Corbier/Toussuire","m":30,"b":35,"km":19,"via":"Rte de Fontcouverte/D78 and Rte des Arves/D926","q":""},{"n":"Albiez","m":45,"b":45,"km":25,"via":"D110","q":""},{"n":"Saint-Sorlin","m":45,"b":50,"km":28,"via":"D926","q":""},{"n":"Saint-Francois-Longchamp","m":60,"b":65,"km":40,"via":"D213","q":""},{"n":"Valloire","m":70,"b":80,"km":45,"via":"D902","q":"Morzine D902"},{"n":"Aillons-Margeriaz","m":100,"b":110,"km":101,"via":"A43","q":"Maurienne A43"},{"n":"Le Collet d'Allevard","m":100,"b":100,"km":89,"via":"A43","q":"Maurienne A43"},{"n":"La Feclaz (Grand Revard)","m":100,"b":120,"km":105,"via":"A43","q":"Maurienne A43"}],"near":30,"n30":1,"n60":4,"fac":{"fireplace":false,"sauna":false,"toysIn":false,"toysOut":false,"garden":true,"bigGarden":false,"spa":true},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"Le Corbier, station 100 % skis aux pieds; à 200 m du télésiège de la Voie Lactée (Les Sybelles)","notes":"Le Corbier chalet 200 m from lift into Les Sybelles, 6 bed/4 bath sleeps 15 - strong fit; brand-new owner, 0 exchanges, contact_allowed=0.","score":55,"stars":3.0,"gp":276,"rr":100,"gr":0.0,"ex":0,"owner":"Hugues","recip":true,"desc":[{"loc":"tr","title":"Hug & Mag's chalet near the slopes","gf":"Welcome to our Chalet!","gp":"Our chalet is in Le Corbier, a 100% ski-in/ski-out pedestrian resort at 1,550 m altitude, with the Famille Plus label, in the heart of the Maurienne valley. Everything is within reach: shops and services, a covered shopping arcade linking the top and bottom of the resort, sunny terraces, a heated outdoor pool and a wellness area. From the terrace, the view takes in the Aiguilles d'Arves and the great Alpine massifs (Ecrins, Vanoise, Belledonne, Lauzière).\nIn winter, you are 200 m from the Voie Lactée chairlift, the gateway to the Sybelles ski area (the 4th largest ski area in France, linked to La Toussuire). Snowshoeing, snowmobiling, sledging, the Grande Odyssée… there is never a shortage of things going on.\nIn summer, the mountain becomes a playground: 6 trail-running routes, a mountain-bike track and freeride zone at Le Corbier, hikes for all levels (from family walks to more demanding summits), off-season snowshoe outings, and a programme of activities and festive events. Nearby, La Toussuire also offers its famous Rallye Gourmand (a Savoyard gourmet walk), the 4h de La Toussuire (mountain-bike/sport challenge), the circus and street-arts festival Le Spectacle est dans la rue, not to mention its restaurants, bars and wellness areas for recharging.\nAnd the region has some wonderful discoveries in store: the villages of the Maurienne, the legendary Tour de France passes (Galibier, Télégraphe), the lake and town of Saint-Jean-de-Maurienne 30 min away, and even organised excursions to Turin (2h30). Lyon is 2h30 away, Grenoble 1h30 and Geneva 2h10.\nPeople come here for the fresh air, the sunshine and the smiles of the Savoyards — you are going to love it!","ot":"See you very soon in our mountains, with family or friends."},{"loc":"fr","title":"Le Chalet proche des pistes de Hug & Mag","gf":"Bienvenue dans notre Chalet !","gp":"Notre chalet se trouve au Corbier, une station piétonne 100 % skis aux pieds à 1 550 m d'altitude, labellisée Famille Plus, au cœur de la vallée de la Maurienne. Tout est à portée de main : commerces et services, galerie marchande couverte qui relie le haut au bas de la station, terrasses ensoleillées, piscine extérieure chauffée et espace bien-être. Depuis la terrasse, la vue porte sur les aiguilles d'Arves et les grands massifs alpins (Ecrins, Vanoise, Belledonne, Lauzière).\nEn hiver, vous êtes à 200 m du télésiège de la Voie Lactée, porte d'entrée du domaine des Sybelles (4ᵉ plus grand domaine skiable de France, relié à La Toussuire). Raquettes, motoneige, luge, Grande Odyssée… l'animation ne manque jamais.\nEn été, la montagne se transforme en terrain de jeu : 6 parcours de trail, piste de VTT et zone freeride au Corbier, randonnées pour tous les niveaux (des balades familiales aux sommets plus engagés), sorties raquettes hors saison, et un programme d'animations et d'événements festifs. À proximité, La Toussuire propose aussi son fameux Rallye Gourmand (randonnée gourmande savoyarde), les 4h de La Toussuire (défi VTT/sport), le festival de cirque et arts de rue Le Spectacle est dans la rue, sans oublier ses restaurants, bars et espaces bien-être pour se ressourcer.\nEt la région réserve de belles découvertes : les villages de Maurienne, les cols mythiques du Tour de France (Galibier, Télégraphe), le lac et la ville de Saint-Jean-de-Maurienne à 30 min, et même des excursions organisées à Turin (2h30). Lyon est à 2h30, Grenoble à 1h30 et Genève à 2h10.\nIci, on vient pour le grand air, le soleil et le sourire des Savoyards — vous allez adorer !","ot":"A très vite dans nos montagnes en famille ou entre amis."}],"ph":["3322934_0","3322934_1","3322934_2","3322934_3","3322934_4","3322934_5","3322934_6","3322934_7","3322934_8","3322934_9","3322934_10","3322934_11"]},{"v":"V70","n":70,"id":2659004,"t":"Valérie's house","town":"Saint-Pierre-D'allevard","cc":"France","region":"Belledonne","lat":45.36994837485825,"lon":6.034575544522957,"bd":4,"ba":2,"cap":10,"m2":140,"typ":"House","mn":4,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Le Collet d'Allevard","m":22,"b":22,"km":13,"via":"D525 and D525A","q":""},{"n":"Les 7 Laux","m":30,"b":35,"km":23,"via":"D525","q":""},{"n":"Le Sappey","m":50,"b":60,"km":41,"via":"A41","q":""},{"n":"Aillons-Margeriaz","m":60,"b":65,"km":52,"via":"A41","q":""},{"n":"La Feclaz (Grand Revard)","m":60,"b":70,"km":56,"via":"A41","q":""},{"n":"Chamrousse","m":65,"b":75,"km":58,"via":"A41 and D111","q":""},{"n":"St-Pierre-de-Chartreuse","m":65,"b":75,"km":54,"via":"A41 and D512","q":""},{"n":"Le Corbier/Toussuire","m":80,"b":100,"km":98,"via":"A43","q":"Maurienne A43"}],"near":22,"n30":2,"n60":5,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":nu rd, Goncelin, Le Touvet and Pontcharra 10-20 minutes away) and cities (Grenoble and Chambéry 30 minutes away, Annecy and Lyon 1h30 away...). \nBakery and supermarket 5 minutes away.\nBus stop 5 minutes walk away which allows you to reach Goncelin train station in 10 minutes or to reach Grenoble in 35-40 minutes.\n\n￼","ot":"Nous souhaitons retrouver la maison telle que nous la laissons (ménage fait dans son ensemble - selon le principe d'échange de maisons), mais si cela est impossible, nous demandons un forfait de 80 euros.\n4 nuits minimum."},{"loc":"en","title":null,"gf":"Our house is located in a peaceful location with mountain views. Close to small mountain resorts, 30 minutes from the capital of the Alps, Grenoble, and close to Chambéry.","gp":"The neighborhood is very peaceful. You can alternate between outdoor activities (mountain hikes, mountain biking, paragliding, Collet d'Allevard and 7 Laux ski resorts...), visits to small towns (Allevard, Goncelin, Le Touvet and Pontcharra at 10- 20 minutes) and cities (Grenoble and Chambéry 30 minutes, Annecy and Lyon 1h30...). \nBakery and supermarket 5 minutes away. \nBus stop 10 minutes walk away which allows you to reach Goncelin station in 10 minutes (the bus goes to Grenoble).","ot":null}],"ph":["2659004_0","2659004_1","2659004_2","2659004_3","2659004_4","2659004_5","2659004_6","2659004_7","2659004_8","2659004_9","2659004_10","2659004_11","2659004_12","2659004_13","2659004_14","2659004_15","2659004_16","2659004_17","2659004_18","2659004_19","2659004_20","2659004_21","2659004_22","2659004_23","2659004_24","2659004_25","2659004_26","2659004_27","2659004_28","2659004_29","2659004_30","2659004_31","2659004_32","2659004_33","2659004_34","2659004_35","2659004_36","2659004_37","2659004_38","2659004_39","2659004_40","2659004_41"]},{"v":"V71","n":71,"id":253286,"t":"Le Bidwalin, chalet de Nadine et Alain","town":"Biot","cc":"France","region":"Portes du Soleil","lat":46.265303046667285,"lon":6.631690815449315,"bd":4,"ba":  2019, the living room in October 2019. We have equipment for babies (travel cot, all-terrain pushchair, high chair). We hope to welcome you there soon.","gp":"Our chalet is in the heart of a mid-mountain massif that is home to the big ski resorts of the Portes du Soleil: Morzine-Avoriaz, Les Gets and the Swiss resorts. In summer there are many activities: hiking, mountain biking, lake swimming, paragliding, treetop adventure courses, climbing, etc. Beautiful towns such as Evian les Bains, Yvoire, Annecy or Switzerland are nearby.\nWe provide plenty of folders to help you put together a cultural, gastronomic or sports programme.\nIn winter, a boiler room will dry your ski boots and clothes.\nOur children who live in the area will welcome you and can even drop off your shopping if you have taken the time to arrange a click-and-collect order.","ot":"We are willing to exchange our little house in Normandy, particularly with Paris for weekends; this is more difficult for short periods with the chalet.\nWe always reply to every request."},{"loc":"fr","title":"Le Bidwalin, chalet de Nadine et Alain","gf":"Le calme et l'environnement sauront vous séduire, le chalet est situé dans un chemin en impasse, les enfants peuvent jouer  dans le jardin en toute sécurité. La grande terrasse vous permettra de jouir de la vue sur les montagnes et de prendre vos repas ou de vous reposer au soleil. Nous avons décoré notre chalet avec tout notre cœur et nos hôtes s'y sentent toujours très bien. Il est confortable et fonctionnel, la cuisine a été entièrement refaite en juillet 2019, le séjour en octobre 2019. Nous disposons de matériel pour les bébés (lit parapluie, poussette tout terrain, chaise haute) Nous espérons vous y accueillir bientôt.","gp":"Notre chalet est au coeur d'un massif de moyenne montagne où se trouvent les grandes stations de ski des Portes du Soleil : Morzine-Avoriaz, les Gets et les stations suisses. L'été il y a de multiples activités à pratiquer : randonnées pédestr ifs (Belledonne, Bauges, Chartreuse), offers a generous living space with a garden with trees, a swing and a pool, ideal for family holidays.\nIt is in a small country village, 3 minutes by car from a small supermarket. The town of Chambéry is 15 minutes by car or 9 minutes by train. (Station 4 minutes by car)\nGeneva airport is an hour away by car or bus, and so is Saint Exupéry (Lyon).\nWe can leave a car at your disposal and possibly at Geneva airport in some cases. (to be discussed)\n\nNearby: Lac Saint André and the Montmélian municipal pool (in summer) for swimming, golf, ski resorts less than an hour's drive away, the Col du Granier 20 minutes away and hikes starting nearby, tennis courts in the village....","ot":"We look forward to welcoming you to our home, and hope you will be delighted with your stay in Savoie."},{"loc":"fr","title":"Au pied des montagnes !","gf":"Cette villa, ancien séchoir à tabac transformé en habitation en 2000, offre tout le confort et le charme du bois et de la pierre.\r\nRépartis sur 3 niveaux de 60 mètres carrés chacun, vous trouverez une cuisine ouverte sur le salon et la salle à manger au rez de chaussée.\r\nVous accéderez aux chambres et salles de bains situés aux étages supérieurs grâce à deux escaliers en bois.\r\nUne toute nouvelle terrasse en bois  avec pergola donnant sur le jardin vous permet de profiter de l'environnement. \nNous avons également 3 poules qui font de bons oeufs en échange de restes, de grains et d'eau... \n( le chat en photo ne sera pas présent dans la maison.)\nUne piscine hors sol l'été est agréable pour se rafraîchir et fera la joie des petits comme des grands !","gp":"Cette villa, au croisement de 3 vallées entre Albertville, Grenoble et Chambéry, au pied des divers massifs montagneux savoyards (Belledonne, Bauges, Chartreuse), offre une belle surface habitable agrémentée d'un jardin arboré, avec balançoire et piscine, idéale pour des vacances en famille.\nElle est située dans un petit village à la ca he river that crosses the department from the Argentière glaciers to Geneva. It is a spacious house and we have redone its interior to make it cosy, and we have decorated it with souvenirs from our travels. We wanted a large, very bright living area with the kitchen, the living room where you can watch TV or play video games, and the dining room for family meals. There is our bedroom, which looks out over our garden, with a bathroom next to it. Upstairs are our 2 children's bedrooms and the study with the computer and the bookshelves, which also serves as a music room since we have a drum kit and a few guitars. There is a second bathroom, with a bathtub with a view of the mountains. We think it is ideal for 6 people. In the garage there is the laundry room, and we have set up a room with the sauna and some sports equipment. You can enjoy the view in the garden while having barbecues or playing ping pong, Mölkky or darts. There is a carport to park 2 cars.\nSince summer 2021 our family has grown, as Obao, a sweet cat, decided to move in with us. She has a basket and her bowl in the garage, but she really likes being inside the house when we are there! If you come to the house, you will surely meet her and you will need to take care of her!\n\nOur house is in the heart of Haute-Savoie and overlooks the Arve valley, a river that crosses the department from the Argentière glaciers to Geneva. It is a spacious house, and we have renovated its interior to make it cozy, decorating it with our travel memories. We wanted a large, bright living area with the kitchen, the living room where you can watch TV or play video games, and the dining room for family meals. There is our bedroom, which has a view of our garden, with a bathroom next to it. Upstairs, there are our two children's bedrooms and the office with the computer and the bookshelf, which also serves as a music room as we have a drum set and a few guitars. There is a second bathroom with a bathtub overlooking the mountains. We think it is ideal for 6 people. In the garage, there is the laundry room, and we have arranged a room with a sauna and some equipment for doing sports. You can enjoy the view in the garden while having barbecues or playing ping pong, Mölkky, or darts. There is a shelter where you can park 2 cars. Since the summer of 2021, our family has grown because Obao, a friendly cat, decided to settle with us. She has a basket and her bowl in the garage, but she really likes being inside the house when we are there! If you come to the house, you will surely meet her, and you will need to take care of her!\n\nOur house is in the heart of Haute-Savoie and overlooks the Arve valley, a river that crosses the department from the Argentière glaciers to Geneva. It is a spacious house and we have renovated its interior to make it cosy and have decorated it with our travel souvenirs. We wanted a large, very bright living area with the kitchen, the living room where you can watch TV or play video games, and the dining room for family meals. There is our bedroom, which has a view of our garden, with a bathroom next to it. Upstairs are our 2 children's bedrooms and the study with the computer and the bookshelves, which also serves as a room for making music since we have a drum kit and some guitars. There is a second bathroom, with a bathtub with a view of the mountains. In the garage there is the laundry room, and we have set up a room with the sauna and some sports equipment. You can enjoy the view in the garden while having barbecues or playing ping pong, Mölkky or darts. There is a shed where you can park 2 cars.\nSince summer 2021 our family has grown, since Obao, a friendly cat, decided to come and live with us. She has a basket and her bowl in the garage, but she really likes being inside the house when we are there! If you come to the house you will surely meet her and you will have to take care of her!","gp":"Quiet neighbourhood, on a dead-end lane; we are surrounded by houses, fields and cows. You can park the car under the carport or in the garden.\nChildren can play safely in the garden, but there is no fence around the house. The lane that runs past the house is used only by the neighbours on the dead end.\nHiking trails start from the house and you are very quickly in the woods.\nWe are 5 minutes by car from the small town centre of Marnaz, where you can find many small shops such as a bakery, a butcher's, a pharmacy and a small grocery store, and we are 10 minutes from a shopping area and the town of Cluses.\n\nQuiet neighborhood, on a dead-end street, we are surrounded by houses, fields, and cows. There is the possibility to park the car under the shelter or in the garden. Children can play safely in the garden, but there is no fence around the house. The road in front of the house is used only by neighbors on the dead-end street. There are hiking trails starting from the house, and you can quickly reach the woods. We are 5 minutes by car from the small town center of Marnaz, where you can find many small shops such as a bakery, a butcher, a pharmacy, and a small grocery store, and we are 10 minutes from a shopping area and the town of Cluses.","ot":"In our region you can go skiing and snowshoeing in winter, and in summer you can go cycling, enjoy the many lakes, go hiking and do all kinds of mountain sports!\nWe are also a few minutes from the main roads leading to Geneva (30 min), Annecy (45 min), Chamonix Mont Blanc (30 min) and Italy.\nWe are close to the ski resorts. The family resort of Mont Saxonnex is 15 min away, the Grand Massif 30 min. We are 40 minutes from Le Grand-Bornand or Les Gets, and 1 hour from La Clusaz.\nFinally, you can discover our local food and our famous cheeses – you are in for a treat!\n\nIn our region, you can go skiing and snowshoeing in the winter, and in the summer, you can go cycling, enjoy the many lakes, go hiking, and partake in all mountain-related sports!  \nWe are also just a few minutes from the main roads leading to Geneva (30 min), Annecy (45 min), Chamonix Mont Blanc (30 min), and Italy.  \nWe are close to ski resorts. The family-friendly Mont Saxonnex resort is 15 minutes away, while the Grand Massif resort is 30 minutes away. We are 40 minutes from Le Grand-Bornand or Les Gets, and 1 hour from La Clusaz.  \nFinally, you can discover our gastronomy and our famous cheeses—you are in for a treat!"},{"loc":"fr","title":"La maison de Cyril et Cécile","gf":"Notre maison est au coeur de la Haute-Savoie et donne sur la vallée de l ‘Arve, rivière qui traverse le département des glaciers d'Argentière jusqu'à Genêve. C'est une maison spacieuse et nous avons refait son intérieur pour qu'elle soit cosy et nous l'avons décorée avec nos souvenirs de voyages. Nous avons voulu une grande pièce de vie très lumineuse avec la cuisine, le salon dans lequel vous pourrez regarder la télévision ou jouer aux jeux vidéo et la salle à manger pour les repas en familles. Il y a notre chambre qui a une vue sur notre jardin avec une salle de bain à côté. À l'étage, il y a les 2 chambres de nos enfants et le bureau avec l'ordinateur et la bibliothèque, qui sert aussi de pièce pour faire de la musique puisque nous avons une batterie et quelques guitares. Il y a une deuxième salle de bain, avec une baignoire avec vue sur les montagnes. Nous pensons qu’elle est idéale pour 6 personnes. Au garage, il y a la buanderie et nous avons aménagé, une pièce avec le sauna et quelques ustensiles pour faire du sport. Vous pourrez profiter de la vue dans le jardin en faisant des barbecues ou en jouant au ping pong, au molky ou aux fléchettes. Il y a un abri pour pouvoir garer 2 voitures. \nDepuis l'été 2021, notre famille s'est agrandie puisqu'Obao, une gentille chatte, a décidé de s'installer chez nous. Elle a un panier et sa gamelle au garage mais elle aime beaucoup être à l'intérieur de la maison lorsque nous sommes là ! Si vous venez à la maison, vous allez surement la rencontrer et il faudra prendre soin d'elle !\n\nOur house is in the heart of Haute-Savoie and overlooks the Arve valley, a river that crosses the department from the Argentière glaciers to Geneva. It is a spacious house, and we have renovated its interior to make it cozy, decorating it with our travel memories. We wanted a large, bright living area with the kitchen, the living room where you can watch TV or play video games, and the dining room for family meals. There is our bedroom, which has a view of our garden, with a bathroom next to it. Upstairs, there are our two children's bedrooms and the office with the computer and the bookshelf, which also serves as a music room as we have a drum set and a few guitars. There is a second bathroom with a bathtub overlooking the mountains. We think it is ideal for 6 people. In the garage, there is the laundry room, and we have arranged a room with a sauna and some equipment for doing sports. You can enjoy the view in the garden while having barbecues or playing ping pong, Mölkky, or darts. There is a shelter where you can park 2 cars. Since the summer of 2021, our family has grown because Obao, a friendly cat, decided to settle with us. She has a basket and her bowl in the garage, but she really likes being inside the house when we are there! If you come to the house, you will surely meet her, and you will need to take care of her!\n\nNuestra casa está en el corazón de la Alta Saboya y domina el valle del Arve, un río que cruza el departamento de los glaciares desde Argentière hasta Ginebra. Es una casa espaciosa y hemos reformado su interior para que sea acogedora y la hemos decorado con nuestros souvenirs de viaje. Queríamos un salón grande y muy luminoso con la cocina, el salón en el que poder ver la televisión o jugar a videojuegos y el comedor para las comidas en familia. Hay nuestro dormitorio que tiene una vista de nuestro jardín con un baño al lado. Arriba, están los 2 dormitorios de nuestros hijos y la oficina con la computadora y la biblioteca, que también sirve como sala para hacer música ya que tenemos una batería y algunas guitarras. Hay un segundo baño, con bañera con vista a las montañas. En el garaje está el lavadero y hemos habilitado una habitación con la sauna y algunos utensilios para hacer deporte. Puede disfrutar de la vista en el jardín mientras hace barbacoas o juega al ping-pong, al molky oa los dardos. Hay un cobertizo para poder aparcar 2 coches.\nDesde el verano de 2021, nuestra familia ha crecido desde que Obao, un simpático gato, decidió mudarse a vivir con nosotros. Ella tiene una canasta y su tazón en el garaje, ¡pero realmente le gusta estar dentro de la casa cuando estamos allí! ¡Si vienes a la casa seguro que te la encuentras y tendrás que cuidarla!","gp":"Quartier calme, dans une impasse, nous sommes entourés de maisons, de champs et de vaches. Il y a possibilité de garer la voiture sous l'abri ou dans le jardin. \nLes enfants peuvent jouer dans le jardin en toute sécurité mais il n'y a pas de clôture autour de la maison.  Le chemin qui passe devant la maison est utilisé uniquement par les voisins de l'impasse.\nDe la maison partent des chemins de randonnées et on est très rapidement dans les bois.\nNous sommes à 5 minutes en voiture du petit centre ville de Marnaz oú l'on peut trouver de nombreux petits commerces comme une boulangerie, une boucherie, une pharmacie et une petite épicerie et nous sommes à 10 minutes d’une zone commerciale et de la ville de Cluses. \n\nQuiet neighborhood, on a dead-end street, we are surrounded by houses, fields, and cows. There is the possibility to park the car under the shelter or in the garden. Children can play safely in the garden, but there is no fence around the house. The road in front of the house is used only by neighbors on the dead-end street. There are hiking trails starting from the house, and you can quickly reach the woods. We are 5 minutes by car from the small town center of Marnaz, where you can find many small shops such as a bakery, a butcher, a pharmacy, and a small grocery store, and we are 10 minutes from a shopping area and the town of Cluses.","ot":"Dans notre région, nous pourrez faire du ski et des raquettes en hiver et en été, vous pourrez faire du vélo, profiter des nombreux lacs, faire de la randonnée et tous les sports en lien avec la montagne !\nNous sommes aussi à quelques minutes des routes principales qui mènent à Genève (30min), Annecy (45min), Chamonix Mont Blanc (30min) et de l'Italie.\nNous sommes proches des stations de ski. La station familiale du Mont Saxonnex est à 15 min, celle du Grand Massif est  à 30 min. Nous sommes à 40 minutes du Grand-Bornand ou des Gets, et à 1h de la Clusaz. \nVous pourrez enfin, découvrir notre gastronomie et nos fameux fromages, vous allez vous régalez !\n\nIn our region, you can go skiing and snowshoeing in the winter, and in the summer, you can go cycling, enjoy the many lakes, go hiking, and partake in all mountain-related sports!  \nWe are also just a few minutes from the main roads leading to Geneva (30 min), Annecy (45 min), Chamonix Mont Blanc (30 min), and Italy.  \nWe are close to ski resorts. The family-friendly Mont Saxonnex resort is 15 minutes away, while the Grand Massif resort is 30 minutes away. We are 40 minutes from Le Grand-Bornand or Les Gets, and 1 hour from La Clusaz.  \nFinally, you can discover our gastronomy and our famous cheeses—you are in for a treat!"}],"ph":["1784717_0","1784717_1","1784717_2","1784717_3","1784717_4","1784717_5","1784717_6","1784717_7","1784717_8","1784717_9","1784717_10","1784717_11","1784717_12","1784717_13","1784717_14","1784717_15","1784717_16","1784717_17","1784717_18","1784717_19","1784717_20","1784717_21","1784717_22","1784717_23","1784717_24","1784717_25","1784717_26","1784717_27","1784717_28","1784717_29","1784717_30","1784717_31"]},{"v":"V78","n":78,"id":3132660,"t":"dana's house","town":"Venon","cc":"France","region":"Belledonne","lat":45.173514197195885,"lon":5 n","gf":"Sur les contreforts de Belledonne,\nDevant une vue imprenable sur le macif du Vercors,\nUne maison dans un village convivial.","gp":"Le p’tit bistro, super cuisine,  tenu par une bande sympathique, avec concert/spectacle toutes les 2 semaines.\nBoulangerie très bonne le dimanche matin.\nAMAP le mercredi soir.\nRandos et balades au départ de la maison, lacs de montagne dans les environs (20 min de voiture et 1h30 de marche).\nStation de ski Chamrousse à 25 min de voiture.\nBalnéo à Uriage, 15 min en voiture.\nBalcons de Belledonne à vélo.","ot":""}],"ph":["3132660_0","3132660_1","3132660_2","3132660_3","3132660_4","3132660_5","3132660_6","3132660_7","3132660_8","3132660_9","3132660_10"]},{"v":"V79","n":79,"id":2709645,"t":"Bienvenue chez nous ! Notre nid douillet en Alsace….","town":"Leimbach","cc":"France","region":"Vosges","lat":47.79477027386738,"lon":7.10212833103014,"bd":4,"ba":2,"cap":10,"m2":160,"typ":"House","mn":3,"beds":{"big_double_bed":1,"double_bed":2,"single_bed":1,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Le Markstein","m":50,"b":55,"km":31,"via":"D13B6/D13BVI and D431G","q":""},{"n":"Ballon d'Alsace","m":55,"b":55,"km":36,"via":"D466","q":""},{"n":"La Bresse","m":55,"b":60,"km":40,"via":"N66 and D13B","q":""},{"n":"Gerardmer","m":75,"b":80,"km":53,"via":"D13B","q":""}],"near":50,"n30":0,"n60":3,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":"L'hiver nous aimons nous réchauffer autour de la cheminée","sauna":null,"toys_inside":"jeux et jouets (kaplas, poupées, schleich, playmobil); jeux de société","toys_outside":"vélos, des luges, ainsi que des jeux d'extérieur (Tir à l'arc, badminton, mölky)","large_garden":"un grand jardin ... entièrement arboré","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"stations de ski ... se situent à 30 minutes en voiture (Vosges)","notes":"Alsace semi-detached house with fireplace, toys and sledges, Vosges ski 30 min; sleeps 10, cat, €100 cleaning Dec 2026-Jul 2027.","score":53,"stars":2.5,"gp":190,"rr":100,"gr":5.0,"ex":5,"owner":"Elodie et Thomas","recip":true,"desc":[{"loc":"tr","title":"Welcome to our home! Our cosy nest in Alsace….","gf":"Our semi-detached house is in a quiet cul-de-sac. We have a large garden that we have planted entirely with trees to make it an idyllic spot, a truly peaceful corner at the back of the house. In season you will find figs, cherries, raspberries, blackberries, redcurrants and grapes.\nYou can have lunch under the pergola or have a barbecue there.\nWe live on the first floor of the house; the ground floor houses the garage, a bathroom and a guest bedroom.\nOn our living floor, the shared space (living room, dining room, kitchen) is completely open. It's a warm space and we love spending time there playing (the house is full of board games), listening to music and watching films.\nOur house has three bedrooms, each with a double bed; in summer we put mosquito screens on the windows for extra peace.\nThis floor also has a bathroom and a separate toilet.\nChildren will find games and toys (Kapla, dolls, Schleich, Playmobil….)\nWe love our little terrace off the kitchen, where we have set up a cosy corner.\nIn winter we like to warm up around the fireplace. In summer, the thick walls of the house keep us cool.","gp":"We live in a small village that happens to be the first on the Alsace Wine Route.\nMany hikes are accessible on foot from the house, which is less than 5 minutes from the forest.\nThe village is also close to cycle paths (Thur and Doller valleys)\nAlthough very quiet, the village is not isolated: it is less than 15 minutes by car from Cernay, which has leisure facilities (laser game, karting, cinema, shopping centre, artificial wave, trampoline park)\nWe are 5 minutes by car or bike from the Thann swimming pool.\nMany tourist attractions (open-air museum, many amusement parks, Colmar, Mulhouse, the Wine Route, ski resorts, typical Alsatian villages, treetop adventure courses, zip lines, swimming lakes….) are within 30 minutes by car.\nThe Swiss and German borders, as well as Europa-Park (best amusement park in the world), are also less than an hour away by car.\nWe are 35 minutes from EuroAirport Basel Mulhouse.\nThe place is ideal for great times with family or friends, but also for resting and recharging in the middle of nature.","ot":"During your stay, you will get to know our discreet cat, Morphine.\nWe provide bikes, sledges and outdoor games (archery, badminton, mölkky, etc…)\nOn request, we can set up a high chair and an extra cot for a baby.\nOf course, to get your Alsatian stay off to a good start, on arrival you will find a local culinary speciality or a good bottle of Alsace wine as a welcome gift.\nSmokers are welcome but please smoke outside.\n\nFROM DECEMBER 2026 TO JULY 2027: We will ask for a contribution of 100 euros for cleaning, as we will not be able to do it ourselves."},{"loc":"fr","title":"Bienvenue chez nous ! Notre nid douillet en Alsace….","gf":"Notre maison mitoyenne se situe au calme dans une impasse. Nous disposons d’un grand jardin que nous avons entièrement arboré pour en faire un endroit bucolique, un véritable coin tranquille à l’arrière de la maison. Vous y trouverez en saison des figues, des cerises, des framboises, des mûres, des groseilles et du raisin.\nVous pourrez déjeuner sous la pergola ou y faire un barbecue.\nNous vivons au premier étage de la maison, le rez de chaussée abrite le garage, une salle de bain et une chambre d’amis.\nSur notre étage de vie, l’espace commun (salon, salle à manger,cuisine)est entièrement ouvert. C’est un espace chaleureux et nous adorons y passer du temps pour jouer (la maison regorge de jeux de société), écouter de la musique, regarder des films.\nNotre maison abrite trois chambres équipées chacune d’un lit double, en été nous installons des moustiquaires aux fenêtres pour plus de tranquillité. \nL’étage se dote également d’une salle de bain, et des toilettes séparés. \nLes enfants pourront trouver des jeux et jouets (kaplas, poupées, schleich, playmobil….) \nNous adorons notre petite terrasse qui donne sur la cuisine et sur laquelle nous avons aménagé un coin cosy. \nL’hiver nous aimons nous réchauffer autour de la cheminée. L’été, les épais murs de la maison nous gardent au frais.","gp":"Nous vivons dans un petit village qui se trouve être le premier de la route des vins d’Alsace. \nDe nombreuses randonnées sont accessibles à pied depuis la maison qui se trouve à moins de 5 minutes de la forêt. \nLe village est aussi à proximité de voies cyclables (vallée de la thur et de la doller) \nLe village bien que très calme n’est pas isolé pour autant, il est à moins de 15 minutes en voiture de Cernay qui possède des infrastructures de loisirs (laser game, karting, cinéma, centre commercial, vague artificielle, trampoline parc) \nNous sommes à 5 minutes en voiture ou vélo de la piscine de Thann. \nDe nombreuses activités touristiques (écomusée, nombreux parcs d’attractions, Colmar, Mulhouse, route des vins, stations de ski, village alsacien typique, accrobranche, tyroliennes, lacs de baignade….) se situent à 30 minutes en voiture. \nLes frontières suisse et allemande, ainsi que l’Europapark (meilleur parc d’attractions du monde) sont également à moins d’une heure en voiture. \nNous sommes à 35 minutes de l’euroairport Bâle Mulhouse. \nL’endroit est idéal pour passer de super moments en famille ou entre amis, mais également pour se reposer et se ressourcer en pleine nature.","ot":"Durant votre séjour, vous ferez connaissance avec notre discret chat, Morphine. \nNous mettons à disposition des vélos, des luges, ainsi que des jeux d’extérieur. (Tir à l’arc, badminton, mölky etc…)\nSur demande, nous pourrons installer une chaise haute et un lit d’appoint pour bébé. \nBien sûr afin de bien débuter votre séjour alsacien, vous trouverez à votre arrivée, une spécialité culinaire locale ou une bonne bouteille de vin d'alsace en cadeau de bienvenue.\nLes fumeurs sont bienvenus mais merci de fumer à l’extérieur.\n\nDE DÉCEMBRE 2026 à JULLET 2027 : Nous demanderons un participation de 100 euros pour le ménage car nous ne serons pas en mesure de le faire par nos soins."}],"ph":["2709645_0","2709645_1","2709645_2","2709645_3","2709645_4","2709645_5","2709645_6","2709645_7","2709645_8","2709645_9","2709645_10","2709645_11","2709645_12","2709645_13","2709645_14","2709645_15","2709645_16","2709645_17","2709645_18","2709645_19","2709645_20","2709645_21","2709645_22","2709645_23","2709645_24","2709645_25","2709645_26","2709645_27","2709645_28","2709645_29","2709645_30"]},{"v":"V80","n":80,"id":3045588,"t":"Maison familiale splendide vue montagne - La maison des hirondelles","town":"Fillinges","cc":"France","region":"Haut-Giffre","lat":46.16765863642337,"lon":6.362811105256459,"bd":4,"ba":2,"cap":10,"m2":150,"typ":"House","mn":2,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":2,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":2},"res":[{"n":"Le Grand-Bornand","m":50,"b":60,"km":39,"via":"Tour du Bargy","q":""},{"n":"Les Carroz","m":50,"b":60,"km":47,"via":"A40","q":""},{"n":"Les Gets","m":50,"b":55,"km":36,"via":"D907 and D902","q":"Morzine D902"},{"n":"Praz de Lys-Sommand","m":50,"b":60,"km":39,"via":"D907","q":""},{"n":"Samoens","m":50,"b":55,"km":37,"via":"D907","q":""},{"n":"Combloux","m":55,"b":70,"km":56,"via":"A40","q":""},{"n":"La Clusaz","m":55,"b":65,"km":41,"via":"Tour du Bargy","q":""},{"n":"Les Houches","m":55,"b":70,"km":67,"via":"A40","q":""}],"near":50,"n30":0,"n60":10,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":"Thermomix, barbecue, jeux enfants, ... cheminée","sauna":null,"toys_inside":"jeux enfants, petite ludothèque d'une cinquantaine de jeux de société","toys_outside":null,"large_garden":"un grand jardin plat","winter_restriction":null,"access_issue":null},"av":["f27"],"q":["Morzine D902"],"ski":"Premières stations à 25mn (Praz-de-Lys, Hirmentaz); Les Gets, Grand-Bornand, La Clusaz à 40mn","notes":"Family house in Fillinges, 4 bed/2 bath sleeps 10, fireplace + 50 board games; small resorts 25 min, majors 40 min.","score":53,"stars":2.5,"gp":265,"rr":100,"gr":5.0,"ex":2,"owner":"Carole","recip":false,"desc":[{"loc":"tr","title":"Family house with splendid mountain views - The swallows' house","gf":"Pleasant 150m2 family house with a large flat garden and two large terraces from which you will enjoy a breathtaking view of the mountains. The south-facing aspect lets you enjoy the sun from morning to evening, with the trees offering shade in summer when needed. A bright, modern house, well equipped for pleasant times in summer and winter alike (Thermomix, barbecue, children's games, a small library of around fifty board games, fireplace...). A piano and a drum kit are available, provided they are used in a respectful, musical way.\nOn the ground floor you will find a large living room, a separate kitchen, a bedroom and a bathroom; upstairs there are 3 bedrooms, a bathroom and two mezzanine areas, one of which is dedicated to work (desk, computer, bookcase).","gp":"At the house you can enjoy surroundings that lend themselves to relaxation, lazing in the garden or walks nearby, in a rural or woodland setting or with mountain views (Vallée Verte, Meulières du Vouan, Forêt des Voirons). You can also head out for half a day or a day to a variety of places: the Mont-Blanc, Giffre, Aravis, Bornes and Chablais massifs, the town and Lake of Annecy, Lake Geneva, Geneva, Lausanne...\n\nIDEALLY located, the house is in calm, bucolic surroundings while remaining 5 min from the motorway, which serves:\n- Chamonix (1h)\n- Annecy (40 min)\n- Geneva (25 min)\n- Yvoire and the beaches of Lake Geneva (35 min)\n- Thonon (40 min)\n- Cirque de Sixt-Fer-à-Cheval (exceptional site rated 3 stars in the Michelin guide) (50 min)\n- Nearest ski resorts 25 min away (Sommand-Praz-de-Lys, Hirmentaz-Les Habères); Les Gets, Grand-Bornand, La Clusaz, Les Houches, Espace Diamant and Grand Massif are 40 min away.\n\nFinally, you will have all amenities nearby:\n- bakeries, the pharmacy and an organic vegetable grower are within walking distance;\n- a bus network is within walking distance;\n- there are plenty of shops and local producers less than 10 min away by car;\n- the nearest hospital is about 10 min away (but we don't hear it).\n\nFollowing requests from some of you, I have added some personal photos of places where we like to go walking at the end of the listing, so you can get an idea of what is possible around the house.","ot":"Among ourselves, we jokingly call ourselves the swallows' house. Like them, we love to travel… and then come back to our cosy nest… They also seem to like our neighbourhood: from the terrace or the living room, we love watching their aerial ballets from April to October, as they have made use of the neighbours' eaves to settle there for good.\n\nWe are new to HomeExchange but have already done exchanges in this spirit informally. This convinced us to expand the experience. We look forward to welcoming you and to new human adventures. Don't hesitate to contact us if you have any questions; we will be delighted to answer them and to welcome you! See you soon!"},{"loc":"fr","title":"Maison familiale splendide vue montagne - La maison des hirondelles","gf":"Agréable maison familiale de 150m2, agrémentée d'un grand jardin plat et de deux grandes terrasses d'où vous vous jouirez d'une vue imprenable sur les montagnes. L'exposition sud vous permettra de profiter du soleil du matin au soir, les arbres offrant au besoin de l'ombre l'été. Maison lumineuse et moderne, bien équipée pour passer des moments agréables, en été comme en hiver (Thermomix, barbecue, jeux enfants, petite ludothèque d'une cinquantaine de jeux de société, cheminée...). Un piano et une batterie sont disponibles sous réserve d'une utilisation musicale respectueuse.\nAu rez-de-chaussée, vous trouverez un grand séjour, une cuisine séparée, une chambre et une salle de bain; à l'étage, vous disposerez de 3 chambres, une salle de bain, et deux espaces mezzanine dont une dédiée au travail (bureau, ordinateur, bibliothèque).","gp":"A la maison, vous pourrez profiter d'un environnement propice à la détente, au farniente dans le jardin ou aux promenades de proximité, dans une ambiance champêtre, forestière ou avec vue sur les montagnes (Vallée verte, Meulières du Vouan, Forêt des Voirons). Vous pourrez aussi rayonner à la demi-journée ou à la journée dans des univers variés : massifs du Mont-Blanc, du Giffre, des Aravis, des Bornes, du Chablais, ville et Lac d'Annecy, Lac Léman, Genève, Lausanne...\n\nIDÉALEMENT située, la maison se trouve en effet dans un environnement calme et bucolique, tout en restant à 5mn de l'autoroute qui dessert :\n- Chamonix (1h)\n- Annecy (40mn)\n- Genève (25mn)\n- Yvoire et les plages du Lac Léman (35mn)\n- Thonon (40mn)\n- Cirque de Sixt-Fer-à-Cheval (site exceptionnel classé 3 étoiles au guide Michelin) (50mn)\n- Premières stations de ski à 25mn (Sommand-Praz-de-Lys, Hirmentaz-Les Habères) ; les Gets, Grand-Bornand, La Clusaz, Les Houches, Espace Diamant, Grand Massif, sont à 40mn.\n\nEnfin, vous aurez à proximité toutes les commodités :\n- les boulangeries, la pharmacie, un producteur de légumes bio sont accessibles à pied;\n- un réseau de bus est accessible à pied;\n- les magasins et producteurs locaux sont nombreux à moins de 10mn en voiture;\n- le premier hôpital est à environ 10mn (mais nous ne l'entendons pas).\n\nSuite aux demandes de certains d'entre vous,  à la fin de l'annonce, afin que vous puissiez vous faire une idée des possibles autour de la maison, j'ai ajouté quelques photos personnelles des sites où nous aimons nous promener.","ot":"Entre nous, nous plaisantons en nous appelant la maison des hirondelles. Comme elles, nous aimons voyager … puis revenir dans notre nid douillet… Elles aussi semblent apprécier notre quartier : depuis la terrasse ou le salon, nous aimons admirer leurs ballets d'avril jusqu'à octobre, puisqu’elles ont mis à profit les sous-pentes des voisins pour s'établir durablement. \n\nNous sommes nouveaux sur HomeExchange mais avons déjà réalisé de manière informelle des échanges dans cet esprit. Cela nous a convaincus d'élargir cette expérience. Nous nous réjouissons de vous recevoir et de vivre de nouvelles aventures humaines. N'hésitez pas à nous contacter si vous avez des questions, nous serons ravis d'y répondre et de vous accueillir! A bientôt!"}],"ph":["3045588_0","3045588_1","3045588_2","3045588_3","3045588_4","3045588_5","3045588_6","3045588_7","3045588_8","3045588_9","3045588_10","3045588_11","3045588_12","3045588_13","3045588_14","3045588_15","3045588_16","3045588_17","3045588_18","3045588_19","3045588_20","3045588_21","3045588_22","3045588_23","3045588_24","3045588_25","3045588_26","3045588_27","3045588_28","3045588_29","3045588_30","3045588_31","3045588_32","3045588_33","3045588_34","3045588_35","3045588_36","3045588_37","3045588_38","3045588_39","3045588_40","3045588_41","3045588_42","3045588_43","3045588_44","3045588_45","3045588_46","3045588_47","3045588_48","3045588_49","3045588_50","3045588_51"]},{"v":"V81","n":81,"id":3276104,"t":"Le petit skieur","town":"Saint-Nicolas-La-Chapelle","cc":"France","region":"Mont Blanc","lat":45.81685329779145,"lon":6.502716487952751,"bd":3,"ba":2,"cap":11,"m2":130,"typ":"House","mn":5,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":4,"children_bed":0,"baby_bed":1,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Crest-Voland","m":14,"b":16,"km":10,"via":"D1212 and D71A","q":"Val d'Arly D1212"},{"n":"Megeve","m":24,"b":28,"km":14,"via":"Rte du Val d'Arly","q":""},{"n":"Combloux ange from the living room terrace. Snowboarding and skiing slopes are at our door step but if you wish to experience a more challenging slopes you can head over to Crans Montana or Saas-Fe only 40 min by car.\r\nEischoll is a  charming ski station that connects to the ski slopes of Unterbäch by a ski lift and Burchen by a short ride. It is perfect for families while there is enough challenge for these who love powder skiing. From late spring through to autumn there are wonderful hikes and downhill mountain biking trails suitable for all tastes. The village has shops and traditional restaurant, as well as a ski rental shop only five min away by car. Ours is first floor  apartment  in a building of three. and can be reached easily by public transport (train to Raron, and then cable car).\r\nNote to families:  It has everything needed for a stay with children: high chair, sleds, games,  books for a nice family vacation.","gp":"Mountains, wild life at your doorstep, country retreat, ski station, winter sports\n\n- Buzzy restaurants: Moosalp\n- Cool bars: Moosalp\n- Cozy cafés: on the slopes there are a couple of restaurants to stop by at.\n- Walks in the park: walks in nature\n- Spot of exercise: snowshoe walking, mountain biking, snowboarding, skiing, hiking\n- Day tripping: Zermatt, Saas Fee, Crans Montana, Brig, Simplon, Italy","ot":""}],"ph":["2375157_0","2375157_1","2375157_2","2375157_3","2375157_4","2375157_5","2375157_6","2375157_7","2375157_8","2375157_9","2375157_10","2375157_11","2375157_12","2375157_13","2375157_14","2375157_15","2375157_16","2375157_17","2375157_18","2375157_19","2375157_20","2375157_21"]},{"v":"V83","n":83,"id":422364,"t":"Marielle's house","town":"Hauteville","cc":"Switzerland","region":"Fribourg Prealps","lat":46.6737500734841,"lon":7.109352587752491,"bd":4,"ba":2,"cap":11,"m2":170,"typ":"House","mn":0,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":1,"children_bed":0,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_ y for now - slightly small for 12.","score":52,"stars":2.5,"gp":249,"rr":100,"gr":4.97,"ex":18,"owner":"Gregory","recip":true,"desc":[{"loc":"tr","title":"Gregory's Chalet","gf":"PLEASE CHECK THE CHALET'S AVAILABILITY BEFORE SENDING YOUR REQUEST.\nGUESTPOINTS (GPs) ONLY FOR THE TIME BEING. THANK YOU IN ADVANCE.\n\nAll-wood mountain chalet\nAt the foot of the ski slopes.\nSleeps 10 people\nCharm and comfort at their peak.\n\nVery spacious, it can comfortably sleep 10 people and gives ski-in/ski-out access to the ski area.\nIt is a traditional all-wood mountain chalet, set in 1350 m2 of conifers where it is not unusual to come across roe deer.\nIt has 4 bedrooms in total: 2 bedrooms with a double bed, 1 bedroom with 4 single beds (2 bunk beds and 2 singles that can be pushed together), 1 bedroom with a double bed.\n2 bathrooms, 2 separate WCs, a fitted kitchen, coffee maker, washing machine, heated ski room.\nWarm, functional and cosy, the Chalet des Airelles will make you feel at home, in the heart of Savoie, for an unforgettable stay with family or friends.\nSheets and household linen can be provided as an option for maximum comfort and minimum effort!\nFresh air and a fire in the fireplace (firewood included)...","gp":"The Chalet des Airelles is in Savoie in the resort of Le Revard,\ncommonly known as \"Little Canada\", in an exceptional setting!!\nIt is a traditional all-wood mountain chalet, set in 1350 m2 of fir trees.\nThe Chalet des Airelles is located on Boucle de l'Angle Est in the heart of the REVARD resort, above Aix les Bains and overlooking the Lac du Bourget.\n4 km from the neighbouring resort of La Féclaz, 20 km from Aix les Bains, 45 minutes from Annecy, 1h15 from Geneva and 120 km from Lyon.","ot":""},{"loc":"fr","title":"Le Chalet de Gregory","gf":"MERCI DE VÉRIFIER LA DISPONIBILITÉ DU CHALET AVANT D’ENVOYER VOTRE DEMANDE SVP.\nUNIQUEMENT GPs POUR LE MOMENT. MERCI D’AVANCE.\n\nChalet de Montagne tout en bois\nAu pied des pistes de ski.\nPouvant accueillir 10 personnes\nCharme et confort au sommet.\n\nTrès spacieux , il peut héberger confortablement 10 personnes et permet d'accéder au domaine skiable, skis aux pieds.\nC'est un chalet de montagne traditionnel tout en bois, dans un écrin de 1350m2 de conifères où il n'est pas rare de croiser des chevreuils.\nIl dispose de 4 chambres au total : 2 chambres avec lit double, 1 chambre de 4 lits simples (2 lits superposés et 2 simples pouvant être réunis), 1 chambre avec un lit double.\n2 Salle de bains, 2 WC séparés, une cuisine équipée, cafetière, machine à laver le linge, local à skis chauffé.\nChaleureux, fonctionnel et douillet, le Chalet des Airelles vous fait vous sentir comme chez vous, au coeur de la Savoie, pour un séjour inoubliable en famille ou entre amis.\nLes draps, le linge de maison peuvent être fournis en option pour un maximum de confort et un minimum d'effort !\nGrand air et feu dans la cheminée (bois de chauffage inclus)...","gp":"Le Chalet des Airelles est situé en Savoie dans la station du Revard, \r\ncommunément appelé \"le Petit Canada\" dans un site exceptionnel l!!\r\nC est un chalet de montagne traditionnel tout en bois, dans un écrin de 1350m2 de sapins.\r\nLe Chalet des Airelles est situé Boucle de l angle Est au cœur de la Station du REVARD, au dessus d'Aix les Bains et en surplomb du Lac du Bourget.\r\nA 4 km de la station la Féclaz voisine, 20 km d'Aix les Bains, 45 minutes d'Annecy, 1h15 de Genève et 120 km de Lyon.","ot":""}],"ph":["2812770_0","2812770_1","2812770_2","2812770_3","2812770_4","2812770_5","2812770_6","2812770_7","2812770_8","2812770_9","2812770_10","2812770_11","2812770_12","2812770_13","2812770_14","2812770_15","2812770_16","2812770_17","2812770_18","2812770_19","2812770_20","2812770_21","2812770_22","2812770_23","2812770_24","2812770_25"]},{"v":"V85","n":85,"id":1447911,"t":"Entre lac et montagne bienvenue chez nous","town":"Val de Chaise","cc":"France","region":"Val d'Arly","lat":45.75037758541837,"lon":6.31713145532
