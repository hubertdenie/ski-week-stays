sant small town. However, we are in a very quiet neighbourhood, a stone's throw from the castle (the view from the house is magnificent) and the cinema. All services can be reached on foot, and in a few minutes' walk you can also find yourself in the woods, on the slopes of the mountain. Ideal for skiers, mountain lovers and anyone who wants to enjoy our beautiful region.","ot":"The cities of Annecy and Geneva are about 30 min away, as are the ski resorts."},{"loc":"fr","title":"La maison de Anaïs et Lucas","gf":"Notre maison est grande et bien conçue, avec tout le confort nécessaire. Le jardin est agréable en toutes saisons et vous trouverez pour les familles une grande salle de jeux très bien équipée. Le dernier étage est équipé d’une salle de bain et d’une cuisine d’appoint pour plus d’autonomie.","gp":"Nous sommes au cœur de Bonneville, une petite ville très dynamique et agréable. Nous sommes cependant dans un quartier très calme, à deux pas du château ( la vue de la maison est magnifique) et du cinéma. Tous les services sont accessibles à pied et on peut aussi en quelques minutes de marche  se retrouver dans les bois, sur les flancs de la montagne. Idéal pour les amateurs de ski, de montagne et tout ceux qui veulent profiter de notre belle région.","ot":"Les villes d’Annecy et de Genève sont à environ 30 min tout comme les stations de ski."}],"ph":["3032895_0","3032895_1","3032895_2","3032895_3","3032895_4","3032895_5","3032895_6","3032895_7","3032895_8","3032895_9","3032895_10","3032895_11","3032895_12","3032895_13","3032895_14","3032895_15","3032895_16"]},{"v":"V40","n":40,"id":3295370,"t":"Maison lumineuse & kid friendly au coeur des Alpes","town":"Pontcharra","cc":"France","region":"Belledonne","lat":45.442803253525945,"lon":6.021920474678149,"bd":5,"ba":2,"cap":12,"m2":130,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":0,"children_bed":2,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Le Collet d'Allevard","m":35,"b":35,"km":23,"via":"D525A","q":""},{"n":"Les 7 Laux","m":40,"b":45,"km":32,"via":"A41","q":""},{"n":"Aillons-Margeriaz","m":50,"b":55,"km":35,"via":"D1090 and D206","q":""},{"n":"Le Sappey","m":50,"b":60,"km":47,"via":"A41","q":""},{"n":"La Feclaz (Grand Revard)","m":55,"b":60,"km":42,"via":"D912","q":""},{"n":"St-Pierre-de-Chartreuse","m":60,"b":60,"km":38,"via":"D912","q":""},{"n":"Chamrousse","m":65,"b":75,"km":63,"via":"A41 and D111","q":""},{"n":"Le Corbier/Toussuire","m":70,"b":80,"km":79,"via":"A43","q":"Maurienne A43"}],"near":35,"n30":0,"n60":6,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"tout équipée pour les accueillir (table à langer, chaise haute, lits, jouets)","toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"quatre stations de ski à 30 minutes en voiture (Sept Laux, Collet d'Allevard alpin)","notes":"Town house in Pontcharra (Grésivaudan), 5 bed/2 bath, sleeps 12; kid-equipped; Sept Laux/Collet 30 min; owner has 1 exchange.","score":63,"stars":3.0,"gp":195,"rr":100,"gr":5.0,"ex":1,"owner":"Manon","recip":true,"desc":[{"loc":"tr","title":"Bright, kid-friendly house in the heart of the Alps","gf":"Welcome to our house, ideal for a stay with your children and/or friends!\n\nWe have five bedrooms, including two children's rooms, a fully equipped open kitchen and a large, bright living room. The living room opens onto a large, quiet terrace with a beautiful view of the Chartreuse massif. You can also enjoy our garden, where two cars can be parked one behind the other. The house is on two floors: the living areas, our bedroom, the two children's rooms and our bathroom are on the 1st floor, and we have two guest bedrooms and an extra bathroom on the ground floor. Little bonus: a bookcase full of comics in the living room!\n\nAs we have three young children, our house is fully equipped for little ones (changing table, high chair, beds, toys, etc). We also make our bikes available for getting around the area, with baby seats and a trailer for the children. In the warm season you can also borrow our paddleboard for a spin on the nearby lake!","gp":"The house is in a quiet residential neighbourhood right next to the town centre. In 5 minutes by bike you can enjoy a beautiful lake where you can swim! You will find all the useful shops in town, as well as a train station and a cinema. Pontcharra also has a station with regular services to all the surrounding towns.\n\nPontcharra is in the Grésivaudan valley, between Chambéry and Grenoble. There is no shortage of things to do around here, summer and winter:\n- thousands of hikes in the three nearby massifs (Belledonne, Chartreuse and Bauges)\n- beautiful lakes (small ones very close by and Lac du Bourget 40 minutes away by car). There are paid activities on two lakes 20 minutes away (water skiing, inflatables, etc).\n- in winter, four ski resorts 30 minutes away by car (Sept Laux and Collet d'Allevard for alpine skiing, Désert d'Entremont and Le Barioz for cross-country skiing) and many other resorts a bit further away.\n- Several beautiful towns nearby, reachable by train: Chambéry 20 minutes away, Grenoble and Aix-les-Bains 30 minutes, Annecy and Albertville 1h.\n- The town's many facilities: cinema, swimming pool, pump track, lake, station, etc.\n- many events nearby all year round: festivals, local and farm fairs, concerts, etc.","ot":""},{"loc":"fr","title":"Maison lumineuse & kid friendly au coeur des Alpes","gf":"Bienvenue dans notre maison, idéale pour un séjour avec vos enfants et / ou vos amis ! \n\nNous avons cinq chambres, dont deux chambres d'enfants, une cuisine ouverte tout équipée et un grand salon lumineux. Le salon est prolongé par une grande terrasse au calme qui offre une belle vue sur le massif de la Chartreuse. Vous pourrez également profiter de notre jardin, où deux voitures peuvent être garées l'une derrière l'autre. La maison est sur deux étages : les pièces de vie, notre chambre, les deux chambres des enfants et notre salle de bain sont au 1er et nous avons deux chambres d'amis et une salle de bain en plus au rendez-de-chaussée. Petit bonus : une bibliothèque remplie de BD dans le salon !\n\nAyant trois petits enfants, notre maison est tout équipée pour les accueillir (table à langer, chaise haute, lits, jouets, etc). Nous mettons également nos vélos à disposition pour se balader dans le coin, avec des sièges bébés et une cariole pour les enfants. A la belle saison vous pourrez également emprunter notre paddle pour faire un tour sur le lac à côté !","gp":"La maison est située dans un quartier résidentiel calme à proximité immédiate du centre-ville. En 5 minutes en vélo vous pourrez profiter d'un beau lac où on peut se baigner ! Vous trouverez tous les commerces utiles dans la ville, ainsi qu'une gare et un cinéma. A Pontcharra il y a également une gare qui dessert régulièrement toutes les villes alentours. \n\nPontcharra se situe dans la vallée du Grésivaudan, entre Chambéry et Grenoble. Les activités ne manquent pas par chez nous, été comme hiver : \n- des milliers de randonnées dans les trois massifs à proximité (Belledonne, Chartreuse et Bauges)\n- des beaux lacs (des petits tout proche et le lac du Bourget à 40 minutes en voiture). Il y a des activités payantes sur deux lacs à 20 minutes (ski nautique, structures gonflables, etc). \n- en hiver, quatre stations de ski à 30 minutes en voiture (Sept Laux et Collet d'Allevard en ski alpin, le Désert d'Entremont et le Barioz en ski de fond) et de nombreuses autres stations un peu plus loin. \n- Plusieurs belles villes à proximité, accessibles en train : Chambéry à 20 minutes, Grenoble et Aix les Bains à 30 minutes, Annecy et Albertville à 1h. \n- Les multiples équipements de la ville : cinéma, piscine, pump track, lac, gare, etc.\n- de nombreux événements à proximité toute l'année : festivals, fêtes locales et paysannes, concerts, etc.","ot":""}],"ph":["3295370_0","3295370_1","3295370_2","3295370_3","3295370_4","3295370_5","3295370_6","3295370_7","3295370_8","3295370_9","3295370_10"]},{"v":"V41","n":41,"id":2530280,"t":"Villa with Indoor Pool, Sauna and Billiards","town":"Corserey","cc":"Switzerland","region":"Fribourg Prealps","lat":46.777060415443636,"lon":6.993057629443806,"bd":5,"ba":5,"cap":13,"m2":340,"typ":"House","mn":0,"beds":{"big_double_bed":1,"double_bed":3,"single_bed":0,"children_bed":1,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":1,"baby_bed_up":1},"res":[{"n":"Charmey","m":45,"b":50,"km":43,"via":"A12","q":""},{"n":"Moleson","m":50,"b":55,"km":39,"via":"A12","q":""},{"n":"Chateau-d'Oex","m":60,"b":65,"km":58,"via":"A12","q":""},{"n":"Metabief","m":60,"b":70,"km":68,"via":"A1","q":""},{"n":"Villars","m":75,"b":90,"km":89,"via":"A12","q":""},{"n":"Champery","m":80,"b":100,"km":94,"via":"A12 and A9","q":""},{"n":"Leysin","m":80,"b":90,"km":92,"via":"A12","q":""},{"n":"Les Diablerets","m":85,"b":100,"km":96,"via":"A12","q":""}],"near":45,"n30":0,"n60":4,"fac":{"fireplace":true,"sauna":true,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":"Sauna privatisé pour se détendre après une journée ski","toys_inside":"Espace jeux & détente avec salle TV ... et billard","toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":["x26"],"q":[],"ski":"Vous pourrez rejoindre le Moléson (no distance given; villa near Fribourg)","notes":"Fribourg-area villa with indoor pool, sauna, billiards; 5 bed/5 bath, '8 à 12 (idéalement 8 adultes max)'; lowland - drive to Moléson; CHF 240-280 cleaning.","score":63,"stars":3.0,"gp":292,"rr":55,"gr":4.5,"ex":9,"owner":"Jérôme","recip":false,"desc":[{"loc":"tr","title":"Villa with Indoor Pool, Sauna and Billiards","gf":"✨ Highlights:\n✅ Heated indoor pool (access all year round)\n✅ Private sauna to relax after a day of skiing\n✅ Games & relaxation area with TV room (large screen, home cinema) and billiards\n✅ 3 outdoor terraces, 2 of them sheltered (outdoor meals, sun)\n✅ Spacious, bright bedrooms (linen provided)\n✅ Capacity: 8 to 12 people - ideal for groups or families (ideally 8 adults maximum)","gp":"Our guests often describe our house as a \"modern, spacious haven of peace\". What wins them over above all is the combination of exceptional facilities and the warmth of a real family home:\n\nYou'll enjoy a superb indoor pool that can be used in all weathers,\na sauna for your moments of relaxation, and a billiards table for convivial evenings.\n\nSpace and layout: The house is very spacious, ideal for large groups or families. Everyone can find their privacy thanks to a separate studio and comfortable living spaces.\n\nCareful decoration: We put a lot of heart into the decor, with particular attention to detail so that you immediately feel \"at home\" and not in an impersonal rental.\n\nAbsolute comfort: Equipped kitchen, a warm living room designed for spending long moments together.\n\nTranquillity and outdoors: You'll love the garden and the peaceful outdoor space, perfect for a morning coffee or dining outside in complete tranquillity.\n\nExcursions and nature: We are ideally located for memorable outings. You can head to the Moléson for its alpine panoramas and hikes.\n\nLeisure nearby: For thrill-seekers, there is a karting centre nearby, offering a fun activity for young and old.\n\nA strategic location: The neighbourhood makes it easy to combine total rest at the villa with lively discovery of the region's treasures.","ot":"You can sign up for our cleaning option when booking:\n\nif you use the house + apartment it is 280.-,\nif only the house it is 240.-\n\nOtherwise, the cleaning fee will be increased by 100.-"},{"loc":"fr","title":"Villa with Indoor Pool, Sauna and Billiards","gf":"✨ Les points forts :\n✅ Piscine intérieure chauffée (accès toute l'année)\n✅ Sauna privatisé pour se détendre après une journée ski\n✅ Espace jeux & détente avec salle TV (écran grand format, home cinéma) et billard\n✅ 3 terrasses extérieures dont 2 abritées (repas en plein air, soleil )\n✅ Chambres spacieuses et lumineuses  linge fourni)\n✅ Capacité : 8 à 12 personnes - idéal pour groupes ou familles (idéalement 8 adultes maximum)","gp":"Nos invités décrivent souvent notre maison comme un \"havre de paix moderne et spacieux\". Ce qui les séduit avant tout, c'est l'alliance entre les équipements exceptionnels et la chaleur d'une vraie maison de famille :\n\nVous profiterez d'une superbe piscine intérieure utilisable par tous les temps\nUn sauna pour vos moments de détente, et d'un billard pour vos soirées conviviales.\n\nL'espace et l'agencement : La maison est très spacieuse, idéale pour les grands groupes ou les familles. Chacun peut y trouver son intimité grâce à un studio indépendant et des pièces de vie confortables.\n\nUne décoration soignée : Nous avons mis beaucoup de cœur dans la décoration, avec une attention particulière aux détails pour que vous vous sentiez immédiatement \"chez vous\" et non dans une location impersonnelle.\n\nLe confort absolu : Cuisine équipée, salon chaleureux conçu pour passer de longs moments ensemble.\n\nTranquillité et extérieur : Vous adorerez le jardin et l'espace extérieur paisible, parfaits pour prendre un café le matin ou dîner dehors en toute tranquillité.\n\nExcursions et Nature : Nous sommes idéalement situés pour des escapades mémorables. Vous pourrez rejoindre le Moléson pour ses panoramas alpins et ses randonnées.\n\nLoisirs à proximité : Pour les amateurs de sensations, un centre de Karting se trouve à proximité, offrant une activité ludique pour les petits et les grands.\n\nUne situation stratégique : Le quartier permet de combiner facilement repos total à la villa et découvertes dynamiques des trésors de la région.","ot":"Vous pouvez souscrire à notre option ménage lors de la réservation, \n\nsi vous utilisez la maison + appartement c'est 280.-, \nsi uniquement la maison c'est 240.-\n\nDans le cas contraire, les frais de ménage seront majorés de 100.-"}],"ph":["2530280_0","2530280_1","2530280_2","2530280_3","2530280_4","2530280_5","2530280_6","2530280_7","2530280_8","2530280_9","2530280_10","2530280_11","2530280_12","2530280_13","2530280_14","2530280_15","2530280_16","2530280_17","2530280_18","2530280_19","2530280_20","2530280_21","2530280_22","2530280_23","2530280_24","2530280_25","2530280_26","2530280_27","2530280_28","2530280_29","2530280_30","2530280_31","2530280_32","2530280_33","2530280_34","2530280_35","2530280_36","2530280_37","2530280_38","2530280_39","2530280_40","2530280_41","2530280_42","2530280_43","2530280_44","2530280_45","2530280_46","2530280_47","2530280_48","2530280_49","2530280_50"]},{"v":"V42","n":42,"id":2882359,"t":"Au confluent - Grande maison de village en Chartreuse - 7-10 pers - cour et jardin","town":"Saint-Pierre-D'entremont","cc":"France","region":"Chartreuse","lat":45.41965847619725,"lon":5.854812565387471,"bd":4,"ba":2,"cap":13,"m2":180,"typ":"House","mn":4,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":3,"children_bed":1,"baby_bed":0,"double_bed_up":0,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":2},"res":[{"n":"St-Pierre-de-Chartreuse","m":22,"b":22,"km":13,"via":"Rte du Planolet/D102B and D512","q":""},{"n":"Le Sappey","m":40,"b":40,"km":25,"via":"D512","q":""},{"n":"Les 7 Laux","m":65,"b":70,"km":54,"via":"D912","q":""},{"n":"Aillons-Margeriaz","m":70,"b":75,"km":46,"via":"D912","q":""},{"n":"La Feclaz (Grand Revard)","m":70,"b":70,"km":43,"via":"D912","q":""},{"n":"Le Collet d'Allevard","m":70,"b":70,"km":47,"via":"D912","q":""},{"n":"Chamrousse","m":90,"b":100,"km":85,"via":"A41","q":""},{"n":"Villard-de-Lans","m":90,"b":100,"km":70,"via":"D531","q":""}],"near":22,"n30":1,"n60":2,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":"700 m² d'extérieur (cour et jardin privatifs)","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"profiter du massif de Chartreuse: ski de fond ou alpin, raquettes","notes":"Village house in Chartreuse for 7-10, 700 m2 yard by river; only small local ski areas; min 5 nights in school holidays.","score":63,"stars":3.0,"gp":200,"rr":92,"gr":5.0,"ex":4,"owner":"Claudine • Morgane","recip":true,"desc":[{"loc":"tr","title":"Au Confluent - Large village house in Chartreuse - 7-10 people - courtyard and garden","gf":"Welcome to our family home \"AU CONFLUENT\". It is ideal for a convivial stay with family or friends. In the heart of the village of St Pierre d'Entremont Savoie and the Chartreuse Regional Natural Park, between rivers and mountains, our 180 m² family home on two levels with 700 m² of outdoor space (private courtyard and garden) will delight everyone. The living spaces are spacious, and here are the four bedrooms:\nBedroom 1 = 140 bed + cot\nBedroom 2 = 3 beds of 90 (extra bed possible)\nBedroom 3 = 140 bed + travel cot\nBedroom 4 = 140 bed + child's bed + travel cot\n\n❄️ 700 m² private courtyard and garden\n❄️ Direct access to the river and mountain views\n❄️ Large 180 m² family home\n❄️ Ideally located (village centre, hiking/via ferrata starting points nearby)\n❄️ 7 to 10 people (if there are young children).\n❄️ Fully equipped (wifi, dishwasher, oven, food processor, washing machine, tumble dryer, etc.)\n❄️ Rated as a ★ ★ ★ furnished tourist accommodation!\n\nRest, culture, sports and leisure: it's up to you to choose how best to enjoy our beautiful region!\n\nPlease note: we only wish to be contacted for stays of at least 4 nights outside school holidays and at least 5 nights during school holidays. Thank you for your understanding.","gp":"Located in the heart of this simple, authentic little mountain village, our house is a few minutes' walk from local shops: you can do your shopping on foot:\n- bakery, pâtisserie, grocery, butcher, cheese shop\n- tobacconist-newsagent, pharmacy, fuel, crafts\n- beauty salon, cash machine\n- cinema, cafés and restaurants\n- market on Saturday mornings\n\nYou can also enjoy the Chartreuse massif and park:\n- nature and fresh air: cycling or mountain biking, cross-country or downhill skiing, snowshoeing or hiking, via ferrata\n- the fauna and flora along the waymarked trails\n- must-see places: the Pas du Frou, the waterfalls of the Cirque de St Même...\n- the history of the Entremonts: the Tour d'Infernet and the Chapelle des Dix Mille Martyrs, the ruins of the Château des Teppaz and the Château de Montbel, its ovens, fountains, mills and granaries, the boundary stones between France and Savoy, the cave bear museum...\n- the history of the Grande Chartreuse with its monastery, its famous liqueur cellars, the Arcabas museum...\n- crafts, by following the craft-skills trail (route des savoir-faire): soaps, fabrics, clay, wood...\n\nA green getaway in an authentic village!","ot":""},{"loc":"fr","title":"Au confluent - Grande maison de village en Chartreuse - 7-10 pers - cour et jardin","gf":"Bienvenue dans notre maison de famille \"AU CONFLUENT\". Elle est idéale pour un séjour en famille ou entre amis dans la convivialité. Au cœur du village de St Pierre d'Entremont Savoie et du Parc Naturel Régional de la Chartreuse, entre rivières et montagnes, notre maison familiale de 180 m² sur deux niveaux et de 700 m² d'extérieur (cour et jardin privatifs) fera le bonheur de tous. Les pièces de vie sont spacieuses, et voici les quatre chambres :\nChambre 1 = lit de 140 + lit bébé\nChambre 2 = 3 lits de 90 (lit d'appoint possible)\nChambre 3 = lit de 140 + lit parapluie\nChambre 4 = lit de 140 + lit enfant + lit parapluie\n\n❄️ Cour et jardin privatifs de 700m² \n❄️ Accès direct à la rivière et vue sur les montagnes\n❄️ Grande maison familiale de 180m²\n❄️ Idéalement situé (centre village, départ de randonnées/via ferrata à proximité)\n❄️ 7 à 10 personnes (s’il y a des enfants en bas âge).\n❄️ Tout équipée (wifi, lave-vaisselle, four, robot, lave-linge, sèche-linge, etc.)\n❄️ Classé meublé de tourisme ★ ★ ★ !\n\nRepos, culture, sports et loisirs, à vous de choisir pour profiter au mieux de notre belle région !\n\nA noter : nous souhaitons être sollicité uniquement pour des séjours de 4 nuits minimum hors vacances scolaires et 5 nuits minimum en période de vacances scolaires. Merci de votre compréhension.","gp":"Située au cœur de ce petit village de montagne simple et authentique, notre maison est à quelques minutes à pied des commerces locaux : vous pouvez faire vos courses à pied :\n- boulangerie, pâtisserie, épicerie, boucherie, fromagerie\n- tabac-presse, pharmacie, carburant, artisanat\n- salon esthétique, distributeur automatique de billets\n- salle de cinéma, cafés et restaurants\n- marché le samedi matin\n\nVous pouvez également profiter du massif et du Parc de Chartreuse :\n- de la nature et du bon air : vélo ou VTT, ski de fond ou alpin, raquettes ou randonnée pédestre, via ferrata\n- de la faune et la flore en parcourant les sentiers balisés\n- de lieux incontournables : le Pas du Frou, les cascades du Cirque de St Même...\n- de l'histoire des Entremonts : la Tour d'Infernet et la Chapelle des Dix Mille Martyrs, les ruines du château des Teppaz et du château de Montbel, ses fours, fontaines, moulins ou greniers, les bornes frontières entre la France et la Savoie, le musée de l'ours des cavernes...\n- de l'histoire de la Grande Chartreuse avec son monastère, ses fameuses caves à liqueur, le musée Arcabas...\n- de l'artisanat en suivant la route des savoir-faire : savons, tissus, terre, bois...\n\nUn séjour au vert dans un village authentique !","ot":""}],"ph":["2882359_0","2882359_1","2882359_2","2882359_3","2882359_4","2882359_5","2882359_6","2882359_7","2882359_8","2882359_9","2882359_10","2882359_11","2 d a barbecue or relaxing on a deckchair.\nFlat and fenced, it is a place where children or pets can play outdoors in complete safety.\nThe kitchen, separate from the living room, is modern and well equipped for preparing meals. This chalet is a second home, a holiday home, and you will feel at home and at ease since empty cupboards will be available to you in the 6 bedrooms.\nThere are two private parking spaces for the chalet at the entrance to the garden","gp":"Located on the edge of the village, the chalet enjoys an unobstructed view of the mountain panorama, while being just a few minutes' walk from the station and the village shops and restaurants.","ot":"Our apartment is a second home. So, depending on the time of year (during the high tourist seasons, in order to ensure cleaning just before and after your visit), fees may apply for the key handover and cleaning service."},{"loc":"fr","title":"Chalet de vacances traditionnel et familial","gf":"Chalet familial construit en 1936. Très bien entretenu et restauré régulièrement, c'est une maison de vacances, bien chauffée en hiver et fraîche en été.\nLe jardin paisible est aménagé pour partager des repas autour d'un barbecue ou se relaxer sur une chaise longue.\nPlat et clôturé, c'est un endroit pour laisser des enfants ou des animaux de compagnie jouer en plein air en toute sécurité.\nLa cuisine, indépendante du séjour, est moderne et bien équipée pour préparer des repas. Ce chalet est une résidence secondaire, maison de vacances et vous vous y sentirez chez vous et à l'aise puisque des placards vides seront à votre disposition dans les 6 chambres à coucher. \nIl y a deux places de parc privées pour le chalet à l’entrée du jardin","gp":"Situé en bordure de village, le chalet jouit d’une vue sans vis à vis sur le panorama des montagnes, tout en étant à quelques minutes a pied de la gare et des commerces et restaurants du village.","ot":"Notre appartement est une résidence secondaire. Donc, en fonction de la période de l'année (pendant les hautes saisons touristiques, afin d'assurer le ménage juste avant et après votre venue) des frais peuvent s'appliquer pour le service de remise des clefs et de ménage."}],"ph":["1426492_0","1426492_1","1426492_2","1426492_3","1426492_4","1426492_5","1426492_6","1426492_7","1426492_8","1426492_9","1426492_10","1426492_11","1426492_12","1426492_13","1426492_14","1426492_15","1426492_16","1426492_17","1426492_18","1426492_19","1426492_20","1426492_21","1426492_22","1426492_23","1426492_24","1426492_25","1426492_26","1426492_27","1426492_28","1426492_29","1426492_30","1426492_31","1426492_32","1426492_33","1426492_34","1426492_35","1426492_36","1426492_37","1426492_38","1426492_39"]},{"v":"V44","n":44,"id":1704027,"t":"Maison au calme au coeur des vignes","town":"Myans","cc":"France","region":"Bauges","lat":45.514967347999495,"lon":5.987390387520115,"bd":5,"ba":3,"cap":12,"m2":170,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":5,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Aillons-Margeriaz","m":35,"b":40,"km":23,"via":"D21 and D206","q":""},{"n":"La Feclaz (Grand Revard)","m":40,"b":45,"km":26,"via":"D912","q":""},{"n":"Les 7 Laux","m":40,"b":45,"km":40,"via":"A41","q":""},{"n":"Le Collet d'Allevard","m":45,"b":50,"km":33,"via":"D1090","q":""},{"n":"Le Sappey","m":50,"b":60,"km":55,"via":"A41","q":""},{"n":"Crest-Voland","m":55,"b":65,"km":66,"via":"A43","q":"Maurienne A43"},{"n":"St-Pierre-de-Chartreuse","m":55,"b":60,"km":38,"via":"D912","q":""},{"n":"Saint-Francois-Longchamp","m":65,"b":75,"km":73,"via":"A43","q":"Maurienne A43"}],"near":35,"n30":0,"n60":7,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"une salle de jeux suivant les besoins avec un canapé","toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":["f27"],"q":[],"ski":null,"notes":"2023 house in vineyards near Chambéry, 5 doubles/3 baths fits 10-12; no ski claim, resorts need a drive; cleaning fee applies.","score":63,"stars":3.0,"gp":230,"rr":100,"gr":4.89,"ex":14,"owner":"Sebastien et Angélique","recip":true,"desc":[{"loc":"tr","title":"Quiet house in the heart of the vineyards","gf":"My house is in the municipality of Myans, in the countryside around Chambéry.\nIt is practical and very pleasant, built in 2023.\nWe have a very nice 80 m2 living area.\nOn the ground floor there is a laundry room, a master suite (ours), and a bedroom with a separate shower room.\nUpstairs you will find our boys' three bedrooms, their bathroom with a very large shower, a separate WC and a games room as needed, with a sofa that can be used as a bed.\nThere are walks and bike rides starting from our house, the little Lac Saint André, ...\nWe are not far from the main roads...\nBakery, tobacconist and snack bar less than 5 min on foot\nShopping centre 10 min by car.\n\nCleaning fees will apply.","gp":"I live on a quiet dead-end street, with vineyards as neighbours and pleasant people.\nYou can go for walks or bike rides from the house.\nIn the heart of the village, less than 5 min on foot, you can go to the bakery and discover the local specialities, and you can have a drink and get something to eat.\nThere is also a charming church full of history.","ot":""},{"loc":"fr","title":"Maison au calme au coeur des vignes","gf":"Ma maison se trouve sur la commune de Myans,  la campagne de Chambéry. \nElle est fonctionnelle,  très agréable,  construction  de 2023.\nNous disposons d'une très belle pièce de vie de 80m2.\nAu rez de chaussé il y a une buanderie, une suite parentale (la notre), une chambre avec une salle d'eau indépendante.\nA l'étage, vous trouverez les trois chambres de nos garçons, leur salle de bain avec une très grande douche, un wc indépendant et une salle de jeux suivant les besoins avec un canapé qui fait couchage.\nIl y a des balades à pieds ou à vélos au départ de chez nous, le petit lac saint andré, ...\nNous sommes située non loin des grands axes...\nBoulangerie, tabac et petit restauration à moins de 5min à pieds \nCentre commercial à 10min en voiture.\n\nDes frais de ménage seront à prévoir.","gp":"J'habite dans une impasse calme, vignes comme voisins et des personnes agréable.\nVous pouvez faire des balades à pieds ou à vélos depuis la maison.\nAu coeur du village à moins de 5min à pieds vous pourrez aller à la boulangerie découvrir les spécialités, il est possible de boire un verre et de se restaurer.\nIl y a également une charmante église qui est pleine d'histoire.","ot":""}],"ph":["1704027_0","1704027_1","1704027_2","1704027_3","1704027_4","1704027_5","1704027_6","1704027_7","1704027_8","1704027_9"]},{"v":"V45","n":45,"id":3047861,"t":"Casa di Lissi ed Alex: Un nuovo e sostenibile rifugio con vista panoramica nel mezzo dei D","town":"Feldthurns","cc":"Italy","region":"Dolomites","lat":46.67456841945254,"lon":11.599409532165755,"bd":6,"ba":3,"cap":11,"m2":140,"typ":"House","mn":0,"beds":{"big_double_bed":1,"double_bed":3,"single_bed":1,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Alpe di Siusi","m":45,"b":50,"km":30,"via":"SS12 and Landesstraße 24/Strada Provinciale 24","q":""},{"n":"Ratschings","m":50,"b":55,"km":47,"via":"A22/E45","q":""},{"n":"Selva Gardena","m":50,"b":60,"km":34,"via":"SS242d","q":""},{"n":"Plose","m":75,"b":75,"km":36,"via":"Landesstraße 29/Strada Provinciale 29/SP29","q":""},{"n":"Kronplatz","m":80,"b":90,"km":61,"via":"Pustertaler Str./SS 49 della Pusteria/Strada Val Pusteria/E66","q":""},{"n":"Canazei","m":100,"b":120,"km":56,"via":"SS242d and Strada Statale 242/SS242","q":""},{"n":"Arabba","m":120,"b":140,"km":62,"via":"SS242d","q":""},{"n":"Axamer Lizum","m":120,"b":140,"km":106,"via":"E45 and A13","q":""}],"near":45,"n30":0,"n60":3,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"In inverno ci sono comprensori sciistici facilmente raggiungibili (Velturno, near Bressanone)","notes":"Sustainable wooden house in Velturno near Brixen, 6 bed/3 bath, sleeps 11 - just short for 12; ski areas 'easily reachable', no times given.","score":62,"stars":3.0,"gp":250,"rr":89,"gr":5.0,"ex":3,"owner":"Alexander","recip":true,"desc":[{"loc":"tr","title":"Lissi and Alex's house: a new, sustainable retreat with panoramic views in the middle of the Dolomites.","gf":"Our house is sustainably built of wood; in summer you can grow vegetables — a paradise for children and adults. By public transport you can quickly reach unique nature in the middle of the Dolomites in northern Italy. It is fairly large, and the surroundings are very quiet, in the middle of nature.","gp":"Our neighbourhood is in Velturno (Feldthurns), a small, quiet and authentic South Tyrolean village, surrounded by nature but well connected. Here life still follows the rhythm of the seasons: walks in the woods, silence, clean air and a strong sense of community.\n\nThe village has the essential services: grocery shops, a bakery, local restaurants and trattorias, a public summer swimming pool, playgrounds, and trails directly accessible from the house. Bressanone (Brixen) can be reached in a few minutes by car or bus and offers a railway station, museums, bookshops, cinemas, markets and a lively cultural life.\n\nThe region is ideal for nature lovers: walking and cycling excursions, alpine pastures and huts, vineyards, castles, alpine lakes and above all mountains. In winter there are easily reachable ski areas; in summer, swimming lakes, walking routes and outdoor activities.\n\nIt's a place suited to families, couples or people looking for tranquillity, simplicity and a real connection with the area. It isn't a \"picture-postcard\" destination, but a real place where you can feel at home.","ot":""},{"loc":"it","title":"Casa di Lissi ed Alex: Un nuovo e sostenibile rifugio con vista panoramica nel mezzo dei Dolomiti.","gf":"La nostra casa è costruita in modo sostenibile in legno, in estate è possibile coltivare ortaggi, un paradiso per bambini e adulti. Con i mezzi pubblici si raggiunge rapidamente una natura unica nel mezzo dei Dolomiti nel Nord dell'Italia. E' abbastanza grande, e l'intorno è molto tranquillo in mezzo della natura.","gp":"Il nostro quartiere si trova a Velturno, un piccolo paese altoatesino tranquillo e autentico, immerso nella natura ma ben collegato. Qui la vita segue ancora il ritmo delle stagioni: passeggiate nei boschi, silenzio, aria pulita e una forte dimensione di comunità.\n\nNel paese si trovano i servizi essenziali: negozi di alimentari, panificio, ristoranti e trattorie locali, una piscina pubblica estiva, parchi gioco, sentieri direttamente accessibili da casa. Bressanone è raggiungibile in pochi minuti di auto o autobus e offre stazione ferroviaria, musei, librerie, cinema, mercati e una vivace vita culturale.\n\nLa regione è ideale per chi ama la natura: escursioni a piedi e in bicicletta, malghe, vigneti, castelli, laghi alpini e soprattutto montagne. In inverno ci sono comprensori sciistici facilmente raggiungibili; in estate laghi balneabili, cammini e attività all’aria aperta.\n\nÈ un luogo adatto a famiglie, coppie o persone che cercano tranquillità, semplicità e un contatto reale con il territorio. Non è una destinazione “da cartolina”, ma un posto vero, dove sentirsi a casa.","ot":""}],"ph":["3047861_0","3047861_1","3047861_2","3047861_3","3047861_4","3047861_5","3047861_6","3047861_7","3047861_8","3047861_9","3047861_10","3047861_11","3047861_12","3047861_13","3047861_14","3047861_15","3047861_16","3047861_17","3047861_18","3047861_19","3047861_20","3047861_21","3047861 z","m":60,"b":70,"km":56,"via":"D1203 and A40","q":""},{"n":"Combloux","m":65,"b":75,"km":65,"via":"D1203 and A40","q":""},{"n":"La Feclaz (Grand Revard)","m":65,"b":75,"km":61,"via":"A41 and D913","q":""},{"n":"Samoens","m":70,"b":80,"km":62,"via":"D1203","q":""},{"n":"Les Gets","m":75,"b":85,"km":64,"via":"D1203 and D902","q":"Morzine D902"}],"near":45,"n30":0,"n60":4,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"Une grande salle de jeux avec un baby-foot; collection de jeux de société","toys_outside":"aménagements extérieurs et une piscine hors-sol pour les enfants","large_garden":null,"winter_restriction":null,"access_issue":null},"av":["f27"],"q":["Aravis D909"],"ski":"Le Semnoz (25 min); Les Aravis / La Clusaz & Le Grand-Bornand (35-40 min)","notes":"Farmhouse near Annecy, 5 bed/2 bath, big games room + board games, kids' outdoor play; Semnoz 25 min, La Clusaz 35-40 min.","score":62,"stars":3.0,"gp":247,"rr":83,"gr":5.0,"ex":3,"owner":"Sebastien","recip":true,"desc":[{"loc":"tr","title":"Large charming house in a farmhouse complex with an exceptional view between Lake, Mountains and Geneva","gf":"Welcome to our haven of peace in Saint-Martin-Bellevue (Fillière), a charming Haute-Savoie village nestled in the heart of unspoilt nature, while remaining very close to the region's main points of interest.\nWhether you are nature lovers, keen skiers and snowboarders, fans of lazing by the lake or on a business trip, our house is the perfect base for exploring the whole of Haute-Savoie and neighbouring Switzerland.\n\nYou will find:\nA breathtaking view from a large terrace and the garden.\nA large games room with a table football\nOutdoor facilities and an above-ground pool for the children.\nFresh eggs from the hens.\nA great collection of board games\nA Petiot Concorde table football for lively matches.\nAnd very friendly neighbours who share our love for this old farmhouse.","gp":"Our house is in a quiet, peaceful neighbourhood.\n\nYou can walk to a very good bakery and a covered market hall (bar, burgers, wine shop, deli etc.) and set off on lovely walks.\n\nWe are close to all the access routes:\n-Annecy & its Lake (\"The Venice of the Alps\"): only 15 minutes away, where you can enjoy the old town, the canals, the beaches with turquoise water and the cycle path that goes round the lake.\n-Geneva & Switzerland: 30 minutes via the A41 motorway (very quick access).\n\nThe Ski Resorts:\n-Le Semnoz (25 min): the family resort par excellence for skiing and walks\n-Les Aravis / La Clusaz & Le Grand-Bornand (35-40 min): internationally renowned ski areas for alpine skiing, cross-country and ski touring/hikes.\n\nAlso worth doing:\n-The Plateau des Glières: a key site of the Resistance, perfect for cross-country skiing in winter and green hikes with reblochon or potato fritter tastings in summer.\n-The Gorges du Fier: a spectacular canyon with a suspended walkway (20 min away).\n-The Château de Menthon-Saint-Bernard: said to have inspired Walt Disney for Sleeping Beauty's castle.\n-The Parmelan, from which you will have a stunning view, and also Mont Veyrier & La Tournette: for hikers looking for breathtaking panoramas over the whole Annecy basin.\n\nYou won't be short of things to do in the area :)","ot":"Unfortunately our house is not accessible to people with reduced mobility as it is on 3 floors with stairs. We are very sorry about that.\n\nAnd we cannot accommodate your pets because we have hens and tortoises (including a "},{"loc":"fr","title":"Grande maison de charme dans corps de ferme avec vue exceptionnelle entre Lac, Montagnes et Genève","gf":"Bienvenue dans notre havre de paix situé à Saint-Martin-Bellevue (Fillière), un charmant village haut-savoyard niché au cœur d'une nature préservée, tout en restant à proximité immédiate des plus grands points d'intérêt de la région.\nQue vous soyez amoureux de la nature, passionnés de glisse, adeptes du farniente au bord du lac ou en voyage d'affaires, notre maison est le point de départ parfait pour rayonner dans toute la Haute-Savoie et la Suisse voisine.\n\nVous y trouverez :\nUne vue a couper le souffle depuis une grande  terrasse et le jardin.\nUne grande salle de jeux avec un baby-foot\nDes aménagements extérieurs et une piscine hors-sol pour les enfants. \nDes œufs frais des poules.\nUne belle collection de jeux de société\nUn baby-foot Petiot Concorde pour des parties endiablées.\nEt des voisins très sympathiques qui partagent notre amour pour cet ancien corps de ferme.","gp":"Notre maison se trouve dans un quartier calme et paisible.\n\nVous pourrez accéder à pied à une très bonne boulangerie et des Halles (bar, burger, caviste, traiteur etc) et pourrez partir faire belles balades à pied.\n\nNous sommed proches de  tous les accès :\n-Annecy & son Lac (« La Venise des Alpes ») : À seulement 15 minutes où vous pourrez profiter de la vieille ville, des canaux, des plages aux eaux turquoise et de la piste cyclable qui fait le tour du lac.\n-Genève & la Suisse : À 30 minutes via l'autoroute A41 (accès très rapide).\n\n Les Stations de Ski :\n -Le Semnoz (25 min) : La station familiale par excellence pour le ski et les balades\n -Les Aravis / La Clusaz & Le Grand-Bornand (35-40 min) : Domaines skiables de renommée internationale pour le ski alpin, le fond et les randos.\n\nÉgalement à faire :\n-Le Plateau des Glières : Haut-lieu de la Résistance, parfait pour le ski de fond en hiver et les randonnées verdoyantes avec dégustation de reblochon ou beignets de pomme de terre en été.\n -Les Gorges du Fier : Un canyon spectaculaire aménagé sur une passerelle suspendue (à 20 min).\n-Le Château de Menthon-Saint-Bernard : Qui aurait inspiré Walt Disney pour le château de la Belle au Bois Dormant.\n -Le Parmelan sur lequel vous aurez une vue imprenable mais aussi le Mont Veyrier & La Tournette : Pour les randonneurs en quête de panoramas à couper le souffle sur tout le bassin annécien.\n\nVous ne manquerez pas d’activités à faire dans le secteur :)","ot":"Notre maison n’est malheureusement pas accessible aux personnes PMR car elle est sur 3 étages avec des escaliers. Nous en sommes navrés.\n\nEt nous ne pouvons pas accueillir vos animaux car nous avons des poules et des tortues (notamment une "}],"ph":["3228230_0","3228230_1","3228230_2","3228230_3","3228230_4","3228230_5","3228230_6","3228230_7","3228230_8","3228230_9","3228230_10","3228230_11","3228230_12","3228230_13","3228230_14","3228230_15","3228230_16","3228230_17","3228230_18","3228230_19","3228230_20","3228230_21","3228230_22","3228230_23","3228230_24","3228230_25","3228230_26"]},{"v":"V48","n":48,"id":2269385,"t":"La Pommeraie","town":"Vimines","cc":"France","region":"Bauges","lat":45.545120161207386,"lon":5.857353181686045,"bd":5,"ba":1,"cap":10,"m2":140,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":1,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"St-Pierre-de-Chartreuse","m":45,"b":45,"km":35,"via":"D1006 and D520B","q":"Maurienne"},{"n":"Aillons-Margeriaz","m":55,"b":65,"km":31,"via":"D206","q":""},{"n":"La Feclaz (Grand Revard)","m":55,"b":60,"km":27,"via":"D912","q":""},{"n":"Le Sappey","m":60,"b":65,"km":47,"via":"Rte du Col de Pte./D512","q":""},{"n":"Les 7 Laux","m":60,"b":70,"km":58,"via":"A41","q":""},{"n":"Le Collet d'Allevard","m":65,"b":75,"km":60,"via":"A41","q":""},{"n":"Crest-Voland","m":75,"b":90,"km":84,"via":"A43","q":"Maurienne A43"},{"n":"La Clusaz","m":85,"b":110,"km":87,"via":"A41","q":""}],"near":45,"n30":0,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":["f27"],"q":["Maurienne"],"ski":null,"notes":"Old farmhouse near Chambéry, 5 bed/1 bath sleeps 10; no ski claim, owners focus on summer; one bathroom for 12 is a problem.","score":62,"stars":3.0,"gp":255,"rr":77,"gr":4.89,"ex":12,"owner":"Mathias et Morgane","recip":true,"desc":[{"loc":"tr","title":"La Pommeraie (The Apple Orchard)","gf":"The house is a former farmhouse. Divided into several parts, the north side was modernised in the second half of the 20th century, which is what gives it its different look from the rest of the farmhouse.\nBetween mountains (Chartreuse and Bauges), lakes (Bourget, Aiguebelette, ...) and towns (Chambéry 10 min away, Annecy 30 min, Grenoble 40 min, Lyon 45 min, Geneva 1 hour), our house offers a wide choice of holiday types (active, urban, but always with peace and quiet).\nThe house has 5 bedrooms, 4 of them with double beds.\nBathtub, dishwasher, washing machine and tumble dryer.\nThe house also has a lovely terrace, a garden, a vegetable garden and a henhouse.\nThe property used to be surrounded by fields for sheep farming, which over time became apple and pear orchards. The owners of this farm decided to practise sustainable farming, favouring alternatives to pesticides (clay, essential oils, naturally resistant varieties, traps…).\nThe house takes its name \"La Pommeraie\" (the apple orchard) from this local activity.","gp":"The house is in the countryside while having access to the town of Chambéry 10 min away by car, Annecy 30 min, Grenoble 45 min, and Lyon and Geneva 1 hour.\nFields surround the house, and there is a remarkable calm (birdsong and the deep silence of the night). The evenings are pleasant, there is fresh air, and we sleep very well there in summer and winter alike.\nThe setting is also very beautiful. The house is surrounded by mountains, with walks/hikes right from the house (Épine massif) or further afield in the Chartreuse.\nYou can also taste the local specialities, of which there are many.","ot":"Above all, we want simplicity and friendliness in our exchanges. We want you to have a lovely summer in our house, which we are very fond of. It is very welcoming, but it is not new or spick and span. We are simple people when we travel and we don't want any pressure in our exchanges. We love the idea of sharing ways of life, books and activities, and we will take care of your home with kindness and respect."},{"loc":"fr","title":"La Pommeraie","gf":"La maison est un ancien corps de ferme. Séparé en plusieurs parties, le côté nord a été modernisé dans la deuxième moitié du 20éme siècle, c’est ce qui lui donne son aspect différent du reste du corps de ferme. \r\nEntre montagnes (Charteuse et Bauges), lacs (Bourget, Aiguebelette, ...) et ville (Chambéry à 10min, Annecy à 30min, Grenoble à 40min, Lyon à 45min, Genève à 1h), notre maison bénéficie d'un large choix de type de vacances (sportive, urbaine mais toujours avec de la tranquillité). \r\nLa maison dispose de 5 chambres avec lit doubles pour 4 d'entre elles. \r\nBaignoire, lave vaisselle, lave linge et sèche linge. \r\nLa maison dispose également d'une belle terrasse, d'un jardin, d'un potager et d'un poulailler. \r\nLa propriété était auparavant entourée par des champs pour l’élevage des moutons qui sont devenus au fil du temps des vergers de pommes et de poires. Les propriétaires de cette exploitation ont décidés de faire une agriculture raisonnée, favorisant des méthodes alternatives aux pesticides (argile, huiles essentielles, variétés résistantes naturellement, pièges…).\r\nLa maison tient son nom de « La Pommeraie » de cette activité locale.","gp":"La maison est à la campagne tout en bénéficiant d'un accès à la ville de Chambéry à 10min en voiture, Annecy 30 mn,  Grenoble 45min et Lyon et Génève à 1h.\nLes champs entourent la maison, un calme remarquable (oiseaux qui chantent et le silence profond de la nuit) y règne. Les soirées sont agréables, il y a de l'air, nous y dormons très bien été comme hiver. \nLe cadre est aussi très beau. La maison est entourée de montagnes et les balades/randonnées au pied de la maison (massif de l'épine) ou plus loin dans la Chartreuse.\nVous pourrez aussi déguster les spécialités locales qui sont nombreuses.","ot":"Nous souhaitons avant tout de la simplicité et de la convivialité dans nos échanges. Nous souhaitons que vous passiez un bel été dans notre maison que nous affectionnons beaucoup. Elle est très accueillante mais ce n'est pas neuf ni tiré à 4 épingles. Nous sommes simples quand nous voyageons et nous ne souhaitons aucune pression dans nos échanges. Nous aimons l'idée de partager des manières de vivre, des livres, des activités et prendrons soin de votre chez vous avec bienveillance et respect."}],"ph":["2269385_0","2269385_1","2269385_2","2269385_3","2269385_4","2269385_5","2269385_6","2269385_7","2269385_8","2269385_9","2269385_10"]},{"v":"V49","n":49,"id":2998774,"t":"CHALET SAMOENS","town":"Samoëns","cc":"France","region":"Portes du Soleil","lat":46.08310584962826,"lon":6.718482163805197,"bd":4,"ba":2,"cap":10,"m2":105,"typ":"House","mn":5,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":4,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Samoens","m":6,"b":6,"km":2,"via":"Rte de Taninges/D907","q":""},{"n":"Les Gets","m":28,"b":30,"km":22,"via":"D907 and D902","q":"Morzine D902"},{"n":"Les Carroz","m":35,"b":40,"km":24,"via":"D6","q":""},{"n":"Praz de Lys-Sommand","m":35,"b":35,"km":24,"via":"D907 and D902","q":"Morzine D902"},{"n":"Morzine","m":40,"b":45,"km":28,"via":"D907 and D902","q":"Morzine D902"},{"n":"Combloux","m":55,"b":65,"km":42,"via":"A40","q":""},{"n":"Flaine","m":55,"b":55,"km":38,"via":"D106","q":""},{"n":"Les Houches","m":55,"b":70,"km":53,"via":"A40","q":""}],"near":6,"n30":2,"n60":10,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden" ise","lat":45.40741389920281,"lon":6.494935934298084,"bd":6,"ba":3,"cap":13,"m2":147,"typ":"House","mn":3,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":8,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"St-Martin-de-Belleville","m":7,"b":7,"km":4,"via":"D117","q":""},{"n":"Champagny","m":45,"b":45,"km":28,"via":"D96 and D915","q":""},{"n":"Meribel","m":45,"b":45,"km":26,"via":"D96 and D90","q":""},{"n":"Courchevel","m":50,"b":55,"km":33,"via":"D96 and D91A","q":""},{"n":"Valmorel","m":50,"b":50,"km":31,"via":"D96 and D95","q":""},{"n":"La Plagne","m":60,"b":65,"km":47,"via":"N90 and D221","q":"Tarentaise N90"},{"n":"Saint-Francois-Longchamp","m":75,"b":80,"km":54,"via":"D213","q":""},{"n":"Les Arcs","m":90,"b":100,"km":63,"via":"N90","q":"Tarentaise N90"}],"near":7,"n30":1,"n60":6,"fac":{"fireplace":true,"sauna":false,"toysIn":false,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":"Un salon avec poêle, nous vous fournissons le bois (stove)","sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"Situé à 2.5 kms de St Martin de Belleville (3 Vallées); <5 minutes des activités","notes":"Chalet for 12 in Les Varcins, 2.5 km from St-Martin lifts (3 Vallées), wood stove, 3 baths; strong fit, short drive to lifts.","score":61,"stars":3.0,"gp":337,"rr":80,"gr":4.88,"ex":14,"owner":"sebastien","recip":false,"desc":[{"loc":"tr","title":"Sébastien's house,\nChalet Le Lys Martagon - 12 people - Les 3 Vallées - magnificent view!","gf":"Welcome to our chalet,\nIt is equipped to sleep 12 people; the sleeping arrangements are as follows:\n 4 bedrooms, a mezzanine, an enclosed alcove.\n3 bathrooms\nA living room with a stove; we provide the wood for lovely evenings by the fire.\nThe windows offer a beautiful view of the mountains.\nA terrace, 2 balconies and a green space with a pétanque court, furniture, barbecue.\nThe chalet is very well equipped; you will lack for nothing.\n\nThere are lots of activities, in winter as in summer!","gp":"Located 2.5 km from St Martin de Belleville (3 Vallées ski area, the largest ski area in the world; Vanoise national park, for protected flora and fauna) in the traditional village of Les Varcins.\nThe village is calm and peaceful, far from the noise of the resort, but less than 5 minutes from activities, shops, restaurants...\nOf course you can set off on walks from the chalet.\nFrom the village of Saint Martin you have direct access to the slopes of the Belleville valley (Saint Martin, Les Menuires, Val-Thorens) and also to the neighbouring valleys (Méribel, Courchevel).","ot":""},{"loc":"fr","title":"La maison de Sébastien, \nChalet Le lys Martagon - 12 personnes - Les 3 Vallées - vue magnifique !","gf":"Bienvenue dans notre chalet, \nIl est équipé pour accueillir 12 personnes, les couchages se disposent de la façons suivantes :\n 4 chambres, une mezzanine, une alcôve fermée.\n3 Salles de bain\nUn salon avec poêle, nous vous fournissons le bois pour de beaux moments le soir au coin du feu.\nLes ouvertures offrent une belle vue sur la montagne.\nUne terrasse, 2 balcons et un espace vert avec jeu de pétanque, mobilier, barbecue.\nLe chalet est très bien équipé, vous ne manquerez de rien.\n\nLes activités sont nombreuses, que ce soit en hiver comme en été !","gp":"Situé à 2.5 kms de St Martin de Belleville (domaine skiable des 3 Vallées, le plus garnd domaine skiable du monde, parc national de la Vanoise, pour une flore et une faune protégée) dans le village typique des Varcins. \nLe village est calme et paisible, loin du bruit de la station, mais a moins de 5 minutes des activités, commerces, restaurants...\nBien sur vous pouvez partir en ballade depuis le chalet.\nDepuis le village de Saint Martin vous accédez directement aux pistes de la vallée des Belleville (Saint Martin, Les Menuires, Val-Thorens) mais également aux vallées voisines (Méribel, Courchevel).","ot":""}],"ph":["2817253_0","2817253_1","2817253_2","2817253_3","2817253_4","2817253_5","2817253_6","2817253_7","2817253_8","2817253_9","2817253_10","2817253_11","2817253_12","2817253_13","2817253_14","2817253_15","2817253_16","2817253_17","2817253_18","2817253_19","2817253_20","2817253_21","2817253_22","2817253_23","2817253_24","2817253_25","2817253_26","2817253_27","2817253_28","2817253_29","2817253_30","2817253_31","2817253_32","2817253_33","2817253_34","2817253_35","2817253_36","2817253_37","2817253_38","2817253_39","2817253_40","2817253_41","2817253_42","2817253_43","2817253_44","2817253_45","2817253_46","2817253_47","2817253_48","2817253_49","2817253_50"]},{"v":"V52","n":52,"id":2801630,"t":"Karine's house","town":"Crest-Voland","cc":"France","region":"Mont Blanc","lat":45.79030904883693,"lon":6.495671278617585,"bd":4,"ba":2,"cap":10,"m2":100,"typ":"House","mn":4,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":4,"children_bed":2,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Crest-Voland","m":2,"b":2,"km":1,"via":"Chem. des Pieux and D71A","q":""},{"n":"Les Saisies","m":18,"b":20,"km":10,"via":"D71A","q":""},{"n":"Megeve","m":28,"b":30,"km":16,"via":"D1212","q":"Val d'Arly D1212"},{"n":"Combloux","m":35,"b":40,"km":21,"via":"D1212","q":"Val d'Arly D1212"},{"n":"Saint-Gervais","m":40,"b":45,"km":26,"via":"D1212","q":"Val d'Arly D1212"},{"n":"La Clusaz","m":50,"b":50,"km":28,"via":"Rte du Col des Aravis/D909","q":""},{"n":"Les Contamines","m":50,"b":60,"km":35,"via":"D1212","q":"Val d'Arly D1212"},{"n":"Le Grand-Bornand","m":55,"b":60,"km":33,"via":"Rte du Col des Aravis/D909","q":""}],"near":2,"n30":3,"n60":9,"fac":{"fireplace":true,"sauna":false,"toysIn":false,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":["Val d'Arly D1212"],"ski":"A 3 minutes en voiture ou 5 minutes en navette l'hiver, la station de Crest-Voland; Les Saisies 10 min","notes":"Cosy 100 m2 chalet flat in Crest-Voland, 4 bed/2 bath, 3 min to lifts (Espace Diamant), Saisies 10 min; sleeps 10 - tight for 12.","score":60,"stars":3.0,"gp":207,"rr":100,"gr":5.0,"ex":11,"owner":"Karine","recip":false,"desc":[{"loc":"tr","title":"Chalet Bonne Etoile (Lucky Star)","gf":"Our chalet is an ideal place to recharge in peace and quiet. It is located in the heart of the Savoie Alps. Very comfortable, with a cosy atmosphere. Very pretty view of the Aravis range.\nCome and discover the Val d'Arly and the Beaufortain and their charming Savoyard villages.\nMany hikes possible, on foot, by mountain bike...\nThe Mont Blanc massif is very close.\nSwimming possible in pools and in various lakes.\nThe chalet is non-smoking.","gp":"Ten minutes' walk from the chalet, the authentic village of Crest-Voland has several shops. Very good bakery, butcher's, mini-market, shop selling Savoyard products, restaurants, sports shop and sports equipment rental (mountain bikes...), souvenir and decoration shops.\n10 minutes by car: the resort of Les Saisies.\n3 minutes by car or 5 minutes by shuttle in winter: the Crest-Voland resort.\nHalf an hour away: Albertville and Megève.\nNot very far from Annecy.","ot":"Come and settle in comfortably in our little corner of paradise!"},{"loc":"fr","title":"Le chalet Bonne Etoile","gf":"Notre chalet, est un lieu idéal pour se ressourcer au calme. Il est situé au cœur des Alpes savoyardes. Très confortable et d'ambiance cosy. Très jolie vue sur la chaîne des Aravis.\nVenez découvrir le Val D'Arly et le Beaufortain et leurs charmants villages savoyards.\nDe nombreuses randonnées possibles, à pied, en VTT... \nLe massif du Mont Blanc tout proche.\nDes possibilités de baignades en piscine et dans différents lacs.\nLe chalet est non fumeur.","gp":"A dix minutes à pieds du chalet, le village authentique de Crest-Voland dispose de plusieurs commerces. Très bonne boulangerie, boucherie, supérette, épicerie de produits savoyards, restaurants, magasin de sport et de location de matériel sportif ( VTT...), magasins de souvenirs et décoration.\nA 10 minutes en voiture, la station des Saisies.\nA 3 minutes en voiture ou 5 minutes en navette l'hiver, la station de Crest voland.\nA une demie heure : Albertville et Megève.\nPas très loin d'Annecy.","ot":"Venez vous installer confortablement dans notre coin de paradis!"}],"ph":["2801630_0","2801630_1","2801630_2","2801630_3","2801630_4","2801630_5","2801630_6","2801630_7","2801630_8","2801630_9","2801630_10","2801630_11","2801630_12","2801630_13"]},{"v":"V53","n":53,"id":2157155,"t":"Helle Wohnung am Fuße der Alpen","town":"Wertach","cc":"Germany","region":"Allgaeu","lat":47.604866621703174,"lon":10.41723897064156,"bd":3,"ba":2,"cap":11,"m2":110,"typ":"Apartment","mn":5,"beds":{"big_double_bed":1,"double_bed":2,"single_bed":2,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Nesselwang","m":12,"b":12,"km":9,"via":"B310","q":""},{"n":"Jungholz","m":14,"b":14,"km":8,"via":"B310","q":""},{"n":"Pfronten Breitenberg","m":26,"b":30,"km":20,"via":"B310","q":""},{"n":"Tannheim","m":35,"b":35,"km":28,"via":"B310 and Tannheimer Str./B199","q":""},{"n":"Oberstdorf","m":45,"b":50,"km":36,"via":"B19","q":""}],"near":12,"n30":3,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":false,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"a lot of toys and books for kids up to 4yrs","toys_outside":"we have scooters and play stuff for outdoors","large_garden":null,"winter_restriction":null,"access_issue":"two parking spaces"},"av":["x27"],"q":[],"ski":"From our doorstep ... skiing, cross-country skiing and sledding; Loipe passes the house","notes":"Wertach (Allgäu) flat, great for toddlers (toys, playground opposite) but 3 bedrooms/sleeps ~8-11 - too small for 12.","score":60,"stars":3.0,"gp":260,"rr":86,"gr":5.0,"ex":34,"owner":"Andrea","recip":true,"desc":[{"loc":"tr","title":"Bright apartment at the foot of the Alps","gf":"*****for German see below****\n\nOur bright and spacious four-room-flat is bedded in a romantic little mountain village right at the start of the Alps with great touristic infrastructure. \n\nFrom our doorstep you have plenty possibillities for hiking, skiing, cross-country skiing and sledding etc... there are no limits for outdoor activities. \n\nMunich is a two-hours drive an the next International Airports are Stuttgart, Munich or Zürich Airport (all 2,5hrs-drive)\nThe next domestic/European Airport is Memmingen (40mins drive)\nNext motorway: 10mins to A7 that leads North and South. \nAustria ist just a 10mins drive away.\n\nRegarding the apartment:\nWe have 3 bedrooms: \nMaster bedroom with a double bed 180x200cm.\nGuestroom with a \"wardrobebed\" 160x200cm.\nKids' bedroom with two beds 70x140 or additionally two matresses 90×200.\n\nOn top our couch in the living room can be extended for a additional sleeping space of 140×200.\n\nI would say we can easily host up to 2 families with 2-3 kids or a family with gradparents.\n\nWe do have a lot of toys and books for kids up to 4yrs. Also, we have scooters and play stuff for outdoors.\n\nThere a two parking spaces for your car.\n\nOf course, we have a fully equipped kitchen and a dining table for 8 persons.\n\nWe also have Netflix and Sky access for lazy days or relaxing evenings. :)\n\nOur apartment has been newly renovated and we will keep on updating pictures step by step.\n\n*********GERMAN*******\n\nOur bright 4-room apartment is in the Alps in an idyllic small tourist village.\n\nMany cycling and hiking trails start right outside our front door. In winter a cross-country ski trail also runs right past the front door.\n\nOur apartment is on two floors (1st floor and attic floor) and has two balconies with mountain views. We have 3 bedrooms – one with a double bed (180x200cm), the second with 2 children's beds (2 x 70x140cm – alternatively with 2 mattresses on the floor 90x200) and a guest room with a wardrobe double bed (160x200cm).\nIn addition, our couch can be pulled out (approx. 140x200cm).\n\nEverything you need for daily life is within walking distance: supermarkets, bakers, butchers, restaurants, doctors and pharmacy. We have 2 parking spaces at the house.\n\nWe modernised up to August 2022 and will keep updating the pictures.","gp":"****for German see below******\n\n\nWe live in a quiet family friendly area in a dead end street in an apartment building with 4 flats. Our spacious and bright home spreads over two floors with two balconies that have mountain views. \n\nThe supermarket and any other daily amendities (farmacy, butcher and bakery...) are within walking distance. \n\n**** GERMAN*****\n\nWe live in a 4-family house in a cul-de-sac. The neighbourhood is quiet and family-friendly. A playground and outdoor pool are a 5-minute walk away. There is also a supermarket just around the corner. In winter the cross-country ski trail runs past our house and in summer cycling and hiking trails are directly accessible.","ot":"International sightseeing Highlight Neuschwanstein Castle is just a 30mins drive.\n\nAdditionally, there is a big indoor play hall within walking distance for rainy days. (Check out on Google \"Allgäulino Wertach\")\n\nFurthermore, an outdoor playground is across the street as well as a football pitch. \n\nThe Lake Grüntensee also provides two beaches for swimming, a playground for kids (see pics) and a Kletterwald (climbing forest) for the older kids. \n\n***** German*****\nNeuschwanstein Castle can be reached by car within 30 min. In addition, the leisure options are limitless in terms of hiking, biking, skiing and tobogganing.\n\nAs a bad-weather alternative there is the Allgäulino in the village (indoor play hall – just Google it) and the ABC swimming pool in Nesselwang.\n\nThe outdoor playground is across the street.\n\nThe Grüntensee also offers 2 swimming spots and boat hire, as well as a climbing forest."},{"loc":"de","title":"Helle Wohnung am Fuße der Alpen","gf":"*****für Deutsch siehe unten****\n\nOur bright and spacious four-room-flat is bedded in a romantic little mountain village right at the start of the Alps with great touristic infrastructure. \n\nFrom our doorstep you have plenty possibillities for hiking, skiing, cross-country skiing and sledding etc... there are no limits for outdoor activities. \n\nMunich is a two-hours drive an the next International Airports are Stuttgart, Munich or Zürich Airport (all 2,5hrs-drive)\nThe next domestic/European Airport is Memmingen (40mins drive)\nNext motorway: 10mins to A7 that leads North and South. \nAustria ist just a 10mins drive away.\n\nRegarding the apartment:\nWe have 3 bedrooms: \nMaster bedroom with a double bed 180x200cm.\nGuestroom with a \"wardrobebed\" 160x200cm.\nKids' bedroom with two beds 70x140 or additionally two matresses 90×200.\n\nOn top our couch in the living room can be extended for a additional sleeping space of 140×200.\n\nI would say we can easily host up to 2 families with 2-3 kids or a family with gradparents.\n\nWe do have a lot of toys and books for kids up to 4yrs. Also, we have scooters and play stuff for outdoors.\n\nThere a two parking spaces for your car.\n\nOf course, we have a fully equipped kitchen and a dining table for 8 persons.\n\nWe also have Netflix and Sky access for lazy days or relaxing evenings. :)\n\nOur apartment has been newly renovated and we will keep on updating pictures step by step.\n\n*********DEUTSCH*******\n\nUnsere helle 4 Zimmer Wohnung liegt in den Alpen in einem idyllischen kleinen touristischem Ort. \n\nViele Rad- und Wanderwege gehen direkt vor unserer Haustüre los. Im Winter geht auch eine Langlaufloipe direkt an der Haustüre vorbei.\n\nUnsere Wohnung verfügt über zwei Stockwerke ( 1.OG und DG) und zwei Balkone mit Bergblick. Wir haben 3 Schlafzimmer - eins mit Doppelbett (180x200cm), das zweite mit 2 Kinderbetten (2 x 70x140cm - alternativ mit 2 Matratzen am Boden 90x200) und ein Gästezimmer mit Schrank-Doppelbett (160x200cm). \nZusätzlich besteht die Möglichkeit unsere Couch auszuziehen (ca 140x200cm)\n\nFußläufig ist alles erreichbar was man für den täglichen Bedarf benötigt: Supermärkte, Bäcker, Metzger, Restaurants, Ärzte und Apotheke. Wir haben 2 Stellplätze am Haus. \n\nWir haben bis August 2022 modernisiert und werden die Bilder  ständig aktualisieren.","gp":"****für Deutsch siehe unten******\n\n\nWe live in a quiet family friendly area in a dead end street in an apartment building with 4 flats. Our spacious and bright home spreads over two floors with two balconies that have mountain views. \n\nThe supermarket and any other daily amendities (farmacy, butcher and bakery...) are within walking distance. \n\n**** DEUTSCH*****\n\nWir wohnen in einem 4 Familienhaus in einer Sackgasse. Die Nachbarschaft ist ruhig und familienfreundlich. Ein Spielplatz und Freibad sind zu Fuß in 5 Min erreichbar. Zudem ist ein Supermarkt direkt ums Eck. Im Winter führt die Langlaufloipe an unserem Haus vorbei und im Sommer sind Rad- und Wanderwege direkt erreichbar.","ot":"International sightseeing Highlight Neuschwanstein Castle is just a 30mins drive.\n\nAdditionally, there is a big indoor play hall within walking distance for rainy days. (Check out on Google \"Allgäulino Wertach\")\n\nFurthermore, an outdoor playground is across the street as well as a football pitch. \n\nThe Lake Grüntensee also provides two beaches for swimming, a playground for kids (see pics) and a Kletterwald (climbing forest) for the older kids. \n\n***** Deutsch*****\nSchloss Neuschwanstein ist mit dem Auto innerhalb 30min erreichbar. Zudem sind die Freizeitmöglichkeiten grenzenlos bzgl Wandern, Biken, Skifahren und Rodeln.\n\nAls schlecht Wetter Alternative gibt es im Ort das Allgäulino (Indoor Spielhalle - einfach Googeln), das ABC Schwimmbad in Nesselwang. \n\nDer outdoor Spielplatz ist auf der anderen Straßenseite. \n\nZudem bietet der Grüntensee 2 Bademöglichkeiten und Bootsverleih sowie einen Kletterwald."}],"ph":["2157155_0","2157155_1","2157155_2","2157155_3","2157155_4","2157155_5","2157155_6","2157155_7","2157155_8","2157155_9","2157155_10","2157155_11","2157155_12","2157155_13","2157155_14","2157155_15","2157155_16","2157155_17","2157155_18","2157155_19","2157155_20","2157155_21","2157155_22","2157155_23","2157155_24","2157155_25","2157155_26","2157155_27","2157155_28","2157155_29","2157155_30","2157155_31","2157155_32","2157155_33","2157155_34","2157155_35","2157155_36","2157155_37"]},{"v":"V54","n":54,"id":3025719,"t":"Duplex de 5 chambres de 178m2 aux 2 Alpes","town":"Mont-De-Lans","cc":"France","region":"Oisans","lat":45.020851291392546,"lon":6.12989265797627,"bd":5,"ba":4,"cap":15,"m2":178,"typ":"Apartment","mn":0,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":6,"children_bed":0,"baby_bed":1,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Les 2 Alpes","m":7,"b":7,"km":2,"via":"Av. de la Muzelle/D213","q":""},{"n":"Alpe d'Huez","m":55,"b":60,"km":33,"via":"D211","q":""},{"n":"Oz-Vaujany","m":65,"b":70,"km":40,"via":"D1091","q":"Oisans D1091"},{"n":"Valloire","m":85,"b":100,"km":60,"via":"D1091 and D902","q":"Oisans D1091"},{"n":"Chamrousse","m":90,"b":100,"km":72,"via":"D1091","q":"Oisans D1091"},{"n":"Le Sappey","m":100,"b":110,"km":86,"via":"D1091","q":"Oisans D1091"},{"n":"Les 7 Laux","m":110,"b":130,"km":105,"via":"D1091","q":"Oisans D1091"},{"n":"Le Collet d'Allevard","m":120,"b":140,"km":116,"via":"D1091","q":"Oisans D1091"}],"near":7,"n30":1,"n60":2,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":false,"garden":false,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"wint well exposed. It has 4 bedrooms, two bathrooms, a large living room and a well-equipped kitchen, a large shaded terrace, a garden (barbecue, swings, ping pong table, trampoline .), a large basement.\n\nIt is located in a small town in Aix les Bains, in the heart of Savoy, which has many attractions for holidaymakers: hiking, cycling, climbing, swimming, culture.\n\n- 5 minutes from Lake Bourget at Aix les Bains ( swimming, sailing, canoeing...)\n- 15 minutes from Lake Aiguebelette\n- 20 minutes from Annecy and its lake\n- 20 minutes from Chambéry\n- 15 minutes from the Parc des Bauges (walking and donkey rides, canirando, parapente, ecomuseum, nature house...), and not far from the other alpine massifs (Aravis ...)\n- 1h from Lyon and Chamonix\n- 45 minutes from Switzerland  \n\nWe have a cat that lives exclusively outside (allergic welcome !) and 3 chickens that will give you good fresh eggs and require very little care (our neighbor can take care of them if you prefer).\nIn summer you can enjoy tomatoes and raspberries (no watering).","gp":"comfortable house, with a large garden\nquiet but 5 minutes from  the lake and 15 minutes from the massif des Bauges\nwell adapted house with children: many indoor and outdoor games, books...","ot":"Welcome to Savoie and let us discover your region !"},{"loc":"fr","title":"maison chaleureuse entre lacs et montagnes :  à 15 minutes du plateau de ski de Savoie Grand Revard","gf":"La maison se situe dans une petite commune touchant Aix les Bains, au cœur de la Savoie, un département où on a le choix des activités en été comme en hiver : randonnées, vélo, escalade, via ferrata, canyoning, parapente, baignade dans les lacs ou en rivière (vasques du Chéran), ski de piste, de fond, de randonnée, raquettes, culture...\n\n- à 5 minutes du lac du Bourget ( baignade, voile, canoë...) \n- à 15 minutes du lac d'Aiguebelette \n- à 20 minutes d'Annecy \n- à 20 minutes de Chambéry \n- à 15 minutes du Parc des Bauges (balades à pied et en ânes, écomusée, maison de la nature, Grand Revard pour la randonnée, le ski et les balades en raquette), et non loin des autres massifs Alpins (Belledonnes, Aravis, Chartreuse, Beaufortain...) .\n- à 1h de Lyon et de Chamonix \n- à 45 minutes de la Suisse\n\nNous aimons beaucoup marcher et vous trouverez en arrivant des guides et des cartes pour choisir vos randonnées.\nNous laissons des vélos à disposition.\n\nNotre maison est confortable, lumineuse et chaleureuse, bien isolée, elle reste fraîche l'été. Elle comporte 4 chambres, toutes pourvues d'un lit deux places (possibilité de rajouter un matelas une place confortable dans trois d'entre d'elles), deux salles de bain, un grand séjour avec un poêle et une cuisine bien équipée, une grande terrasse ombragée , un jardin de 1000 m2 (barbecue,  table de ping pong, slack line), une cabane pour les enfants. \n\nNous ne sommes pas très TV, même si notre équipement est très fonctionnel, et la TV se situe dans une des chambres et pas dans la pièce de vie. \nVous trouverez beaucoup de livres,  de jeux de société, un piano d'appoint.\n\n\nNous avons trois poules qui vous donneront de bons œufs frais et qui exigent très peu de soin (notre voisine peut s'en charger si vous préférez).\nNous avons un jeune chat très câlin et facile à vivre qui navigue entre dehors et dedans. \nSelon la saison vous pourrez profiter des légumes du potager.","gp":"Le quartier est tranquille et le voisinage sympathique. \nLa maison est donc au  calme mais à 5 minutes d'Aix les Bains, du lac du Bourget (en 15 minutes à vélo en descente, un peu plus pour remonter !) et 15 minutes du massif des Bauges pour randonner l été et skier l hiver. \nMaison bien adaptée avec des enfants : nombreux jeux , livres...","ot":"Bienvenue en Savoie et au plaisir de découvrir votre coin !"}],"ph":["1458842_0","1458842_1","1458842_2","1458842_3","1458842_4","1458842_5","1458842_6","1458842_7","1458842_8","1458842_9","1458842_10","1458842_11","1458842_12","1458842_13","1458842 rden, surrounded by nature and close to exciting cities","gf":"Spacious house just below 1000m elevation - with view of the French Alps. You will enjoy the quiet green surroundings and plenty of mountain, lake and city activities. \n\nOur home offers space for up to 10 guests, includes a modern kitchen for your aperos, two bathrooms including a walk-in shower, and relaxing living spaces, including a garden, terrace and pizza oven.","gp":"We are 45 min from Geneva airport, 30 min from Geneva city centre, 25 min from Annecy, 45 min from Chamonix and 10 min from the medieval French city La Roche-sur-Foron with a train station. \n\nWe live on a small mountain ridge, where we have more four-legged than two-legged neighbours, and largely pastures and small forests with a few houses and farms (several that sell their own alpine cheese) in-between. \n\nYou can start various strolls or mountain-bike tours directly from the doorstep, while in winter, the cross-country ski track is 10 min away by foot, and about 10-15 ski resorts are reachable within 45 min by car.","ot":"We welcome families with babies and children, and can offer to share some of the needed equipment to make your travel easier. In terms of organizing our home for your stay, we may be able to adapt the room setup and other details - to be discussed, also depending on our plans during the respective period.\n\nThe home includes a carport for two vehicles and we can for arrange a dry place to store bicycles, skis or other equipment."}],"ph":["1898349_0","1898349_1","1898349_2","1898349_3","1898349_4","1898349_5","1898349_6","1898349_7","1898349_8","1898349_9","1898349_10","1898349_11","1898349_12","1898349_13","1898349_14"]},{"v":"V59","n":59,"id":2318794,"t":"Entre lac et montagne : La maison de Virginie","town":"Montmin","cc":"France","region":"Aravis","lat":45.812237648093046,"lon":6.245683775145985,"bd":4,"ba":1,"cap":12,"m2":200,"typ":"House","mn":5,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":0,"
