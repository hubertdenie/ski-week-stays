right near the house. The village of Mattarello is well served: supermarket and pharmacy on the street corner, several bars, a huge park with various sports grounds (football, basketball, tennis, volleyball) and a playground, a library, a parish cinema. We have several bikes (for adults and children) and the cycle path along the Adige river can be reached in a few minutes. With this cycle path you can reach Lake Garda heading south and Austria heading north... simply beautiful! The nearest airport is Verona or alternatively Milan-Bergamo. Trento train station is connected to Mattarello by the bus that stops right near the house. Close to MUSE, Trento's famous Natural Science Museum: well worth a visit!","ot":""},{"loc":"it","title":"Trento: storia e natura","gf":"La nostra casa è semplicemente fantastica: indipendente pur essendo nel centro storico di un paese molto caratteristico e ben servito. E' disposta su tre livelli: zona giorno al primo piano, zona notte al secondo e stube, garage e lavanderia al piano terra (con giardino e orto). C'è anche un montacarichi/ascensore esterno. La casa è molto luminosa e spaziosa.","gp":"A 8 minuti di macchina da Trento, famosa città del Concilio, 25 in autobus che passa proprio vicino casa. Il paese di Mattarello è ben servito: supermercato e farmacia all'angolo della strada, diversi bar, enorme parco con diversi campi sportivi (calcio, basket, tennis, pallavolo) e parco giochi, biblioteca, cinema parrocchiale. Disponiamo di diverse bici (per grandi e piccini) e la pista ciclabile che costeggia il fiume Adige si raggiunge in pochi minuti. Ciclabile con cui si raggiunge il lago di Garda in direzione Sud e l'Austria in direzione Nord... semplicemente bellissima! L'aeroporto più vicino è Verona o eventualmente Milano-Bergamo. La stazione dei treni di Trento è collegata a Mattarello con l'autobus che arriva proprio vicino casa. Vicini al MUSE, il famoso Museo di Scienze Naturali di Trento: merita una bella visita!","ot":""}],"ph":[ throom, summer-oriented, no ski claim - too small for 12.","score":47,"stars":2.5,"gp":204,"rr":90,"gr":5.0,"ex":6,"owner":"agnes","recip":true,"desc":[{"loc":"tr","title":"Eco-friendly house under the canopy on a high plateau of the Chartreuse","gf":"Welcome to our house made of wood, straw and earth, ideal for a quiet stay with family or friends and for walks and paragliding.\nOur living room is warm, cool in summer, bright and original thanks to the large picture windows that frame the trees and the field like paintings. You can enjoy the terrace in the cool shade of the tall beech trees to relax after days of walking, swims in the waterfall, magical mountain-bike rides or spectacular paragliding flights.\nWe have three bedrooms with double beds, one of which also has a single bed and a baby cot. Our large library of books, comics, records and board games is at your disposal for moments of discovery and sharing. It is an ideal house for enjoying nature and resting in peace and quiet.","gp":"Our neighbourhood is friendly and quiet, with a small village within walking distance where you can find organic and local food and discover books with Marine at the La Main Gauche bookshop. There are lots of walks, from easy to more challenging, such as the Dent de Crolles or the Aulp du Seuil. The cool Glésy waterfall or Les Dioux are ideal places for a refreshing swim. You will also find lots of mountain-bike routes and, of course, ways to go paragliding solo or in tandem from the world-famous site of Saint Hilaire du Touvet, 10 min away by car.","ot":""},{"loc":"fr","title":"Maison écologique sous la canopée sur un haut plateau de Chartreuse","gf":"Bienvenue dans notre maison en bois, paille et terre idéale pour un séjour en famille  ou entre amis tranquille et pour les balades et le parapente.\nNotre  pièce à vivre est chaleureuse, fraiche en été, lumineuse et originale grâce aux grandes baies vitrées qui font des tableaux sur les arbres et le champ. Vous pourrez profiter de la terrasse sous la fraicheur des grands hêtres pour vous détendre après des journées de balade, des bains dans la cascade, des sorties VTT magiques ou des vols en parapente grandioses.\nNous avons trois chambres avec des lits doubles dont une est équipée avec un lit simple et un lit pour bébé. Notre grande bibliothèque de livres, de BD, de disques et de jeux de société est à votre disposition  pour des moments de découverte et de partage. C'est une maison idéale pour profiter de la nature et se reposer au calme.","gp":"Notre quartier est chaleureux et calme avec un petit village à proximité à pied pour trouver de l'alimentation bio et locale et découvrir des livres avec Marine à la librairie La Main Gauche. Il y a plein de possibilités de balades de faciles à plus engagées comme la Dent de crolles ou l'Aube du seuil. La cascade fraiche du Glésy ou les Dioux sont des lieux idéaux pour prendre des bains frais. Vous trouverez également plein de circuits VTT et bien sur de quoi voler en parapente seul.e ou en biplace depuis le site mondialement reconnu de Saint Hilaire du Touvet à 10 mn en voiture.","ot":null}],"ph":["2934982_0","2934982_1","2934982_2","2934982_3","2934982_4","2934982_5","2934982_6","2934982_7","2934982_8","2934982_9","2934982_10","2934982_11","2934982_12","2934982_13","2934982_14"]},{"v":"V105","n":105,"id":3319851,"t":"Villa neuve haut de gamme à Genève, au pied de la montagne le Salève","town":"Vessy","cc":"Switzerland","region":"Jura","lat":46.172580248831686,"lon":6.158526746861648,"bd":4,"ba":4,"cap":10,"m2":256,"typ":"House","mn":7,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":1,"children_bed":0,"baby_bed":1,"double_bed_up":0,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Le Grand-Bornand","m":55,"b":65,"km":46,"via":"A40 and Tour du Bargy","q":""},{"n":"Les Carroz","m":55,"b":60,"km":54,"via":"A40","q":""},{"n":"Combloux","m":60,"b":70,"km":63,"via":"A40","q":""},{"n":"La Clusaz","m":60,"b":70,"km":48,"via":"A4 sant to live in, bright and suited to the whole family. The large terrace lets you fully enjoy meals and evenings outdoors, with an open view over the garden. The calm, the ease of moving around and the large interior spaces make it an ideal place to relax. And at the bottom of the garden, a little surprise awaits visitors and always makes an impression... to be discovered on site!","gp":"Our guests particularly appreciate the calm and practicality of Bessoncourt. The house is in a pleasant setting, close to many shops, restaurants and services. You can easily get to Belfort and discover its famous Lion, its citadel and its historic centre. The region also offers lovely walks in the Vosges, many cycling routes, lakes and outdoor activities. Bessoncourt is an excellent starting point for exploring the Territoire de Belfort, nearby Alsace and even neighbouring Switzerland.","ot":"We hope you will feel as good here as we do. This house is a living space we love to share and we will be delighted to help you discover the region. Welcome to our home, and we look forward to a great exchange!"},{"loc":"fr","title":"Maison d'architecte BESSONCOURT","gf":"Ce que nos invités apprécient le plus, c'est l'espace et le confort de la maison. De plain-pied, elle est agréable à vivre, lumineuse et adaptée à toute la famille. La grande terrasse permet de profiter pleinement des repas et des soirées en extérieur, avec une vue dégagée sur le jardin. Le calme, la facilité de circulation et les grands espaces intérieurs en font un lieu idéal pour se détendre. Et au fond du jardin, une petite surprise attend les visiteurs et fait toujours son effet... à découvrir sur place !","gp":"Nos invités apprécient particulièrement le calme et la praticité de Bessoncourt. La maison est située dans un environnement agréable, à proximité de nombreux commerces, restaurants et services. Vous pourrez facilement rejoindre Belfort, découvrir son célèbre Lion, sa citadelle et son centre historique. La région offre également de belles balades dans les Vosges, de nombreux itinéraires à vélo, des lacs et des activités de plein air. Bessoncourt est un excellent point de départ pour explorer le Territoire de Belfort, l'Alsace toute proche et même la Suisse voisine.","ot":"Nous espérons que vous vous sentirez ici aussi bien que nous. Cette maison est un lieu de vie que nous aimons partager et nous serons ravis de vous aider à découvrir la région. Bienvenue chez nous et à bientôt pour un bel échange !"}],"ph":["152502_0"]},{"v":"V107","n":107,"id":3302764,"t":"Maison familiale sur le début des côteaux de la Chartreuse.","town":"Saint-Nazaire-Les-Eymes","cc":"France","region":"Belledonne","lat":45.25105743879464,"lon":5.853926979286399,"bd":4,"ba":3,"cap":10,"m2":168,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":0,"children_bed":1,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":1,"baby_bed_up":1},"res":[{"n":"Le Sappey","m":30,"b":35,"km":17,"via":"D1090 and D512","q":""},{"n":"Les 7 Laux","m":35,"b":40,"km":27,"via":"D250","q":""},{"n":"Le Collet d'Allevard","m":45,"b":50,"km":38,"via":"A41 and D525","q":""},{"n":"St-Pierre-de-Chartreuse","m":45,"b":50,"km":26,"via":"D30","q":""},{"n":"Chamrousse","m":50,"b":55,"km":37,"via":"D111","q":""},{"n":"Aillons-Margeriaz","m":60,"b":70,"km":61,"via":"A41","q":""},{"n":"La Feclaz (Grand Revard)","m":65,"b":75,"km":65,"via":"A41","q":""},{"n":"Villard-de-Lans","m":70,"b":80,"km":56,"via":"D531","q":""}],"near":30,"n30":1,"n60":6,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":"Parc des Ecoutoux accessible à pieds; terrain de rugby attenant (public)","large_garden":null,"winter_restriction":null,"access_issue":null},"av":["f27"],"q":[],"ski":"station de ski des 7 Laux à 35 minutes, Chamrousse à 45 minutes","notes":"Grésivaudan family house near Grenoble, kids' beds/cot, slopes 35-45 min drive; new owner - weak ski fit for 12.","score":46,"stars":2.5,"gp":202,"rr":100,"gr":0.0,"ex":0,"owner":"Murielle","recip":true,"desc":[{"loc":"tr","title":"Family house at the start of the Chartreuse foothills.","gf":"We are offering our house, located in the beautiful village of Saint-Nazaire-Les-Eymes at the foot of the Chartreuse massif.\n\nIt comprises:\n1st floor: A large living area with kitchen open to the living room + open onto a large terrace.\n                 Child's bedroom (cot, but an adult single mattress can be put on the floor) +\n                 shower room (shower + washbasin)\n                 A toilet\n                 Master bedroom with a 160 cm double bed and a spacious bathroom with toilet, washbasin and\n                 bathtub.\n2nd floor: Child's bedroom with a child's bed + a bathroom (shower + toilet + washbasin)\n                  Small mezzanine (small daybed).\nGround floor: A converted former garage: a large room of around forty square metres, with a sleeping area with a 140 cm bed and washbasin + a sofa bed area.\n\nThe terrace is spacious and covered, with a lovely view of the Chartreuse foothills and part of Belledonne. The area is quiet, away from all roads.","gp":"Located in a quiet residential neighbourhood, our house is less than 5 minutes by car from delicious local shops (bakery, butcher, grocery, cheese shop, chocolate shop), and also from a Carrefour Express less than 5 minutes away, or larger supermarkets 10 min away (Lidl, Super U, Carrefour etc).\n\nA magnificent park, the Parc des Ecoutoux, within walking distance, will delight your children, as will the rugby pitch next to the house, which also has a football goal for letting off steam in every sport!\n\nWe love living here and make the most of the surroundings of our house: running/trail running from our door; family walks 5 minutes from home, in the vineyards at the start of the Chartreuse foothills or in the Manival valley / hikes such as Pravouta, the Dent de Crolles 20 minutes away by car etc.\n\nThe area is simply perfect for mountain lovers in summer and winter, while being close to all amenities and close to Grenoble.\nAnd it is with great pleasure that we can tell you about the very many, very varied activities you could enjoy in summer and winter (the free-flight event, the Coupe Icare, held in September in Crolles/Lumbin; 7 Laux ski resort 35 minutes away, Chamrousse 45 minutes away, the Domaine des Fauves zoological park less than an hour away, a visit to the town of Annecy 1h away, Chambéry 35 minutes away etc).","ot":""},{"loc":"fr","title":"Maison familiale sur le début des côteaux de la Chartreuse.","gf":"Nous vous proposons notre maison, située dans le beau village de Saint-Nazaire-Les-Eymes au pied du massif de la Chartreuse. \n\nCelle-ci comporte : \n1 étage : Une grande pièce à vivre avec cuisine ouverte sur salon + ouverte sur grande terrasse.\n                 Chambre enfant (lit à barreaux mais possibilité de mettre un matelas adulte une place au sol) + \n                 salle d'eau (douche + lavabo)\n                 Un toilette\n                 Chambre parentale avec un lit double 160 cm et une spacieuse salle de bain avec toilette, lavabo et                                          \n                 baignoire.\n2 étage : Chambre enfant avec un lit enfant + une salle de bain (douche + toilettes + lavabo)\n                  Petite mezzanine (petite méridienne).\nAu RDC : Un ancien garage aménagé : grande pièce d'une quarantaine de mètres carrées, avec un coin chambre avec lit en 140 cm et lavabo + un coin canapé lit. \n\nLa terrasse est spacieuse, couverte, avec une belle vue sur les côteaux de la Chartreuse, et une partie de Belledonne. Le coin est calme, à l'écart de toutes routes.","gp":"Située dans un quartier résidentiel calme, notre maison est à moins de  5 minutes  en voiture des délicieux commerces locaux (boulangerie, boucherie, épicerie, fromagerie, chocolaterie), mais également d'un carrefour express à moins de 5 minutes, ou de plus grandes surfaces, à 10 min (Lidl, Super U, Carrefour etc).\n\nUn magnifique parc, le Parc des Ecoutoux, accessible à pieds, ravira vos enfants, tout comme, attenant à la maison, un terrain de rugby avec également cage de foot pour se défouler dans tous les sports ! \n\nNous adorons vivre ici, et profitons pleinement de l'environnement de notre maison : courses à pieds/ trail au départ de chez nous ; ballades familiales à 5 minutes de chez nous, dans les vignes sur le début des côteaux de la Charteuse ou dans la vallée du Manival / randonnées telles que Pravouta, la Dent de Crolles à 20 minutes de voiture etc. \n\nLe coin est tout bonnement parfait pour les amoureux de la montagne été comme hiver, tout en étant proche de toutes les commodités et proche de Grenoble.\nEt c'est avec un grand plaisir que nous pouvons vous indiquer les très nombreuses activités, très diverses, été comme hiver dont vous pourriez profiter  (l'événement du vol libre, la Coupe Icare, ayant lieu en septembre à Crolles/Lumbin ; station de ski des 7 Laux à 35 minutes, de Chamrousse à 45 minutes, le Domaine des Fauves - parc zoologique à moins d'une heure, visite de la ville d'Annecy à 1h, Chambéry à 35 minutes etc).","ot":null}],"ph":["3302764_0","3302764_1","3302764_2","3302764_3","3302764_4","3302764_5","3302764_6","3302764_7","3302764_8","3302764_9","3302764_10","3302764_11","3302764_12"]},{"v":"V108","n":108,"id":2237456,"t":"La maison de Chloé","town":"Longevilles-Mont-d'Or","cc":"France","region":"Jura","lat":46.76460401945517,"lon":6.328090922926173,"bd":4,"ba":2,"cap":10,"m2":145,"typ":"House","mn":4,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":0,"children_bed":2,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":1,"baby_bed_up":1},"res":[{"n":"Metabief","m":6,"b":6,"km":2,"via":"Av. des Crêts","q":""},{"n":"Les Rousses","m":65,"b":65,"km":54,"via":"D46","q":""},{"n":"Monts Jura", ski":"la station de ski de fond la plus proche est à 10 minutes en voiture ... à condition qu'il y ait de la neige","notes":"Rustic Jura country house, 3 bed/1 bath sleeps 11, 5000 m2 land; cross-country only, snow not guaranteed - poor for alpine ski week.","score":45,"stars":2.0,"gp":177,"rr":90,"gr":5.0,"ex":47,"owner":"Olivier et Hélène","recip":false,"desc":[{"loc":"tr","title":"Olivier's country house","gf":"My second home is rustic inside and out, but has all the equipment needed for everyday comfort.\nWhat makes it special is the outdoor land and the countryside surroundings, with the forest right behind the house ...\n+ 5000 m2 of land at your disposal, flat or sloping, a small private hollow, lawn or wooded.\nGood south-south-east exposure.\nAnd, a treasure ... peace and quiet!","gp":"The house is in a hamlet of about ten houses strung out in a line, a 10-minute walk from the centre of the village (1000 inhabitants), where you will find all the basic shops: bakery, Comté cheese dairy, delicatessen, supermarket and petrol station, ski and bike rental ... All the details here:\nhttps://www.jura-foncine.com/vivre-a-foncine/annuaire/commerces-et-services/\n\nThere are cow pastures in front of the house (to the south), and the edge of the forest on the hillside behind the house (to the north).\nThe GR5 passes in front of the house, with many hiking and mountain-bike trails nearby.\nSpace to let the children run free ...\nIn winter the nearest cross-country ski resort is 10 minutes away by car (ski area linked to Chapelle des Bois), provided there is snow, which sadly is no longer guaranteed with global warming ;-)","ot":"For a return to simplicity in peace and quiet on a sunny Jura hillside, with land made for relaxing, or a good base for hiking, mountain biking and cross-country skiing in winter if the snow is there ..."},{"loc":"fr","title":"La maison de campagne d'Olivier","gf":"Ma maison secondaire est rustique à l'intérieur comme à l'extérieur, mais dispose de tous les équipements nécessaires au confort de la vie de tous les jours.\nCe qui fait son intérêt est le terrain extérieur et les environs à la campagne et avec la forêt juste derrière la maison ...\n+ 5000 m2 de terrain à votre disposition, à plat ou en pente, une petite combette privée, en pelouse ou arboré.\nBien exposé sud-sud-est.\nEt, un trésor ... au calme !","gp":"Maison dans un hameau dispersé linéairement d'une dizaine de maisons, à 10 minutes à pieds du centre du village (de 1000 habitants) dans lequel vous trouverez tous les commerces de base : boulangerie, fruitière à Comté, charcuterie, Supermarché et station service, locations de skis, vélos ... Tous les détails ici :\nhttps://www.jura-foncine.com/vivre-a-foncine/annuaire/commerces-et-services/\n\nIl y a des prairies à vaches devant la maison (au sud), et la forêt en lisière sur le coteau derrière la maison (au nord).\nLe GR5 passe devant la maison, nombreux chemins de randonnées et VTT à côté.\nDe l'espace pour lâcher les enfants ...\nL'hiver la station de ski de fond la plus proche est à 10 minutes en voiture (domaine de ski relié à Chapelle des Bois), à condition qu'il y ait de la neige, ce qui n'est hélas plus garanti avec le réchauffement climatique ;-)","ot":"Pour un moment de retour à la simplicité au calme sur un coteau ensoleillé du Jura avec un terrain propice au repos, ou une bonne base pour faire de la randonnée, du VTT et du ski de fond l'hiver si la neige est là ..."}],"ph":["2483904_0","2483904_1","2483904_2","2483904_3","2483904_4","2483904_5","2483904_6","2483904_7","2483904_8","2483904_9","2483904_10","2483904_11","2483904_12","2483904_13"]},{"v":"V110","n":110,"id":2425696,"t":"Alps Haven of Peace Between Belledonne and the Alpine City of Light","town":"Saint-Martin-D'uriage","cc":"France","region":"Oisans","lat":45.15097308738073,"lon":5.850060861860103,"bd":3,"ba":2,"cap":10,"m2":150,"typ":"House","mn":5,"beds":{"big_double_bed":1,"double_bed":2,"single_bed":2,"children_bed":  mountain range and hiking/VTT paths. Renowned for its clean air and exceptional quality of life, you will enjoy the tranquility of the mountains while being just minutes away from amenities and major points of interest.\n\n⛰️ Local Activities and Noteworthy Sites (38410)\nThe municipality itself, particularly the district of Uriage-les-Bains, offers a wealth of options for well-being and recreation:\n\nUriage-les-Bains, the Spa Resort:\n\nLes Thermes d'Uriage (The Thermal Baths): An ideal place for a wellness break and relaxation, famous for its water with dermatological properties.\n\nThe Uriage Park: Stroll through this beautiful thermal park, which has retained its Belle Époque charm—perfect for picnics or a pleasant walk.\n\nLeisure & Entertainment:\n\nThe JOA Casino of Uriage for a lively evening (slot machines, table games).\n\nThe Uriage Golf Course (in nearby Bresson) for golf enthusiasts.\n\nThe Jeannine Creissels Cultural Center – Le Belvédère for local shows and exhibitions.\n\nHeritage:\n\nThe Château d'Uriage: A private property visible from the outside, it dominates the village and is part of a pleasant local heritage circuit.\n\nThe former Uriage-les-Bains Train Station (now the Tourist Office) is a testament to the town's rich thermal past.\n\nHiking and Nature:\n\nMany marked trails start directly from the town: the Curists' Circuit, the Ridge Circuit, the Ramparts Circuit, the Vignasses Circuit.\n\nDiscover the Marais des Seiglières (Seiglières Marsh) for a peaceful, family-friendly nature walk.\n\n********************\nUn havre de paix entre Belledonne et Grenoble","gp":"Mountains countryside, 20min walk from nearby village and central place with restaurants, tabac, bakery, pizza place.\n\nYou can access the hiking/biking trails that lead to the Chamrousse summit from the house.","ot":""}],"ph":["2425696_0","2425696_1","2425696_2","2425696_3","2425696_4","2425696_5","2425696_6","2425696_7","2425696_8","2425696_9","2425696_10","2425696_11","242569 m Lac de la Gruyère and 15 minutes from the town of Gruyères and the mountains.","gp":"We live in a pretty, typical and very quiet village, on the edge of the forest, pastures and the lake. Close to the mountains and ski resorts. 15 minutes from the town of Bulle and 1h30 from Geneva airport.","ot":"Please do not smoke or bring animals into the house.\n\nAn adorable cat lives in the house. He comes and goes as he pleases, but please feed him.\n\nIf you don't want to do the cleaning, I can arrange this service for you for 80 Swiss francs."},{"loc":"fr","title":"Maison de charme, Villarvolard","gf":"Maison de charme au coeur du village avec deux terrasses privées. Un calme absolu, à 15 minutes en voiture de la ville de bulle, 5 minutes à pieds du lac de la Gruyère et 15 minutes du bourg de Gruyères et des montagnes.","gp":"Nous habitons un joli village typique très calme, en bordure de forêt, de pâturages et du lac. Proche de la montagne et des stations de ski. A 15 minutes de la ville de Bulle et à 1h30 de l'aéroport de Genève.","ot":"Nous vous demandons de ne pas fumer  et de ne pas emmener d'animaux dans la maison svp.\n\nUn adorable chat habite dans la maison. Il entre et sort à sa guise, mais vous devrez le nourrir svp.\n\nSi vous ne souhaitez pas faire le ménage, je peux organiser ce service pour vous pour 80 francs suisses."}],"ph":["1661460_0","1661460_1","1661460_2","1661460_3","1661460_4","1661460_5","1661460_6","1661460_7","1661460_8","1661460_9","1661460_10","1661460_11","1661460_12","1661460_13","1661460_14","1661460_15","1661460_16"]},{"v":"V113","n":113,"id":1070825,"t":"Charming Slovenian countryside, very close to Ljubljana & other towns","town":"Preddvor","cc":"Slovenia","region":"Slovenia","lat":46.30318030467471,"lon":14.426054280643013,"bd":4,"ba":2,"cap":11,"m2":300,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":2,"children_bed":0,"baby_bed":1,"double_bed_up":0,"single_bed_up":1,"children_bed_up":2,"baby_bed_up":1},"res":[{"n":"Krvavec","m":55,"b":55,"km":26,"via":"Ambrož pod Krvavcem","q":""}],"near":55,"n30":0,"n60":1,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":"middle of a big garden with tall trees","winter_restriction":null,"access_issue":null},"av":["f27"],"q":[],"ski":"Krvavec less than 20 minutes driving; Kranjska Gora, Vogel, Stari Vrh within 1 hour","notes":"Preddvor house 300 m2, 4 bed/2 bath, sleeps 11; Krvavec <20 min; big garden; contact_allowed=0.","score":45,"stars":2.0,"gp":273,"rr":71,"gr":5.0,"ex":126,"owner":"Ana & Miha","recip":true,"desc":[{"loc":"en","title":"Charming Slovenian countryside, very close to Ljubljana & other towns","gf":"Our home is bright, modern and cozy. House is comfortable enough to accommodate a couple or a bigger family. It is located in the middle of a big garden with tall trees, so you'll be able to enjoy birds singing around you, have a drink, lunch, BBQ picnic or just sit outside and enjoy the nature.\n\nHouse is well equipped, please feel free to share your needs and we'll be happy to advise what are the available options.","gp":"We live in a small town Preddvor. It is located in a region Gorenjska (Upper Carniola). It's a very safe and quiet town where people are kind and friendly. It is a popular tourist destination with a small lake (5 minutes from our home) where you can rent a boat, take a walk or even swim. There is a local market, a post office, ATM. Shopping centers, cinemas, restaurants etc. are in towns just few minutes away. \n\nOur home is just 10 minutes from Kranj (main city of Gorenjska) and less than 30 minutes from the capital city of Slovenia, Ljubljana. In less than 30 minutes you can also get to beautiful places such as Jezersko, medieval town Škofja Loka and in less than 1 hour to Bled, Kranjska Gora and national park Triglavski narodni park.\n\nPreddvor is fantastic starting point for many hiking trails, for beginners and even more experienced hikers. The most popular hill around is Sv. Jakob (church on the top visible from our home; 1-1.5h to get there).\n\nOn the other hand you can go to the Slovenian seaside, which is just an hour and a half drive from Preddvor. On your trip you can stop in Postojna and admire unique Postojna cave and Castle Predjama.\n\nIf you want to visit some of the most admired cities in Europe, Venice and Vienna are just few hours away.\n\nAnother popular destination to visit is Croatia with its capital city of Zagreb or any of the places on beautiful Croatian coast. It takes around 2 hours to get to Zagreb or to Istria and more when you go further to the south towards Dalmatia.\n\nIn winter there are several ski resorts around. Krvavec less than 20 minutes driving and many others (Kranjska Gora, Vogel, Stari Vrh) within 1 hour. Austrian or Italian ski resorts are also not too far away.","ot":"In the middle of nature, close to beautiful towns \nNew, modern, bright, but cozy\nCenter of Europe: Vienna, Venice... few hours away"}],"ph":["1070825_0","1070825_1","1070825_2","1070825_3","1070825_4","1070825_5","1070825_6","1070825_7","1070825_8","1070825_9","1070825_10","1070825_11","1070825_12","1070825_13","1070825_14","1070825_15","1070825_16","1070825_17","1070825_18","1070825_19","1070825_20","1070825_21","1070825_22","1070825_23","1070825_24","1070825_25","1070825_26"]},{"v":"V114","n":114,"id":1775858,"t":"Le Chalet à la montagne dans la station de ski de la joue du loup dans le Devoluy (Super D","town":"Dévoluy","cc":"France","region":"Devoluy","lat":44.68963779288524,"lon":5.892247429523428,"bd":3,"ba":2,"cap":10,"m2":55,"typ":"House","mn":5,"beds":{"big_double_bed":0,"double_bed":0,"single_bed":8,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Superdevoluy","m":20,"b":20,"km":7,"via":"Rte des Stations/D17","q":""},{"n" ire.","gp":"This is a magical area where we enjoy stunning views over the lake of Geneva and the snow-capped Alps. The house  has the benefit of being located next to the quiet UNESCO protected vineyards, but is also only a few minutes’ drive from all the amenities of Lutry and Lausanne with lots of bars and restaurants to choose from.   We are 5 minutes’ drive from the lake of Geneva where we love to swim and paddle board in the summer. In the winter, we are just one hour from major ski resorts such as Verbier and we are surrounded by countless walks. This is a great place for exploring Europe. We are one hour from Geneva by train. (Train station- 10 mins walk from the house to connect to main lines). You can take a boat across the lake to France or even hop on  a train from Lausanne to Milano (3.5 hours) or drive over the mountains (approx 4 hours to Turin).  Austria is also 3.5 hours drive.  \n\n- Buzzy restaurants: Villa Malfi in Lutry for great food and nice ambience\n- Cool bars: Walk into the vineyards and sample the local wines\n- Spot of exercise: Great for walking and skiing in the nearby vineyards or swimming in the lake nearby. Cyclists love this region as well.\n- Day tripping: Geneva by train, Evian in France by boat. Even take an early morning train to Milan and come back in the evening.","ot":"We have a friendly cat called Sammy. He spends most of his time sleeping in the basement or outdoors, so just needs to be fed.\nWe do charge a cleaning fee of 100 francs."}],"ph":["2358998_0","2358998_1","2358998_2","2358998_3","2358998_4","2358998_5","2358998_6","2358998_7","2358998_8","2358998_9","2358998_10","2358998_11","2358998_12","2358998_13","2358998_14","2358998_15","2358998_16","2358998_17","2358998_18","2358998_19","2358998_20","2358998_21","2358998_22","2358998_23","2358998_24","2358998_25","2358998_26"]},{"v":"V120","n":120,"id":549490,"t":"Andreas & Caroline","town":"Vipiteno","cc":"Italy","region":"South Tyrol","lat":46.89491616484304,"lon":11.43 r a contribution of 80 euros per stay for cleaning.","gp":"Apartment located in the heart of the village. Restaurants, bars and all the shops are at the foot of the building. You can join in all the village events that take place on the village square.","ot":"A big breath of fresh air in a magnificent setting."},{"loc":"fr","title":"La maison de Gerard","gf":"La montagne, belle l'été comme l'hiver. Une vue superbe sur les Aravis qui donne envie d'aller grimper, skier, etc....\nPour les sportifs, vous avez tout à portée de main : ski, ski de randonnée, avec une école de ski et une équipe de guides pour vous accompagner. L'été, randonnée, escalade, VTT, golf du Mont d'Arbois (megève à 8KMs), golf de chamonix à 22 kms, parc de loisir des contamines à 8 kms, cure thermale, espace bien être, rafting, parapente, mur d'escalade, et bien sûr point de départ pour le tour du mont blanc avec gare du TMB qui vous monte pour des départs de randonnées extraordinaire et le nid d'aigle départ de l'ascension du montblanc. Départ pour l'ascencion du Mont blanc avec les guides de Saint Gervais. Ski de randonnée accompagné des guides de Saint Gervais pour la sécurité.\nVous arrivez par le train, gare du Fayet St gervais, utilisez le valléen qui vous montera directement à St Gervais. Vous traversez le pont et vous êtes à l'appartement.\nVous effectuez une cure thermale, vous voulez profitez de l'espace bien être, tous les deux situés dans le parc thermale, prenez l'ascenseur thermale situé à 10 minutes maximum de marche de l'appartement, et vous y êtes, sans avoir à sortir votre véhicule.\nNous ne sommes pas sur place, aussi nous demandons une participation pour le ménage de 80 euros par séjour.","gp":"Appartement situé au coeur du village. Les restaurants, les bars, tous les commerces sont au bas de l'immeuble. Vous pouvez participer à toutes les animations du village qui se déroulent sur la place du village.","ot":"Un grand bol d'air dans un cadre magnifique."}],"ph":["1894542_0","189 ns rénovée nous même elle n'est donc ni moderne ni parfaite mais c'est un havre de paix à la campagne, idéalement situé pour profiter de la ville, de la montagne et des lacs. \nElle est confortable pour 7 personnes mais peut en accueillir 9. Il y a une très grande chambre pour 2 adultes et une très grande chambre avec un lit double et un lit simple au 1er étage. Au deuxième étage il y a 2  chambres avec chacune un lit double. Vous trouverez une salle de bain avec baignoire et également une douche séparée. Il y a des toilettes à chaque étage.\nAvec un grand jardin exposé plein sud et une vue dégagée, vous passerez des journées en toute tranquillité et des nuits à admirer les étoiles . Nous avons donc 2 voisins mitoyens.\nC'est une maison non fumeur. \nNous avons un chat (jamais présent pendant les échanges) et notre jardin n'est pas clos, de ce fait l'accueil de vos animaux de compagnie peut être un peu compliqué. Néanmoins nous n'y sommes pas opposés.","gp":"A proximité d'Annecy (moins de 20 minutes du centre ville en voiture), vous pourrez découvrir la vieille ville, admirer le lac pendant vos balades en vélo sur les pistes cyclables, ou profiter de baignades dans un cadre inoubliable. \nEté comme hiver, l'accès aux grandes stations et aux sommets alpins est facile, les plus proches sont Le Grand Bornand et de La Clusaz à 55 minutes de voiture. Le sommet du Semnoz et sa station de ski familiale est à 25 minutes de la maison et vous offre une vue magnifique sur le Mont Blanc. Les stations des Bauges sont également facilement accessibles (environ 40 minutes)\nPour les amoureux de nature, vous pourrez découvrir sans aller trop loin le lac du Bourget, les marais de Chautagne ou les abords du Rhône et en roulant un peu plus, le lac Léman ou bien la vallée de Chamonix et le Mont Blanc. Pour les sportifs il y en a pour tous les goûts selon les saisons: ski, randonnée, VTT, activités nautiques sur le lac, parapente (au col de la forclaz), canöé, rafting... Et pour les gourmands, bien sûr tous les fromages AOC des pays de Savoie et les vins de Chautagne.","ot":"Nous parlons anglais également."},{"loc":"en","title":"Emmanuelle's house","gf":"This house is our home. It's an old farm. We've got two neighbours. We have renoved it ourselves so our house isn't modern and perfect but  It's a very quiet place between city, moutains and lakes. There are 9 beds but it's better for  7 people: one big adult's bedroom and one other bedroom with a double bed and a simple bed are on the first floor. On the second floor you can find 2 bedrooms with 2 double beds. There is one bathroom and a shower next to. Some wc are on each floor. \nThe garden is looking at the south with great view. You can spend quiet time. \nIt's a non smooking house. \nWe have got a cat but he won't be at home during the exchanges. Our garden is open so we are sorry but we couldn't accept your pets.","gp":"Close to Annecy (less than 20 minutes from the center), you could discover the old city, bike around Annecy's Lake or go to the beaches and swim.  \nSummer and winter, it's easy to go in greats ressorts and moutains. Semnoz's mont and its small ski resort is at only 25 minutes driev and offer you a splendid view on the Mont Blanc. The nearest big ones are Le Grand Bornand and La Clusaz (55 minutes drive). \nFor nature's lovers, you can easily discover Bourget's Lake, Rhône's banks, Leman's Lake or Chamonix's Valley and the Mont Blanc. For sportifs men you can find: ski, trek, VTT, water sports, paraglide, canöé, rafting...\nAnd for gourmands, you should taste all our locals cheeses and wines.","ot":"."}],"ph":["2033085_0","2033085_1","2033085_2","2033085_3","2033085_4","2033085_5","2033085_6","2033085_7","2033085_8","2033085_9","2033085_10","2033085_11","2033085_12","2033085_13","2033085_14","2033085_15","2033085_16","2033085_17","2033085_18","2033085_19","2033085_20","2033085_21","2033085_22","2033085_23","2033085_24"]},{"v":"V125","n":125,"id":1554041,"t":"La maison de Beno  a small garden with garden furniture and a barbecue.","gp":"A peaceful, friendly neighbourhood with shops and services within a few minutes' walk: bakery, butcher-delicatessen, mini-market, pharmacy, bars, tea room and restaurant, park and playgrounds.\nOutdoor activities are easily and quickly accessible: skiing, hiking, horse riding, cycling.\nLocated between Grenoble and Chambéry, the city and its activities can be reached in 30-40 min.\nThe nearest large supermarkets are 7 to 10 km away.\nWe have bikes, scooters, rollerblades, ski/snowboard equipment and sledges available.","ot":"For a quiet holiday in the mountains, making the most of the surrounding nature."},{"loc":"fr","title":"La maison de Benoît et Edwige","gf":"Notre maison se situe au cœur d'un village de montagne à 700 m d'altitude.\nA 10 km de la station de ski des 7 laux, dans les Alpes du Nord (massif de Belledonne), qui propose un bon nombre d'activités aussi bien en hiver qu'en été: http://www.les7laux.com\n\nC'est une maison de village d'une 100aine de mètres carrés sur 3 étages, avec une petite cuisine, une salle à manger-salon, 2 chambres, une salle de bain, des toilettes, une bibliothèque et un bureau. Il y a une terrasse et un petit jardin avec salon de jardin et barbecue.","gp":"Quartier paisible et convivial avec des commerces et services accessibles à pied en quelques minutes: boulangerie, boucherie-charcuterie, supérette, pharmacie, bars, salon de thé  et restaurant, parc et terrains de jeux.\nOn a facilement et rapidement accès à des activités de plein air: ski, randonnée, équitation, vélo. \nSitué entre Grenoble et Chambéry, l'accès à la ville et à ses activités est possible en 30-40 mn. \nLes grandes surfaces les plus proches sont entre 7 et 10 kms.\nNous avons des vélos, des trottinettes, des rollers, du matériel de ski/snow et des luges à disposition.","ot":"Pour passer des vacances dans la montagne au calme et profiter pleinement de la nature environnante."}],"ph":["1554041_0","1554 otre espace terrasse ou encore ses petits coins de verdure où les petits enfants pourront se rouler. \n\nPour les jours plus couverts, je vous invite dans notre séjour lumineux pour vous prélasser sur le canapé ou bouquiner tranquillement. \nNous avons une cuisine récente et toute équipée ouverte sur la salle à manger permettant un échange continu entre les différents occupants. \n\nLes 3 chambres sont à l'étage, permettant ainsi de continuer de profiter de sa soirée sans déranger alors que les plus petits ou les plus fatigués, montent se coucher. \n1 chambre avec lit double king size, 1 autre avec lit bébé et lit double, une dernière avec lit enfant et possibilité de mettre un matelas double ou simple. Enfin nous avons une alcôve fermée par un rideau avec lit double et un grand canapé convertible au rez de chaussé.\n\n We live in a house of 130 sqm, adjoining with two very discreet retirees within a very peaceful neighborhood.\nYou will be able to take advantage of the outdoor space that will please both adults and children with our terrace area or its little green corners where little children can roll.\n\nFor the more covered days, I invite you in our luminous stay to loung on the sofa or to read quietly.\nWe have a recent kitchen and all equipped open on the dining room allowing a continuous exchange between the different occupants.\n\nThe 3 bedrooms are upstairs, allowing you to continue enjoying your evening without disturbing while the smallest or the most tired, go to bed.","gp":"Notre maison se trouve au calme dans les hauteurs d'Aix les bains, dans un quartier de retraités. Nous prenons généralement le vélo pour aller au centre ville mais c'est aussi faisable à pied (20min).\r\nPour partir en direction des Bauges (massif montagneux) ou d'Annecy, on gagne du temps en évitant le centre ville.","ot":"La maison est dans un quartier calme avec un espace extérieur exposé sud pour profiter du soleil.  The house is in a quiet area with outdoor terrace facing south to enjoy the sun.\nNous avons un grand espace de vie et aimons lire sur le canapé en jetant un coup d’œil de temps en temps à la dent du chat et au lac en contrebas.  We have a large living space where we love to read on the couch by glancing from time to time to the tooth \nLes chambre sont à l'étage, ce qui nous permet de faire plus facilement la sourde oreille aux petits cris de notre fille quand elle a du mal à s'endormir . :)      The rooms are upstairs, which allows us to make it easier to not hear the little cries of o"},{"loc":"fr","title":"Maison sur les hauteurs d'Aix les Bains","gf":"Avec mes deux enfants Ambre et Gabriel, nous habitons une maison de 130 m² au sein d'un quartier très paisible. \nNotre maison est  particulièrement adaptée pour recevoir des familles, nous possédons tout l'équipement pour les enfants. Des jeux évolutifs ainsi qu'une panoplie de jeux de sociétés pour petits et grands. Des bandes dessinées peuvent également être lues avec soin. \n\nLes chambres se situant à l'étage, il est possible de profiter pleinement de l'espace de vie sans déranger les enfants ou encore les plus fatigués.\nLe logement est composé d'une chambre avec lit double, une avec un lit enfant et une petite barrière, et une dernière avec un lit simple en hauteur et la possibilité d'y ajouter un matelas simple ou double. Nous possédons également deux canapés convertible (un dans une alcove et un dans le salon). \nDes travaux de rénovation sont en cours dans deux chambres (fin 2024-début 2025). \n\nDans le jardin se trouve un trampoline ainsi qu'une petite cabane. \n\nUn poisson nous accompagne depuis plusieurs années, et nous vous demanderons de le nourrir une fois par jour, si cela est possible bien sûr. \nL'été un petit coup aux plantes et aux tomates dans le jardin sera le bienvenu.","gp":"Nous habitons dans une impasse très calme. Il est possible de rejoindre le centre ville à pied en 25 min ou encore le lac à vélo pour le même temps.\nPlusieurs plages aménagées sur le lac du Bourget avec des aires de jeux pour enfants non loin.\n\nEn partant dans la direction opposé, vous irez à la rencontre des bauges, massif montagneux qui se prête à la randonnée l'été et au ski l'hiver. \n\nL'été vous pouvez également profiter en famille ou non : \n- d'un bel espace aquatique à Aix les Bains (Aqualac) ; \n- de belles randonnées ou couchés de soleil à moins de 30 min de voiture ;  \n- des courses hippiques à l'hippodrome d'Aix les Bains. \n\nAnnecy se trouve à 30 min en voiture, accessible en train également. \nChambéry se trouve à 20 min en voiture, 10 min en train. \n\nA 45 min en voiture se trouve le parc d'attractions Walibi.","ot":"Ce sera avec un grand plaisir que nous vous partagerons les beautés de la région."}],"ph":["1458604_0","1458604_1","1458604_2","1458604_3","1458604_4","1458604_5","1458604_6","1458604_7","1458604_8","1458604_9","1458604_10","1458604_11","1458604_12","1458604_13","1458604_14","1458604_15","1458604_16","1458604_17","1458604_18","1458604_19","1458604_20","1458604_21","1458604_22","1458604_23","1458604_24","1458604_25","1458604_26","1458604_27","1458604_28","1458604_29","1458604_30","1458604_31","1458604_32","1458604_33","1458604_34","1458604_35","1458604_36","1458604_37","1458604_38"]},{"v":"V127","n":127,"id":3288578,"t":"Chalet à la montagne de Monique et Thierry","town":"Bruson","cc":"Switzerland","region":"4 Vallees","lat":46.05947079288427,"lon":7.204192082955447,"bd":3,"ba":1,"cap":10,"m2":110,"typ":"House","mn":5,"beds":{"big_double_bed":2,"double_bed":0,"single_bed":6,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Verbier","m":35,"b":35,"km":17,"via":"Rte de Verbier","q":""},{"n":"La Tzoumaz","m":65,"b":65,"km":31,"via":"Rte de Verbier","q":""},{"n":"Villars","m":65,"b":75,"km":63,"via":"A9","q":""},{"n":"Champery","m":70,"b":75,"km":65,"via":"A9","q":""},{"n":"Leysin","m":75,"b":85,"km":73,"via":"A9","q":""},{"n":"Crans-Montana"," "ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":"playground is public nearby: There is a large and modern playground","large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"In winter there is a shuttle bus to the ski areas Goldeck and Bad Kleinkirchheim. Others 30-60 min","notes":"Lakeside Millstatt attic flat, 3 bedrooms/1 bath, ski by shuttle bus; min 7 days, EUR 70 cleaning, guinea pigs to feed; too small for 12.","score":41,"stars":2.0,"gp":218,"rr":91,"gr":4.94,"ex":18,"owner":"Sandra","recip":false,"desc":[{"loc":"en","title":"Sunny apartment 2 minutes from the lake","gf":"We offer a large and beautiful attic flat.  On the main floor we have:  a large living room with a couch and a small balcony, two single bedrooms (beds 120 x 200 cm and 140 x 200 cm) and a kitchen which is connected to the dining room as well as bathroom and toilet.  On the second floor there is a master bedroom and a small room with a couch and there are two large roof-terraces (west and east side) with a great view over the mountains and the lake. \n\nThere is a large and modern playground and we have a cinema just down the road (OMU-films every Tuesday - http://www.kino-millstatt.at).\nWe have 3-4 guinea pigs which live in a huge cage outside on the balcony all year. They need food twice a day and water once a day. The cage has to be cleaned once a week which is done by my mother. As several of our family members and friends are allergic to animal hair we do not allow animals inside our flat but it is no problem at all if you have pets we should look after during our exchange.","gp":"Our village is surrounded by mountains and situated at a lake. It is beautiful to go biking or roller blading along the lake or explore the mountains (hiking or mountainbiking). From the 18-hole-golf course you have a breathtaking view over the lake. There are a lot of fine restaurants around the lake (partly with boat shuttle)and we have all necessary shops in the village and the nearest town is only 10 minutes away (car, bus). In summer there are several cultural events and festivities. We have a cinema, a disco and some bars. In winter there is a shuttle bus to the ski areas \"Goldeck\" and Bad Kleinkirchheim. Other ski areas are also nearby (30 - 60 min). Carinthia is full of interesting sightseeing spots and in 40 minutes you can reach Italy and Slovenia and our capital Klagenfurt. The cities Salzburg (bordering to Passau in Germany) and Graz are only 1,5 hours away. Vienna and Munich are about 3,5 hours away (bordering to Hungary for example).\nGenerally Carinthia offers a beautiful landscape (lakes and mountains) and a lot of cultural events. http://www.millstaettersee.com/de/der-millstaetter-see.html, http://www.kaernten.at/de/, http://www.kaerntencard.at/\nWe are close to a national park with beautiful hiking and biking routes and a lot of climbing possibilities which makes our area very attractive in spring and autumn. \n\n- Buzzy restaurants: Badehaus Millstatt; Pizzeria Peppino - you get nearly everything, especially exotic food like lopster, oisters, kangaroo.. https://www.pizzeria-peppino.at/;     The Butchers - Steak House; http://www.butcher-millstatt.at/; Charlys in Döbriach - good food and changing country dishes (Mexican, Asian,..); https://www.facebook.com/Charlys-Mein-Restaurant-Mc-Cools-Seelounge-181516261899441/; Villa Verdin; Forelle - Stefanies; La Strada in Radenthein,...\n- Cool bars: Kap 4613; Some bars and discos in Spittal; In summer there are a lot of local festivities and the bars at the lakes are open until late; Villach with different pubs and discos; Velden - great nightlife and a Casino\n- Cozy cafés: Kap 4613 - https://www.kap4613.at/; Fischimbiss im Garten - https://de-de.facebook.com/wwwfischimbissat/ - it is a pearl with a great view and good fish (summer and winter); Badehaus Millstatt - https://www.badehaus-millstaettersee.at/; Kunstcafé Döbriach; Parkcafé Spittal;  In summer: Seelounge Döbriach, Café on the beach in Dellach; \n- Retail therapy: Local markets (Fridays - indoor market in Radenthein in the afternoon; in Seeboden afternoon and evening; on Mondays in Millstatt; on Tuesdays in Döbriach in the evening - must go!, on Thursdays in Spittal in the castle); Shopping malls are in Spittal, Villach, Klagenfurt or if you like italian style cloths you can go to the market in Tarvis (45 min)\n- Bit of culture: Where should we start...? https://de.wikipedia.org/wiki/Stift_Millstatt; https://de.wikipedia.org/wiki/Teurnia; https://www.keltenwelt.at/; https://de.wikipedia.org/wiki/Friesach_(K%C3%A4rnten); https://www.burg-hochosterwitz.com/; \n- Walks in the park: https://www.millstaettersee.com/de/tours/slow-trail-zwergsee.html; ://www.visitcarinthia.at/hiking/hiking/; there is a biking trail around lake Millstatt (24 km - medium level but you can go parts of it by boat); Something very special is a hiking tour to the \"Granattor\" at night to see the sun rise when you arrive there (about 3 hours); \n- Spot of exercise: Different indoor pools and skiing areas nearby; Outdoor sports in summer. \n- Day tripping: www.kaernten.at; There is the possibility to buy a \"Kärnten Card\" - there is one for the summer and one for the winter where the visit of many attractions is for free or at a reduced price; As we are a small country bordering to some other countries the possibilities for short trips are endless. We are pleased to help here.","ot":"The house is only available for 7 days or more. \nObligatory cleaning fee of EUR 70,-\nPlease be aware that in Carinthia we have to register every guest, even if they stay for free. That is why you will have to fill in the guest form and pay visitor´s tax of EUR 2,70 per person and day."}],"ph":["2383236_0","2383236_1","2383236_2","2383236_3","2383236_4","2383236_5","2383236_6","2383236_7","2383236_8","2383236_9","2383236_10","2383236_11","2383236_12","2383236_13","2383236_14","2383236_15","2383236_16", Blanc).\n\nIt is a 95 m2 souplex (ground floor plus lower level), comprising on the ground floor: a bedroom with a double bed, a bathroom with separate toilet, and a kitchen open onto a large living room.\nOn the lower level there are 2 bedrooms. The first has a double bed + a single bed, with its own private bathroom. The second bedroom has a bunk bed and a single bed.\nA terrace is available with the option of eating outside.\n\nWe have 2 indoor parking spaces and a ski room with boot warmers.\nA gym is also available for residents.\n\nThis is a non-smoking home.\n\nWe are happy to welcome pets.","gp":"The accommodation is 100 m from the slopes of the Combloux ski area (Beauregard gondola) and the ESF ski school.\nThe residence is also close to cross-country ski trails and hiking paths.\nThe village of Combloux is below, 5 min away by car. A free shuttle is available to get there. It's a family village with local shops.\nA supermarket is 3 km away.\n5 km away, there is an ice rink and an aquatic centre in the pretty village of Megève.","ot":"This apartment is perfect for an unforgettable mountain holiday! Relax in a peaceful setting with shops and restaurants nearby. Experience the charm of Combloux in absolute comfort!"},{"loc":"fr","title":"Appartement neuf au pied des pistes du domaine skiable de Combloux .","gf":"Notre appartement fait partie d'une nouvelle résidence aux pieds des pistes du domaine de Combloux (Les Portes du Mont Blanc).\n\nIl s'agit d'un souplex de 95 m2, comprenant au RDC :  une chambre avec un lit double, une salle de bain avec toilette séparé, et une cuisine ouverte sur une grande pièce à vivre. \nEn souplex, on trouve 2 chambres. La première est composée d'un lit double + un lit simple, avec sa salle de bain privée.  La seconde chambre se compose d'un lit superposé et d'un lit simple. \nUne terrasse est à disposition avec possibilité de manger à l'extérieur. \n\nNous disposons de 2 places de parking en intérieur et d'un local à ski avec chauffe chaussures. \nUne salle de sport est également à disposition pour les  résidents.\n\nC'est un logement non fumeur. \n\nNous accueillons les animaux avec plaisir.","gp":"Le logement est situé à 100 m des pistes du domaine de Combloux (télécabine de Beauregard) et de l'école de ski ESF.  \nLa résidence est également à proximité de pistes de ski de fond et de chemin de randonnées.  \nLe village de Combloux se situe en contre bas à 5 min en voiture. Une navette gratuite est disponible pour s'y rendre. C'est un village familial avec des commerces de proximités. \nUn supermarché se trouve à 3km. \nA 5km, on trouve une patinoire et un complexe nautique dans le joli village de Megève.","ot":"Cet appartement est parfait pour des vacances inoubliables à la montagne ! Détendez-vous dans un cadre paisible avec commerces et restaurants à proximité. Vivez le charme de Combloux dans un confort absolu !"}],"ph":["2699862_0","2699862_1","2699862_2","2699862_3","2699862_4","2699862_5","2699862_6","2699862_7","2699862_8","2699862_9","2699862_10","2699862_11","2699862_12","2699862_13","2699862_14","2699862_15","2699862_16","2699862_17","2699862_18","2699862_19"]},{"v":"V131","n":131,"id":2858171,"t":"Maison vue sur Mont Dauphin et les Ecrins","town":"Eygliers","cc":"France","region":"Hautes-Alpes","lat":44.68127611847393,"lon":6.635816631312046,"bd":3,"ba":2,"cap":11,"m2":88,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":0,"children_bed":2,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Risoul","m":35,"b":40,"km":21,"via":"D186","q":""},{"n":"Vars","m":45,"b":50,"km":27,"via":"D902","q":"Morzine D902"},{"n":"Serre Chevalier","m":50,"b":60,"km":41,"via":"N94","q":"Durance N94"},{"n":"Montgenevre","m":60,"b":70,"km":45,"via":"N94","q":"Durance N94"},{"n":"Ancelle","m":70,"b":80,"km":61,"via":"N94","q":"Durance N94"},{"n":"Chaillol","m":85,"b":100,"km":73,"via":"N94","q":"Durance N94"},{"n":"Orcieres","  très calme, peu de passage de voiture. La gare SNCF est située à 5 min en voiture et 20 min à pied. Mont Dauphin se trouve à 15 min à pied et de nombreuses randonnées au départ de la maison sont possibles.","ot":null}],"ph":["2858171_0","2858171_1","2858171_2","2858171_3","2858171_4","2858171_5","2858171_6","2858171_7","2858171_8","2858171_9","2858171_10","2858171_11","2858171_12","2858171_13","2858171_14"]},{"v":"V132","n":132,"id":2722127,"t":"L’appartement de Marie-Anne et Xavier","town":"Annecy","cc":"France","region":"Aravis","lat":45.91374531000367,"lon":6.121105689833356,"bd":4,"ba":2,"cap":10,"m2":110,"typ":"Apartment","mn":3,"beds":{"big_double_bed":0,"double_bed":1,"single_bed":2,"children_bed":0,"baby_bed":0,"double_bed_up":2,"single_bed_up":1,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"La Clusaz","m":45,"b":55,"km":31,"via":"D16 and D909","q":"Aravis D909"},{"n":"Le Grand-Bornand","m":45,"b":55,"km":31,"via":"D16 and D909","q":"Aravis D909"},{"n":"Aillons-Margeriaz","m":50,"b":60,"km":41,"via":"D5 and D59","q":""},{"n":"La Feclaz (Grand Revard)","m":60,"b":65,"km":53,"via":"A41 and D913","q":""},{"n":"Les Carroz","m":60,"b":75,"km":73,"via":"A410 and A40","q":""},{"n":"Combloux","m":65,"b":80,"km":82,"via":"A410 and A40","q":""},{"n":"Samoens","m":70,"b":90,"km":79,"via":"A410","q":""},{"n":"Crest-Voland","m":75,"b":90,"km":53,"via":"D1508","q":""}],"near":45,"n30":0,"n60":5,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":false,"garden":false,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":["Aravis D909"],"ski":null,"notes":"City flat in Annecy, 110 m2, no ski claim; resorts need a drive; too small and not a ski base for 12.","score":39,"stars":2.0,"gp":212,"rr":100,"gr":5.0,"ex":13,"owner":"Marie-Anne","recip":false,"desc":[{"loc":"tr","title":"Marie-Anne and Xavier's apartment","gf":"Large 110m2 family apartment 15 minutes' walk from the town centre and 20 from the lake.\n\nBright, with a magnificent view of the surrounding mountains, our apartment is easily accessible by car, with a large residents' car park at the foot of the building.\n\nThis apartment is our main residence, so you will find everything you need in it!\n\nOur apartment consists of a bedroom with a 160x200 bed and a shower room, a study with a 140x190 sofa bed, a child's bedroom with a 90x200 bed (bunk beds possible) and another child's bedroom with a 90x200 bed.\nThe children's bedrooms are large, 15m2. We also have a convertible sofa bed in the living room, but for more comfort we usually put a 140x190 double mattress in one of the children's bedrooms.\nA travel cot is available.","gp":"At the bottom of the building you will find a Carrefour City, a bakery-pâtisserie and a pharmacy. A Biocoop is a few metres away. An ideal neighbourhood for exploring around Annecy (very close to the centre while still being able to drive easily in and out of Annecy).","ot":"There is a barrier at the entrance to the residence.\nA remote fob will be available for you to park after you arrive.\n\nWe make sure someone is there to welcome you (us or a neighbour).\n\nThis is a family home, so no parties or evening gatherings, and no smoking inside (on the balcony no problem as long as you use the ashtray). We get on very well with our neighbours; please respect this good relationship :)"},{"loc":"fr","title":"L’appartement de Marie-Anne et Xavier","gf":"Grand appartement familiale de 110m2 à 15 minutes à pied du centre ville et 20 du lac.\n\nLumineux avec une vue magnifique sur les montagnes environnantes notre appartement est facilement accessible en voiture avec un grand parking de copropriété au pied de l'immeuble.\n\nCet appartement est notre résidence principale, vous trouverez donc tout ce qu’il faut dedans! \n\nNotre appartement est composé d’une chambre avec un lit 160x200 avec une salle d’eau, un bureau avec un canapé lit 140x190, une chambre d’enfant avec un lit 90x200 (possibilité d’avoir des lits superposés) et une autre chambre d’enfant avec un lit 90x200.\nLes chambres des enfants sont grandes 15m2. Nous avons également un canapé lit convertible dans le salon mais pour plus de confort nous mettons généralement un matelas double de 140x190 dans l’une des chambres d’enfants. \nVous trouverez à dispo un lit parapluie.","gp":"En bas de l'immeuble vous trouverez un carrefour city, une boulangerie pâtisserie et une pharmacie. A quelques mètres une bioccop. Quartier idéal pour rayonner autour d'Annecy ( très proche du centre tout en pouvant circuler facilement en voiture pour rentrer et sortir d’Annecy).","ot":"Il y a une barrière pour entrer dans la copropriété.\nUn bip sera à votre disposition pour vous garer après votre arrivée.\n\nNous faisons en sorte que quelqu’un soit présent pour vous accueillir (nous ou un voisin).\n\nLogement familial, donc pas de fête ni de soirée et interdiction de fumer à l’intérieur (sur le balcon aucun problème du moment que vous utilisez le cendrier). Nous nous entendons très bien avec nos voisins, merci de respecter cette entente :)"}],"ph":["2722127_0","2722127_1","2722127_2","2722127_3","2722127_4","2722127_5","2722127_6","2722127_7","2722127_8","2722127_9","2722127_10","2722127_11","2722127_12","2722127_13","2722127_14","2722127_15","2722127_16","2722127_17","2722127_18","2722127_19"]},{"v":"V133","n":133,"id":3322273,"t":"Chalet jusqu'à 10 personnes  avec Piscine / SPA, calme spacieux au grand air des montagnes","town":"Samoëns","cc":"France","region":"Portes du Soleil","lat":46.078500836243855,"lon":6.736125031296302,"bd":4,"ba":4,"cap":11,"m2":127,"typ":"House","mn":3,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":4,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Samoens","m":7,"b":7,"km":2,"via":"Av. du Fer À Cheval","q":""},{"n":"Les Carroz","m":35 nd Massif Express gondola.","ot":"The property is non-smoking, including the garage.\nPets are not accepted.\nIf you need to charge an electric car, there is some tolerance; if the charging amount exceeds €15 of electricity, a supplement will be requested. However, there is no dedicated socket.\nSheets can be provided for a supplement of €25 per bed, payable on arrival.\nA cleaning service can also be requested."},{"loc":"fr","title":"Chalet jusqu'à 10 personnes  avec Piscine / SPA, calme spacieux au grand air des montagnes","gf":"Venez  séjourner dans ce chalet moderne  au charme cocooning à Samoëns.\nIdéal en hiver comme en été, au cœur de la nature, dans un environnement calme.\nParfait pour se ressourcer en famille ou entre amis, il dispose de nombreux équipements, dont un SPA/Jacuzzi pour des moments de détente absolue.\nSitué proche du cœur du village de station, il offre une facilité d’accès aux remontées mécaniques grâce à la navette ski bus gratuite à proximité.\nUn lieu chaleureux et tout confort pour vivre pleinement la montagne en toute saison.\nPossibilité d'hébergement jusqu’à 10 personnes.","gp":"Situé dans un quartier résidentiel calme, le chalet est à quelques minutes des commerces locaux, cafés et parcs. Le centre-ville est à 10 minutes à pied via une piste piéton / cycliste. Une navette ski bus gratuite l'hiver à 40m permet également un accès privilégié au télécabine Grand massif express.","ot":"Le logement est non fumeur même au niveau du garage.\nLes animaux ne sont pas acceptés\nSi vous devez recharger une voiture électrique une tolérance est appliquée si le montant de la recharge excède les 15€ d'électricité un supplément sera demandé. Toutefois il n' y a pas de prise spécifique.\nLes draps peuvent être fournis moyennant un supplément de 25€ par lit à régler à l'arrivée.\nUn service de nettoyage peut être également sollicité."}],"ph":["3322273_0","3322273_1","3322273_2","3322273_3","3322273_4","3322273_5","3322273_6","3322273_7","3322273_8","3322273_9","3322273_10","3322273_11","3322273_12","3322273_13","3322273_14","3322273_15","3322273_16","3322273_17","3322273_18"]},{"v":"V134","n":134,"id":2917312,"t":"Evian - maison à proximité du lac, de la Suisse et des montagnes (stations).","town":"Évian-Les-Bains","cc":"France","region":"Portes du Soleil","lat":46.3894253621886,"lon":6.580693185378198,"bd":4,"ba":2,"cap":10,"m2":124,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":2,"children_bed":0,"baby_bed":0,"double_bed_up":2,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Morzine","m":50,"b":60,"km":39,"via":"D902","q":"Morzine D902"},{"n":"Les Gets","m":55,"b":65,"km":44,"via":"D902","q":"Morzine D902"},{"n":"Avoriaz","m":70,"b":80,"km":51,"via":"D902","q":"Morzine D902"},{"n":"Praz de Lys-Sommand","m":70,"b":80,"km":55,"via":"D902","q":"Morzine D902"},{"n":"Villars","m":70,"b":80,"km":51,"via":"D1005","q":""},{"n":"Champery","m":75,"b":80,"km":55,"via":"Rte des Frasses","q":""},{"n":"Leysin","m":75,"b":85,"km":54,"via":"Route 11","q":""},{"n":"Les Diablerets","m":80,"b":100,"km":59,"via":"Route 11","q":""}],"near":50,"n30":0,"n60":2,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":"jardin de 300m2","winter_restriction":null,"access_issue":null},"av":["f27"],"q":["Morzine D902"],"ski":"Thollon-les-Mémises, Bernex à moins de 20 minutes","notes":"Evian town house, 4 bed/2 bath, sleeps 10 - short of 12; small resorts Thollon/Bernex <20 min; car needed.","score":37,"stars":2.0,"gp":278,"rr":100,"gr":5.0,"ex":12,"owner":"Dimitri","recip":true,"desc":[{"loc":"tr","title":"Evian - house close to the lake, Switzerland and the mountains (resorts).","gf":"House of about 120 m2 with 4 bedrooms, 2 living rooms (with sofa bed), a fitted kitchen, a garage, two private parking spaces, and a 300 m2 garden with a terrace and barbecue.\n\nDiscover Évian-les-Bains, between lake and mountains! On the shores of the magnificent Lake Geneva, Évian-les-Bains is a charming destination in every season.\n\nIn summer, enjoy walks along the lake (municipal beaches, Évian's lagoon pool...), water sports, cruises on the lake to Switzerland, or hikes in the surrounding mountains (Pic des Mémises with a stunning view over Lake Geneva and the Swiss Alps). The Japanese Garden and the Sources Cachat offer peaceful walks right in the heart of town.\n\nIn winter, the nearby ski resorts and snowy landscapes are an ideal setting for lovers of winter sports and relaxation (Thollon-les-Mémises, Bernex less than 20 minutes away...). For a day of relaxation, the Evian Resort Spa or the Valvital thermal baths welcome you for some well-being.\n\nThe town, famous for its mineral water and its Belle Époque architecture, also has a lively centre with cafés, restaurants, beaches and a casino.\n\nNot to mention its prime location, a stone's throw from Switzerland: Lausanne can be reached in 30 minutes by boat, the Valais by road in 30 minutes and Geneva in less than an hour by road or by train.\nThe beautiful medieval lakeside village of Yvoire is also 20 minutes away by car.\n\nPlease note, our house is on the heights of the town. Unless you are a keen walker, it is better to have a car!","gp":"Very quiet, residential, family neighbourhood, mainly inhabited by cross-border workers (French-Swiss).","ot":""},{"loc":"fr","title":"Evian - maison à proximité du lac, de la Suisse et des montagnes (stations).","gf":"Maison de 120m2 environ avec 4 chambres, 2 salons (avec canapé-lit), une cuisine équipée, un garage, deux places privatives, un jardin de 300m2 doté d'une terrasse avec barbecue. \n\nDécouvrez Évian-les-Bains, entre lac et montagnes ! Située au bord du magnifique Lac Léman, Évian-les-Bains est une destination de charme à toutes les saisons.\n\nEn été, profitez des balades au bord du lac (plages municipales, piscine-lagon d’Évian...), des activités nautiques, des croisières sur le lac vers la Suisse, ou encore des randonnées dans les montagnes environnantes (Pic des Mémises avec vue imprenable sur le Léman et les Alpes suisses). Le Jardin Japonais et les Sources Cachat offrent des promenades paisibles en plein cœur de la ville.\n\nEn hiver, les stations de ski proches et les paysages enneigés offrent un cadre idéal pour les amateurs de sports d’hiver et de détente (Thollon-les-Mémises, Bernex à moins de 20 minutes...). Pour une journée de détente, le Spa Evian Resort ou les thermes de Valvital vous accueillent pour un moment bien-être.\n\nLa ville, réputée pour son eau minérale et son architecture Belle Époque, offre également un centre animé avec des cafés, des restaurants, des plages et un casino. \n\nSans compter son emplacement privilégié, à deux pas de la Suisse : Lausanne est accessible en 30 minutes en bateau, le Valais par la route en 30 minute et Genève en moins d’une heure de route ou par le train.\nLe sublime village médiéval d'Yvoire, situé en bord de lac, est également à 20 minutes en voiture.\n\nAttention, notre maison se situe dans les hauteurs de la ville. Sauf à être un grand marcheur, il est préférable d'avoir une voiture !","gp":"Quartier très calme, résidentiel et familial, peuplé majoritairement de travailleurs transfrontaliers (franco-suisses).","ot":""}],"ph":["2917312_0","2917312_1","2917312_2","2917312_3","2917312_4","2917312_5","2917312_6","2917312_7","2917312_8","2917312_9","2917312_10","2917312_11","2917312_12","2917312_13","2917312_14","2917312_15","2917312_16","2917312_17","2917312_18","2917312_19","2917312_20","2917312_21","2917312_22","2917312_23","2917312_24","2917312_25","2917312_26","2917312_27"]},{"v":"V135","n":135,"id":1343702,"t":"Alps, mountain views, quiet historic town","town":"La Ravoire","cc":"France","region":"Bauges","lat":45.55262147691555,"lon":5.9438586704499246,"bd":3,"ba":2,"cap":10,"m2":135,"typ":"House","mn":4,"beds":{"bi as 4 bedrooms, one of which is currently used as a playroom/office for our 2 daughters.\nDownstairs we have a sunny open living space with a fully equipped kitchen which has a direct access to a terrace (gas bbq) and a private garden. The playroom is also on this floor and has a convertible sofa bed.\nUpstairs, there are 3 double bedrooms (1 with a double and a single bed) and 2 bathrooms. One of the room in en-suite with a double bed, a walk-through closet, a bathroom and a balcony.\nIn the basement, there are a garage, a laundry area and a cellar.\n\nNew in 2021 we’ve built a larger terrace with a roof.","gp":"Chambery is an ideal location for outdoors activities winter like summer : skiing, hiking, riding, horse riding, kayaking, canyoning, paragliding ...\nBut you don’t have to be a sport addict to enjoy the beauty of the landscapes, there are many touristic routes offering magical view points and a picnic by the lake at sunset is a dreamy way to end the day. The average temperature of the lake Bourget or Aiguebelette is around 23°C in the summer. \nAnnecy and Grenoble are 40 minutes away and Lyon or Geneva 60/90 minutes away for those who prefer city trips.\nItaly 2 hours.\n\nIn the summer free concerts are usually organised in the town.","ot":"We will take good care of your house and we'll be delighted to help you organise you stay in Chambéry."},{"loc":"fr","title":"Une vue magnifique sur les montagnes","gf":"Nous habitons une maison mitoyenne moderne construite en 2011. Elle est située dans une rue très calme au milieu de maisons plus anciennes en limite de zone naturelle, ce qui nous permet d’avoir des vaches comme voisines au printemps mais aussi d’avoir une vue dégagée sur les montagnes et sur Chambéry.\nPlusieurs balades à pied ou VTT sont possibles au départ de la maison.\nAu rez-de-chaussée, la pièce à vivre est ouverte sur une cuisine équipée, elle a  un accès direct à la terrasse, la pergola et le BBQ Weber. Il y a également une chambre qui est utilisée comme salle de jeux/bureau. Cette pièce possède un couchage pour 2 personnes de type BZ.\nA l’étage, nous avons 3 chambres doubles (dont une avec un lits simple en plus et une suite parentale avec dressing , salle d’eau et balcon) et une salle de bain (baignoire + douche).","gp":"Chambéry est une destination nature idéale été comme hiver entre lac et montagne. De nombreuses activités peuvent être pratiquées : randonnée, baignade, ski, vélo, randonnée équestre, voile, kayak, canyoning, spéléologie, parapente….\nMais il n’est pas obligatoire d’être sportif pour apprécier la région, de nombreuses routes touristiques offrent des points de vue sublimes sans effort et un pique-nique à la plage au coucher du soleil est une façon rêvée de terminer la journée…  La température estivale des eaux des lacs du Bourget ou d’Aiguebelette  est en moyenne de 22°C.\nAnnecy ou Grenoble sont accessibles en 40 minutes et Lyon ou Genève en 60 à 90 minutes pour ceux qui préfèrent les escapades citadines.\nL’été des concerts gratuits animent la ville et des séances de cinéma en plein air sont organisées chaque semaine.","ot":"Nous prendrons grand soin de votre maison et serons ravis de vous aider à organiser votre séjour à Chambéry."}],"ph":["1343702_0","1343702_1","1343702_2","1343702_3","1343702_4","1343702_5","1343702_6","1343702_7","1343702_8","1343702_9","1343702_10","1343702_11","1343702_12","1343702_13","1343702_14","1343702_15","1343702_16","1343702_17","1343702_18","1343702_19","1343702_20","1343702_21","1343702_22","1343702_23","1343702_24","1343702_25","1343702_26","1343702_27","1343702_28","1343702_29","1343702_30","1343702_31","1343702_32","1343702_33","1343702_34","1343702_35","1343702_36","1343702_37","1343702_38","1343702_39","1343702_40","1343702_41","1343702_42","1343702_43"]},{"v":"V136","n":136,"id":3225982,"t":"il migliore panorama delle Dolomiti!","town":"Alleghe","cc":"Italy","region":"Dolomites","lat":46.40836694845567,"lon":12.025473209892553,"bd":3,"ba":2,"cap"  rez de chaussée, vous trouverez la pièce à vivre (salon et cuisine), l'accès à la terrasse, une salle de bain avec un toilette. Au premier étage, vous pourrez bénéficier des 3 chambres, d'une salle de bain et d'un toilette séparé.\nAu troisième étage, dans les combles, il y a une dernière chambre qui sera fermée en fonction du nombre de locataires.\n\nNous avons cette maison depuis seulement 2 ans, nous faisons des petits travaux à notre rythme, il reste des choses à faire mais rien qui vous empêcherait de passer de belles vacances !","gp":"Nous habitons dans un quartier calme, en impasse. Nous sommes à quelques minutes à pieds du centre du village avec toutes les commodités (boulangerie, tabac, charcuterie, banque, pharmacie ) et il y a des départs de bus très proches.\nA 5 minutes en voiture, vous trouverez une grande zone commerciale.","ot":"Vous serez séduits par ce petit coin : vous serez à quelques kilomètres des premières plages du lac d'Annecy, à 30 min des premières stations de ski, à 30 min par l'autoroute de Genève, à moins d'une heure de Chamonix !"}],"ph":["2647618_0","2647618_1","2647618_2","2647618_3","2647618_4","2647618_5","2647618_6","2647618_7","2647618_8","2647618_9","2647618_10","2647618_11","2647618_12","2647618_13","2647618_14","2647618_15","2647618_16","2647618_17","2647618_18","2647618_19","2647618_20"]},{"v":"V142","n":142,"id":2537696,"t":"Alessandro's house","town":"Moena","cc":"Italy","region":"Dolomites","lat":46.375561019456455,"lon":11.660105865691689,"bd":4,"ba":2,"cap":11,"m2":130,"typ":"House","mn":5,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":4,"children_bed":0,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Canazei","m":35,"b":45,"km":18,"via":"Strada Dolomites/SS48","q":""},{"n":"Alleghe","m":60,"b":70,"km":40,"via":"Strada Statale 346 del Passo di S. Pellegrino and SP346","q":""},{"n":"San Martino di Castrozza","m":60,"b":70,"km":40,"via":"SS50","q":""},{"n":"Selva lopes of the Alpe Lusia–San Pellegrino ski area, which is part of Dolomiti Superski. In summer, you can enjoy walks in the countryside, hiking in the mountains, cycling or MTB. The local cheese, \"Puzzone di Moena PDO\", is well worth tasting all year round.\nMoena (1200 m) is the largest town in the Fassa Valley and includes the hamlets of Forno, Medil, Peniola, Sorte and Someda. The village is known as \"the Fairy of the Dolomites\" because of the beautiful pink light that tinges the mountain tops at sunrise and sunset, creating spectacular views.\n\nSince 2011, Moena has been one of the Alpine Pearls, a title awarded to mountain resorts able to offer ecological and environmentally friendly holidays.\n\nAn evocative location framed by woods, trails and green countryside, in summer, you'll be entranced by the spectacular views of the spires of the Latemar (2790 m) and the San Pellegrino Pass. In winter, the town is the heart of the Alpe Luisa - San Pellegrino ski area, whose snowy expanses are a fabulous destination at any time of year. It has a network of ski lifts and ski slopes with various levels of difficulty, suitable for anyone who wants to try skiing.","ot":"Mandatory cleaning: €150."},{"loc":"it","title":"Casa di Alessandro","gf":"In the heart of the Dolomites, a Unesco World Heritage Site, in the charming village of Moena, our warm house enjoys a wonderful view, spacious rooms, a garden (a rarity in these mountain villages) and all contemporary comforts.\nIt is composed of :\n- on the ground floor: a large living-room with three large windows on the village and the Dolomites, a large kitchen, a bathroom, a garage, a changing room\n- on the first floor: 4 bedrooms and a bathroom","gp":"À Moena, à less than 5 minutes walk from the center with many restaurants, cafes and boutiques, and at the same time in a very quiet area with a beautiful view of the mountains and the other side of the town of Moena. We are less than 5 minutes from the Lusia ski lifts and 1 e regional bus to the ski lifts of the \"Skijuwel Alpbachtal-Wildschönau\".\nOr hiking up the many mountains in the area (Kitzbühel and Zillertal Alps), MTB tours, swimming in the surrounding lakes, picking blueberries and mushrooms ..... simply enjoying nature or making use of the region's full programme of tourist activities....","ot":"Accommodation available from the end of May 2021"},{"loc":"de","title":"Alpbach/Tirol - Sonne und Panoramablick im \"schönsten Dorf Österreichs\"","gf":"Sonnige, ruhige Wohnung mit herrlichem Bergblick im \"schönsten Dorf Österreichs\", die Wohnung verfügt über eine sehr geräumige Wohnküche sowie drei Doppelzimmer mit jeweils eigenem Bad/WC. Alle Räume haben Zugang zum  Balkon, Das Haus bzw. die Wohnung war ursprünglich ein kleines Familienhotel, der typische Tiroler Holzbaustil wurde erhalten - die Ausstattung modernisiert. \nVor allem die Küche ist bestens ausgestattet....","gp":"Ruhige sonnige Lage und trotzdem alles in wenigen Minuten zu Fuß zu erreichen - die zahlreichen guten Tiroler Wirtshäuser ebenso wie der Regionalbus zu den Skiliften des \"Skijuwel Alpbachtal-Wildschönau\". \nOder Wandern auf die vielen Berge der Umgebung (Kitzbüheler und Zillertaler Alpen), MTB-Touren, Schwimmen in den umliegenden Seen, Heidelbeeren und Pilze sammeln ..... einfach die Natur genießen oder das volle Programm touristischer Angebote der Region nützen....","ot":"Unterkunft ab Ende Mai 2021 verfügbar"}],"ph":["1881875_0","1881875_1","1881875_2","1881875_3","1881875_4","1881875_5","1881875_6","1881875_7","1881875_8","1881875_9","1881875_10","1881875_11","1881875_12","1881875_13"]},{"v":"V144","n":144,"id":2929743,"t":"Chiara, Giovanni and the kids","town":"Belluno","cc":"Italy","region":"Friuli","lat":46.15249279828085,"lon":12.231989182431104,"bd":3,"ba":2,"cap":10,"m2":156,"typ":"Apartment","mn":0,"beds":{"big_double_bed":0,"double_bed":1,"single_bed":3,"children_bed":0,"baby_bed":1,"double_bed_up":0,"single_bed_up":3,"children_bed_up":0,"bab
