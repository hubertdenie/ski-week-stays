iclette che potrete usare liberamente per esplorare la zona.","gp":"Ci troviamo in un quartiere molto tranquillo, tipico della nostra città. Il centro è facilmente raggiungibile:\n\n7 minuti in auto\n30 minuti a piedi\n15 minuti in bicicletta\n\nLa nostra posizione è strategica per esplorare le bellezze del Veneto e delle vicine regioni:\n\nA un'ora dalle Dolomiti, le montagne più belle d'Italia, perfette per escursioni e attività all'aria aperta.\n\nA un'ora da Venezia, una delle città più affascinanti del mondo.\n\nSiamo anche vicini a città d'arte come Verona e Padova.\n\nSiamo certi che vi troverete benissimo nella nostra casa e nella nostra splendida regione!","ot":""},{"loc":"it","title":"Chiara, Giovanni and the kids","gf":"La nostra casa è molto spaziosa e accogliente, ideale per ospitare un'altra famiglia. Si trova al secondo piano, servito da ascensore, e offre:\n\nTre camere da letto: una con letto matrimoniale, una con letto a castello e una con letto singolo.\n\nPosti letto extra: abbiamo anche a disposizione un lettino per bambino e due brandine per adattarci al meglio alle vostre esigenze. Anche sull'ampio divano si può tranquillamente dormire comodamente.\n\nDue bagni: uno con doccia e uno con vasca da bagno, per il massimo comfort.\n\nUna grande sala da pranzo con cucina a vista, perfetta per cucinare e stare insieme.\n\nUn ampio terrazzino che si affaccia su un tranquillo giardino condominiale, un luogo ideale per rilassarsi.\n\nUna scala a chiocciola porta poi ad un altro piano dove ci sono due scrivanie per lavorare. \n\nNon abbiamo la connessione WiFi ma in casa la rete mobile prende molto bene e si può usare l'hotspot personale per usare la smart TV.\n\nPer la vostra comodità, offriamo anche un posto auto scoperto e un garage con biciclette che potrete usare liberamente per esplorare la zona.","gp":"Ci troviamo in un quartiere molto tranquillo, tipico della nostra città. Il centro è facilmente raggiungibile:\n\n7 minuti in auto\n30 minuti a piedi\n15 minuti in bicicletta\n\nLa nostra posizione è strategica per esplorare le bellezze del Veneto e delle vicine regioni:\n\nA un'ora dalle Dolomiti, le montagne più belle d'Italia, perfette per escursioni e attività all'aria aperta.\n\nA un'ora da Venezia, una delle città più affascinanti del mondo.\n\nA venti minuti dal meraviglioso Lago di Santa Croce.\n\nSiamo anche vicini a città d'arte come Verona e Padova.\n\nSiamo certi che vi troverete benissimo nella nostra casa e nella nostra splendida regione!","ot":""}],"ph":["2929743_0","2929743_1","2929743_2","2929743_3","2929743_4","2929743_5","2929743_6","2929743_7","2929743_8","2929743_9","2929743_10","2929743_11","2929743_12","2929743_13","2929743_14","2929743_15","2929743_16","2929743_17"]},{"v":"V145","n":145,"id":2862380,"t":"Ampia casa fra natura, silenzio e panorami alpini","town":"Terlago","cc":"Italy","region":"Trentino","lat":46.1117369955979,"lon":11.04642062442428,"bd":3,"ba":2,"cap":10,"m2":130,"typ":"Apartment","mn":3,"beds":{"big_double_bed":0,"double_bed":3,"single_bed":1,"children_bed":0,"baby_bed":0,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"Monte Bondone","m":40,"b":40,"km":34,"via":"SP85","q":""},{"n":"Folgaria","m":50,"b":60,"km":41,"via":"SS12 and SS350","q":""},{"n":"Paganella","m":55,"b":70,"km":47,"via":"SS421","q":""},{"n":"Madonna di Campiglio","m":90,"b":110,"km":66,"via":"SS237 and SS239","q":""},{"n":"Passo Brocon","m":100,"b":110,"km":86,"via":"SS47","q":""},{"n":"San Martino di Castrozza","m":130,"b":160,"km":124,"via":"SS47","q":""}],"near":40,"n30":0,"n60":3,"fac":{"fireplace":false,"sauna":false,"toysIn":false,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":"playground is public: dietro casa si trovano un parco giochi","large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":null,"notes":"Quiet 3-bed flat near Terlago lakes for max 9 adults + baby; no ski claim, car needed; EUR 100 cleaning; too small for 12.","score":29,"stars":1.5,"gp":175,"rr":100,"gr":5.0,"ex":6,"owner":"EMANUELA","recip":false,"desc":[{"loc":"tr","title":"Spacious home amid nature, silence and alpine views","gf":"Welcome to our cosy, modern apartment, ideal for relaxing and exploring the surroundings in the best possible way!\n\nWe have three large bedrooms with double beds, one of which also has a single bed, a fully equipped kitchen and a warm living room that is incredibly bright thanks to the large windows overlooking the private garden. The apartment can sleep up to 9 adults and a baby in the cot.\n\nAn invitation to slow down and breathe in the tranquillity of the surrounding scenery. A short walk takes you to two crystal-clear lakes, perfect for a refreshing dip.","gp":"The neighbourhood is quiet and surrounded by greenery, ideal for those looking for relaxation, silence and a break from the hectic pace of the city. Right behind the house there is a playground perfect for families and numerous trails winding through woods and mountain landscapes, ideal for restorative strolls or longer hikes. The area is residential with little traffic, which ensures peace and privacy. Although it is a bit isolated, all the main services — supermarkets, shops, restaurants — are easily reached by car. It's the perfect place for those who love nature and tranquillity but don't want to be too far from everything.","ot":"Please do not smoke inside the apartment. Pets are not allowed. The apartment provides sheets and towels free of charge. At the end of the stay we ask for a contribution of 100 euros towards cleaning costs, to be left in the apartment."},{"loc":"it","title":"Ampia casa fra natura, silenzio e panorami alpini","gf":"Benvenuti nel nostro appartamento accogliente e moderno, ideale per rilassarsi ed esplorare i dintorni nel migliore dei modi!\n\nAbbiamo tre grandi camere da letto con letti matrimoniali, una delle quali anche con un letto singolo, una cucina completamente attrezzata e un soggiorno caldo e incredibilmente luminoso grazie alle grandi finestre che si affacciano sul giardino privato. L'appartamento può ospitare fino a 9 adulti e un neonato nella culla. \n\nUn invito a rallentare e respirare la tranquillità del panorama che ci circonda. Con una breve passeggiata, raggiungi due laghi cristallini perfetti per un tuffo rigenerante.","gp":"Il quartiere è tranquillo e immerso nel verde, ideale per chi cerca relax, silenzio e una pausa dal ritmo frenetico della città. Proprio dietro casa si trovano un parco giochi perfetto per famiglie e numerosi sentieri che si snodano tra boschi e paesaggi montani, ideali per passeggiate rigeneranti o escursioni più lunghe. La zona è residenziale e poco trafficata, il che garantisce quiete e privacy. Pur essendo un po’ isolato, tutti i principali servizi — supermercati, negozi, ristoranti — si raggiungono facilmente in auto. È il luogo perfetto per chi ama la natura e la tranquillità, ma non vuole essere troppo lontano da tutto.","ot":"Si prega di non fumare all'interno dell'appartamento. Non sono ammessi animali domestici. L'appartamento dispone di lenzuola ed asciugamani gratuiti. Si chiede a fine soggiorno un contributo per le spese di pulizia di 100 euro da lasciare in appartamento."}],"ph":["2862380_0","2862380_1","2862380_2","2862380_3","2862380_4","2862380_5","2862380_6","2862380_7","2862380_8","2862380_9","2862380_10","2862380_11","2862380_12","2862380_13","2862380_14","2862380_15","2862380_16","2862380_17","2862380_18","2862380_19","2862380_20","2862380_21","2862380_22","2862380_23","2862380_24","2862380_25","2862380_26"]}];

  const av=h.av.length?h.av.map(a=>`<span class="av">${WINL[a]}</span>`).join(""):'<span class="small muted">No holiday dates marked yet by the owner.</span>';
  const evs=[["fireplace","Fireplace"],["sauna","Sauna"],["toys_inside","Toys inside"],["toys_outside","Toys outside"],["large_garden","Garden"]].filter(([k])=>h.ev[k]).map(([k,l])=>`<li><b>${l}:</b> “${esc(h.ev[k])}”</li>`).join("");
  app.innerHTML=`<div class="dwrap">
   <button class="back" type="button" id="back">‹ All homes</button>
   <div class="dhead"><span class="bigid">${h.v}</span><h1>${esc(h.t||h.town)}</h1></div>
   <div class="muted">${stars(h.stars)} · ${esc(h.town)}, ${esc(h.region)} · ${esc(h.cc)}</div>
   <div class="mosaic">${mosaic}${ph.length>1?`<button class="allbtn" type="button" data-lb="0">Show all ${ph.length} photos</button>`:""}</div>
   ${carousel(h,"dcar")}
   <div class="cols">
    <div>
     <div class="sec"><h3>${h.bd} bedrooms · sleeps ${h.cap}</h3>
      <div class="facts"><span>${h.ba??"?"} bathrooms</span>${h.m2?`<span>${h.m2} m²</span>`:""}<span>${h.typ}</span>${h.mn?`<span>Minimum stay ${h.mn} nights</span>`:""}</div>
      <div style="margin-top:10px">${beds(h)}</div></div>
     <div class="sec"><h3>What matters for our group</h3><div class="amen">${Object.keys(FACL).map(k=>amenity(h,k)).join("")}</div>${evs?`<ul class="ev">${evs}</ul>`:""}</div>
     <div class="sec"><h3>About this home</h3>${h.notes?`<p style="margin-top:0"><b>In short:</b> ${esc(h.notes)}</p>`:""}
      ${locs.length>1?`<div class="tabs" id="tabs">${locs.map(l=>`<button type="button" class="pill" data-loc="${l}" aria-pressed="${l===loc0}">${LANG[l]||l}</button>`).join("")}</div>`:""}
      <div id="desc">${descHtml(h,loc0)}</div>
      ${loc0==="tr"?`<p class="note">Translated from the owner's ${LANG[h.desc.find(d=>d.loc!=="tr")?.loc]||"original"} text. The original is under the other tab.</p>`:""}</div>
     <div class="sec"><h3>Where it is</h3>
      ${MAP[h.id]||BUNDLED?`<img class="mapimg" data-map="${h.id}" src="${MAP[h.id]||BLANK}" style="aspect-ratio:560/350" alt="Map of ${esc(h.town)} and nearby ski areas">`:""}
      <p class="note">White circle: the home. Coloured dots: ski areas with the drive time in minutes. ${esc(h.town)}, ${esc(h.region)}, ${esc(h.cc)} · ${h.lat.toFixed(4)}, ${h.lon.toFixed(4)}${h.ski?`<br>Owner on skiing: “${esc(h.ski)}”`:""}</p></div>
     <div class="sec"><div class="organiser"><b>For the organiser</b>
      <span>HomeExchange listing <a href="https://www.homeexchange.com/holiday-home/${h.id}" target="_blank" rel="noopener">#${h.id}</a> · <a href="https://www.google.com/maps/search/?api=1&query=${h.lat.toFixed(5)},${h.lon.toFixed(5)}" target="_blank" rel="noopener">Google Maps</a></span>
      <span class="muted">Host ${esc(h.owner)} · ${h.ex??0} exchanges · rating ${h.gr||"–"} · replies to ${h.rr}% of messages · ${h.gp??"?"} GuestPoints/night${h.recip?" · prefers reciprocal swaps":""}</span></div></div>
    </div>
    <aside class="box"><h3>${SKI} Drive to the slopes</h3>
     <table class="dt">${rows||'<tr><td class="muted">No route found.</td></tr>'}</table>
     <p class="note" style="margin:0">Google Maps prediction, weekday 08:30 in February, to the ski area's village.</p>
     <div><b>School holidays</b><div class="avs" style="margin-top:6px">${av}</div></div>
     <div class="pick">Like this one? Write down <b>${h.v}</b></div>
    </aside>
   </div>
   <div class="pn">${prev?`<button class="pill" type="button" data-go="${prev}">‹ ${prev}</button>`:"<span></span>"}${next?`<button class="pill" type="button" data-go="${next}">${next} ›</button>`:""}</div>
  </div>`;
  window.scrollTo(0,0);
  $("back").onclick=()=>{location.hash=""};
  const tabs=$("tabs");if(tabs)tabs.onclick=e=>{const b=e.target.closest("button");if(!b)return;[...tabs.children].forEach(c=>c.setAttribute("aria-pressed",c===b));$("desc").innerHTML=descHtml(h,b.dataset.loc)};
  app.querySelectorAll("[data-lb]").forEach(el=>el.onclick=()=>openLb(h,+el.dataset.lb));
  app.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{location.hash=el.dataset.go});
  bindCars(true);hydrate();loadHome(h.id);
}
const $=id=>document.getElementById(id);
function bindCars(inDetail){
  app.querySelectorAll(".car").forEach(c=>{const t=c.querySelector(".track"),dots=c.querySelectorAll(".dots i");
    c.querySelectorAll(".nav").forEach(b=>b.onclick=e=>{e.stopPropagation();t.scrollBy({left:t.clientWidth*+b.dataset.d,behavior:"smooth"})});
    t.addEventListener("scroll",()=>{const i=Math.round(t.scrollLeft/t.clientWidth);dots.forEach((d,j)=>d.classList.toggle("on",j===i))},{passive:true});
    if(inDetail)t.querySelectorAll("img").forEach((im,i)=>im.onclick=()=>openLb(byV[c.dataset.v],i));
  })}
function bindOverview(){
  $("q").oninput=e=>{st.q=e.target.value;rerender("q")};
  $("mapo").onclick=openMap;
  $("ftog").onclick=()=>{st.open=!st.open;rerender()};
  app.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>{st.win=b.dataset.win;rerender()});
  app.querySelectorAll(".seg").forEach(s=>s.onclick=e=>{const b=e.target.closest("button");if(!b)return;st[s.dataset.k]=+b.dataset.v;rerender()});
  app.querySelectorAll("[data-f]").forEach(c=>c.onchange=()=>{st.f[c.dataset.f]=c.checked;rerender()});
  $("near").oninput=e=>{st.near=+e.target.value;rerender("near")};
  $("noq").onchange=e=>{st.noq=e.target.checked;rerender()};
  $("sort").onchange=e=>{st.sort=e.target.value;rerender()};
  app.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{st.pg=+b.dataset.pg;overview();const g=$("grid");if(g)window.scrollTo(0,g.getBoundingClientRect().top+scrollY-120)});
  app.querySelectorAll(".per").forEach(sl=>sl.onchange=()=>{st.per=+sl.value;try{localStorage.setItem("per",st.per)}catch(e){}rerender()});
  $("reset").onclick=()=>{Object.assign(st,{win:"all",bd:3,cap:10,n30:0,st:0,q:"",near:60,f:{},noq:false,sort:"score"});rerender()};
  app.querySelectorAll(".card").forEach(c=>{c.onclick=e=>{if(e.target.closest(".nav"))return;location.hash=c.dataset.go};c.onkeydown=e=>{if(e.key==="Enter")location.hash=c.dataset.go}});
  bindCars(false);hydrate();
}
let LMAP=null,LLAY=null;
function openMap(){const L0=filtered();$("mapov").classList.add("open");document.body.style.overflow="hidden";$("mapt").textContent=L0.length+" homes on the map · tap a pin for details";
  if(!window.L){$("hmap").innerHTML='<p style="padding:20px">The map needs an internet connection.</p>';return}
  if(!LMAP){LMAP=L.map("hmap");L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(LMAP)}
  if(LLAY)LLAY.remove();LLAY=L.layerGroup().addTo(LMAP);const b=[];
  L0.forEach(h=>{const m=L.marker([h.lat,h.lon],{zIndexOffset:1000-(h.n||0)*5,icon:L.divIcon({className:"",html:`<div class="vpin">${h.v}</div>`,iconSize:null,iconAnchor:[18,12]})}).bindTooltip(`${esc(h.v)} · ${esc(h.town)} · ${h.bd} bedrooms`).on("click",()=>{closeMap();location.hash=h.v});m.addTo(LLAY);b.push([h.lat,h.lon])});
  setTimeout(()=>{LMAP.invalidateSize();if(b.length)LMAP.fitBounds(b,{padding:[40,40]})},50)}
function closeMap(){$("mapov").classList.remove("open");document.body.style.overflow=""}
$("mapx").onclick=closeMap;document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("mapov").classList.contains("open"))closeMap()});
let lastY=0;
function rerender(focus){const y=window.scrollY;overview();window.scrollTo(0,y);if(focus){const el=$(focus);el.focus();if(el.setSelectionRange&&el.type==="search")el.setSelectionRange(el.value.length,el.value.length)}}
let LBH=null;
function openLb(h,i){loadHome(h.id,true);LBH=h;$("lbt").innerHTML=h.ph.map((k,j)=>`<div><img src="${BLANK}" data-k="${k}" alt="Photo ${j+1}"></div>`).join("");$("lb").classList.add("open");document.body.style.overflow="hidden";
  const t=$("lbt");requestAnimationFrame(()=>{t.scrollLeft=t.clientWidth*i;upd()});t.onscroll=upd;$("lbx").focus()}
function upd(){const t=$("lbt");$("lbc").textContent=`${LBH.v} · ${Math.round(t.scrollLeft/t.clientWidth)+1} / ${LBH.ph.length}`}
function closeLb(){$("lb").classList.remove("open");document.body.style.overflow=""}
$("lbx").onclick=closeLb;$("lbp").onclick=()=>$("lbt").scrollBy({left:-$("lbt").clientWidth,behavior:"smooth"});$("lbn").onclick=()=>$("lbt").scrollBy({left:$("lbt").clientWidth,behavior:"smooth"});
document.addEventListener("keydown",e=>{if(!$("lb").classList.contains("open"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowRight")$("lbn").click();if(e.key==="ArrowLeft")$("lbp").click()});
const app=$("app");
function route(){closeLb();const v=decodeURIComponent(location.hash.slice(1));if(v&&byV[v]){lastY=lastY||window.scrollY;detail(v)}else{overview();if(lastY){window.scrollTo(0,lastY);lastY=0}}}
let CRASH=null;try{const v=sessionStorage.getItem("alive");if(v&&!sessionStorage.getItem("clean"))CRASH=JSON.parse(v);sessionStorage.removeItem("clean")}catch(e){}
function crumb(){try{sessionStorage.setItem("alive",JSON.stringify({at:location.hash||"list",pg:st.pg,per:st.per,ua:navigator.userAgent.slice(0,80),t:new Date().toISOString()}))}catch(e){}}
addEventListener("pagehide",()=>{try{sessionStorage.setItem("clean","1")}catch(e){}});
window.addEventListener("hashchange",()=>{route();crumb()});route();crumb();
if(CRASH){const d=document.createElement("div");d.setAttribute("role","status");d.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:90;background:#1c2320;color:#fff;padding:12px 14px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 4px 16px rgb(0 0 0/.3)";d.innerHTML="The page closed unexpectedly last time (at <b>"+String(CRASH.at).replace(/</g,"")+"</b>, "+CRASH.per+" per page). Please send Hubert a screenshot of this message. <button type=button style='margin-left:8px;border:0;border-radius:8px;padding:4px 10px'>OK</button>";d.querySelector("button").onclick=()=>d.remove();document.body.appendChild(d)}
</script>
