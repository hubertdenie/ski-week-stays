 Hiking and mountain-bike trails start from the house. Surrounded by green countryside with cows and, further away, the beautiful mountains of the Écrins National Park and the Dévoluy. In winter, ski resorts 20 min away.","ot":"WE HAVE A LOT OF GUESTPOINTS AND PREFER RECIPROCAL EXCHANGES, THANK YOU FOR YOUR UNDERSTANDING..."},{"loc":"fr","title":"Maison insolite ronde \"DomeEspace\" en bois dans le parc national des Ecrins.","gf":"Notre maison \"Dôme\" est complètement ronde ! C'est un grand chalet ossature bois confortable de 200m² comprenant 4 chambres équipées de salles de bains privatives, 2 salons, une grande cuisine équipée et une grande salle a manger. Ambiance bois dans un beau jardin de 1500m² au cœur de la campagne du Parc National des Ecrins. Ici la priorité est donnée au contact avec la nature et les montagnes...ressourcement garanti à l'intérieur comme à l'extérieur quelle que soit la saison !","gp":"Située dans un hameau, à 500 m des premiers commerces (boulangerie, épicerie, brasserie) et à 7 mn en voiture de supermarchés. Sentiers de randonnée et VTT au départ de la maison. Enveloppée de campagne verte avec des vaches et plus loin des belles montagnes du Parc National des Ecrins et du Dévoluy. L'hiver, stations de ski à 20mn.","ot":"NOUS AVONS BEAUCOUP DE GP ET PRIVILEGIONS LES ECHANGES RECIPROQUES, MERCI DE VOTRE COMPREHENSION..."}],"ph":["2967900_0","2967900_1","2967900_2","2967900_3","2967900_4","2967900_5","2967900_6","2967900_7","2967900_8","2967900_9","2967900_10","2967900_11","2967900_12","2967900_13","2967900_14","2967900_15","2967900_16","2967900_17","2967900_18","2967900_19","2967900_20"]},{"v":"V28","n":28,"id":3012001,"t":"Chez la famille ZUMI","town":"Saint-Jean-D'arvey","cc":"France","region":"Bauges","lat":45.58846774640831,"lon":5.991754334858823,"bd":4,"ba":1,"cap":11,"m2":180,"typ":"House","mn":3,"beds":{"big_double_bed":1,"double_bed":3,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":2,"children_bed_up":0,"baby_bed_up":1},"res":[{"n":"La Feclaz (Grand Revard)","m":20,"b":22,"km":13,"via":"D912 and D913","q":""},{"n":"Aillons-Margeriaz","m":24,"b":24,"km":16,"via":"D206","q":""},{"n":"Les 7 Laux","m":55,"b":65,"km":54,"via":"A41","q":""},{"n":"Le Collet d'Allevard","m":60,"b":70,"km":56,"via":"A41","q":""},{"n":"Le Sappey","m":65,"b":80,"km":68,"via":"A41","q":""},{"n":"Crest-Voland","m":70,"b":85,"km":80,"via":"A43","q":"Maurienne A43"},{"n":"St-Pierre-de-Chartreuse","m":70,"b":85,"km":47,"via":"D1006","q":"Maurienne"},{"n":"Saint-Francois-Longchamp","m":80,"b":100,"km":86,"via":"A43","q":"Maurienne A43"}],"near":20,"n30":2,"n60":4,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"une salle de jeux avec beaucoup de jouets et de jeux de société","toys_outside":"un trampoline, une balançoire et un toboggan à l'extérieur","large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"La Féclaz ski de fond; Le Revard et Le Margériaz ski alpin (near village)","notes":"Family house above Chambéry, 4 bed/1 bath, sleeps 11; great for kids (playroom, trampoline, swing); small Revard/Margériaz resorts.","score":67,"stars":3.5,"gp":230,"rr":100,"gr":5.0,"ex":4,"owner":"Julien","recip":true,"desc":[{"loc":"tr","title":"At the ZUMI family's","gf":"A bright, practical house at the gateway to the Massif des Bauges Natural Park (a UNESCO Global Geopark), in Savoie, in the heart of the French Alps, with an incredible view of Mont Granier and the Belledonne range. It is in the charming village of Saint-Jean-d’Arvey, an ideal starting point for exploring the region on foot, on skis or by bike.\n\nOn the ground floor you will find the garage, where you can store outdoor gear.\nThere is also a bedroom with a double bed, a WC, the kitchen, the living room, the dining room and a utility room, with direct access to the garden and terrace.\n\nOn the 1st floor you will find 3 bedrooms with double beds, a desk area ideal for remote working, a large bathroom with shower and bathtub, and a WC. There is also a games room with lots of toys and board games for children and adults :)\n\nThe house also has a travel cot and 3 single mattresses.\n\nWe have lots of toys for children (indoor and outdoor), as well as a trampoline, a swing and a slide outside.\nYou will also find a barbecue, garden furniture, and a large table for eating in the shade of the trees.","gp":"Set in peaceful surroundings, this residential neighbourhood offers a particularly quiet place to live.\nPerfect for a family or a group of friends wanting to enjoy outdoor activities such as skiing, cycling or hiking.\n\nSaint-Jean-d’Arvey is a charming, friendly village with many local shops and services: bakery, pharmacy, post office, hairdresser, greengrocer, medical practice, physiotherapists and a gourmet restaurant. The village is also home to various local craftspeople such as a potter, a seamstress and a jeweller. All offer quality products, often locally sourced.\n\nFor leisure, there is a football pitch, pétanque areas, a free tennis court, several barbecue areas with shared tables, and a small skatepark. Many hiking routes start right from the village, taking you to the Doria waterfall and the Mont Peney via ferrata, as well as activities such as canyoning and climbing.\n\nThe main lakes of Savoie are less than 45 minutes away: Lac de la Thuile, Lac du Bourget and Lac d’Aiguebelette. Located at the foot of the Croix du Nivolet, the village is also close to Aix-les-Bains, La Féclaz and its vast Nordic ski area, and the alpine ski resorts of Le Revard and Le Margériaz. Chambéry, capital of Savoie, is only 15 minutes away by car, giving easy access to shops, theatres, cinemas and the historic centre.\n\nThe house enjoys a prime location in the heart of the Alps: 20 minutes from Lac du Bourget, 30 minutes from Lac d’Aiguebelette, 25 minutes from Aix-les-Bains, 45 minutes from Annecy and its lake, 45 minutes from Grenoble, and about 1h15 from Chamonix, Geneva or Lyon.","ot":"✨ A natural gem in the heart of the Alps, between lakes and mountains\n\nTreat yourself to a unique break in unspoilt surroundings, ideal for a family or a group of friends looking for nature, comfort and authenticity. Summer and winter alike, enjoy an exceptional setting for skiing, hiking, cycling and relaxing.\n\nNestled in the charming village of Saint-Jean-d’Arvey, the house enjoys a peaceful setting while staying close to all amenities: artisan bakery, butcher, local shops, healthcare professionals and a gourmet restaurant. The village charms with its authenticity and the quality of its local produce, made by many passionate craftspeople.\n\nAs for activities, everything is accessible straight from the house: hiking trailheads, the Doria waterfall, the Mont Peney via ferrata, climbing sites and canyoning. Also on site: a free tennis court, relaxation areas with barbecues, sports grounds and facilities for young and old.\n\nYou are ideally placed to explore the region's most beautiful landscapes:\n– Lac du Bourget 20 minutes away\n– Lac d’Aiguebelette 30 minutes away\n– Aix-les-Bains 25 minutes away\n– Annecy and its lake 45 minutes away\n\nIn winter, enjoy the nearby ski areas: La Féclaz for cross-country skiing, Le Revard and Le Margériaz for alpine skiing, all in a remarkable natural setting at the foot of the Croix du Nivolet.\n\nFinally, Chambéry, the historic capital of Savoie, is 15 minutes away and offers a rich cultural mix: old town, restaurants, markets, cinemas and theatre.\n\n"},{"loc":"fr","title":"Chez la famille ZUMI","gf":"Maison lumineuse et fonctionnelle, située aux portes du Parc naturel du Massif des Bauges (classé Géoparc mondial UNESCO), en Savoie, au cœur des Alpes françaises, avec une vue  incroyable sur le Mont Granier et la chaîne de Belledonne. Elle se trouve dans le charmant village de Saint-Jean-d’Arvey, un point de départ idéal pour découvrir la région à pied, à ski ou à vélo.\n\nAu RDC, vous trouverez le garage, permettant de stocker le matériel outdoor. \nVous trouverez également une chambre avec un lit deux places, un WC, la cuisine, le salon, la salle à manger et une buanderie, et l'accès direct au jardin et à la terrasse. \n\nAu 1er étage, vous trouverez 3 chambres avec des lits 2 places, un espace bureau idéal pour le télétravail, une grande salle de bain avec douche et baignoire et un WC. Vous y trouverez également une salle de jeux avec beaucoup de jouets et de jeux de société pour les enfants et les adultes :)\n\nLa maison dispose également d'un lit parapluie et de 3 matelas une place.  \n\nNous avons de nombreux jouets pour les enfants (intérieur et extérieur), ainsi qu'un trampoline, une balançoire et un toboggan à l'extérieur.\nVous trouverez également un barbecue, un salon de jardin, et une grande table pour pouvoir manger à l'ombre des arbres.","gp":"Situé dans un environnement paisible, ce quartier résidentiel offre un cadre de vie particulièrement calme.\nParfait pour une famille ou un groupe d’amis souhaitant profiter des activités de plein air comme le ski, le vélo ou la randonnée.\n\nSaint-Jean-d’Arvey est un village charmant et convivial, disposant de nombreux commerces de proximité : boulangerie, pharmacie, bureau de poste, salon de coiffure, primeur, cabinet médical, kinésithérapeutes ainsi qu’un restaurant gastronomique. Le village accueille également divers artisans locaux tels qu’une potière, une couturière ou encore une bijoutière. Tous proposent des produits de qualité, souvent issus du terroir.\n\nCôté loisirs, vous trouverez un terrain de football, des espaces de pétanque, un court de tennis gratuit, plusieurs aires de barbecue avec tables communes, ainsi qu’un petit skatepark. De nombreux itinéraires de randonnée partent directement du village, permettant de découvrir la cascade de la Doria, la via ferrata du Mont Peney, ainsi que des activités comme le canyoning ou l’escalade.\n\nLes principaux lacs de Savoie sont accessibles en moins de 45 minutes : lac de la Thuile, lac du Bourget et lac d’Aiguebelette. Situé au pied de la Croix du Nivolet, le village se trouve également à proximité d’Aix-les-Bains, de La Féclaz et de son vaste domaine de ski nordique, ainsi que des stations de ski alpin du Revard et du Margériaz. Chambéry, capitale de la Savoie, est à seulement 15 minutes en voiture, offrant un accès facile aux commerces, théâtres, cinémas et au centre historique.\n\nLa maison bénéficie d’un emplacement privilégié au cœur des Alpes : à 20 minutes du lac du Bourget, 30 minutes du lac d’Aiguebelette, 25 minutes d’Aix-les-Bains, 45 minutes d’Annecy et de son lac, 45 minutes de Grenoble, et environ 1h15 de Chamonix, Genève ou Lyon.","ot":"✨ Un écrin de nature au cœur des Alpes, entre lacs et montagnes\n\nOffrez-vous une parenthèse unique dans un cadre préservé, idéal pour une famille ou un groupe d’amis en quête de nature, de confort et d’authenticité. Été comme hiver, profitez d’un environnement exceptionnel entre ski, randonnées, vélo et moments de détente.\n\nNichée dans le charmant village de Saint-Jean-d’Arvey, la maison bénéficie d’un cadre paisible tout en restant proche de toutes les commodités : boulangerie artisanale, boucherie, commerces de proximité, professionnels de santé et restaurant gastronomique. Le village séduit par son authenticité et la qualité de ses produits locaux, portés par de nombreux artisans passionnés.\n\nCôté activités, tout est accessible directement depuis la maison : départs de randonnées, cascade de la Doria, via ferrata du Mont Peney, sites d’escalade et canyoning. Sur place également : terrain de tennis gratuit, espaces de détente avec barbecues, terrains de sport et équipements pour petits et grands.\n\nVous êtes idéalement situés pour explorer les plus beaux paysages de la région :\n– Lac du Bourget à 20 minutes\n– Lac d’Aiguebelette à 30 minutes\n– Aix-les-Bains à 25 minutes\n– Annecy et son lac à 45 minutes\n\nEn hiver, profitez des domaines skiables à proximité : La Féclaz pour le ski de fond, Le Revard et Le Margériaz pour le ski alpin, le tout dans un cadre naturel remarquable au pied de la Croix du Nivolet.\n\nEnfin, Chambéry, capitale historique de la Savoie, est accessible en 15 minutes et offre une belle diversité culturelle : centre ancien, restaurants, marchés, cinémas et théâtre.\n\n"}],"ph":["3012001_0","3012001_1","3012001_2","3012001_3","3012001_4","3012001_5","3012001_6","3012001_7","3012001_8","3012001_9","3012001_10","3012001_11","3012001_12","3012001_13","3012001_14","3012001_15"]},{"v":"V29","n":29,"id":2825317,"t":"Wunderschönes Ferienhaus im Allgäu/Bayern zur alleinigen Nutzung! Nähe Schloss Neuschwanst","town":"Pfronten","cc":"Germany","region":"Allgaeu","lat":47.573884568306724,"lon":10.552640923113149,"bd":4,"ba":2,"cap":12,"m2":160,"typ":"House","mn":7,"beds":{"big_double_bed":3,"double_bed":0,"single_bed":0,"children_bed":0,"baby_bed":0,"double_bed_up":2,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":2},"res":[{"n":"Pfronten Breitenberg","m":5,"b":5,"km":2,"via":"Kienbergstraße","q":""},{"n":"Nesselwang","m":14,"b":14,"km":8,"via":"Allgäuer Str.","q":""},{"n":"Tannheim","m":20,"b":20,"km":14,"via":"Achtalstraße","q":""},{"n":"Jungholz","m":30,"b":35,"km":24,"via":"B310","q":""},{"n":"Ehrwald","m":45,"b":50,"km":43,"via":"B179","q":""},{"n":"Oberstdorf","m":65,"b":75,"km":64,"via":"B19","q":""},{"n":"Warth-Schroecken","m":85,"b":90,"km":76,"via":"B198","q":""},{"n":"Damuels","m":130,"b":140,"km":109,"via":"B198","q":""}],"near":5,"n30":4,"n60":5,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"neben einer Auswahl an Spielzeug, Spielen, Bücher und Schlitten","toys_outside":null,"large_garden":"gehen in den großen Garten mit seinen zwei Sonnenterrassen","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"Durch die Lage an dem Skigebiet Pfronten und direkt neben der Skilanglaufloipe","notes":"Whole chalet for groups: 2 kitchens, 3 bedrooms + loft + sofa bed, at Pfronten ski area; EUR 300 cleaning, 0 exchanges, contact_allowed 0.","score":67,"stars":3.5,"gp":298,"rr":90,"gr":0.0,"ex":0,"owner":"Sascha","recip":false,"desc":[{"loc":"tr","title":"Beautiful holiday home in the Allgäu/Bavaria for exclusive use! Near Neuschwanstein Castle!","gf":"Enjoy a dream holiday in our holiday home \"Kienberghäusle\". Set in a sunny, quiet spot on a hillside, this rustic, ecological chalet offers wonderful views of the surrounding mountains, including the Zugspitze, and of the \"Falkenstein castle ruins\".\n\nWith its 2 fully equipped kitchens, 3 bedrooms, 2 bathrooms and its own garden with two large terraces, our holiday home \"Kienberghäusle\" is especially suitable for holidays with friends' families, several generations or small travel groups. Thanks to its location at the Pfronten ski area and right next to the cross-country ski trail, the holiday home \"Kienberghäusle\" is also ideal for a winter holiday.\n\nThe holiday home \"Kienberghäusle\" in detail:\n\n•\tThe large kitchen-living room is the meeting point of the house. A second kitchenette is available on the upper floor.\n•\tTwo living rooms, each with an additional dining table, two Smart TVs, sofa set, sofa bed, armchairs\n•\tFree Wi-Fi throughout the property\n•\tDishwasher, washing machine and dryer\n•\t3 large bedrooms (1.80x2.00m / 1.60x2.00m / 1.60x2.00m)\n•\tSleeping gallery with double mattress (1.40x2.00m)\n•\tHigh-quality sofa bed in the ground-floor living room (1.40x2.00m)\n•\t2 bathrooms with daylight (1x bathtub and rain shower; 1x shower room)\n•\t2 parking spaces right in front of the door (one with a wallbox, for a fee)\n•\t6 e-bike charging stations\n•\t2 terraces in the large garden\n•\t2 balconies on the upper floor\n\nThe best thing is spending the hours together after a long walk, a mountain tour, a bike ride, a day at the swimming lake or a day of skiing. Simply park your cars right in front of the door and head into the large garden with its two sun terraces or onto one of the two balconies on the upper floor. Outdoor furniture and a garden barbecue are provided. On the lawn you can enjoy a long sunbathe and let the children play. From here you have a wonderful, unobstructed view of the local mountain, our Kienberg.\n\nFor the kids, besides a selection of toys, games, books and sledges, our gallery is the highlight. They climb up a wooden ladder to the two extra sleeping places and conquer their own \"den\" after an eventful day.","gp":"The climatic health resort of Pfronten consists of 13 districts spread generously across the wide valley.\n\nAbout 8,000 people live here. Lush green meadows, clear streams, light forests and romantic valleys (Achtal, Vilstal, Finstertal) contrast with the striking mountains.\n\nEveryone finds something to suit them here, whether a leisurely walker in the valley and on the many alpine pastures, or the sporty, ambitious climber, paraglider, mountain biker, skier or ski tourer on the surrounding mountains. Skiers will find a snow-sure ski area in the valley and another very scenic ski area on the local mountain, the Breitenberg.\n\nNeuschwanstein and Hohenschwangau castles are very close by!\n\nFor children, the 12 adventure playgrounds in Pfronten are the highlight.\n\nThere is plenty going on in Pfronten in summer and winter: from traditional events such as the cattle drive (Viehscheid) or the traditional costume market to sporting highlights such as the MTB marathon or the ski and board show, there is something for everyone.\n\nPfronten offers an impressive variety of sports in every season. Whether skiing, cross-country skiing, hiking or tobogganing – the idyllic landscape of the Allgäu Alps invites you to active experiences. In winter in particular, Pfronten impresses with first-class winter sports. The daily winter sports report keeps you up to date: it gives information on the weather conditions and the state of the cross-country trails, winter walking paths, toboggan runs and ski lifts. With a clear colour code, the report shows whether the facilities are open (green light) or closed (red light) – so you can plan your activities perfectly.\n\nThe restaurants around Pfronten invite you to enjoy delicious moments in the middle of the Allgäu Alps. From hearty regional specialities to international dishes, there is something for every taste. On this page you will find my personal recommendations – carefully selected places that impress with their special atmosphere, warm service and first-class food. Get inspired and discover the culinary highlights of the region!\n\nAward-winning Allgäu experiences for children: the Pfronten valley offers plenty of play, fun and excitement with no fewer than 12 themed playgrounds – from a knights' playground to a fairy-tale playground. Pfronten Tourism's activity programme offers lots to experience with guided walks, crafts, stone polishing and other great activities. Things get really adventurous with archery and climbing at dizzying heights in the Höllschlucht forest ropes course. There's no chance of boredom on child-friendly hikes and bike rides or on a visit to one of the many castles and palaces either. And in winter the family holiday continues in the snow with skiing and snowboarding, tobogganing or ice skating.","ot":"The house must be handed back clean. By prior arrangement we can offer a cleaning service. The cost is €300. We make nothing from this cost and simply pass it on to the guest.\n\nPets are not allowed.\n\nPlease smoke only on the balcony or terrace."},{"loc":"de","title":"Wunderschönes Ferienhaus im Allgäu/Bayern zur alleinigen Nutzung! Nähe Schloss Neuschwanstein!","gf":"Genießen Sie traumhafte Ferien in unserem Ferienhaus „Kienberghäusle“. An einem sonnigen und ruhigen Platz in Hanglage gelegen, bietet das urige und ökologische Chalet eine wunderschöne Aussicht auf die umliegenden Berge, inkl. Zugspitzblick, und die „Burgruine Falkenstein“.\n\nMit seinen 2 vollwertig ausgestatteten Küchen, seinen 3 Schlafzimmern, 2 Bädern und dem eigenen Gar-ten mit zwei großen Terrassen eignet sich unser Ferienhaus ”Kienberghäusle“ besonders für den Urlaub befreundeter Familien, mehrerer Generationen oder kleiner Reisegruppen. Durch die Lage an dem Skigebiet Pfronten und direkt neben der Skilanglaufloipe, eignet sich das Ferienhaus „Kienberghäusle“ auch ideal für einen Winterurlaub.\n\nDas Ferienhaus „Kienberghäusle“ im Detail:\n\n•\tDie große Wohnküche gilt als Treffpunkt des Hauses. Eine weitere Küchenzeile steht im OG zur Verfügung.\n•\tZwei Wohnzimmer mit jeweils zusätzlich einem Esstisch, zwei SmartTV, Couchgarnitur, Schlafcouch, Sessel\n•\tkostenloses WLAN im ganzen Objekt\n•\tGeschirrspüler, Waschmaschine und Trockner\n•\t3 große Schlafzimmer (1,80x2,00m / 1,60x2,00m / 1,60x2,00m)\n•\tSchlafempore mit Doppelmatratze (1,40x2,00m)\n•\thochwertige Schlafcouch im EG-Wohnzimmer (1,40x2,00m)\n•\t2 Tageslichtbäder (1x Wanne und Regendusche; 1x Duschbad)\n•\t2 KFZ-Stellplätze direkt vor der Haustür (einer mit Wallbox gegen Gebühr)\n•\t6 E-Bike-Ladestationen\n•\t2 Terrassen im großen Garten\n•\t2 Balkone im OG \n\nAm schönsten ist es doch, die Stunden nach einer ausgedehnten Wanderung, einer Bergtour, einer Rad-tour, einem Tag am Badesee oder einem Skitag gemeinsam zu verbringen. Dann stellen Sie Ihre Autos einfach direkt vor die Haustüre und gehen in den großen Garten mit seinen zwei Sonnenterrassen oder auf einen der beiden Balkone im Obergeschoss. Eine Möblierung des Außenbereiches und ein Gartengrill sind vorhanden. Auf der Liegewiese können Sie ein ausgiebiges Sonnenbad genießen und die Kinder spielen lassen. Hier haben Sie einen wunderbaren und unverbauten Blick auf den Hausberg, unseren Kien-berg. \n\nFür die Kids ist, neben einer Auswahl an Spielzeug, Spielen, Bücher und Schlitten, jedoch unsere Empore das Highlight. Sie erklimmen die weiteren zwei Schlafplätze über eine Holzleiter und erobern ihre eigene \"Höhle\" nach einem ereignisreichen Tag.","gp":"Der Luftkurort Pfronten besteht aus 13 Ortsteilen, die sich großzügig im weiten Tal verteilen. \n\nHier leben ca. 8.000 Einwohner. Saftige grüne Wiesen, klare Bäche, lichte Wälder, romantische Täler (Achtal, Vilstal, Finstertal) sind der Kontrast zu den markanten Bergen. \n\nHier findet jeder das für ihn Passende, egal ob gemütlicher Spaziergänger im Tal und auf den vielen Al-men, oder der sportlich ambitionierte Kletterer, Gleitschirmflieger, Mountainbiker, Skifahrer oder Skitou-rengeher auf den umliegenden Bergen. Skifahrer finden ein schneesicheres Skigebiet im Tal und ein weiteres landschaftlich sehr reizvolles Skigebiet auf dem Hausberg Breitenberg. \n\nDas Schloss Neuschwanstein und Hohenschwangau sind ganz in der Nähe!\n\nFür Kinder sind die 12 Erlebnisspielplätze in Pfronten das Highlight.\n\nSommer wie Winter ist in Pfronten einiges geboten: Von traditionellen Veranstaltungen wie der Viehscheid oder dem Trachtenmarkt bis hin zu sportlichen Highlights wie dem MTB-Marathon oder der Ski- und Boardshow ist alles dabei.\n\nPfronten bietet zu jeder Jahreszeit eine beeindruckende Vielfalt an Sportmöglichkeiten. Ob Skifahren, Langlaufen, Wandern oder Rodeln – die idyllische Landschaft der Allgäuer Alpen lädt zu aktiven Erlebnissen ein. Besonders im Winter überzeugt Pfronten mit erstklassigen Wintersportangeboten. Der tagesaktuelle Wintersportbericht hält euch stets auf dem Laufenden: Er informiert über die Wetterbedingungen und den Zustand der Loipen, Winterwanderwege, Rodelstrecken und Skilifte. Mit einem übersichtlichen Farbcode zeigt der Bericht, ob die Angebote geöffnet (grünes Licht) oder geschlossen (rotes Licht) sind – so könnt ihr eure Aktivitäten optimal planen.\n\nDie Restaurants rund um Pfronten laden zu genussvollen Momenten inmitten der Allgäuer Alpen ein. Von herzhaften Schmankerln der regionalen Küche bis zu internationalen Spezialitäten ist für jeden Geschmack etwas dabei. Auf dieser Seite findet ihr meine persönlichen Empfehlungen – sorgfältig ausgewählte Lokale, die mit ihrer besonderen Atmosphäre, herzlichem Service und erstklassigen Speisen überzeugen. Lasst euch inspirieren und entdeckt die kulinarischen Highlights der Region!\n\nAusgezeichnete Allgäu-Erlebnisse für Kinder: Jede Menge Spiel, Spaß und Spannung bietet das Pfrontener Tal mit gleich 12 Themenspielplätzen – vom Ritter- bis Märchenspielplatz. Bei den Erlebnisangeboten von Pfronten Tourismus gibt es bei geführten Wanderungen, beim Basteln oder Steineschleifen und weiteren tollen Angeboten viel zu erleben. Richtig abenteuerlich wird´s beim Bogenschießen und beim Klettern in schwindelerregender Höhe im Waldseilgarten Höllschlucht. Auch bei kinderfreundlichen Wanderungen und Radtouren oder beim Besuch einer der vielen Burgen und Schlössern kommt keine Langeweile auf. Und im Winter geht der Familienurlaub im Schnee beim Skifahren und Snowboarden, Rodeln oder beim Eislaufen weiter.","ot":"Das Haus muss gereinigt wieder übergeben werden. Wir können nach vorheriger Absprache einen Reinigungsservice anbieten. Die Kosten belaufen sich auf 300€. Wir verdienen nichts an diesen Kosten und geben diese nur an den Gast weiter.\n\nHaustiere sind nicht erlaubt.\n\nRauchen bitte nur auf Balkon oder Terrasse."}],"ph":["2825317_0","2825317_1","2825317_2","2825317_3","2825317_4","2825317_5","2825317_6","2825317_7","2825317_8","2825317_9","2825317_10","2825317_11","2825317_12","2825317_13","2825317_14","2825317_15","2825317_16","2825317_17","2825317_18","2825317_19","2825317_20","2825317_21","2825317_22","2825317_23","2825317_24","2825317_25","2825317_26","2825317_27","2825317_28","2825317_29","2825317_30","2825317_31","2825317_32","2825317_33","2825317_34","2825317_35","2825317_36","2825317_37"]},{"v":"V30","n":30,"id":2700592,"t":"Chalet du Bibrou","town":"Les Villards-Sur-Thônes","cc":"France","region":"Aravis","lat":45.92007136219591,"lon":6.382288457666728,"bd":4,"ba":2,"cap":14,"m2":135,"typ":"House","mn":7,"beds":{"big_double_bed":1,"double_bed":1,"single_bed":8,"children_bed":0,"baby_bed":2,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Le Grand-Bornand","m":8,"b":9,"km":5,"via":"D909 and D4","q":"Aravis D909"},{"n":"La Clusaz","m":10,"b":12,"km":5,"via":"D909","q":"Aravis D909"},{"n":"Crest-Voland","m":55,"b":55,"km":34,"via":"Rte du Col des Aravis","q":""},{"n":"Les Carroz","m":60,"b":70,"km":53,"via":"Tour du Bargy/D12 and A40","q":""},{"n":"Megeve","m":60,"b":65,"km":35,"via":"Rte du Col des Aravis and D1212","q":"Val d'Arly D1212"},{"n":"Combloux","m":65,"b":70,"km":40,"via":"Rte du Col des Aravis and D1212","q":"Val d'Arly D1212"},{"n":"Les Saisies","m":65,"b":70,"km":41,"via":"Rte du Col des Aravis and D218B","q":""},{"n":"Saint-Gervais","m":65,"b":80,"km":66,"via":"Tour du Bargy/D12 and A40","q":""}],"near":8,"n30":2,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":"un chalet qui sent bon le bois autour d'une flambée","sauna":null,"toys_inside":"De très nombreux jeux de société ... duplos, caplas, poupons, petites voitures","toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":["Aravis D909"],"ski":"à 5 km des pistes de La Clusaz et Du Grand Bornand ... à 5mns en voiture","notes":"Chalet 5 min from La Clusaz/Grand-Bornand for 12+2 babies, full baby kit and toys, 62 exchanges; 4 bed/2 bath, €110 cleaning, contact_allowed=0.","score":66,"stars":3.5,"gp":289,"rr":100,"gr":4.98,"ex":62,"owner":"Joëlle , Philippe ,Perrine et Clément","recip":false,"desc":[{"loc":"tr","title":"Chalet du Bibrou","gf":"With its magnificent view of the Tournette, our chalet is the ideal place to recharge, have an excellent stay with family or friends and take home wonderful memories.\nIt can sleep 12 people + 2 babies, and has a very large private car park that can hold 6/7 cars + a garage for safely storing bikes, mountain gear and skis.\nEverything for babies: changing table, 2 bouncers, 2 high chairs (from about 10/11 months), 2 baby carriers (very good quality) for family hikes, 2 umbrella strollers, 2 cots with thick mattresses for baby's comfort, small toys.\nWashing machine, 2 tumble dryers, ski boot and après-ski boot dryer, 2 irons, equipped kitchen with coffee maker, espresso machine (Senseo), classic coffee maker, toaster, kettle, dishwasher, microwave, oven, large fridge, small freezer, 2 raclette machines + a traditional raclette machine, electric plancha, 2 fondue sets, croque-monsieur maker. A full set of cookware, lovely mountain-style crockery, stemmed glasses, beer glasses, whisky glasses, champagne coupes..... nothing is missing, you'll feel right at home!\nLarge south-facing picture windows and 2 large terraces with a gas plancha and 2 sets of garden furniture, an awning to protect you effectively from the sun and let you make the most of our beautiful mountains.\nLiving room with mountain-style bench seating, a TV and a second TV in the large dormitory bedroom.\nYou'll appreciate the refined mountain decor. The chalet smells wonderfully of wood, you feel so good there!\nLess than 30 mins from Annecy and 5 km from the slopes of La Clusaz and Le Grand Bornand.\n20 mins from the beaches and the waterfalls of Angon and Talloires.\nClose to superb walks and all kinds of sports (hiking, paragliding, via ferrata, mountain biking, riding centre, treetop adventure course, and all water sports on Lake Annecy). An ideal place for sporty people as well as families. Discover the simple practice of river trekking (\"longe rivière\"), which children love and which is accessible to all, very, very popular in summer during hot spells. A stick, some water shoes and you're ready to walk up shallow rivers against the current, it's great for families! The chalet is the ideal place for many holidaymakers, summer and winter.\nYou can taste indulgent raclettes, the inevitable Savoyard fondue, always very convivial, the \"tarti-chèvre\", or take advantage of staying in Reblochon country to enjoy excellent tartiflettes.\nWifi/fibre\nA great many board games for all ages, comics and activity books will be available for children and adults to extend your evenings, plus toys for your very young children, who will be delighted to find Duplo, Kapla, baby dolls, toy cars, little early-learning books, puzzles....\nPLEASE NOTE! Our canine friends are welcome under certain conditions. Sorry, but we will only accept them at the chalet after a discussion with the dog's owners, followed by our agreement or not. So that every holidaymaker finds the chalet spotless before unpacking, a cleaning contribution of 110 euros for the whole chalet (2 floors + basement) will be requested. As this chalet is our second home, we ask you to bring your own sheets and towels. But if you'd like to lighten your luggage, someone locally can provide bed linen and towels and take care of the laundry after you leave, for a fee.\nRestaurants and shops 2 km away. We prefer exchanges of 6 or 7 nights.\n.","gp":"You'll love the many family or sporty walks, the nearby ski slopes, the magnificent town of Annecy with its lake, old town and canals. La Clusaz and Le Grand Bornand are 5 mins away by car. You can even get there on foot via little mountain paths! The Lac des Confins for a family walk in superb scenery, and there at the goat farm, young and old alike will love being among the goats and their newborn kids.\nThe mountains are simply magnificent.... you almost always come back!","ot":"How about a drink with family or friends in a chalet that smells of wood, around a crackling fire after a day of sport?....\nThen... don't hesitate! Come and discover our chalet, you'll leave with wonderful memories and completely recharged!\nIt can sleep 12 people!"},{"loc":"fr","title":"Chalet du Bibrou","gf":"Avec sa vue magnifique sur la Tournette notre chalet est l'endroit idéal pour se ressourcer , passer un excellent séjour en famille ou entre amis  et en garder de merveilleux souvenirs .\nIl peut accueillir 12 personnes + 2 bébés ,a un très grand parking privé pouvant accueillir 6/7 voitures + garage . pour y déposer , vélos , matériel de montagne , skis en toute sécurité .\nTout pour bébé, table à langer , 2 transats ,2 chaises hautes ( à partir de 10/11 mois environ ) , 2 porte bébés( de très bonne qualité) pour les randonnées en famille ,2 poussettes canes , 2 lits bébé avec d'épais matelas pour le confort de bébé , de petits jouets . \nLave linge, 2 sèche linge , sèche chaussures de ski et après ski , 2 fers à repasser , cuisine équipée avec Cafetière , expresso ( Senseo), cafetière classique ,grille pain , bouilloire , lave vaisselle  , micro onde , four , grand réfrigérateur , petit congélateur ,2 appareils à raclette , + appareil à raclette à l'ancienne , plancha électrique , 2 appareil à fondue , appareil à croques Monsieur Toute la batterie de cuisine , belle  vaisselle de montagne , verres à pied , verres à bière ,à whisky , coupes .....il ne manque rien , vous y serez comme chez vous ! \nDe grandes baies vitrées plein sud et 2 grandes terrasses avec plancha au gaz  et 2 salons de jardin , store banne pour vous protéger efficacement du soleil et pour profiter au maximum de nos belles montagnes .\nSalon avec banquettes de montagne , un téléviseur et un deuxième téléviseur dans la grande chambre dortoir .\nVous apprécierez la décoration de montagne raffinée . Le chalet sent bon le bois , on s'y sent tellement bien ! \nA moins de 30 mns d'Annecy et à 5 km des pistes de La Clusaz et Du Grand Bornand, \nA 20mns des plages et des cascades d'Angon et de Talloires .\nA proximité de superbes balades et de toutes  activités sportives (randonnées , parapente, via ferrata , VTT , centre équestre , accrobranche ,et tout sport aquatique sur la lac d\"Annecy . Endroit idéal pour les sportifs comme pour les familles .                                                                                                                                                                    Découvrez la pratique simple du longe rivière que les enfants adorent et à portée de tous , très très appréciée l'été sous de grandes chaleurs .Un bâton , des chaussures d'eau et vous voilà prêts à remonter les rivières peu profondes  à contre courant , c'est génial en famille ! Le chalet est l'endroit idéal pour de nombreux vacanciers été ,hiver .\nVous pourrez goûter les  raclettes gourmandes , l’inévitable fondue savoyarde toujours très conviviale , la tarti-chèvre ou profiter de séjourner dans ce pays du reblochon pour déguster d'excellentes tartiflettes .\nWifi/fibre \nDe très nombreux jeux de société pour tous ages , bandes dessinées et cahiers d'activité , seront à la  disposition des enfants et adultes pour vos prolonger vos soirées , des jouets pour vos très jeunes enfants qui seront ravis de trouver duplos, caplas, poupons , petites voitures , petits livres d'éveil, puzzles ....\nATTENTION ! Nos amis les chiens sont les bienvenus à certaines conditions . Désolés mais nous n'accepterons leur venue au chalet qu’après discussion avec les propriétaires du chien ,suivie de notre accord ou non .                          Afin  que chaque vacancier trouve un chalet impeccable avant de poser ses valises ,une participation pour le ménage de 110 euros pour tout le chalet ( 2 étages + sous sol ) vous sera demandée  . Ce chalet étant notre résidence secondaire , nous vous demandons d'amener  vos draps et votre linge de toilette . Mais si vous désirez alléger vos valises une personne sur place peut vous fournir linge de lit , serviettes de toilette et s'occuper du pressing après votre départ , ceci moyennant  participation .\nRestaurants ,commerces à 2kms .Nous privilégions les échanges de 6 ou 7 nuits. \n .","gp":"Vous allez adorer les nombreuses balades familiales ou sportives , les pistes de ski à proximité , la magnifique ville d'Annecy avec son lac , sa vieille ville et ses canaux . La clusaz , le Grand Bornand  à 5mns en voiture .Possibilité de s'y rendre à pied par de petits chemins de montagne ! Le lac des confins pour une balade familiale dans un superbe paysage et là  à la chèvrerie ,petits et grands vont adorer être au milieu des chèvres  et leurs tous jeunes chevreaux . \nLa montagne est simplement magnifique ....on y revient presque toujours !","ot":"Un apéro en famille ou entre amis dans un chalet qui sent bon le bois autour d'une flambée après une journée sportive ça vous dit ?....\nAlors ...n'hésitez pas ! Venez découvrir  notre chalet , vous en repartirez avec de magnifiques souvenirs et totalement ressourcés !\nIl peut accueillir 12 personnes !"}],"ph":["2700592_0","2700592_1","2700592_2","2700592_3","2700592_4","2700592_5","2700592_6","2700592_7","2700592_8","2700592_9","2700592_10","2700592_11","2700592_12","2700592_13","2700592_14","2700592_15","2700592_16","2700592_17","2700592_18","2700592_19","2700592_20","2700592_21","2700592_22","2700592_23","2700592_24","2700592_25","2700592_26"]},{"v":"V31","n":31,"id":1309357,"t":"Traditional former farmhouse in French alps - Chambery/Annecy -","town":"Les Deserts","cc":"France","region":"Bauges","lat":45.64715656831158,"lon":6.0158863466973616,"bd":4,"ba":2,"cap":12,"m2":160,"typ":"House","mn":7,"beds":{"big_double_bed":1,"double_bed":2,"single_bed":3,"children_bed":0,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"La Feclaz (Grand Revard)","m":5,"b":5,"km":3,"via":"D913","q":""},{"n":"Aillons-Margeriaz","m":28,"b":28,"km":23,"via":"D912 and D59","q":""},{"n":"Les 7 Laux","m":65,"b":75,"km":63,"via":"A41","q":""},{"n":"Le Collet d'Allevard","m":70,"b":80,"km":65,"via":"A41","q":""},{"n":"Le Sappey","m":75,"b":90,"km":77,"via":"A41","q":""},{"n":"Crest-Voland","m":80,"b":100,"km":89,"via":"A43","q":"Maurienne A43"},{"n":"St-Pierre-de-Chartreuse","m":80,"b":90,"km":56,"via":"D1006","q":"Maurienne"},{"n":"Le Grand-Bornand","m":85,"b":100,"km":77,"via":"A41","q":""}],"near":5,"n30":2,"n60":2,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":"dining-living area is large with wood burning fireplace","sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"3 km away from La Feclaz/Savoie Grand Revard, largest cross-country skiing resort in France","notes":"Big farmhouse at 1100 m, 4 bedrooms/2 baths, wood fireplace, no TV; 3 km to La Féclaz (mainly XC, small alpine); experienced host.","score":66,"stars":3.5,"gp":196,"rr":100,"gr":4.99,"ex":103,"owner":"Jany","recip":true,"desc":[{"loc":"en","title":"Traditional former farmhouse in French alps - Chambery/Annecy -","gf":"LA MAISON EST TRES GRANDE: EXCHANGE D’UNE SEMAINE MINIMUM \n\nOur family farmhouse is in the French Alps (1100 meters above sea level) and situated between Annecy and Chambery. the house is located in a natural park called \"Parc Naturel Regional du Massif des Bauges\" with a preserved environment with no high concrete buildings and only a few neighours.    \n\nThe farmhouse is restored/renovated and provides the confort of a modern house. We are using firewood for heating.\nOur home has 4 bedrooms: Three bedrooms have double beds and the last one has 2 single beds. The kitchen is fully equipped and the dining-living area is large with wood burning fireplace. We have no TV (it is our choice) but access to internet.\nThe decoration is a mix of  travel  remembrances together with an eclectic personal \"art\" collection.  \n\nIn winter you can ski (cross-country skiing as well as alpine skiing also ski courses for children ). In summer and autumn hike, bike, walk or climbe with endless possibilities.  Our garden has a barbecue (Weber), table and umbrella. \nFamilies with children will enjoy the place! Single and families with no children will enjoy the place!","gp":"Our house is 3 km away from La Feclaz/Savoie Grand Revard which is the largest cross-country skiing resort in France. We have no direct neighours but are close to the road which is important when it is snowing! The snowplow is coming regurlarly to clean the road\r\n\r\n It is 30 minutes drive to Chambery, one hour drive to Annecy, two hours drive to Geneva or Lyon. It is ideally located for delightful day trips to major attractions like Chamonix, Annecy, Geneva or Megeve.\r\n\r\nIt is an area for all seasons with a wide choice of experiences regardless of when you visit.","ot":""}],"ph":["1309357_0","1309357_1","1309357_2","1309357_3","1309357_4","1309357_5","1309357_6","1309357_7","1309357_8","1309357_9","1309357_10","1309357_11","1309357_12","1309357_13","1309357_14","1309357_15","1309357_16","1309357_17","1309357_18","1309357_19","1309357_20","1309357_21","1309357_22","1309357_23","1309357_24","1309357_25","1309357_26","1309357_27","1309357_28","1309357_29"]},{"v":"V32","n":32,"id":3030735,"t":"La maison de Marion, Mathieu, et Les enfants, entre lac et montagnes","town":"Bluffy","cc":"France","region":"Aravis","lat":45.869498755088266,"lon":6.2121146723981235,"bd":4,"ba":2,"cap":10,"m2":120,"typ":"House","mn":4,"beds":{"big_double_bed":0,"double_bed":2,"single_bed":0,"children_bed":2,"baby_bed":1,"double_bed_up":0,"single_bed_up":1,"children_bed_up":1,"baby_bed_up":1},"res":[{"n":"Le Grand-Bornand","m":28,"b":35,"km":22,"via":"D909","q":"Aravis D909"},{"n":"La Clusaz","m":30,"b":35,"km":23,"via":"D909","q":"Aravis D909"},{"n":"Crest-Voland","m":60,"b":70,"km":44,"via":"D909A","q":"Aravis D909"},{"n":"Aillons-Margeriaz","m":70,"b":80,"km":62,"via":"D5","q":""},{"n":"La Feclaz (Grand Revard)","m":75,"b":85,"km":74,"via":"A41","q":""},{"n":"Les Carroz","m":75,"b":85,"km":88,"via":"A410 and A40","q":""},{"n":"Les Saisies","m":75,"b":85,"km":54,"via":"D71A","q":""},{"n":"Combloux","m":80,"b":100,"km":96,"via":"A40","q":""}],"near":28,"n30":2,"n60":3,"fac":{"fireplace":false,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":"plein de jeux pour enfants dans la maison et au garage","toys_outside":"2 vélos enfants, trottinettes enfant et bébé","large_garden":"Un grand jardin entoure la maison","winter_restriction":null,"access_issue":"Parking extérieur couvert"},"av":[],"q":["Aravis D909"],"ski":"en 45' dans les stations de ski La Clusaz ou le Grand Bornand","notes":"Family house near Annecy with toys, 4 small bedrooms (kids' rooms), no cleaning service, 45 min to La Clusaz - too small/far.","score":65,"stars":3.0,"gp":203,"rr":100,"gr":4.99,"ex":27,"owner":"Marion & Mathieu","recip":true,"desc":[{"loc":"tr","title":"The house of Marion, Mathieu and the kids, between lake and mountains","gf":"Our house is a little paradise, very quiet, sunny (well, when there is sun!), with a magnificent view of the Dents de Lanfon mountain.\nA large unfenced garden surrounds the house.\n\nGround floor: entrance + living room + dining room and open kitchen.\nThe dining room opens onto a large terrace, which itself opens onto the garden.\nBedroom with double bed (160 cm), bathroom (shower), WC.\n\nUpstairs: open mezzanine with a double bed (160 cm) + 3 children's bedrooms (1 room = a loft bed + fold-out chair as an extra bed, 1 room = a mid-height bed, 1 room = a baby cot and a mattress on the floor as an extra bed) + bathroom with WC.\n\nAvailable: lots of children's games in the house and in the garage. Books and comics. A paddleboard. 2 children's bikes, child and baby scooters. 1 regular bike and 1 longtail electric bike (for those who know how to use one). We don't adapt the bikes; it's up to you to do so if you wish (e.g. a baby seat to be fitted by you and removed afterwards).\nHigh chair + travel cot + stair gates + hiking baby carrier.\n\nCovered outdoor parking\n\nWe don't have a cat, but we have a rabbit!! Her name is Crocus, and she lives outdoors in her hutch. She loves cuddles and needs food and water.\n\nOtherwise:\n- non-smoking house\n- no pets\n- no cleaning service available\n- sheets and towels to be discussed together\n- no TV (it has stayed in the garage since we moved in! But if you need it we can set it up for you).\n\nCar exchange possible for reciprocal exchanges.\n\nPLEASE - We ask you to be particularly considerate, especially towards our neighbours (who are very nice!), as this is a rented house that we exchange with our landlord's agreement. Thank you in advance!!","gp":"Very quiet, the house is next to the village of Bluffy.\n\nThe Château de Menthon can be reached on foot, as can the village (but it's uphill!).\n\nClose to many places (by car):\n- 10' to the lake,\n- 20' to Annecy,\n- 45' to the ski resorts of La Clusaz or Le Grand Bornand,\n- 1h to Switzerland\n\nYou can go walking in the Aravis and the Bauges, and if you don't have much time you will find short walks in the area, often with very beautiful viewpoints over the lake!\n\nShops in the next village (Menthon-Saint-Bernard): bakery, 8 à 8 convenience store, butcher, pharmacy, restaurants, etc. Otherwise you have to go to Annecy or Thônes.\n\nIn winter: we head for the snow! Hiking, alpine skiing, cross-country skiing. Otherwise a climbing gym or a few museums in Annecy. Discover the old town with fewer tourists than in summer.\nIn summer: swimming in the lake in the magnificent bay of Talloires or closer, at Menthon. A fun treetop adventure course in Talloires for young and old. Climbing, canyoning. Cycling round the lake. Plenty of aperitifs at the lakeside bars.\nAnd in the shoulder seasons we do everything else! Autumn is magnificent with the red-orange forest, and in spring you can watch the newborns (there are flocks of sheep around, with their little lambs in spring).","ot":"Welcome to Bluffy and have a great holiday!"},{"loc":"fr","title":"La maison de Marion, Mathieu, et Les enfants, entre lac et montagnes","gf":"Notre maison est un petit paradis, très au calme, ensoleillée (enfin quand il y a du soleil !), avec une vue magnifique sur la montagne des Dents de Lanfon. \nUn grand jardin entoure la maison non clôturé. \n\nAu RDC : entrée + salon + salle à manger et cuisine ouverte.  \nLa salle à manger donne sur une grande terrasse, elle même donnant sur le jardin.  \nChambre avec lit double (160 cm), salle de bain (douche), WC. \n\nA l’étage : mezzanine ouverte avec un lit double (160 cm) + 3 chambres enfants (1 chambre = un lit en hauteur + chauffeuse en lit d'appoint, 1 chambre = un lit mi hauteur, 1 chambre = un lit bébé et matelas par terre en lit d'appoint)+ salle de bain WC. \n\nA disposition : plein de jeux pour enfants dans la maison et au garage. Livres et BD. Un paadle. 2 vélos enfants, trottinettes enfant et bébé. 1 vélo normal et 1 vélo électrique longtail (pour ceux qui savent s'en servir). Pour les vélos on ne les adapte pas, à vous de le faire si vous le souhaitez (ex siège bébé à installer par vous et à enlever ensuite). \nChaise haute + lit parapluie + barrières escaliers + porte bébé rando.\n\nParking extérieur couvert\n\nNous n'avons pas de chat, mais un lapin !! Elle s'appelle Crocus, et elle vit en extérieur dans sa cage. Elle aime les câlins et a besoin de nourriture et d'eau. \n\nPour le reste : \n- maison non fumeur\n- pas d'animaux \n- pas de prestation de ménage possible\n- draps et serviettes à voir ensemble\n- pas de télé (elle est restée au garage depuis notre emménagement ! Mais si vous en avez besoin on pourra vous l’installer). \n\nÉchange de voiture possible pour les échanges réciproques. \n\nSVP - Nous vous demandons une attention particulière notamment vis-à-vis de nos voisins (qui sont très gentils !), car il s'agit d'une maison louée, que nous échangeons avec l'accord de notre propriétaire. Merci par avance !!","gp":"Très calme, la maison est à côté du village de Bluffy. \n\nChâteau de Menthon accessible à pied, comme le village (mais ça grimpe!). \n\nProche de beaucoup d’endroits (en voiture) : \n- en 10' au lac, \n- en 20' dans Annecy, \n- en 45' dans les stations de ski La Clusaz ou le Grand Bornand,  \n- en 1h en Suisse\n\nVous pourrez vous balader dans les Aravis, les Bauges, et si vous n’avez pas beaucoup de temps vous trouverez des petites balades à faire dans le coin, avec souvent de très beaux points de vue sur le lac !\n\nCommerces dans le village d'à côté (Menthon-saint-bernard) : boulangerie, 8 à 8, boucherie, pharmacie, restaurants etc. Sinon il faut aller à Annecy ou à Thones. \n\nL'hiver : on va à la neige ! Rando, ski alpin, ski de fond. Sinon salle d'escalade ou quelques musées à Annecy. Découverte de la vieille ville avec moins de touristes que l'été.\nL'été : baignades dans le lac dans la magnifique baie de Talloires ou plus près, à Menthon. Accrobranche sympa à Talloires pour petits et grands. Escalade, Canyoning. Tour du lac à vélo. Nombreux apéros dans les guinguettes du lac. \nEt en demi saison on fait tout le reste ! L'automne est magnifique avec la forêt rouge orange, et au printemps on observe les derniers nés (il y a des troupeaux de moutons dans les parages, avec leurs petits agneaux au printemps).","ot":"Bienvenue à Bluffy et bonnes vacances !"}],"ph":["3030735_0","3030735_1","3030735_2","3030735_3","3030735_4","3030735_5","3030735_6","3030735_7","3030735_8","3030735_9","3030735_10","3030735_11","3030735_12","3030735_13","3030735_14","3030735_15","3030735_16","3030735_17"]},{"v":"V33","n":33,"id":3238449,"t":"La maison de Barby","town":"Barby","cc":"France","region":"Bauges","lat":45.576557184923026,"lon":5.982697052247656,"bd":4,"ba":3,"cap":11,"m2":200,"typ":"House","mn":0,"beds":{"big_double_bed":2,"double_bed":1,"single_bed":2,"children_bed":0,"baby_bed":1,"double_bed_up":1,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Aillons-Margeriaz","m":30,"b":30,"km":20,"via":"D11 and D206","q":""},{"n":"La Feclaz (Grand Revard)","m":30,"b":35,"km":18,"via":"D912 and D206A","q":""},{"n":"Les 7 Laux","m":50,"b":55,"km":50,"via":"A41","q":""},{"n":"Le Collet d'Allevard","m":55,"b":60,"km":52,"via":"A41","q":""},{"n":"Le Sappey","m":60,"b":70,"km":65,"via":"A41","q":""},{"n":"Crest-Voland","m":65,"b":80,"km":76,"via":"A43","q":"Maurienne A43"},{"n":"St-Pierre-de-Chartreuse","m":65,"b":75,"km":44,"via":"D1006","q":"Maurienne"},{"n":"Saint-Francois-Longchamp","m":75,"b":90,"km":82,"via":"A43","q":"Maurienne A43"}],"near":30,"n30":2,"n60":5,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":false,"garden":true,"bigGarden":true,"spa":false},"ev":{"fireplace":"Grand salon baie vitrée avec poele à bois (stove)","sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":"Un grand jardin, non clôturé","winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"20min de la Féclaz (ski de fond); 50min des premières stations de Belledonne (7 Laux)","notes":"Chambéry-suburb house with wood stove, big garden and extra lower flat, but alpine skiing 50 min away - poor ski fit.","score":65,"stars":3.0,"gp":250,"rr":100,"gr":5.0,"ex":2,"owner":"axelle","recip":true,"desc":[{"loc":"tr","title":"The Barby house","gf":"Entrance on the first floor, with a large, fully equipped open kitchen - Large living room with picture window and wood stove, terrace. On the same level, 2 bedrooms: one with a 140 cm bed, and a child's bedroom with a \"gigogne\" trundle bed (i.e. a 90 cm single bed convertible into two single beds or a double bed); a cot is also available. In the same corridor, toilet and bathroom.\nUpstairs, a master suite with bathroom, toilet and storage.\nThen on the lower level, an apartment accessible from inside, with a bedroom (160 cm) and a 140 cm sofa bed, with bathroom, toilet and kitchen.\nThe apartment is made available if needed. But if it's not essential, it will be closed.\nA large garden, not fenced.\nA 6x3 m unheated pool.\n\nCleaning to be discussed depending on the exchange. If end-of-stay cleaning is charged at the other home, it will be here too.\nSomeone can come and clean during your stay, for €40 for 2h30.","gp":"Barby, on the outskirts of Chambéry, reachable by bus from the TGV station (10 min) followed by a 15-min walk with stairs.\nHiking on foot from the house, just a few steps from the Bauges park. Bike rides in the Bauges, the Chartreuse, around Lac du Bourget. Chambéry 15 min by bike.\nLac du Bourget 20 min. Aix-les-Bains 25 minutes. Annecy 45 min.\nIn winter, you are 20 min by car from the La Féclaz cross-country ski area, 50 min from the first ski resorts of the Belledonne massif (7 Laux..)\nAn endless playground!!\nBakery 10 min on foot in Barby centre, or 1 min by bike in Saint Alban, 2 pharmacies, 2 butchers within walking distance, as well as a great cheese shop. Supermarkets are 5 minutes away by car.","ot":""},{"loc":"fr","title":"La maison de Barby","gf":"Arrivée au premier étage, avec grande cuisine ouverte toute équipée - Grand salon baie vitrée avec poele à bois, terrasse. Au même niveau 2 chambres une avec lit de 140cm, et une chambre d'enfant avec un lit gignone (soit un lit simple de 90cm transformable en deux lit simple ou un lit double), lit à barreau disponible aussi. avec dans le même couloir, toilette et salle de bain \nA l'étage, une suite parentale avec salle de bain toilette, rangement. \nPuis au niveau inférieur un appartement accessible par l'intérieur, avec une chambre (160cm) et une canapé lit 140cm avec salle de bain, toilette, cuisine. \nL'appartement est mis a disposition si besoin. Mais si pas indispensable il sera fermé. \nUn grand jardin, non clôturé. \nUne Pisicine 6x3m non chauffée.\n\nMénage a discuter selon l'échange. Si ménage de fin payant dans l'autre logement il le sera aussi. \nUne personne peut passer faire le ménage pendant votre séjour, moyennant 40e pour 2h30.","gp":"Barby, périphérie de Chambéry, accessible en bus depuis la gare de TGV (10min) puis un trajet à pied avec escalier de 15min. \nRandonnée à pied de maison, situé à quelques pas du parc des Bauges. Sortie vélo bauges, chartreuse, tour du lac du Bourget. Chambéry 15min à vélo.\nLac du Bourget 20min. Aix les bains 25 minutes. Annecy 45min. \nEn hiver, vous êtes à 20min de la station de ski de fond de la Féclaz en voiture,  50min des première station de ski du massif de Belledonne (7 Laux..)\nUn terrain de jeux infini !!\nBoulangerie à 10min à pied dans Barby centre, ou 1min à vélo à saint Alban, 2 pharmacies, 2 boucheries accessible à pied tout comme une super fromagerie. Les supermarchés sont à 5minutes en voiture.","ot":""}],"ph":["3238449_0","3238449_1","3238449_2","3238449_3","3238449_4","3238449_5","3238449_6","3238449_7","3238449_8","3238449_9","3238449_10","3238449_11","3238449_12","3238449_13","3238449_14","3238449_15","3238449_16","3238449_17"]},{"v":"V34","n":34,"id":2220522,"t":"Maison familiale 5 chambres - calme et sérénité entre Doubs et Jura","town":"Frasne","cc":"France","region":"Jura","lat":46.85740443116917,"lon":6.161868169697871,"bd":4,"ba":2,"cap":12,"m2":230,"typ":"House","mn":5,"beds":{"big_double_bed":1,"double_bed":2,"single_bed":1,"children_bed":1,"baby_bed":2,"double_bed_up":0,"single_bed_up":0,"children_bed_up":1,"baby_bed_up":1},"res":[{"n":"Metabief","m":28,"b":30,"km":25,"via":"D9","q":""},{"n":"Les Rousses","m":65,"b":75,"km":66,"via":"D471 and RN 5/N5","q":""},{"n":"Monts Jura","m":100,"b":110,"km":87,"via":"D471 and RN 5/N5","q":""}],"near":28,"n30":1,"n60":1,"fac":{"fireplace":true,"sauna":false,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":null,"sauna":null,"toys_inside":null,"toys_outside":null,"large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":null,"notes":"Family house in Frasne (Doubs/Jura), 4-5 bed/2 bath, sle  2 with a single bed (90*190) (photos 12 and 13)\nNote: photos 12 and 13 are not up to date: a standard single bed has replaced the cabin bed in bedroom 2 (and the furniture has been moved around)\n\n- half a floor down: the living floor:\n-- the spacious kitchen / dining room with an extendable table (seating 9) and all the useful equipment (photo 1 with the old table, photos 2 and 3 with the current table)\n-- the back kitchen\n-- the spacious living room for games / aperitifs with TV and wooden piano (photos 4, 5 and 6)\n-- bedroom 3 with a double bed (160*200), renovated, with 2 windows and floating parquet floor (photo 14)\n-- a bathroom with shower (photo 15)\n-- a separate WC\n-- access to the terrace from the living room and the kitchen / dining room (table, plancha) (photos 7 and 8)\n\n- one floor down: (stays cool in summer)\n-- bedroom 4 with a double bed (140*190), a sofa, and two windows (photos 16 and 17)\n-- bedroom 5 with a double sofa bed (140*190) (photos 18 and 19)\n-- bedroom 6 with a single bed and a desk\n-- a bathroom with bathtub and shower (photos 20 and 21)\n-- a separate WC\n\nTravel cot (old) available for a young child.\n\nPossibility of charging an electric car (please let us know if needed).","gp":"In the heart of the Grésivaudan, the house is in a residential neighbourhood with a park and an equestrian centre 100 m away.\n\nShops 10 minutes' walk away (supermarket, farmers' shop, bakery and cheese shop / delicatessen).\n\nRestaurants in Montbonnot, Meylan, Saint Ismier, Grenoble.\n\nA haven of peace; you feel as if you are in the countryside, even though you are 10 min on foot from the shops and 20 minutes by car from the centre of Grenoble (or 30 min by bus).\n\nLocated 30 min / 1 hour's drive from the cross-country and alpine ski resorts / hikes in the Chartreuse, Belledonne and Vercors massifs.","ot":"At our place you will find lots of board games, toys and children's books from L'École des loisirs and Bayard Presse.\n\nFeel free to get in touch with us with any questions ;-)\n\nWe speak English !\n\nWe speak Italian!"},{"loc":"fr","title":"Maison chaleureuse avec vue sur Belledonne (avec un étage à max 24° pendant la canicule)","gf":"Superbe maison très spacieuse et très lumineuse dans un quartier calme, avec une vue exceptionnelle sur les montagnes du massif de Belledonne (depuis la salle à manger, le salon, les 3 chambres du bas et la terrasse).\n\nLa maison peut accueillir jusqu’à 10 personnes (+ éventuellement un bébé en lit parapluie) : 3 lits doubles et 4 lits simples (dont un lit cabane à 5 cm du sol).\n\nJardin avec portique de jeu (deux balançoires et un petit toboggan) et balancelle.\n \n\nLa maison est organisée sur plusieurs niveaux :\n\n- tout en haut : \nla chambre 1 avec 1 lit simple (90*190) (photos 9, 10 et 11) et un lit cabane (90*190) à 5 cm du sol avec une petite barrière pas très haute sur une partie d’un côté du lit et un ”toît” en bois genre ”cabane”, indiqué comme lit enfant (nous l’utilisions pour notre fils jusqu'à ses 4 ans, il peut servir pour des enfants plus grands, il a un bon matelas),\net la mezzanine \nAttention : photos 9 et 11 non à jour : le lit cabane a remplacé un des deux lits simples de la chambre 1\n\n- un demi-étage plus bas : la chambre 2 avec un lit simple (90*190)  (photos 12 et 13)\nAttention : photos 12 et 13 non à jour : un lit 1 place classique a remplacé le lit cabane de la chambre 2 (et les meubles ont changé de place)\n\n- un demi-étage plus bas : l'étage de vie :\n-- la cuisine / salle à manger spacieuse avec une table à rallonges (où on peut manger à 9) et tous les équipements utiles (photo 1 avec l'ancienne table, photos 2 et 3 avec la table actuelle)\n-- l'arrière-cuisine\n-- le salon spacieux pour les jeux / apéros avec télévision et piano en bois (photos 4, 5 et 6)\n-- la chambre 3 avec un lit double (160*200), rénovée, avec 2 fenêtres et parquet flottant (photo 14)\n-- une salle de bains avec douche (photo 15)\n-- un WC indépendant\n-- l'accès à la terrasse depuis le salon et la cuisine / salle à manger (table, plancha) (photos 7 et 8)\n\n- un étage plus bas : (reste frais l'été)\n-- la chambre 4 avec un lit double (140*190), un canapé, et deux fenêtres (photos 16 et 17)\n-- la chambre 5 avec un lit-convertible double (140*190) (photos 18 et 19)\n- - la chambre 6 avec un lit simple et un bureau \n-- une salle de bains avec baignoire et douche (photos 20 et 21)\n-- un WC indépendant\n\nLit parapluie (ancien) à disposition pour un jeune enfant.\n\nPossibilité de recharger une voiture électrique (merci de nous prévenir le cas échéant).","gp":"Au coeur du Grésivaudan, la maison est située dans un quartier résidentiel avec parc et centre équestre à 100 m. \n\nCommerces à 10 minutes à pied (Supermarché, magasin de producteurs, boulangerie et fromagerie / épicerie fine). \n\nRestaurants à Montbonnot, Meylan, Saint Ismier, Grenoble. \n\nUn havre de paix, on se sent à la campagne, même si on est à 10 min à pied des commerces, et à 20 minutes en voiture du centre de Grenoble (ou à 30 min en bus).\n\nSitué à 30 min / 1h de route des stations de ski nordique et ski alpin / randonnées dans les massifs de Chartreuse, Belledonne et Vercors.","ot":"Vous trouverez chez nous de nombreux jeux de société, jouets et livres de l'école des loisirs et Bayard Presse pour les enfants.\n\nN'hésitez pas à prendre contact avec nous pour toute question ;-)\n\nWe speak English !\n\nParliamo Italiano !"}],"ph":["2025789_0","2025789_1","2025789_2","2025789_3","2025789_4","2025789_5","2025789_6","2025789_7","2025789_8","2025789_9","2025789_10","2025789_11","2025789_12","2025789_13","2025789_14","2025789_15","2025789_16","2025789_17","2025789_18","2025789_19","2025789_20","2025789_21","2025789_22","2025789_23","2025789_24","2025789_25","2025789_26","2025789_27","2025789_28"]},{"v":"V37","n":37,"id":2581042,"t":"DREAM CHALET with Sauna and Gym","town":"Reichenau","cc":"Austria","region":"Carinthia","lat":46.86322829334594,"lon":13.82991209252618,"bd":4,"ba":2,"cap":10,"m2":220,"typ":"House","mn":0,"beds":{"big_double_bed":0,"double_bed":4,"single_bed":2,"children_bed":0,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":0,"baby_bed_up":0},"res":[{"n":"Bad Kleinkirchheim","m":22,"b":22,"km":15,"via":"Falkertsee Landesstraße and B88","q":""},{"n":"Kreischberg","m":70,"b":70,"km":60,"via":"B95 and B97","q":""},{"n":"Gerlitzen","m":75,"b":75,"km":55,"via":"B95","q":""},{"n":"Goldeck","m":75,"b":85,"km":62,"via":"Millstätter Straße/B98","q":""},{"n":"Katschberg","m":85,"b":85,"km":72,"via":"B95","q":""},{"n":"Kranjska Gora","m":90,"b":100,"km":78,"via":"Millstätter Straße/B98","q":""},{"n":"Nassfeld","m":110,"b":120,"km":92,"via":"B111","q":""},{"n":"Vogel","m":150,"b":180,"km":132,"via":"B95","q":""}],"near":22,"n30":1,"n60":1,"fac":{"fireplace":true,"sauna":true,"toysIn":true,"toysOut":true,"garden":true,"bigGarden":false,"spa":false},"ev":{"fireplace":"zusätzliches Feuerholz (firewood charged extra)","sauna":"60qm Gym, Saunahaus","toys_inside":null,"toys_outside":"3 Terrassen mit BBQ, Trampolin und Outdoor Fitness Tower","large_garden":null,"winter_restriction":null,"access_issue":null},"av":[],"q":[],"ski":"Im Winter kann man am Falkert Ski fahren (chalet at Falkertsee, 1875m)","notes":"Falkert chalet at 1875m with sauna house, gym, trampoline; 4 bed/2 bath, sleeps 10; €300 cleaning + electricity; bring linen/towels.","score":64,"stars":3.0,"gp":318,"rr":77,"gr":4.96,"ex":21,"owner":"Sandra","recip":false,"desc":[{"loc":"tr","title":"DREAM CHALET with Sauna and Gym","gf":"Our Dream Chalet at Falkertsee in the Nockberge Biosphere Park in Carinthia at 1875m\nA quick overview for you:\n- 4 bedrooms, 2 bathrooms, 3 WCs, alpine parlour (Almstüberl), Sky Sport, 60 m² gym, sauna house, 3 terraces with BBQ, trampoline and outdoor fitness tower\n\nIn winter you can go skiing, cross-country skiing and tobogganing at Falkert.\nIn summer hiking, climbing and cooling off in the water. Programme for kids.\n\nCosts payable on site: electricity according to consumption, additional firewood, tourist tax, any additional rubbish bags needed and a flat fee of EUR 125 for the final cleaning.\n\nOther important notes:\nPlease bring bed linen and your own towels.","gp":"Our Dream Chalet at Falkertsee is located in the Nockberge Biosphere Park in Carinthia at 1875m. Right on the Falkertsee with a fantastic view.\n\nWhere you'll be\nFalkertsee, Carinthia, Austria\nProbably the best neighbours are the alpine cows, which are at Falkertsee until about mid-September. After they are driven down from the alpine pastures, the cows are back in the valley. In the immediate neighbourhood there is really just a small hut and a larger house. In front of the house there is also a small stable (petting zoo) which is home to goats in summer.\n\nThe small hut is privately owned and is only very rarely used by the owners, as they are already quite elderly.\nThe next, larger house is the only building lived in all year round, by a young, very nice couple. Among other things, the two of them run the nearby Seehütte (a small restaurant on the lake), which, however, is only open in the high season until about 6 pm. Here you can order classic Austrian dishes. As it is above all a very popular restaurant for hikers and families, the choice is good, but not comparable to a large restaurant.\n\nIn the high season there are three more small huts offering their own cheese and milk and a small selection of food and drinks. All three are easily reachable on foot in 15 minutes at most.\n\nA little further away is the Kärntenhaus. Here you will find a proper restaurant. A very large choice of dishes, and especially recommended is the Kaiserschmarrn served in the pan. On foot it takes a good 30 minutes; by car the Kärntnerhaus can be reached in about 5 minutes.\nAt the Kärntnerhaus, as guests you can also order fresh bread rolls by phone or in person, which are then delivered directly to the alpine pasture in the morning. The prices for this very reliable and convenient service (especially in winter) are really very reasonable.\n\nThe nearby Heidialm (5 minutes' walk) has its own small park for children, and in the summer high season the tourist association offers a wide range of activities for children every day. Climbing, hikes, slackline and much more are available on the programme, which changes daily. Through our membership in the association, our guests can take part in all activities free of charge, except for a few special offers that must be paid for separately.\n\nWINTER\nIn winter a children's ski park and a children's ski school are always set up on one of the slopes. Usually a cross-country ski trail is laid out on the deeply frozen Falkertsee and an ice-skating rink is cleared.\nBecause of the location it can get really cold in winter and snow depths can reach up to four metres.","ot":"Please at least 3 nights ♥️\nWe ask for a EUR 300 cleaning fee + electricity costs according to consumption – EUR 0.20 per kWh.\nPlease bring your own duvet/pillow covers (except bed sheets) and towels."},{"loc":"de","title":"DREAM CHALET with Sauna and Gym","gf":"Unser Dream Chalet am Falkertsee im Biosphärenpark Nockberge in Kärnten auf 1875m\nkleiner Überblick für euch:\n- 4 Schlafzimmer, 2 Bäder, 3 Wc's, Almstüberl, Sky Sport, 60qm Gym, Saunahaus, 3 Terrassen mit BBQ, Trampolin und Outdoor Fitness Tower\n\nIm Winter kann man am Falkert Ski fahren, Langlaufen und Rodeln.\nIm Sommer Wandern, klettern und im Wasser abkühlen. Programm für Kids.\n\nKosten vor Ort: Strom nach Verbrauch, zusätzliches Feuerholz, Kurtaxe, zusätzliche Müllsäcke die gebraucht werden und pauschal EUR 125 für die Endreinigung.\n\nWeitere wichtige Hinweise:\nBitte Bettwäsche und eigene Handtücher mitnehmen.","gp":"Unser Dream Chalet am Falkertsee befindet sich im Biosphärenpark Nockberge in Kärnten auf 1875m. Direkt am Falkertsee mit traumhaften Ausblick. \r\n\r\nHier wirst du sein\r\nFalkertsee, Kärnten, Österreich\r\nDie wohl besten Nachbarn sind die Almkühe die bis etwa Mitte September am Falkertsee sind. Nach dem Almabtrieb sind die Kühe wieder im Tal. In direkter Nachbarschaft ist eigentlich eine kleine Hütte und ein größeres Wohnhaus. Vorm Haus steht noch ein kleiner Stall (Streichelzoo) der im Sommer von Ziegen bewohnt wird.\r\n\r\nDie kleine Hütte ist in privatem Besitz und wird nur sehr selten von den Besitzern benutzt, da Sie schon im fortgeschrittenen Lebensalter sind.\r\nDas nächst größere Haus ist das einzige Gebäude was ganzjährig von einem jungen, sehr nettem Pärchen bewohnt wird. Die beiden betreiben u.a. die nahegelegene Seehütte ( kleines Restaurant am See) was allerdings nur in der Hauptsaison bis etwa 18 Uhr geöffnet hat. Hier kann man klassische österreichische Gerichte bestellen. Da es es vor allem um ein sehr beliebtes Restaurant für Wanderer und Familien handelt ist die Auswahl gut, aber nicht zu vergleichen mit einem großen Restaurant.\r\n\r\nIn der Hauptsaison gibt es drei weitere kleine Hütten die eigenen Käse und Milch anbieten und eine kleine Auswahl an Speisen und Getränken. Alle drei sind in maximal 15 Minuten sehr gut zu Fuß zu erreichen.\r\n\r\nEtwas weiter entfernt befindet sich das Kärntenhaus. Hier treffen Sie auf ein richtiges Restaurant. Eine sehr große Auswahl an Speisen und ganz besonders zu empfehlen ist der Kaiserschmarrn der in der Pfanne serviert wird. Zu Fuß braucht man hier gut 30 Minuten mit dem Auto ist das Kärntnerhaus etwa in 5 Minuten zu erreichen.\r\nBeim Kärntnerhaus können Sie als Gäste auch telefonisch oder persönlich frische Brötchen und Semmeln bestellen, die Ihnen dann in der Früh direkt zur Alm geliefert werden. Die Preise für diesen sehr verlässlichen und bequemen Service (vor allem im Winter) sind wirklich absolut angemessen.\r\n\r\nDie nahegelegene Heidialm (5 Minuten Fußweg) hat einen eigenen kleinen Park für Kinder und durch den Tourismusverband werden zur Hauptsaison im Sommer jeden Tag verschiedenste Aktivitäten für Kinder angeboten. Klettern, Wanderungen, Slackline uvm. stehen auf dem täglich neugestalteten Programm zur Verfügung. Durch unsere Mitgliedschaft im Verband können unsere Gäste bis auf wenige Spezialangebote die extra zu entrichten sind, an allen Aktivitäten kostenfrei teilnehmen.\r\n\r\nWINTER\r\nIm Winter entsteht auf einer der Pisten immer ein Kinderskipark und eine Kinderschischule. Meist wird auf dem tief zugefrorenen Falkertsee eine Langlaufloipe errichtet und ein Eislaufplatz frei geschoben.\r\nDurch die Lage kann es im Winter schon wirklich kalt werden und Schneemengen bis zu vier Meter erreichen.","ot":"Bitte mindestens 3 Nächte ♥️\nWir bitten um EUR 300 Reinigungsgebühr + die Stromkosten nach Verbrauch - EUR 0,20 kWh.\nBettbezüge (ausser Bettlacken) und Handtücher bitte selber mitbringen."}],"ph":["2581042_0","2581042_1","2581042_2","2581042_3","2581042_4","2581042_5","2581042_6","2581042_7","2581042_8"]},{"v":"V38","n":38,"id":2737844,"t":"Jettes and Holgers Villa Bellevue","town":"Altaussee","cc":"Austria","region":"Salzkammergut","lat":47.640666374851946,"lon":13.76040319984615,"bd":5,"ba":2,"cap":10,"m2":260,"typ":"House","mn":6,"beds":{"big_double_bed":2,"double_bed":2,"single_bed":0,"children_bed":1,"baby_bed":0,"double_bed_up":0,"single_bed_up":0,"children_bed_up":1,"baby_bed_up":0},"res":[{"n":"Riesneralm","m":50,"b":50,"km":45,"via":"B145","q":""},{"n":"Dachstein West","m":60,"b":65,"km":54,"via":"B145 and B166","q":""},{"n":"Schladming","m":60,"b":70,"km":69,"via":"B145 and B320","q":""},{"n":"Wurzeralm","m":70,"b":75,"km":64,"via":"B145","q":""},{"n":"Ramsau","m":75,"b":80,"km":76,"via":"B145 and B320","q":""},{"n":"Postalm","m":75,"b":80,"km":56,"via":"B145","q":""},{"n":"Filzmoos","m":110,"b":120,"km":89,"via":"B166","q":""},{"n":"Hinterstoder","m":110,"b":120,"km":102,"via":"B145","q":""}],"near":50,"n30":0,"n60":3,"fac":{"fireplace":true,"sauna":true,"toysIn":true,"toysOut":false,"garden":true,"bigGarden
